      expression: 'last(/Ruckus Unleashed by SNMP/ruckus.Unleashed.System.Uptime)<10m and last(/Ruckus Unleashed by SNMP/zabbix[host,snmp,available])=1'
      name: 'Master AP has been restarted'
      event_name: 'Ruckus: Master AP has been restarted (uptime < 10m)'
      priority: INFO
      description: 'Uptime is less than 10 minutes.'
      manual_close: 'YES'
      dependencies:
        - name: 'No SNMP data collection'
          expression: 'max(/Ruckus Unleashed by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
      tags:
        - tag: scope
