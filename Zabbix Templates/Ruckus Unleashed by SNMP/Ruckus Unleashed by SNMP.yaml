zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: f71faac2ecaf43e4b251b991cc1bf1af
      name: 'Templates/Network devices'
  templates:
    - uuid: 77dd62a08faf468a9f0d70d1240365c4
      template: 'Ruckus Unleashed by SNMP'
      name: 'Ruckus Unleashed by SNMP'
      description: |
        Ruckus Unleashed by SNMP.
        
        MIBs used:
        - RUCKUS-UNLEASHED-SYSTEM-MIB
        - RUCKUS-UNLEASHED-WLAN-MIB
        - RUCKUS-ROOT-MIB
        - RUCKUS-TC-MIB
        - IF-MIB
        - SNMPv2-SMI
        - SNMPv2-TC
        - SNMPv2-CONF
      vendor:
        name: E-MSN
        version: 7.4.11
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 7a45bcc70edc468183f0fc29765b7c87
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          delay: '60'
          history: 1w
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 6615b8a34a0d4d459b3b416d132cc816
              expression: 'max(/Ruckus Unleashed by SNMP/icmpping,#3)=0'
              name: 'ICMP Ping: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: e340a96e4c4f4090ab623b9cca466203
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: ee1c1c5837a541d4b5373a03bce9115b
              expression: 'min(/Ruckus Unleashed by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Ruckus Unleashed by SNMP/icmppingloss,5m)<100'
              name: 'ICMP Ping: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Ruckus Unleashed by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: fe80cb000f0b49bd906b55e0a2bffeca
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: d791d95e6db342889ea412cce5771c8a
              expression: 'avg(/Ruckus Unleashed by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'ICMP Ping: High ICMP ping response time'
              event_name: 'High ICMP ping response time (>{$ICMP_RESPONSE_TIME_WARN}s for 5m)'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'ICMP Ping: High ICMP ping loss'
                  expression: 'min(/Ruckus Unleashed by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Ruckus Unleashed by SNMP/icmppingloss,5m)<100'
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Ruckus Unleashed by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: cdf5e866f0254c12b981f876fd151c07
          name: 'Master AP IP Address'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.25053.1.15.1.1.1.1.2.0
          key: ruckus.Unleashed.System.AP.IP
          delay: 1h
          history: 90d
          value_type: CHAR
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: application
              value: general
            - tag: component
              value: inventory
        - uuid: a51719b71dff4535b50093ad6d4ae055
          name: 'Total APs Capacity'
          type: CALCULATED
          key: ruckus.Unleashed.System.APs.Load
          history: 90d
          value_type: FLOAT
          units: '%'
          params: 'round(100 * last(//ruckus.Unleashed.System.Stats.Total.AP) / (last(//ruckus.Unleashed.System.Licensed.APs)+0.000001),1)'
          tags:
            - tag: application
              value: ap
            - tag: scope
              value: capacity
          triggers:
            - uuid: d0c17589d96c484cac4ec82ae4bda5c6
              expression: 'min(/Ruckus Unleashed by SNMP/ruckus.Unleashed.System.APs.Load,#3)>={$AP.LOAD.WARN}'
              name: 'High AP capacity usage'
              opdata: 'Usage: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Registered AP capacity usage is above the configured threshold.'
              tags:
                - tag: scope
                  value: capacity
        - uuid: 2e69ad953a9c4dbca3824696a3e00202
