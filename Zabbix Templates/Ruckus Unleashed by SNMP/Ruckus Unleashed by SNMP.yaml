              trigger_prototypes:
                - uuid: 126ae369f3bf47c5bff3379aac2547d6
                  expression: 'last(/Ruckus Unleashed by SNMP/ruckus.Unleashed.WLAN.AP.Role[{#SNMPINDEX}],#1)<>last(/Ruckus Unleashed by SNMP/ruckus.Unleashed.WLAN.AP.Role[{#SNMPINDEX}],#2)'
                  name: 'AP {#AP.LABEL} role changed'
                  priority: INFO
                  manual_close: 'YES'
            - uuid: 8c43d3c74a944387818e448c385c6813
              name: 'AP Status [{#AP.LABEL}]'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.25053.1.15.2.1.1.2.1.1.3.6.{#SNMPINDEX}'
              key: 'ruckus.Unleashed.WLAN.AP.Status[{#SNMPINDEX}]'
              trends: '0'
              valuemap:
                name: 'Ruckus AP Status'
              tags:
                - tag: ap
                  value: '{#AP.MAC}'
                - tag: ap_description
                  value: '{#AP.DESCRIPTION}'
                - tag: component
                  value: ap
                - tag: model
                  value: '{#AP.MODEL}'
              trigger_prototypes:
                - uuid: 41c9fda767c74a149fbf075a22db210e
                  expression: 'max(/Ruckus Unleashed by SNMP/ruckus.Unleashed.WLAN.AP.Status[{#SNMPINDEX}],5m)=0'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Ruckus Unleashed by SNMP/ruckus.Unleashed.WLAN.AP.Status[{#SNMPINDEX}])=1'
                  name: 'AP {#AP.LABEL} disconnected for 5 minutes'
                  priority: AVERAGE
                  dependencies:
                    - name: 'No SNMP data collection'
                      expression: 'max(/Ruckus Unleashed by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
            - uuid: 721bff88f246411b8f019cbf15f43f88
              name: 'AP Uptime [{#AP.LABEL}]'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.25053.1.15.2.1.1.2.1.1.6.6.{#SNMPINDEX}'
              key: 'ruckus.Unleashed.WLAN.AP.Uptime[{#SNMPINDEX}]'
              trends: '0'
              units: uptime
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.01'
              tags:
                - tag: ap
                  value: '{#AP.MAC}'
                - tag: ap_description
                  value: '{#AP.DESCRIPTION}'
                - tag: component
                  value: ap
                - tag: model
                  value: '{#AP.MODEL}'
          trigger_prototypes:
            - uuid: 7b83d665245740eeb7205eb54ea6309a
              expression: |
                last(/Ruckus Unleashed by SNMP/ruckus.Unleashed.WLAN.AP.Uptime[{#SNMPINDEX}])<10m
                and
                last(/Ruckus Unleashed by SNMP/ruckus.Unleashed.WLAN.AP.Status[{#SNMPINDEX}])=1
              name: 'AP {#AP.LABEL} restarted'
              priority: INFO
              description: 'The host uptime is less than 10 minutes.'
              manual_close: 'YES'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  for (var i = 0; i < data.length; i++) {
                      var desc = data[i]["{#AP.DESCRIPTION}"];
                      var mac = data[i]["{#AP.MAC}"];
                      if (desc !== undefined && desc !== null) {
                          desc = String(desc).trim();
                      } else {
                          desc = "";
                      }
                      data[i]["{#AP.DESCRIPTION}"] = desc;
                      data[i]["{#AP.LABEL}"] = desc !== "" ? desc : mac;
                  }
                  return JSON.stringify(data);
        - uuid: 64e89d68603f4a78b0de545334432c9a
          name: 'Ruckus AP Ethernet discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#AP.ETH.MAC},1.3.6.1.4.1.25053.1.15.2.1.1.2.8.1.1.6,{#AP.ETH.PORT},1.3.6.1.4.1.25053.1.15.2.1.1.2.8.1.2.6,{#AP.ETH.IFNAME},1.3.6.1.4.1.25053.1.15.2.1.1.2.8.1.5.6,{#AP.ETH.PHY.STATUS},1.3.6.1.4.1.25053.1.15.2.1.1.2.8.1.8.6,{#AP.ETH.SPEED},1.3.6.1.4.1.25053.1.15.2.1.1.2.8.1.9.6,{#AP.ETH.STATUS},1.3.6.1.4.1.25053.1.15.2.1.1.2.8.1.10.6,{#AP.ETH.LABEL},1.3.6.1.4.1.25053.1.15.2.1.1.2.8.1.11.6,{#AP.DESCRIPTION},1.3.6.1.4.1.25053.1.15.2.1.1.2.1.1.2.6]'
          key: ruckus.ap.ethernet.discovery
          delay: 5m
          filter:
            conditions:
              - macro: '{#AP.ETH.IFNAME}'
                value: .+
              - macro: '{#AP.ETH.MAC}'
                value: .+
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: dde9c63346184e59a218b863768ab797
              name: 'AP Ethernet label [{#AP.LABEL}/{#AP.ETH.IFNAME}]'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.25053.1.15.2.1.1.2.8.1.11.6.{#SNMPINDEX}'
              key: 'ruckus.Unleashed.WLAN.AP.Ethernet.Label[{#SNMPINDEX}]'
              value_type: TEXT
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: ap
                  value: '{#AP.ETH.MAC}'
                - tag: ap_description
                  value: '{#AP.DESCRIPTION}'
                - tag: component
                  value: network
                - tag: interface
                  value: '{#AP.ETH.IFNAME}'
                - tag: scope
                  value: inventory
            - uuid: dc49ed9e73974c979b92ca4c3ea162e6
              name: 'AP Ethernet physical status [{#AP.LABEL}/{#AP.ETH.IFNAME}]'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.25053.1.15.2.1.1.2.8.1.8.6.{#SNMPINDEX}'
              key: 'ruckus.Unleashed.WLAN.AP.Ethernet.PhysStatus[{#SNMPINDEX}]'
              trends: '0'
              valuemap:
                name: 'Ruckus AP Ethernet physical status'
              tags:
                - tag: ap
                  value: '{#AP.ETH.MAC}'
                - tag: ap_description
                  value: '{#AP.DESCRIPTION}'
                - tag: component
                  value: network
                - tag: interface
                  value: '{#AP.ETH.IFNAME}'
                - tag: scope
                  value: availability
            - uuid: 92c5f108d31f453c9e447f6759575205
              name: 'AP Ethernet speed [{#AP.LABEL}/{#AP.ETH.IFNAME}]'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.25053.1.15.2.1.1.2.8.1.9.6.{#SNMPINDEX}'
              key: 'ruckus.Unleashed.WLAN.AP.Ethernet.Speed[{#SNMPINDEX}]'
              units: bps
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: ap
                  value: '{#AP.ETH.MAC}'
                - tag: ap_description
                  value: '{#AP.DESCRIPTION}'
                - tag: component
                  value: network
                - tag: interface
                  value: '{#AP.ETH.IFNAME}'
                - tag: scope
                  value: performance
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var descByApIndex = {};
                  var result = [];
                  for (var i = 0; i < data.length; i++) {
                      var idx = data[i]["{#SNMPINDEX}"];
                      var desc = data[i]["{#AP.DESCRIPTION}"];
                      if (idx !== undefined && desc !== undefined && data[i]["{#AP.ETH.IFNAME}"] === undefined) {
                          desc = desc !== null ? String(desc).trim() : "";
                          descByApIndex[String(idx)] = desc;
                      }
                  }
                  for (var j = 0; j < data.length; j++) {
                      if (data[j]["{#AP.ETH.IFNAME}"] !== undefined && data[j]["{#AP.ETH.MAC}"] !== undefined) {
                          var ethIdx = String(data[j]["{#SNMPINDEX}"] || "");
                          var parts = ethIdx.split(".");
                          var apIdx = parts.length > 6 ? parts.slice(0, 6).join(".") : ethIdx;
                          var apDesc = descByApIndex[apIdx] !== undefined ? descByApIndex[apIdx] : "";
                          var apMac = data[j]["{#AP.ETH.MAC}"];
                          data[j]["{#AP.DESCRIPTION}"] = apDesc;
                          data[j]["{#AP.LABEL}"] = apDesc !== "" ? apDesc : apMac;
                          result.push(data[j]);
                      }
                  }
                  return JSON.stringify(result);
