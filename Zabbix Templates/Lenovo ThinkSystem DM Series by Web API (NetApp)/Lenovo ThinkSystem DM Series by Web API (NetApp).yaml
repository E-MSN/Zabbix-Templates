          url: '{$ONTAP.SCHEME}://{HOST.CONN}:{$ONTAP.PORT}/api/cluster/nodes?fields=name'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var result = [];
                  JSON.parse(value).records.forEach(function (node) {
