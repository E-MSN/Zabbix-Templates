zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 3097d88f9bd741b69eac32e51be0f0b9
      name: 'Templates/NAS & SAN'
  templates:
    - uuid: cca015bd031b4eaea349fbd3e2f0770a
      template: 'Lenovo ThinkSystem DM Series by Web API'
      name: 'Lenovo ThinkSystem DM Series by Web API (NetApp)'
      description: 'Monitors Lenovo ThinkSystem DM Series arrays through the NetApp ONTAP Web Services API.'
      vendor:
        name: E-MSN
        version: 7.4-10
      groups:
        - name: 'Templates/NAS & SAN'
      items:
        - uuid: b06601d286104d7e90ecbe91ce0f2e2d
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          description: |
            The host accessibility by ICMP ping.
            
            0 - ICMP ping fails;
            1 - ICMP ping successful.
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 87d59c67850c458985ac101cc6c0d1ff
              expression: 'max(/Lenovo ThinkSystem DM Series by Web API/icmpping,#3)=0'
              name: 'Lenovo DM: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: c9c4c106cba3434dbd0974a34673162c
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          description: 'The percentage of lost packets.'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 1e896561735e4c21b5b8cfb93e84d512
              expression: 'min(/Lenovo ThinkSystem DM Series by Web API/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Lenovo ThinkSystem DM Series by Web API/icmppingloss,5m)<100'
              name: 'Lenovo DM: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'Lenovo DM: Unavailable by ICMP ping'
                  expression: 'max(/Lenovo ThinkSystem DM Series by Web API/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: edb0f4f2306f45cda4bf72b8ef9e345d
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          description: 'The ICMP ping response time (in seconds).'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: db2e74589cc94547b3a4a17f1a0b31ce
              expression: 'avg(/Lenovo ThinkSystem DM Series by Web API/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'Lenovo DM: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'Lenovo DM: High ICMP ping loss'
                  expression: 'min(/Lenovo ThinkSystem DM Series by Web API/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Lenovo ThinkSystem DM Series by Web API/icmppingloss,5m)<100'
                - name: 'Lenovo DM: Unavailable by ICMP ping'
                  expression: 'max(/Lenovo ThinkSystem DM Series by Web API/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 6544880187cc4a4b9e8bfed35d00c143
          name: 'Lenovo DM: Get aggregates'
          type: HTTP_AGENT
          key: netapp.aggregates.get
          history: '0'
          value_type: TEXT
          authtype: BASIC
          username: '{$ONTAP.USERNAME}'
          password: '{$ONTAP.PASSWORD}'
          timeout: '{$ONTAP.HTTP.TIMEOUT}'
          url: '{$ONTAP.SCHEME}://{HOST.CONN}:{$ONTAP.PORT}/api/storage/aggregates?fields=name,uuid,home_node.name,state,space.block_storage.size,space.block_storage.available,space.block_storage.used,space.block_storage.used_percent,metric'
          tags:
            - tag: component
              value: aggregate
            - tag: component
              value: raw
        - uuid: aae1da27e4784b549b2ca3ea48ba50e0
          name: 'Lenovo DM: Get chassis'
          type: HTTP_AGENT
          key: netapp.chassis.get
          history: '0'
          value_type: TEXT
          authtype: BASIC
          username: '{$ONTAP.USERNAME}'
          password: '{$ONTAP.PASSWORD}'
          timeout: '{$ONTAP.HTTP.TIMEOUT}'
          url: '{$ONTAP.SCHEME}://{HOST.CONN}:{$ONTAP.PORT}/api/cluster/chassis?fields=id,state'
          tags:
            - tag: component
              value: raw
        - uuid: ed909103eb294ede828cd4dba74b970c
