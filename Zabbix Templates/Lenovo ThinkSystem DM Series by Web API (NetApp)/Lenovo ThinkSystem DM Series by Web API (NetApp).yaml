                  value: fc-port
                - tag: fc-port
                  value: '{#FCPORTNAME}'
                - tag: node
                  value: '{#NODENAME}'
              trigger_prototypes:
                - uuid: 88f2e7f5702340ad85b9a024bfa1cdf8
                  expression: '(last(/Lenovo ThinkSystem DM Series by Web API/netapp.port.fc.state[{#NODENAME},{#FCPORTNAME}],#1)<>last(/Lenovo ThinkSystem DM Series by Web API/netapp.port.fc.state[{#NODENAME},{#FCPORTNAME}],#2) and last(/Lenovo ThinkSystem DM Series by Web API/netapp.port.fc.state[{#NODENAME},{#FCPORTNAME}])<>"online")'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: '(last(/Lenovo ThinkSystem DM Series by Web API/netapp.port.fc.state[{#NODENAME},{#FCPORTNAME}],#1)<>last(/Lenovo ThinkSystem DM Series by Web API/netapp.port.fc.state[{#NODENAME},{#FCPORTNAME}],#2) and last(/Lenovo ThinkSystem DM Series by Web API/netapp.port.fc.state[{#NODENAME},{#FCPORTNAME}])="online")'
                  name: '{#FCPORTNAME}: FC port of the Node "{#NODENAME}" has state different from "online"'
                  priority: AVERAGE
                  description: 'Something is wrong with the FC port.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
