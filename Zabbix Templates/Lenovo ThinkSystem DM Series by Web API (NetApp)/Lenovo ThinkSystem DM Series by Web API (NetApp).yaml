                  expression: '(last(/Lenovo ThinkSystem DM Series by Web API/netapp.volume.state[{#VOLUMENAME}],#1)<>last(/Lenovo ThinkSystem DM Series by Web API/netapp.volume.state[{#VOLUMENAME}],#2) and last(/Lenovo ThinkSystem DM Series by Web API/netapp.volume.state[{#VOLUMENAME}])<>"online")'
