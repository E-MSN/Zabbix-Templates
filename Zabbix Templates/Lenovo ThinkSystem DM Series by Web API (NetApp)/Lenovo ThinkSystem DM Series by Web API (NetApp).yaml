        - uuid: 24c73827105c4a43994f712ca0fb0e6b
          name: 'Temperature sensors discovery'
          type: DEPENDENT
          key: netapp.temperature.sensors.discovery
          description: 'Discovers all ONTAP environmental sensors whose reported unit is degrees Celsius.'
          item_prototypes:
            - uuid: e77ec1f91e71434d872dde9974312768
              name: '{#NODENAME}: {#SENSORNAME} temperature state'
              type: DEPENDENT
              key: 'netapp.temperature.state[{#NODENAME},{#SENSORINDEX}]'
              history: 7d
              value_type: CHAR
              description: 'ONTAP threshold state reported by the temperature sensor.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var node = '{#NODENAME}';
                      var index = Number('{#SENSORINDEX}');
                      var records = data.records || [];
                      for (var i = 0; i < records.length; i++) {
                          var record = records[i];
                          var recordNode = record.node && record.node.name !== undefined ? String(record.node.name) : '';
                          if (recordNode === node && Number(record.index) === index) {
                              var state = record.threshold_state;
                              if (state === undefined || state === null || state === '') {
                                  state = record.discrete_state;
                              }
                              if (state === undefined || state === null || state === '') {
                                  return 'unknown';
                              }
                              return String(state).toLowerCase().replace(/_/g, '-');
                          }
                      }
                      throw 'Temperature sensor not found for node ' + node + ', index ' + index;
                - type: DISCARD_UNCHANGED_HEARTBEAT
