              type: DEPENDENT
              key: 'netapp.disk.status.code[{#NODENAME},{#DISKNAME}]'
              history: 7d
              description: 'Composite numeric disk health code derived from state, persistent outage, ONTAP errors and path errors.'
              valuemap:
                name: 'NetApp Disk status code'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var records = JSON.parse(value).records || [];
                      var disk = null;
                      for (var i = 0; i < records.length; i++) {
                          if (records[i].name === '{#DISKNAME}' && records[i].node && records[i].node.name === '{#NODENAME}') {
                              disk = records[i];
                              break;
                          }
                      }
                      if (!disk) return 4;
                      var state = String(disk.state || '').toLowerCase();
                      var errors = Array.isArray(disk.error) ? disk.error.length : 0;
                      var persistentlyFailed = !!(disk.outage && disk.outage.persistently_failed === true);
                      var pathErrors = disk.stats && disk.stats.path_error_count !== undefined && disk.stats.path_error_count !== null
                      ? Number(disk.stats.path_error_count) : 0;
                      if (state === 'broken' || state === 'removed') return 3;
                      if (persistentlyFailed || errors > 0) return 2;
                      if (['copy', 'maintenance', 'pending', 'reconstructing', 'unfail', 'zeroing'].indexOf(state) !== -1) return 2;
                      if (!isNaN(pathErrors) && pathErrors > 0) return 1;
                      if (state === 'present' || state === 'spare' || state === 'partner') return 0;
                      return 4;
