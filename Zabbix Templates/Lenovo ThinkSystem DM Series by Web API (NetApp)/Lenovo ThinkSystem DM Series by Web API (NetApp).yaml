              name: 'SnapMirror {#SOURCE} -> {#DESTINATION}: Status code'
              type: DEPENDENT
              key: 'netapp.snapmirror.state.code[{#SMUUID}]'
              history: 7d
              trends: '0'
              description: 'Numeric severity code derived from the textual snapmirror state.'
              valuemap:
                name: 'NetApp SnapMirror status code'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var relationship = null;
                      (data.records || []).some(function (record) {
                          if (record.uuid === '{#SMUUID}') {
                              relationship = record;
                              return true;
                          }
                          return false;
                      });
                      if (
                          !relationship ||
                          relationship.state === undefined ||
                          relationship.state === null
                      ) {
                          return 8;
                      }
                      var state = String(relationship.state)
                          .toLowerCase()
                          .replace(/[-\s]+/g, '_');
                      switch (state) {
                          case 'snapmirrored':
                              return 0;
                          case 'in_sync':
                              return 1;
                          case 'synchronizing':
                              return 2;
                          case 'expanding':
                              return 3;
                          case 'paused':
                              return 4;
                          case 'uninitialized':
                              return 5;
                          case 'out_of_sync':
                              return 6;
                          case 'broken_off':
                              return 7;
                          default:
                              return 8;
                      }
