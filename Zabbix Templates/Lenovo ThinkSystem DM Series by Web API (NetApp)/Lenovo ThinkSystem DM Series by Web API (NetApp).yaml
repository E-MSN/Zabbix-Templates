        - uuid: b833328fc2824d09bfdb93ca82c9e783
          name: 'Lenovo DM: Cluster status'
          type: DEPENDENT
          key: netapp.cluster.status
          history: 7d
          value_type: CHAR
          description: 'The status of the cluster: ok, error, partial_no_data, partial_no_response, partial_other_error, negative_delta, backfilled_data, inconsistent_delta_time, inconsistent_old_data.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.statistics.status
          master_item:
            key: netapp.cluster.get
          tags:
            - tag: component
              value: cluster
          triggers:
            - uuid: 3699ff0020794dbdb31282c0d0f12be7
              expression: 'nodata(/Lenovo ThinkSystem DM Series by Web API/netapp.cluster.status,{$ONTAP.API.NODATA})=1'
              name: 'Lenovo DM: ONTAP REST API is unavailable'
              priority: HIGH
              description: 'No usable cluster status has been received from the ONTAP REST API within the configured period.'
              dependencies:
                - name: 'Lenovo DM: Unavailable by ICMP ping'
                  expression: 'max(/Lenovo ThinkSystem DM Series by Web API/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
            - uuid: e2bd4312892146ad9348cff4e3ac5611
              expression: '(last(/Lenovo ThinkSystem DM Series by Web API/netapp.cluster.status)<>"ok")'
              name: 'Lenovo ThinkSystem DM Series: Cluster status is abnormal'
              priority: AVERAGE
              description: 'Any errors associated with the sample. For example, if the aggregation of data over multiple nodes fails then any of the partial errors might be returned, “ok” on success, or “error” on any internal uncategorized failure. Whenever a sample collection is missed but done at a later time, it is back filled to the previous 15 second timestamp and tagged with "backfilled_data". “Inconsistent_ delta_time” is encountered when the time between two collections is not the same for all nodes. Therefore, the aggregated value might be over or under inflated. “Negative_delta” is returned when an expected monotonically increasing value has decreased in value. “Inconsistent_old_data” is returned when one or more nodes do not have the latest data.'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 15149d4daf4d4151a12c757636061479
          name: 'Lenovo DM: Cluster status code'
          type: DEPENDENT
          key: netapp.cluster.status.code
          history: 7d
          description: 'Numeric severity code derived from the textual cluster performance metric status.'
          valuemap:
            name: 'NetApp Metric status code'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.statistics.status
            - type: JAVASCRIPT
              parameters:
                - |
                  var status = String(value || '').toLowerCase();
                  if (status === 'ok') return 0;
                  if (status === 'backfilled_data') return 1;
                  if (['partial_no_data', 'partial_no_response', 'partial_other_error', 'negative_delta', 'inconsistent_delta_time', 'inconsistent_old_data'].indexOf(status) !== -1) return 2;
                  if (status === 'error') return 3;
                  return 4;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          master_item:
            key: netapp.cluster.get
          tags:
            - tag: component
              value: cluster
        - uuid: 5c853e32be1d4760b2074ceb555357e9
          name: 'Lenovo DM: Cluster UUID'
