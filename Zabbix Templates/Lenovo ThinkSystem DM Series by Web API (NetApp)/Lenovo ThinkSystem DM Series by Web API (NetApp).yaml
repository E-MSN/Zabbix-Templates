                  recovery_expression: '(last(/Lenovo ThinkSystem DM Series by Web API/netapp.chassis.state[{#ID}],#1)<>last(/Lenovo ThinkSystem DM Series by Web API/netapp.chassis.state[{#ID}],#2) and last(/Lenovo ThinkSystem DM Series by Web API/netapp.chassis.state[{#ID}])="ok")'
