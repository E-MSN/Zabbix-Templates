        - uuid: e271387d12694089851d6d7280d655ea
          name: 'Disks discovery'
          type: HTTP_AGENT
          key: netapp.disks.discovery
          delay: 1h
          authtype: BASIC
          username: '{$ONTAP.USERNAME}'
          password: '{$ONTAP.PASSWORD}'
          item_prototypes:
            - uuid: 5280d4c21fd64af184821962f15666ba
              name: 'Disk {#DISKNAME}: Aggregates'
              type: DEPENDENT
              key: 'netapp.disk.aggregates[{#NODENAME},{#DISKNAME}]'
              history: 7d
              value_type: TEXT
              description: 'The aggregates using the disk.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var records = JSON.parse(value).records || [];
