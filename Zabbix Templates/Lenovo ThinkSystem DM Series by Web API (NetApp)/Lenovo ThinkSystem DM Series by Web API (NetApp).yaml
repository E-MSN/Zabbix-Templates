            - uuid: e4e9cf4f28ff4f70931ede84e64e71f7
              name: '{#NODENAME}: WAFL memory free'
              type: DEPENDENT
              key: 'netapp.node.wafl.memory.free[{#NODENAME}]'
              history: 7d
              value_type: FLOAT
              units: B
              description: 'Current memory available to WAFL on the node. The ONTAP value is converted from MB to bytes.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var node = '{#NODENAME}';
                      var records = data.records || [];
                      var row = null;
                      for (var i = 0; i < records.length; i++) {
                          var properties = records[i].properties || [];
                          for (var j = 0; j < properties.length; j++) {
                              if (properties[j].name === 'node.name' && String(properties[j].value) === node) {
                                  row = records[i];
                                  break;
                              }
                          }
                          if (row !== null) break;
                      }
                      if (row === null) {
                          throw 'WAFL counter row not found for node ' + node;
                      }
                      var counters = row.counters || [];
                      for (var k = 0; k < counters.length; k++) {
                          if (counters[k].name === 'memory_free') {
                              var result = Number(counters[k].value);
                              if (!isFinite(result)) {
                                  throw 'Invalid WAFL memory_free value for node ' + node;
                              }
                              return result * 1048576;
                          }
                      }
                      throw 'WAFL memory_free counter not found for node ' + node;
              master_item:
                key: netapp.wafl.memory.get
              tags:
                - tag: component
                  value: memory
                - tag: node
                  value: '{#NODENAME}'
            - uuid: c65a1510760c464b99eb2929b9380ef4
              name: '{#NODENAME}: WAFL memory used'
              type: DEPENDENT
              key: 'netapp.node.wafl.memory.used[{#NODENAME}]'
              history: 7d
              value_type: FLOAT
              units: B
              description: 'Current memory used by WAFL on the node. The ONTAP value is converted from MB to bytes.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var node = '{#NODENAME}';
                      var records = data.records || [];
                      var row = null;
                      for (var i = 0; i < records.length; i++) {
                          var properties = records[i].properties || [];
                          for (var j = 0; j < properties.length; j++) {
                              if (properties[j].name === 'node.name' && String(properties[j].value) === node) {
                                  row = records[i];
                                  break;
                              }
                          }
                          if (row !== null) break;
                      }
                      if (row === null) {
                          throw 'WAFL counter row not found for node ' + node;
                      }
                      var counters = row.counters || [];
                      for (var k = 0; k < counters.length; k++) {
                          if (counters[k].name === 'memory_used') {
                              var result = Number(counters[k].value);
                              if (!isFinite(result)) {
                                  throw 'Invalid WAFL memory_used value for node ' + node;
                              }
                              return result * 1048576;
                          }
                      }
                      throw 'WAFL memory_used counter not found for node ' + node;
              master_item:
                key: netapp.wafl.memory.get
              tags:
                - tag: component
                  value: memory
                - tag: node
                  value: '{#NODENAME}'
            - uuid: 8b07c3ef0e524e68aa9614ff0194e273
              name: '{#NODENAME}: WAFL memory utilization'
              type: DEPENDENT
              key: 'netapp.node.wafl.memory.utilization[{#NODENAME}]'
              history: 7d
              value_type: FLOAT
              units: '%'
              description: 'WAFL memory utilization calculated from memory_used and memory_free.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var node = '{#NODENAME}';
                      var records = data.records || [];
                      var row = null;
                      for (var i = 0; i < records.length; i++) {
                          var properties = records[i].properties || [];
                          for (var j = 0; j < properties.length; j++) {
                              if (properties[j].name === 'node.name' && String(properties[j].value) === node) {
                                  row = records[i];
                                  break;
                              }
                          }
                          if (row !== null) break;
                      }
                      if (row === null) {
                          throw 'WAFL counter row not found for node ' + node;
                      }
                      var counters = row.counters || [];
                      var used = null;
                      var free = null;
                      for (var k = 0; k < counters.length; k++) {
                          if (counters[k].name === 'memory_used') {
                              used = Number(counters[k].value);
                          }
                          if (counters[k].name === 'memory_free') {
                              free = Number(counters[k].value);
                          }
                      }
                      if (!isFinite(used) || !isFinite(free)) {
                          throw 'Invalid WAFL memory counters for node ' + node;
                      }
                      var total = used + free;
                      if (total <= 0) {
                          throw 'Invalid WAFL memory total for node ' + node;
                      }
                      return used * 100 / total;
              master_item:
                key: netapp.wafl.memory.get
              tags:
                - tag: component
                  value: memory
                - tag: node
                  value: '{#NODENAME}'
