          name: 'Lenovo DM: System model'
          type: DEPENDENT
          key: netapp.system.model
          history: 7d
          value_type: CHAR
          description: 'System model from Node1'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var models = [];
                  (data.records || []).forEach(function (node) {
                      if (node.model && models.indexOf(node.model) === -1) {
                          models.push(node.model);
                      }
                  });
                  if (models.length === 0) {
                      throw 'No model returned by ONTAP';
