            - uuid: 9902065140b24a7e8561cf6bf4785de2
              name: 'Camera {#CAMERA.CHANNEL} ({#CAMERA.TITLE}): Channel title'
              type: DEPENDENT
              key: 'dahua.camera.title[{#CAMERA.INDEX}]'
              history: 2d
              value_type: CHAR
              description: 'Channel title configured on the NVR.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.cameras["{#CAMERA.INDEX}"].title'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: dahua.api.camera.get
              tags:
                - tag: camera
                  value: '{#CAMERA.TITLE}'
                - tag: component
                  value: camera
          master_item:
            key: dahua.api.camera.get
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var cameras = data.cameras || {};
                  var output = [];
                  Object.keys(cameras).forEach(function (index) {
                      var camera = cameras[index];
                      output.push({
                          "{#CAMERA.INDEX}": String(index),
                          "{#CAMERA.CHANNEL}": String(camera.channel),
                          "{#CAMERA.TITLE}": String(camera.title || ('Channel ' + camera.channel)),
                          "{#CAMERA.ENABLED}": String(camera.enabled),
                          "{#CAMERA.ADDRESS}": String(camera.address || ''),
                          "{#CAMERA.MODEL}": String(camera.model || ''),
                          "{#CAMERA.CONNECTION.STATE}": String(camera.connection_state || 'Unknown'),
                          "{#CAMERA.CONNECTION.CODE}": String(camera.connection_state_code)
                      });
                  });
                  return JSON.stringify(output);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          overrides:
            - name: 'Disabled cameras'
              step: '1'
              filter:
                conditions:
                  - macro: '{#CAMERA.ENABLED}'
                    value: ^0$
              operations:
                - operator: NOT_REGEXP
                  value: '(Channel title|Connection state|Connection status code)$'
                  discover: NO_DISCOVER
