                  expression: 'last(/Dahua NVR by web API and SNMP/dahua.disk.utilization[{#DISK.INDEX}])>{$DAHUA.DISK.UTIL.WARN}'
                  name: 'Disk {#DISK.NUMBER} ({#DISK.NAME}): Utilization is high'
                  opdata: 'Utilization: {ITEM.LASTVALUE}'
                  priority: AVERAGE
                  description: 'Storage utilization exceeds {$DAHUA.DISK.UTIL.WARN}%. The default threshold of 100 disables the alert for normal circular NVR recording.'
                  tags:
                    - tag: scope
                      value: capacity
            - uuid: 5bea6003d23744c8a25ece7124d7954b
              name: 'Disk {#DISK.NUMBER}: Volume type - {#DISK.NAME}'
              type: DEPENDENT
              key: 'dahua.disk.volume.type[{#DISK.INDEX}]'
              history: 7d
              value_type: CHAR
              description: 'Volume type returned by StorageDeviceManager/getDeviceInfos.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.storage.disks["{#DISK.INDEX}"].volume'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: dahua.api.storage.inventory.get
              tags:
                - tag: component
                  value: storage
                - tag: disk
                  value: '{#DISK.NAME}'
          master_item:
            key: dahua.api.storage.get
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var disks = data.storage && data.storage.disks ? data.storage.disks : {};
                  var output = [];
                  Object.keys(disks).forEach(function (index) {
                      var disk = disks[index];
                      output.push({
                          "{#DISK.INDEX}": String(index),
                          "{#DISK.NUMBER}": String(disk.number),
                          "{#DISK.NAME}": String(disk.name || ('Disk ' + disk.number))
                      });
                  });
                  return JSON.stringify(output);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 7aa7005a2063493a8d62a5426259dfd5
          name: 'Dahua NVR: Network interface discovery'
          type: DEPENDENT
          key: net.if.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.MATCHES}'
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.MATCHES}'
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFOPERSTATUS}'
                value: '{$NET.IF.IFOPERSTATUS.MATCHES}'
              - macro: '{#IFOPERSTATUS}'
                value: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.MATCHES}'
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          lifetime: 1d
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1h
          description: 'Discovers NVR network interfaces through IF-MIB. Traffic uses 64-bit high-capacity counters.'
          item_prototypes:
            - uuid: e23f71834d804ec0a201c2f07af570c0
              name: 'Interface {#IFNAME}: Inbound packets discarded'
              type: DEPENDENT
              key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
              history: 7d
              units: pps
              description: |
                Inbound packets discarded per second.
                
                MIB: IF-MIB
                Packets discarded even though no transmission error prevented delivery to a higher-layer protocol. A common reason is insufficient buffer capacity. Counter discontinuities can occur when the management system is reinitialized.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '.1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
              master_item:
                key: dahua.snmp.network.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 3e064c6f485f4c8bae281e28dc9daf7f
              name: 'Interface {#IFNAME}: Inbound packets with errors'
              type: DEPENDENT
              key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
              history: 7d
              units: pps
              description: |
                Inbound packets with errors per second.
                
                MIB: IF-MIB
                Packets or transmission units containing errors that prevent delivery to a higher-layer protocol. Counter discontinuities can occur when the management system is reinitialized.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '.1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
              master_item:
                key: dahua.snmp.network.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: edc1af62e0c942cca0262084975ddc8d
              name: 'Interface {#IFNAME}: Bits received'
              type: DEPENDENT
              key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
              history: 7d
              units: bps
              description: |
                Inbound traffic in bits per second.
                
                MIB: IF-MIB
                Calculated from the 64-bit ifHCInOctets counter, including framing characters.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '.1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: dahua.snmp.network.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: d345f455c083451ab9b13add95671ba9
              name: 'Interface {#IFNAME}: Outbound packets discarded'
              type: DEPENDENT
              key: 'net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]'
              history: 7d
              units: pps
              description: |
                Outbound packets discarded per second.
                
                MIB: IF-MIB
                Packets discarded even though no transmission error prevented delivery. A common reason is insufficient buffer capacity. Counter discontinuities can occur when the management system is reinitialized.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '.1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
              master_item:
                key: dahua.snmp.network.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 79c02ac2c122428a97976f5b22b3e040
              name: 'Interface {#IFNAME}: Outbound packets with errors'
              type: DEPENDENT
              key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
              history: 7d
              units: pps
              description: |
                Outbound packets with errors per second.
                
                MIB: IF-MIB
                Packets or transmission units containing errors that prevent successful transmission. Counter discontinuities can occur when the management system is reinitialized.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '.1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
              master_item:
                key: dahua.snmp.network.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 8b8c1c6085c74b0ba8a943782a458812
              name: 'Interface {#IFNAME}: Bits sent'
              type: DEPENDENT
              key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
              history: 7d
              units: bps
              description: |
                Outbound traffic in bits per second.
                
                MIB: IF-MIB
                Calculated from the 64-bit ifHCOutOctets counter, including framing characters.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '.1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: dahua.snmp.network.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 1a9a821a909a43b7a7867072ea083d4e
              name: 'Interface {#IFNAME}: Speed'
              type: DEPENDENT
              key: 'net.if.speed[ifSpeed.{#SNMPINDEX}]'
              history: 7d
              trends: '0'
              units: bps
              description: |
                Current or nominal interface bandwidth in bits per second.
                
                MIB: IF-MIB
                The 32-bit ifSpeed object is limited to 4,294,967,295 bps. Interfaces above this limit require ifHighSpeed or another vendor-specific speed object.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '.1.3.6.1.2.1.2.2.1.5.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: dahua.snmp.network.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 393a0d78bbff43edbb1994b416f16296
              name: 'Interface {#IFNAME}: Admin status'
              type: DEPENDENT
              key: 'net.if.status[ifAdminStatus.{#SNMPINDEX}]'
              history: 7d
              trends: '0'
              description: |
                Configured administrative state of the interface.
                
                MIB: IF-MIB
                1 - Up
                2 - Down
                3 - Testing
              valuemap:
                name: 'IF-MIB::ifAdminStatus'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '.1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: dahua.snmp.network.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: cf40586d22f14880b532673e8675acf0
              name: 'Interface {#IFNAME}: Operational status'
              type: DEPENDENT
              key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
              history: 7d
              trends: '0'
              description: |
                Current operational state of the interface.
                
                MIB: IF-MIB
                1 - Up
                2 - Down
                3 - Testing
                4 - Unknown
                5 - Dormant
                6 - Not present
                7 - Lower-layer down
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '.1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: dahua.snmp.network.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: da09936ea3b642a7ac01427835b967dd
                  expression: |
                    {$IFCONTROL:"{#IFNAME}"}=1
                    and
                    last(/Dahua NVR by web API and SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2
                    and
                    change(/Dahua NVR by web API and SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=1
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Dahua NVR by web API and SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
                  name: 'Interface {#IFDESCR}: Link down'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    The trigger fires only when the operational status changes from Up (1) to Down (2) and {$IFCONTROL:"{#IFNAME}"}=1.
                    Set the context macro {$IFCONTROL:"{#IFNAME}"} to 0 to ignore a specific interface.
                    The event may be closed manually; it will not reopen while the interface remains down.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: '{#IFNAME}'
                      value: down
            - uuid: ee758a701f4743f9a06ad6cce3a45200
              name: 'Interface {#IFNAME}: Type'
              type: DEPENDENT
              key: 'net.if.type[ifType.{#SNMPINDEX}]'
              history: 7d
              trends: '0'
              description: |
                Interface type reported by IF-MIB.
                Additional ifType values are assigned through the IANAifType textual convention.
              valuemap:
                name: 'IF-MIB::ifType'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '.1.3.6.1.2.1.2.2.1.3.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: dahua.snmp.network.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
          trigger_prototypes:
            - uuid: 7e91e339296e433ebf1e6d911711eafd
              expression: |
                change(/Dahua NVR by web API and SNMP/net.if.speed[ifSpeed.{#SNMPINDEX}])<0 and last(/Dahua NVR by web API and SNMP/net.if.speed[ifSpeed.{#SNMPINDEX}])>0
                and (
                last(/Dahua NVR by web API and SNMP/net.if.type[ifType.{#SNMPINDEX}])=6 or
                last(/Dahua NVR by web API and SNMP/net.if.type[ifType.{#SNMPINDEX}])=7 or
                last(/Dahua NVR by web API and SNMP/net.if.type[ifType.{#SNMPINDEX}])=11 or
                last(/Dahua NVR by web API and SNMP/net.if.type[ifType.{#SNMPINDEX}])=62 or
                last(/Dahua NVR by web API and SNMP/net.if.type[ifType.{#SNMPINDEX}])=69 or
                last(/Dahua NVR by web API and SNMP/net.if.type[ifType.{#SNMPINDEX}])=117
                )
                and
                (last(/Dahua NVR by web API and SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2)
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                (change(/Dahua NVR by web API and SNMP/net.if.speed[ifSpeed.{#SNMPINDEX}])>0 and last(/Dahua NVR by web API and SNMP/net.if.speed[ifSpeed.{#SNMPINDEX}],#2)>0) or
                (last(/Dahua NVR by web API and SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2)
              name: 'Interface {#IFDESCR}: Ethernet has changed to lower speed than it was before'
              opdata: 'Current reported speed: {ITEM.LASTVALUE1}'
              priority: INFO
              description: |
                The reported Ethernet speed has decreased while the interface remains operational.
                This may indicate an auto-negotiation, cabling, or link-partner issue.
                This event requires manual closure.
              manual_close: 'YES'
              dependencies:
                - name: 'Interface {#IFDESCR}: Link down'
                  expression: |
                    {$IFCONTROL:"{#IFNAME}"}=1
                    and
                    last(/Dahua NVR by web API and SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2
                    and
                    change(/Dahua NVR by web API and SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=1
                  recovery_expression: 'last(/Dahua NVR by web API and SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: performance
            - uuid: edf96e05c33b4f2784736e63748a6033
              expression: |
                (avg(/Dahua NVR by web API and SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)
                >
                ({$IF.UTIL.MAX:"{#IFNAME}"}/100)
                *
                last(/Dahua NVR by web API and SNMP/net.if.speed[ifSpeed.{#SNMPINDEX}])
                or
                avg(/Dahua NVR by web API and SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)
                >
                ({$IF.UTIL.MAX:"{#IFNAME}"}/100)
                *
                last(/Dahua NVR by web API and SNMP/net.if.speed[ifSpeed.{#SNMPINDEX}]))
                and
                last(/Dahua NVR by web API and SNMP/net.if.speed[ifSpeed.{#SNMPINDEX}])>0
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                avg(/Dahua NVR by web API and SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)
                <
                (({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)
                *
                last(/Dahua NVR by web API and SNMP/net.if.speed[ifSpeed.{#SNMPINDEX}])
                and
                avg(/Dahua NVR by web API and SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)
                <
                (({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)
                *
                last(/Dahua NVR by web API and SNMP/net.if.speed[ifSpeed.{#SNMPINDEX}])
              name: 'Interface {#IFDESCR}: High bandwidth usage'
              event_name: 'Interface {#IFDESCR}: High bandwidth usage (>{$IF.UTIL.MAX:"{#IFNAME}"}%)'
              opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE3}, speed: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'Average inbound or outbound utilization is above the configured percentage of the reported interface speed.'
              manual_close: 'YES'
              dependencies:
                - name: 'Interface {#IFDESCR}: Link down'
                  expression: |
                    {$IFCONTROL:"{#IFNAME}"}=1
                    and
                    last(/Dahua NVR by web API and SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2
                    and
                    change(/Dahua NVR by web API and SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=1
                  recovery_expression: 'last(/Dahua NVR by web API and SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: performance
            - uuid: 5031b11eed0747f38284dbbf5aed89d6
              expression: |
                min(/Dahua NVR by web API and SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
                or min(/Dahua NVR by web API and SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                max(/Dahua NVR by web API and SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
                and max(/Dahua NVR by web API and SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
              name: 'Interface {#IFDESCR}: High error rate'
              event_name: 'Interface {#IFDESCR}: High error rate (>{$IF.ERRORS.WARN:"{#IFNAME}"} for 5m)'
              opdata: 'errors in: {ITEM.LASTVALUE1}, errors out: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: |
                The inbound or outbound error rate has remained above {$IF.ERRORS.WARN:"{#IFNAME}"} for five minutes.
                The event recovers when both rates fall below 80% of the threshold.
              manual_close: 'YES'
              dependencies:
                - name: 'Interface {#IFDESCR}: Link down'
                  expression: |
                    {$IFCONTROL:"{#IFNAME}"}=1
                    and
                    last(/Dahua NVR by web API and SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2
                    and
                    change(/Dahua NVR by web API and SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=1
                  recovery_expression: 'last(/Dahua NVR by web API and SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: performance
