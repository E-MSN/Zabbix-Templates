            - uuid: 3351da7d59cc454eae3fcc3af0808326
              name: 'Disk {#DISK.NUMBER}: Utilization - {#DISK.NAME}'
              type: DEPENDENT
              key: 'dahua.disk.utilization[{#DISK.INDEX}]'
              history: 7d
              value_type: FLOAT
              units: '%'
              description: 'Storage utilization in percent. A value near 100% is normal on an NVR configured to overwrite old recordings.'
              preprocessing:
