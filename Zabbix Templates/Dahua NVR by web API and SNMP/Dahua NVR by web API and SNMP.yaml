        - macro: '{$CPU.UTIL.WARN}'
          value: '90'
          description: 'CPU utilization threshold in percent.'
        - macro: '{$DAHUA.API.ERRORS.MAX}'
          value: '0'
          description: 'Maximum number of optional endpoint failures allowed before raising a warning.'
        - macro: '{$DAHUA.API.NODATA}'
          value: 5m
          description: 'Time without successful master item data before the web API is considered unavailable.'
        - macro: '{$DAHUA.API.PASSWORD}'
          type: SECRET_TEXT
          description: 'Password for the Dahua API account.'
        - macro: '{$DAHUA.API.PORT}'
          value: '443'
          description: 'Dahua web API TCP port.'
        - macro: '{$DAHUA.API.SCHEME}'
          value: https
          description: 'Dahua web API scheme: http or https.'
        - macro: '{$DAHUA.API.USER}'
          value: admin
          description: 'Username for the Dahua web API.'
        - macro: '{$DAHUA.CAMERA.CONNECTION.CHECK}'
          value: '1'
          description: 'Set to 1 to alert when a configured camera is reported as Unconnect, or 0 to disable.'
        - macro: '{$DAHUA.CAMERA.TITLE.MATCHES}'
          value: '^.*$'
          description: 'Discovers only cameras whose channel title matches this regular expression.'
        - macro: '{$DAHUA.CAMERA.TITLE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Excludes cameras whose channel title matches this regular expression.'
        - macro: '{$DAHUA.DISK.UTIL.WARN}'
          value: '100'
          description: 'Disk utilization threshold in percent. The default value effectively disables the alert.'
        - macro: '{$DAHUA.EVENT.STORAGE_FAILURE}'
          value: '1'
          description: 'Set to 1 to alert on active storage failure events, or 0 to disable.'
        - macro: '{$DAHUA.EVENT.STORAGE_LOW_SPACE}'
          value: '1'
          description: 'Set to 1 to alert on storage low-space events. Disabled by default because NVR disks normally fill and overwrite old recordings.'
        - macro: '{$DAHUA.EVENT.STORAGE_MISSING}'
          value: '1'
          description: 'Set to 1 to alert on missing storage events, or 0 to disable.'
        - macro: '{$DAHUA.EVENT.VIDEO_BLIND}'
          value: '1'
          description: 'Set to 1 to alert on video blind events, or 0 to disable.'
        - macro: '{$DAHUA.EVENT.VIDEO_LOSS}'
          value: '1'
          description: 'Set to 1 to alert on video loss events, or 0 to disable.'
        - macro: '{$DAHUA.MEDIA.PORT}'
          value: '37777'
          description: 'TCP media port used by the NVR.'
        - macro: '{$DAHUA.NTP.REQUIRED}'
          value: '1'
          description: 'Set to 1 to alert when NTP synchronization is disabled.'
        - macro: '{$DAHUA.RECORDING.CHECK}'
          value: '1'
          description: 'Set to 1 to alert when a discovered camera primary stream recording mode is Stopped.'
        - macro: '{$IF.ERRORS.WARN}'
          value: '2'
          description: 'Inbound or outbound interface error-rate threshold in packets per second.'
        - macro: '{$IF.UTIL.MAX}'
          value: '95'
          description: 'Interface utilization threshold in percent.'
        - macro: '{$IFCONTROL}'
          value: '1'
          description: 'Controls link-down alerting. Use context macros with a value of 0 to ignore specific interfaces.'
        - macro: '{$MEMORY.UTIL.WARN}'
          value: '90'
          description: 'Memory utilization threshold in percent.'
        - macro: '{$NET.IF.IFADMINSTATUS.MATCHES}'
          value: '^.*'
          description: 'Discovers only interfaces whose administrative status matches this regular expression.'
        - macro: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
          value: ^2$
          description: 'Excludes interfaces whose administrative status matches this regular expression. Administrative Down (2) is excluded by default.'
        - macro: '{$NET.IF.IFDESCR.MATCHES}'
          value: '.*'
          description: 'Discovers only interfaces whose description matches this regular expression.'
        - macro: '{$NET.IF.IFDESCR.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Excludes interfaces whose description matches this regular expression.'
        - macro: '{$NET.IF.IFNAME.MATCHES}'
          value: '^.*$'
          description: 'Discovers only interfaces whose name matches this regular expression.'
        - macro: '{$NET.IF.IFNAME.NOT_MATCHES}'
          value: '(^Software Loopback Interface|^NULL[0-9.]*$|^[Ll]o[0-9.]*$|^[Ss]ystem$|^Nu[0-9.]*$|^veth[0-9a-z]+$|docker[0-9]+|br-[a-z0-9]{12}|^bond[0-9]+$|^eth[0-9]+\.[0-9]+$)'
          description: 'Excludes loopback, null, container, bonding and Linux VLAN subinterfaces by default.'
        - macro: '{$NET.IF.IFOPERSTATUS.MATCHES}'
          value: '^.*$'
          description: 'Discovers only interfaces whose operational status matches this regular expression.'
        - macro: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
          value: ^6$
          description: 'Excludes interfaces whose operational status matches this regular expression. NotPresent (6) is excluded by default.'
        - macro: '{$NET.IF.IFTYPE.MATCHES}'
          value: '.*'
          description: 'Discovers only interfaces whose type matches this regular expression.'
        - macro: '{$NET.IF.IFTYPE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Excludes interfaces whose type matches this regular expression.'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'Time that SNMP polling may remain unavailable before an alert is generated.'
