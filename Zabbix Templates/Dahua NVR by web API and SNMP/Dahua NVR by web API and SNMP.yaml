        - uuid: d69fe6606059447c8f82c2f0978da9e8
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          delay: '60'
          history: 1w
          valuemap:
            name: 'Service state'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: aa9ba8bbba77438299967f474ea47b1d
              expression: 'max(/Dahua NVR by web API and SNMP/icmpping,#3)=0'
              name: 'ICMP Ping: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 03cde7b3f7b04fc2ac944362015657df
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: '%'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: e61b53275279442aa19dccf3b5e9a321
              expression: 'min(/Dahua NVR by web API and SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Dahua NVR by web API and SNMP/icmppingloss,5m)<100'
              name: 'ICMP Ping: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Dahua NVR by web API and SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: b2425214027647f38a82e5602574448f
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: s
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: a0bc980732fc404cb01e1757b47aae48
              expression: 'avg(/Dahua NVR by web API and SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'ICMP Ping: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'ICMP Ping: High ICMP ping loss'
                  expression: 'min(/Dahua NVR by web API and SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Dahua NVR by web API and SNMP/icmppingloss,5m)<100'
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Dahua NVR by web API and SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 6d28edc9fac94170b2c5e0fb319f8daf
          name: 'TCP Performance Web'
          type: SIMPLE
          key: 'net.tcp.service.perf[tcp,,{$DAHUA.API.PORT}]'
          history: 7d
          value_type: FLOAT
          units: s
          description: 'TCP connection time for the device web interface port.'
          tags:
            - tag: system
              value: performance
        - uuid: f086a94ecab04420950f884b163f97f6
          name: 'TCP Performance Media'
          type: SIMPLE
          key: 'net.tcp.service.perf[tcp,,{$DAHUA.MEDIA.PORT}]'
          history: 7d
          value_type: FLOAT
          units: s
          description: 'TCP connection time for the device media port.'
          tags:
            - tag: system
              value: performance
        - uuid: 4c6fa959c7c2478cae20159b827bc45f
          name: 'SNMP traps (fallback)'
          type: SNMP_TRAP
          key: snmptrap.fallback
          value_type: LOG
          description: 'The item is used to collect all SNMP traps unmatched by other snmptrap items'
          logtimefmt: 'hh:mm:sszyyyy/MM/dd'
          tags:
            - tag: component
              value: network
        - uuid: a7b578aae49641dcb2e4f504cd75d4c9
          name: 'SNMP Agent Availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          delay: 3m
          history: 7d
          trends: '0'
          description: |
            Availability of SNMP polling for the host. This value corresponds to the SNMP availability icon in the host list.
            
            0 - Unavailable
            1 - Available
            2 - Unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: application
              value: status
          triggers:
            - uuid: ce3bb42bb2ab4666bed719ce9d41809b
              expression: |
                max(/Dahua NVR by web API and SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
                or
                nodata(/Dahua NVR by web API and SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=1
              name: 'No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE}'
              priority: HIGH
              description: |
                SNMP polling has been unavailable for {$SNMP.TIMEOUT}.
                Verify network connectivity, the SNMP interface, credentials, access control, and device SNMP settings.
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Dahua NVR by web API and SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 1e77f329acd8493080d85b51b4b5b8e8
          name: 'Dahua NVR: Camera discovery'
          type: DEPENDENT
          key: dahua.camera.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#CAMERA.TITLE}'
                value: '{$DAHUA.CAMERA.TITLE.MATCHES}'
              - macro: '{#CAMERA.TITLE}'
                value: '{$DAHUA.CAMERA.TITLE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          description: 'Discovers remote camera channels and exposes inventory, connection state, stream settings and recording state.'
          item_prototypes:
            - uuid: 93311d74a2e74ca6978d35dc1f3e191c
              name: 'Camera {#CAMERA.CHANNEL} ({#CAMERA.TITLE}): Connection error'
              type: DEPENDENT
              key: 'dahua.camera.connection.error[{#CAMERA.INDEX}]'
              history: 7d
              value_type: CHAR
              description: 'Optional connection error returned by LogicDeviceManager/getCameraState.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.cameras["{#CAMERA.INDEX}"].connection_error'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: dahua.api.camera.status.get
              tags:
                - tag: camera
                  value: '{#CAMERA.TITLE}'
                - tag: component
                  value: camera
            - uuid: 4c027d8969b94da694bca382fb48a1f2
              name: 'Camera {#CAMERA.CHANNEL} ({#CAMERA.TITLE}): Connection status code'
              type: DEPENDENT
              key: 'dahua.camera.connection.state.code[{#CAMERA.INDEX}]'
              history: 7d
              trends: '0'
              description: 'Normalized camera connection state.'
              valuemap:
                name: 'Camera connection state'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.cameras["{#CAMERA.INDEX}"].connection_state_code'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: dahua.api.camera.status.get
              tags:
                - tag: camera
                  value: '{#CAMERA.TITLE}'
                - tag: component
                  value: camera
              trigger_prototypes:
                - uuid: b199fde6b1514f99aab67fd74c356dd7
                  expression: 'last(/Dahua NVR by web API and SNMP/dahua.camera.connection.state.code[{#CAMERA.INDEX}])=5 and {$DAHUA.CAMERA.CONNECTION.CHECK}=1'
                  name: 'Camera {#CAMERA.CHANNEL} ({#CAMERA.TITLE}): Camera is disabled'
                  opdata: 'Connection state: {ITEM.LASTVALUE}'
                  priority: WARNING
                  description: 'The NVR reports the remote camera state as disabled.'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: 33dff3bb901c434dbcae43f2fce7a6d7
                  expression: 'last(/Dahua NVR by web API and SNMP/dahua.camera.connection.state.code[{#CAMERA.INDEX}])=3 and {$DAHUA.CAMERA.CONNECTION.CHECK}=1'
                  name: 'Camera {#CAMERA.CHANNEL} ({#CAMERA.TITLE}): Camera is disconnected'
                  opdata: 'Connection state: {ITEM.LASTVALUE}'
                  priority: HIGH
                  description: 'The NVR reports the remote camera state as disconnected.'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: 0004ad7ec4544288b2e5c3ba5709129c
                  expression: 'last(/Dahua NVR by web API and SNMP/dahua.camera.connection.state.code[{#CAMERA.INDEX}])=6 and {$DAHUA.CAMERA.CONNECTION.CHECK}=1'
                  name: 'Camera {#CAMERA.CHANNEL} ({#CAMERA.TITLE}): Camera is not initialized'
                  opdata: 'Connection state: {ITEM.LASTVALUE}'
                  priority: WARNING
                  description: 'The NVR reports the remote camera state as not initialized.'
                  tags:
