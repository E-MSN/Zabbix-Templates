                        disk.state_code =
                            normalizedState === 'success' ||
                            normalizedState === 'running' ||
                            normalizedState === 'raidsub' ? 1 :
                            (normalizedState.indexOf('error') !== -1 ||
                             normalizedState.indexOf('fail') !== -1 ||
                             normalizedState === 'offline' ? 0 : 2);
                    }
                    var partitionStates = [];
                    var partitionProblems = 0;
                    if (Array.isArray(device.Partitions)) {
                        if (!disk.partition_count) {
