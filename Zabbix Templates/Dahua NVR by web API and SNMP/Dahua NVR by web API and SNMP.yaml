zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 07e596df2078488dbd1504265c1cc634
      template: 'Dahua NVR by web API and SNMP'
      name: 'Dahua NVR by web API and SNMP'
      description: 'Monitors Dahua NVRs through the CGI web API and SNMP.'
      vendor:
        name: E-MSN
        version: 7.4-7
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: d13a6f22293340189b9187e493b83ba8
          name: 'Dahua NVR: Web API availability'
          type: DEPENDENT
          key: dahua.api.available
          history: 7d
          description: 'Web API availability reported by the lightweight authenticated health check.'
          valuemap:
            name: 'Service state'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.api.available
          master_item:
            key: dahua.api.health.get
          tags:
            - tag: component
              value: system
        - uuid: 1c93f5aa14e8401d8e6c9bcae157d909
          name: 'Dahua NVR: Camera inventory collection errors'
          type: DEPENDENT
          key: dahua.api.camera.errors
          history: 7d
          trends: '0'
          description: 'Number of optional API endpoints that failed during the last collection for this data group.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error_count
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: dahua.api.camera.get
          tags:
            - tag: component
              value: camera
        - uuid: 7bf6bfe56eaa4326910930f359ef77e6
          name: 'Dahua NVR: Camera inventory collection error details'
          type: DEPENDENT
          key: dahua.api.camera.errors.details
          history: 2d
          value_type: TEXT
          description: 'JSON object containing optional API endpoint errors from the last collection for this data group.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var errors = JSON.parse(value).errors || {};
                  return Object.keys(errors).length ? JSON.stringify(errors) : '';
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: dahua.api.camera.get
          tags:
            - tag: component
              value: camera
        - uuid: e1af15d3b0d14ccd85a065984796322d
          name: 'Dahua NVR: Get camera inventory data'
          type: SCRIPT
          key: dahua.api.camera.get
          delay: 1h
          history: 1d
          value_type: TEXT
          params: |
            var params = JSON.parse(value);
            ['scheme', 'host', 'port', 'username', 'password'].forEach(function (field) {
                if (typeof params[field] === 'undefined' || params[field] === '') {
                    throw 'Required parameter is not set: ' + field + '.';
                }
            });
            var host = String(params.host);
            if (host.indexOf(':') !== -1 && host.charAt(0) !== '[') {
                host = '[' + host + ']';
            }
            var baseUrl = String(params.scheme) + '://' + host + ':' + String(params.port);
            var result = {
                collected_at: Math.floor(Date.now() / 1000),
                api: {available: 1},
                system: {},
                cameras: {},
                encoding: {},
                recording: {},
                errors: {}
            };
            function getBody(name, path, required) {
                var body, status;
                var request = new HttpRequest();
                request.setHttpAuth(HTTPAUTH_DIGEST, String(params.username), String(params.password));
                try {
                    body = request.get(encodeURI(baseUrl + path));
                    status = request.getStatus();
                }
                catch (error) {
                    if (required) {
                        throw name + ' request failed: ' + error;
                    }
                    result.errors[name] = 'Request failed: ' + error;
                    return '';
                }
                if (status === 401 || /RmLock/i.test(String(body))) {
                    throw name + ' authentication failed (HTTP ' + status + ').';
                }
                if (status === 403 || /Invalid Authority|Authority:check failure/i.test(String(body))) {
                    if (required) {
                        throw name + ' authorization failed (HTTP ' + status + ').';
                    }
                    result.errors[name] = 'Authorization failed (HTTP ' + status + ')';
                    return '';
                }
                if (status !== 200) {
                    if (required) {
                        throw name + ' returned HTTP ' + status + '.';
                    }
                    result.errors[name] = 'HTTP ' + status;
                    return '';
                }
                return String(body);
            }
            function postJsonBody(name, path, payload, required) {
                var body, status;
                var request = new HttpRequest();
                request.setHttpAuth(HTTPAUTH_DIGEST, String(params.username), String(params.password));
                request.addHeader('Content-Type: application/json');
                request.addHeader('Accept: application/json');
                try {
                    body = request.post(encodeURI(baseUrl + path), JSON.stringify(payload));
                    status = request.getStatus();
                }
                catch (error) {
                    if (required) {
                        throw name + ' request failed: ' + error;
                    }
                    result.errors[name] = 'Request failed: ' + error;
                    return '';
                }
                if (status === 401 || /RmLock/i.test(String(body))) {
                    throw name + ' authentication failed (HTTP ' + status + ').';
                }
                if (status === 403 || /Invalid Authority|Authority:check failure/i.test(String(body))) {
                    if (required) {
                        throw name + ' authorization failed (HTTP ' + status + ').';
                    }
                    result.errors[name] = 'Authorization failed (HTTP ' + status + ')';
                    return '';
                }
                if (status !== 200) {
                    if (required) {
                        throw name + ' returned HTTP ' + status + '.';
                    }
                    result.errors[name] = 'HTTP ' + status;
                    return '';
                }
                return String(body);
            }
            function parseKeyValue(body) {
                var output = {};
                String(body).split(/\r?\n/).forEach(function (line) {
                    var pos = line.indexOf('=');
                    if (pos > 0) {
                        output[line.substring(0, pos)] = line.substring(pos + 1);
                    }
                });
                return output;
            }
            function booleanValue(value) {
                return String(value).toLowerCase() === 'true' || String(value) === '1' ? 1 : 0;
            }
            function numberValue(value, defaultValue) {
                var number = Number(value);
                return isNaN(number) ? defaultValue : number;
            }
            function firstValue(map, key, defaultValue) {
                return typeof map[key] === 'undefined' ? defaultValue : map[key];
            }
            function parseRemoteDevices(body) {
                var cameras = {};
                String(body).split(/\r?\n/).forEach(function (line) {
                    var match = line.match(/^table\.RemoteDevice\.uuid:System_CONFIG_NETCAMERA_INFO_(\d+)\.([^=]+)=(.*)$/);
                    if (!match) {
                        return;
                    }
                    var index = match[1];
                    var field = match[2];
                    var fieldValue = match[3];
                    if (typeof cameras[index] === 'undefined') {
                        cameras[index] = {
                            index: Number(index),
                            channel: Number(index) + 1,
                            enabled: 0,
                            title: '',
                            address: '',
                            model: '',
                            mac: '',
                            serial: '',
                            firmware: '',
                            firmware_version: '',
                            firmware_build: '',
                            poe: 0,
                            poe_port: 0,
                            protocol: '',
                            vendor: '',
                            http_port: 0,
                            https_port: 0,
                            media_port: 0,
                            rtsp_port: 0,
                            connection_state: 'Unknown',
                            connection_state_code: 0,
                            connection_error: ''
                        };
                    }
                    switch (field) {
                        case 'Address':
                            cameras[index].address = fieldValue;
                            break;
                        case 'DeviceType':
                            cameras[index].model = fieldValue;
                            break;
                        case 'Enable':
                            cameras[index].enabled = booleanValue(fieldValue);
                            break;
                        case 'HttpPort':
                            cameras[index].http_port = numberValue(fieldValue, 0);
                            break;
                        case 'HttpsPort':
                            cameras[index].https_port = numberValue(fieldValue, 0);
                            break;
                        case 'Mac':
                            cameras[index].mac = fieldValue;
                            break;
                        case 'PoE':
                            cameras[index].poe = booleanValue(fieldValue);
                            break;
                        case 'PoEPort':
                            cameras[index].poe_port = numberValue(fieldValue, 0);
                            break;
                        case 'Port':
                            cameras[index].media_port = numberValue(fieldValue, 0);
                            break;
                        case 'ProtocolType':
                            cameras[index].protocol = fieldValue;
                            break;
                        case 'RtspPort':
                            cameras[index].rtsp_port = numberValue(fieldValue, 0);
                            break;
                        case 'SerialNo':
                            cameras[index].serial = fieldValue;
                            break;
                        case 'Vendor':
                            cameras[index].vendor = fieldValue;
                            break;
                        case 'Version':
                            cameras[index].firmware = fieldValue;
                            var versionParts = fieldValue.split(',');
                            cameras[index].firmware_version = versionParts[0] || '';
                            cameras[index].firmware_build = versionParts.length > 1 ? versionParts[1] : '';
                            break;
                        case 'VideoInputs[0].Name':
                            cameras[index].title = fieldValue;
                            break;
                    }
                });
                Object.keys(cameras).forEach(function (index) {
                    if (cameras[index].title === '') {
                        cameras[index].title = 'Channel ' + cameras[index].channel;
                    }
                });
                return cameras;
            }
            function parseEncoding(body) {
                var encoding = {};
                String(body).split(/\r?\n/).forEach(function (line) {
                    var match = line.match(/^table\.Encode\[(\d+)\]\.(MainFormat|ExtraFormat)\[0\]\.([^=]+)=(.*)$/);
                    if (!match) {
                        return;
                    }
                    var index = match[1];
                    var stream = match[2] === 'MainFormat' ? 'main' : 'extra';
                    var field = match[3];
                    var fieldValue = match[4];
                    if (typeof encoding[index] === 'undefined') {
                        encoding[index] = {
                            index: Number(index),
                            channel: Number(index) + 1,
                            main: {
                                audio_enabled: 0,
                                video_enabled: 0,
                                codec: '',
                                resolution: '',
                                bitrate_bps: 0,
                                bitrate_control: '',
                                fps: 0,
                                gop: 0,
                                profile: ''
                            },
                            extra: {
                                audio_enabled: 0,
                                video_enabled: 0,
                                codec: '',
                                resolution: '',
                                bitrate_bps: 0,
                                bitrate_control: '',
                                fps: 0,
                                gop: 0,
                                profile: ''
                            }
                        };
                    }
                    var target = encoding[index][stream];
                    switch (field) {
                        case 'AudioEnable':
                            target.audio_enabled = booleanValue(fieldValue);
                            break;
                        case 'VideoEnable':
                            target.video_enabled = booleanValue(fieldValue);
                            break;
                        case 'Video.Compression':
                            target.codec = fieldValue;
                            break;
                        case 'Video.resolution':
                            target.resolution = fieldValue;
                            break;
                        case 'Video.BitRate':
                            target.bitrate_bps = numberValue(fieldValue, 0) * 1000;
                            break;
                        case 'Video.BitRateControl':
                            target.bitrate_control = fieldValue;
                            break;
                        case 'Video.FPS':
                            target.fps = numberValue(fieldValue, 0);
                            break;
                        case 'Video.GOP':
                            target.gop = numberValue(fieldValue, 0);
                            break;
                        case 'Video.Profile':
                            target.profile = fieldValue;
                            break;
                    }
                });
                return encoding;
            }
            function parseRecordMode(body) {
                var recording = {};
                String(body).split(/\r?\n/).forEach(function (line) {
                    var match = line.match(/^table\.RecordMode\[(\d+)\]\.(Mode|ModeExtra1|ModeExtra2)=(\d+)$/);
                    if (!match) {
                        return;
                    }
                    var index = match[1];
                    if (typeof recording[index] === 'undefined') {
                        recording[index] = {
                            index: Number(index),
                            channel: Number(index) + 1,
                            main: 3,
                            extra: 3,
                            extra2: 3,
                            main_state: 2,
                            main_flags: '',
                            extra_state: 2,
                            extra_flags: ''
                        };
                    }
                    if (match[2] === 'Mode') {
                        recording[index].main = Number(match[3]);
                    }
                    else if (match[2] === 'ModeExtra1') {
                        recording[index].extra = Number(match[3]);
                    }
                    else {
                        recording[index].extra2 = Number(match[3]);
                    }
                });
                return recording;
            }
            function cameraStateCode(state) {
                var normalized = String(state || '').toLowerCase();
                if (normalized === 'connecting') {
                    return 1;
                }
                if (normalized === 'connected') {
                    return 2;
                }
                if (normalized === 'unconnect' ||
                    normalized === 'unconnected' ||
                    normalized === 'disconnected') {
                    return 3;
                }
                if (normalized === 'empty') {
                    return 4;
                }
                if (normalized === 'disable' || normalized === 'disabled') {
                    return 5;
                }
                if (normalized === 'uninited' ||
                    normalized === 'uninitialized' ||
                    normalized === 'not initialized') {
                    return 6;
                }
                if (normalized === 'hibernation') {
                    return 7;
                }
                return 0;
            }
            function mergeCameraStates(body, cameras) {
                var response;
                if (String(body).trim() === '') {
                    return cameras;
                }
                try {
                    response = JSON.parse(String(body));
                }
                catch (error) {
                    result.errors.camera_state = 'Invalid JSON response: ' + error;
                    return cameras;
                }
                if (!response || !Array.isArray(response.states)) {
                    result.errors.camera_state = 'The response does not contain a states array.';
                    return cameras;
                }
                response.states.forEach(function (entry) {
                    if (!entry || typeof entry.channel === 'undefined') {
                        return;
                    }
                    var index = String(entry.channel);
                    if (typeof cameras[index] === 'undefined') {
                        cameras[index] = {
                            index: Number(index),
                            channel: Number(index) + 1,
                            enabled: 0,
                            title: 'Channel ' + (Number(index) + 1),
                            address: '',
                            model: '',
                            mac: '',
                            serial: '',
                            firmware: '',
                            firmware_version: '',
                            firmware_build: '',
                            poe: 0,
                            poe_port: 0,
                            protocol: '',
                            vendor: '',
                            http_port: 0,
                            https_port: 0,
                            media_port: 0,
                            rtsp_port: 0,
                            connection_state: 'Unknown',
                            connection_state_code: 0,
                            connection_error: ''
                        };
                    }
                    cameras[index].connection_state = String(entry.connectionState || 'Unknown');
                    cameras[index].connection_state_code = cameraStateCode(entry.connectionState);
                    cameras[index].connection_error = String(entry.errorMessage || '');
                });
                return cameras;
            }
            function mergeRecordingStates(body, recording) {
                var response;
                if (String(body).trim() === '') {
                    return recording;
                }
                try {
                    response = JSON.parse(String(body));
                }
                catch (error) {
                    result.errors.recording_state = 'Invalid JSON response: ' + error;
                    return recording;
                }
                if (!response || !Array.isArray(response.state)) {
                    result.errors.recording_state = 'The response does not contain a state array.';
                    return recording;
                }
                response.state.forEach(function (entry, numericIndex) {
                    var index = String(numericIndex);
                    if (typeof recording[index] === 'undefined') {
                        recording[index] = {
                            index: numericIndex,
                            channel: numericIndex + 1,
                            main: 3,
                            extra: 3,
                            extra2: 3,
                            main_state: 2,
                            main_flags: '',
                            extra_state: 2,
                            extra_flags: ''
                        };
                    }
                    if (!entry) {
                        recording[index].main_state = 2;
                        recording[index].main_flags = '';
                        recording[index].extra_state = 2;
                        recording[index].extra_flags = '';
                        return;
                    }
                    if (entry.Main && typeof entry.Main.State !== 'undefined') {
                        recording[index].main_state = entry.Main.State ? 1 : 0;
                        recording[index].main_flags = Array.isArray(entry.Main.Flags) ?
                            entry.Main.Flags.join(', ') : '';
                    }
                    else {
                        recording[index].main_state = 2;
                        recording[index].main_flags = '';
                    }
                    if (entry.Extra1 && typeof entry.Extra1.State !== 'undefined') {
                        recording[index].extra_state = entry.Extra1.State ? 1 : 0;
                        recording[index].extra_flags = Array.isArray(entry.Extra1.Flags) ?
                            entry.Extra1.Flags.join(', ') : '';
                    }
                    else {
                        recording[index].extra_state = 2;
                        recording[index].extra_flags = '';
                    }
                });
                return recording;
            }
            var remoteBody = getBody(
                'remote_devices',
                '/cgi-bin/configManager.cgi?action=getConfig&name=RemoteDevice',
                true
            );
            result.cameras = parseRemoteDevices(remoteBody);
            result.system.configured_cameras = 0;
            Object.keys(result.cameras).forEach(function (index) {
                result.system.configured_cameras += result.cameras[index].enabled;
            });
            result.encoding = parseEncoding(getBody(
                'encoding',
                '/cgi-bin/configManager.cgi?action=getConfig&name=Encode',
                false
            ));
            result.recording = parseRecordMode(getBody(
                'recording_mode',
                '/cgi-bin/configManager.cgi?action=getConfig&name=RecordMode',
                false
            ));
            var maxChannelsMap = parseKeyValue(getBody(
                'max_remote_channels',
                '/cgi-bin/magicBox.cgi?action=getProductDefinition&name=MaxRemoteInputChannels',
                false
            ));
            result.system.max_remote_channels = numberValue(
                firstValue(maxChannelsMap, 'table.MaxRemoteInputChannels', 0),
                0
            );
            var maxStreamsMap = parseKeyValue(getBody(
                'max_extra_streams',
                '/cgi-bin/magicBox.cgi?action=getProductDefinition&name=MaxExtraStream',
                false
            ));
            result.system.max_extra_streams = numberValue(
                firstValue(maxStreamsMap, 'table.MaxExtraStream', 0),
                0
            );
            Object.keys(result.cameras).forEach(function (index) {
                if (typeof result.encoding[index] === 'undefined') {
                    result.encoding[index] = {
                        index: Number(index),
                        channel: Number(index) + 1,
                        main: {
                            audio_enabled: 0,
                            video_enabled: 0,
                            codec: '',
                            resolution: '',
                            bitrate_bps: 0,
                            bitrate_control: '',
                            fps: 0,
                            gop: 0,
                            profile: ''
                        },
                        extra: {
                            audio_enabled: 0,
                            video_enabled: 0,
                            codec: '',
                            resolution: '',
                            bitrate_bps: 0,
                            bitrate_control: '',
                            fps: 0,
                            gop: 0,
                            profile: ''
                        }
                    };
                }
                if (typeof result.recording[index] === 'undefined') {
                    result.recording[index] = {
                        index: Number(index),
                        channel: Number(index) + 1,
                        main: 3,
                        extra: 3,
                        extra2: 3,
                        main_state: 2,
                        main_flags: '',
                        extra_state: 2,
                        extra_flags: ''
                    };
                }
            });
            result.error_count = Object.keys(result.errors).length;
            return JSON.stringify(result);
          description: 'Collects camera inventory, configured recording modes, stream configuration and camera capacity data from the Dahua CGI API.'
          timeout: 30s
          parameters:
            - name: host
              value: '{HOST.CONN}'
            - name: password
              value: '{$DAHUA.API.PASSWORD}'
            - name: port
              value: '{$DAHUA.API.PORT}'
            - name: scheme
              value: '{$DAHUA.API.SCHEME}'
            - name: username
              value: '{$DAHUA.API.USER}'
          tags:
            - tag: component
              value: raw
          triggers:
            - uuid: da23cb1ee7174996b547b08d151fbe0e
              expression: 'nodata(/Dahua NVR by web API and SNMP/dahua.api.camera.get,2h)=1'
              name: 'Dahua NVR: Camera inventory API data collection is unavailable'
              opdata: 'No data received for 2h'
              priority: HIGH
              description: 'No successful camera inventory collection has been received for two hours.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Dahua NVR by web API and SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: 6012de62c42a4bbeb268ea5705a3e516
          name: 'Dahua NVR: Camera status collection errors'
