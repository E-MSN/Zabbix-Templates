# GB10 Configuration
UserParameter=gb10.metrics,nvidia-smi -i 0 --query-gpu=name,driver_version,temperature.gpu,power.draw,utilization.gpu,pstate --format=csv,noheader,nounits
UserParameter=gb10.processes,nvidia-smi -i 0 --query-compute-apps=pid,process_name,used_gpu_memory --format=csv,noheader,nounits
UserParameter=gb10.details,LC_ALL=C nvidia-smi -q -i 0
