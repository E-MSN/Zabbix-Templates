    - uuid: b07977e2cdd84840998fa341cf33dfa4
      template: 'vLLM by Zabbix agent 2 active'
      name: 'vLLM by Zabbix agent 2 active'
      description: 'Monitors vLLM inference engines through Zabbix agent 2 active checks and Prometheus metrics.'
      vendor:
        name: E-MSN
        version: 7.4-1
      groups:
        - name: Templates/Applications
      discovery_rules:
        - uuid: 4bb59b397fa7474f87799e6ef30ca8c6
          name: 'vLLM: Declared instances'
          type: ZABBIX_ACTIVE
          key: vllm.simple.discovery
          item_prototypes:
            - uuid: 102d9881684849d48209aced0cca8716
              name: 'vLLM [{#INSTANCE}]: KV cache utilization'
              type: DEPENDENT
              key: 'vllm.simple.kv.cache.usage[{#INSTANCE}]'
              value_type: FLOAT
              units: '%'
              description: 'Percentage of the available KV cache capacity currently occupied. Optional metric; missing values are discarded.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'vllm:kv_cache_usage_perc'
                    - function
                    - max
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '100'
              master_item:
                key: 'vllm.simple.metrics[{#INSTANCE}]'
              tags:
                - tag: component
                  value: cache
              trigger_prototypes:
                - uuid: 39cc34e1aff144af91b8835f13bea86c
                  expression: 'min(/vLLM by Zabbix agent 2 active/vllm.simple.kv.cache.usage[{#INSTANCE}],5m)>{$VLLM.KV.CACHE.CRIT}'
                  name: 'vLLM [{#INSTANCE}]: KV cache utilization is critical'
                  priority: HIGH
                - uuid: 4f41eee781ab408aad78c7d128a01bda
                  expression: 'min(/vLLM by Zabbix agent 2 active/vllm.simple.kv.cache.usage[{#INSTANCE}],5m)>{$VLLM.KV.CACHE.WARN}'
                  name: 'vLLM [{#INSTANCE}]: KV cache utilization is high'
                  priority: WARNING
                  dependencies:
                    - name: 'vLLM [{#INSTANCE}]: KV cache utilization is critical'
                      expression: 'min(/vLLM by Zabbix agent 2 active/vllm.simple.kv.cache.usage[{#INSTANCE}],5m)>{$VLLM.KV.CACHE.CRIT}'
            - uuid: aa1408e4444b4dbdb7015bdc0558a1ba
              name: 'vLLM [{#INSTANCE}]: Prometheus metrics'
              type: ZABBIX_ACTIVE
              key: 'vllm.simple.metrics[{#INSTANCE}]'
              history: '0'
              value_type: TEXT
              description: 'Raw Prometheus metrics collected from the discovered vLLM instance. Source for dependent metrics.'
              preprocessing:
                - type: MATCHES_REGEX
                  parameters:
                    - '(?m)^vllm:'
              timeout: 10s
              tags:
                - tag: component
                  value: raw
              trigger_prototypes:
                - uuid: de104f07e1914f4898970b6d44b54791
                  expression: 'nodata(/vLLM by Zabbix agent 2 active/vllm.simple.metrics[{#INSTANCE}],5m)=1'
                  name: 'vLLM [{#INSTANCE}]: Metrics collection unavailable'
                  priority: HIGH
                  description: 'No Prometheus metrics received for 5 minutes.'
            - uuid: b6484e546d404ef798e04697064dd0e9
              name: 'vLLM [{#INSTANCE}]: Preemptions per second'
              type: DEPENDENT
              key: 'vllm.simple.preemptions.rate[{#INSTANCE}]'
              value_type: FLOAT
              units: preemptions/s
              description: 'Rate of inference scheduler preemptions per second. Sustained preemptions may indicate resource contention. Optional metric; missing values are discarded.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'vllm:num_preemptions_total'
                    - function
                    - sum
                  error_handler: DISCARD_VALUE
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'vllm.simple.metrics[{#INSTANCE}]'
              tags:
                - tag: component
                  value: performance
            - uuid: bd6f0f6084af402cae6c554a5ac23e77
              name: 'vLLM [{#INSTANCE}]: Completed requests per second'
              type: DEPENDENT
              key: 'vllm.simple.requests.completed.rate[{#INSTANCE}]'
              value_type: FLOAT
              units: req/s
              description: 'Rate of requests completed with finished_reason=stop. Optional metric; missing values are discarded.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'vllm:request_success_total{finished_reason="stop"}'
                    - function
                    - sum
                  error_handler: DISCARD_VALUE
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'vllm.simple.metrics[{#INSTANCE}]'
              tags:
                - tag: component
                  value: requests
            - uuid: 7183ba5fd2274bd387f0fd0507463ff2
              name: 'vLLM [{#INSTANCE}]: Failed requests per second'
              type: DEPENDENT
              key: 'vllm.simple.requests.failed.rate[{#INSTANCE}]'
              value_type: FLOAT
              units: req/s
              description: 'Rate of requests with finished_reason=error. Aborted or length-limited requests are not counted. Optional metric; missing values are discarded.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'vllm:request_success_total{finished_reason="error"}'
                    - function
                    - sum
                  error_handler: DISCARD_VALUE
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'vllm.simple.metrics[{#INSTANCE}]'
              tags:
                - tag: component
                  value: requests
            - uuid: 3279be2aad1e4b7fb5af740debf1939f
              name: 'vLLM [{#INSTANCE}]: Running requests'
              type: DEPENDENT
              key: 'vllm.simple.requests.running[{#INSTANCE}]'
              description: 'Current number of requests being processed by the inference engine. Optional metric; missing values are discarded.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'vllm:num_requests_running'
                    - function
                    - sum
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'vllm.simple.metrics[{#INSTANCE}]'
              tags:
                - tag: component
                  value: requests
            - uuid: b185918392714645b7db2d657135f9e5
              name: 'vLLM [{#INSTANCE}]: Waiting requests'
              type: DEPENDENT
              key: 'vllm.simple.requests.waiting[{#INSTANCE}]'
              description: 'Current number of requests queued for execution by the inference scheduler. Optional metric; missing values are discarded.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'vllm:num_requests_waiting'
                    - function
                    - sum
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'vllm.simple.metrics[{#INSTANCE}]'
              tags:
                - tag: component
                  value: requests
              trigger_prototypes:
                - uuid: e9dbbde227aa410289c431410c4f14c6
                  expression: 'min(/vLLM by Zabbix agent 2 active/vllm.simple.requests.waiting[{#INSTANCE}],5m)>{$VLLM.QUEUE.CRIT}'
                  name: 'vLLM [{#INSTANCE}]: Request queue is critical'
                  priority: HIGH
                - uuid: 165d96f03c394dada1b4dc9658d6755b
                  expression: 'min(/vLLM by Zabbix agent 2 active/vllm.simple.requests.waiting[{#INSTANCE}],5m)>{$VLLM.QUEUE.WARN}'
                  name: 'vLLM [{#INSTANCE}]: Request queue is high'
                  priority: WARNING
                  dependencies:
                    - name: 'vLLM [{#INSTANCE}]: Request queue is critical'
                      expression: 'min(/vLLM by Zabbix agent 2 active/vllm.simple.requests.waiting[{#INSTANCE}],5m)>{$VLLM.QUEUE.CRIT}'
            - uuid: c8784378580e4b70a1555e027bae944c
              name: 'vLLM [{#INSTANCE}]: Speculative accepted tokens per second'
              type: DEPENDENT
              key: 'vllm.simple.speculative.accepted.rate[{#INSTANCE}]'
              value_type: FLOAT
              units: tokens/s
              description: 'Rate of speculative decoding tokens accepted per second. Optional metric; missing values are discarded.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'vllm:spec_decode_num_accepted_tokens_total'
                    - function
                    - sum
                  error_handler: DISCARD_VALUE
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'vllm.simple.metrics[{#INSTANCE}]'
              tags:
                - tag: component
                  value: speculative
            - uuid: f6b4d0c13c044031bb3d075288b2edb5
              name: 'vLLM [{#INSTANCE}]: Generation tokens per second'
              type: DEPENDENT
              key: 'vllm.simple.tokens.generation.rate[{#INSTANCE}]'
              value_type: FLOAT
              units: tokens/s
              description: 'Rate of output tokens generated per second. Optional metric; missing values are discarded.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'vllm:generation_tokens_total'
                    - function
                    - sum
                  error_handler: DISCARD_VALUE
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'vllm.simple.metrics[{#INSTANCE}]'
              tags:
                - tag: component
                  value: tokens
            - uuid: 5f957a1adc47495faa12f4766527291d
              name: 'vLLM [{#INSTANCE}]: Prompt tokens per second'
              type: DEPENDENT
              key: 'vllm.simple.tokens.prompt.rate[{#INSTANCE}]'
              value_type: FLOAT
              units: tokens/s
              description: 'Rate of input prompt tokens processed per second. Optional metric; missing values are discarded.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'vllm:prompt_tokens_total'
                    - function
                    - sum
                  error_handler: DISCARD_VALUE
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'vllm.simple.metrics[{#INSTANCE}]'
              tags:
                - tag: component
                  value: tokens
            - uuid: 0cb6e9cd6ee44f49892b56cc16654264
              name: 'vLLM [{#INSTANCE}]: TTFT cumulative count'
              type: DEPENDENT
              key: 'vllm.simple.ttft.count[{#INSTANCE}]'
              description: 'Cumulative number of time-to-first-token observations. Used to calculate the average TTFT. Optional metric; missing values are discarded.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'vllm:time_to_first_token_seconds_count'
                    - function
                    - sum
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'vllm.simple.metrics[{#INSTANCE}]'
              tags:
                - tag: component
                  value: latency
            - uuid: 7ca5d43b036340a5bfab3893577afd32
              name: 'vLLM [{#INSTANCE}]: TTFT cumulative sum'
              type: DEPENDENT
              key: 'vllm.simple.ttft.sum[{#INSTANCE}]'
              value_type: FLOAT
              units: s
              description: 'Cumulative time to first token across observations, in seconds. Used to calculate the average TTFT. Optional metric; missing values are discarded.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'vllm:time_to_first_token_seconds_sum'
                    - function
                    - sum
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'vllm.simple.metrics[{#INSTANCE}]'
              tags:
                - tag: component
                  value: latency
            - uuid: c2d323af7bfb4e75ba7ffa8b13a839d3
              name: 'vLLM [{#INSTANCE}]: TTFT average'
              type: CALCULATED
              key: 'vllm.ttft.average[{#INSTANCE}]'
              value_type: FLOAT
              units: ms
              params: '1000 * rate(//vllm.simple.ttft.sum[{#INSTANCE}],5m) / max(rate(//vllm.simple.ttft.count[{#INSTANCE}],5m),0.000000001)'
              description: 'Average time to first token over a 5-minute window, in milliseconds. Returns zero if no observations are recorded during the window; requires valid source history.'
              tags:
                - tag: component
                  value: latency
          graph_prototypes:
            - uuid: c8f5b419b13f40b48d1bd87f50efeff9
