zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 9e3e55f0f47c41e3a8b0e0e0b1d1c001
      name: Templates/Applications
  templates:
    - uuid: fd770d65c1094540b99a5b8d2c42b21e
      template: 'Nvidia GB10 by Zabbix agent 2 active'
      name: 'Nvidia GB10 by Zabbix agent 2 active'
      description: |
        Monitors the NVIDIA GB10 Grace Blackwell Superchip using Zabbix agent 2 in active mode.
        
        Uses NVIDIA-SMI master items and dependent items to reduce collection overhead. Includes basic visibility into vLLM engine processes; detailed inference metrics require separate vLLM monitoring.
        
        Tested on NVIDIA DGX Spark.
      vendor:
        name: E-MSN
        version: 7.4-1
      groups:
        - name: Templates/Applications
      items:
        - uuid: 35d664800a1545e6a449d69984350e96
          name: 'GB10: Decoder activity'
          type: DEPENDENT
          key: gb10.busy.decoder
          value_type: FLOAT
          units: '%'
          description: 'Percentage of the sampling period during which the NVIDIA hardware video decoder (NVDEC) was active.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var section="Utilization", field="Decoder";
                  var lines=value.replace(/\r\n?/g,'\n').split('\n');
                  var sections=['PCI','Clocks Event Reasons','Clocks Event Reasons Counters','Clocks Throttle Reasons','Clocks Throttle Reasons Counters','Utilization','Temperature','GPU Power Readings','GPU Memory Power Readings','Module Power Readings','Clocks','Applications Clocks','Default Applications Clocks','Deferred Clocks','Max Clocks','Max Customer Boost Clocks','Clock Policy','Processes','Encoder Stats','FBC Stats','Fabric'];
                  function clean(s){return s.replace(/^\s+|\s+$/g,'').replace(/\s+/g,' ');}
                  function canon(s){return clean(s).replace(/\s*:\s*$/,'').replace('Clocks Throttle Reasons','Clocks Event Reasons');}
                  var active=false, result=null;
                  for(var i=0;i<lines.length;i++) {
                   var line=clean(lines[i]), header=canon(line);
                   if(!active){if(header===section) active=true;continue;}
                   if(sections.indexOf(header)!==-1) break;
                   var pos=line.indexOf(':');
                   if(pos<0)continue;
                   var label=clean(line.substring(0,pos));
                   if(label===field || (field==='GPU T.Limit Temp' && label==='GPU Current T.Limit Temp')) {
                    result=clean(line.substring(pos+1));break;
                   }
                  }
                  if(result===null || result==='N/A') throw 'Metric unavailable: '+section+'/'+field;
                  var m=result.match(/^(-?[0-9]+(?:\.[0-9]+)?)(?:\s|$)/); if(!m) throw 'Invalid number: '+result; return Number(m[1]);
          master_item:
            key: gb10.details
          tags:
            - tag: component
              value: utilization
        - uuid: 432415309ef64a8c9402bd50e0cda003
