          name: 'GB10: Detailed GPU report'
          type: ZABBIX_ACTIVE
          key: gb10.details
          history: '0'
          value_type: TEXT
          description: 'Raw detailed NVIDIA-SMI GPU report used as the source for dependent hardware metrics. Collection requires the gb10.details agent key.'
          timeout: 10s
          tags:
            - tag: component
              value: raw
          triggers:
            - uuid: 6d1d4fe950b34e25ad79912f454d541b
              expression: 'nodata(/Nvidia GB10 by Zabbix agent 2 active/gb10.details,5m)=1'
              name: 'GB10: No detailed GPU report for 5 minutes'
              priority: WARNING
        - uuid: df1db94bb8e248aa95c71be1d23eb8e2
          name: 'GB10: Driver version'
          type: DEPENDENT
          key: gb10.driver
          value_type: CHAR
          description: 'NVIDIA GPU driver version reported by NVIDIA-SMI.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var fields = value.trim().split('',''); if (fields.length !== 6) { throw ''Unexpected nvidia-smi output: '' + value; } var result = fields[1].trim(); return result;'
          master_item:
            key: gb10.metrics
          tags:
            - tag: component
              value: gpu
