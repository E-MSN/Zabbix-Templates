      template: 'XCP-ng VM via Xen Orchestra'
      name: 'XCP-ng VM via Xen Orchestra'
      description: 'This template is designed for monitoring XCP-ng virtual machines through the Xen Orchestra REST API.'
      vendor:
        name: E-MSN
        version: 7.4-2
      groups:
        - name: Templates/Applications
      items:
        - uuid: ab3fceb963ba4954891e0422143aca23
          name: 'XO API: Collection error'
          type: DEPENDENT
          key: xoa.api.error
          history: 30d
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return JSON.parse(value).error;'
          master_item:
            key: xoa.api.health.raw
          tags:
            - tag: component
              value: health
        - uuid: 2859d9f20bdb4f57b04f04c94815fb56
          name: 'XO API: Authentication and connectivity'
          type: SCRIPT
          key: xoa.api.health.raw
          history: '0'
          value_type: TEXT
          params: |
            var p = JSON.parse(value);
            var req = new HttpRequest();
            if (p.proxy && p.proxy !== 'CHANGE_IF_NEEDED') {
                req.setProxy(p.proxy);
            }
            req.addHeader('Cookie: authenticationToken=' + p.token);
            req.addHeader('Accept: application/json');
            var url = String(p.url).replace(/\/+$/, '');
            try {
                var body = req.get(url + '/rest/v0/pools?limit=1');
                var status = req.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'XO HTTP ' + status;
                }
                JSON.parse(body);
                return JSON.stringify({ok: 1, status: status, error: ''});
            } catch (e) {
                return JSON.stringify({ok: 0, status: req.getStatus() || 0, error: String(e)});
            }
          description: 'Checks Xen Orchestra REST API authentication and basic connectivity.'
          timeout: 60s
          parameters:
            - name: proxy
              value: '{$XOA.PROXY.URL}'
            - name: token
              value: '{$XOA.AUTH.TOKEN}'
            - name: url
              value: '{$XOA.URL}'
          tags:
            - tag: component
              value: health
        - uuid: 67040c42209b45998b1211b61a2b5e8e
          name: 'XO API: Collection available'
          type: DEPENDENT
          key: xoa.api.ok
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return JSON.parse(value).ok;'
          master_item:
            key: xoa.api.health.raw
          tags:
            - tag: component
              value: health
