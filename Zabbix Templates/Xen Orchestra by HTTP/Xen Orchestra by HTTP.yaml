                      if (!d.start || !d.end) {
                          return 0;
                      }
                      if (d.end < d.start) {
                          throw 'Invalid backup timestamps';
                      }
                      return Math.floor((d.end - d.start) / 1000);
              master_item:
                key: 'xoa.backup.vm.raw[{#BACKUP.UUID}]'
              tags:
