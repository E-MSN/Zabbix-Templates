                  value: hardware
          graph_prototypes:
            - uuid: eec33893b3844506acdda1c02487861a
              name: 'IPMI {#IPMI.NAME} [#{#IPMI.INDEX}]'
              yaxismax: '0'
              show_work_period: 'NO'
              graph_items:
                - color: 199C0D
                  calc_fnc: ALL
                  item:
                    host: 'XCP-ng Host via Xen Orchestra'
                    key: 'xoa.host.ipmi.value[{#IPMI.INDEX}]'
          master_item:
            key: xoa.host.ipmi.raw
          lld_macro_paths:
            - lld_macro: '{#IPMI.INDEX}'
              path: $.index
            - lld_macro: '{#IPMI.NAME}'
              path: $.name
            - lld_macro: '{#IPMI.TYPE}'
              path: $.dataType
            - lld_macro: '{#IPMI.UNIT}'
              path: $.unit
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  if (!d.available || !Array.isArray(d.sensors)) {
                      throw 'IPMI unavailable';
                  }
                  var a = d.sensors;
                  var out = [];
                  var known = {totalPower: 1, outletTemp: 1, inletTemp: 1, cpuTemp: 1, fanSpeed: 1, psuPower: 1};
                  function measure(s) {
                      if (s.value === null || s.value === undefined || typeof s.value === 'boolean') {
                          return null;
                      }
                      var v = String(s.value).trim();
                      var m = /^([+-]?(?:\d+(?:\.\d*)?|\.\d+))(?:\s*(degrees?\s*C|°C|RPM|Watts?|Volts?|Amps?|percent|%))?$/i.exec(v);
                      if (!m) {
                          return null;
                      }
                      var numeric = Number(m[1]);
                      if (!isFinite(numeric)) {
                          return null;
                      }
                      var suffix = (m[2] || '').toLowerCase().replace(/\s+/g, '');
                      var units = {'degreesc': '°C', '°c': '°C', 'rpm': 'rpm', 'watt': 'W', 'watts': 'W', 'volt': 'V', 'volts': 'V', 'amp': 'A', 'amps': 'A', 'percent': '%', '%': '%'};
                      var unit = units[suffix] || '';
                      if (!unit && !suffix) {
                          if (s.dataType === 'fanSpeed') {
                              unit = 'rpm';
                          } else if (s.dataType === 'cpuTemp' || s.dataType === 'inletTemp' || s.dataType === 'outletTemp') {
                              unit = '°C';
                          } else if (s.dataType === 'totalPower') {
                              unit = 'W';
                          }
                      }
                      return {number: numeric, unit: unit};
                  }
                  function displayName(s) {
                      var name = String(s.name || '').trim();
                      var type = String(s.dataType || '').trim();
                      if (/^(temp|temperature)$/i.test(name)) {
                          if (type === 'cpuTemp') {
                              return 'CPU Temp';
                          }
                          if (type === 'inletTemp') {
                              return 'Inlet Temp';
                          }
                          if (type === 'outletTemp') {
                              return 'Exhaust Temp';
                          }
                      }
                      if (name !== '') {
                          return name;
                      }
                      if (type !== '') {
                          return type;
                      }
                      return 'Sensor';
                  }
                  for (var i = 0; i < a.length; i++) {
                      var s = a[i];
                      var m = measure(s);
                      var numeric = m !== null && (known[s.dataType] || s.dataType === 'unknown' && m.unit !== '');
                      if (numeric) {
                          out.push({index: String(i), name: displayName(s), dataType: String(s.dataType || 'unknown'), unit: m.unit});
                      }
                  }
                  return JSON.stringify(out);
