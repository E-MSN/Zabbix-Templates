          trigger_prototypes:
            - uuid: c20d49bca1984c059a2fa9604df286c0
              expression: |
                count(/XCP-ng Host via Xen Orchestra/xoa.host.ipmi.event[{#IPMI.INDEX}],#1)>0
                and find(/XCP-ng Host via Xen Orchestra/xoa.host.ipmi.event[{#IPMI.INDEX}],,"iregexp","^(ok|normal|nominal|none|n/a|ns)$")=0
                and {$XOA.MAINTENANCE}=0
                and ({$XOA.DISABLED.IS.MAINTENANCE}=0 or last(/XCP-ng Host via Xen Orchestra/xoa.host.maintenance)=0)
                and last(/XCP-ng Host via Xen Orchestra/xoa.host.ipmi.available)=1
              name: 'IPMI sensor {#IPMI.NAME} [#{#IPMI.INDEX}] reports an abnormal state'
              opdata: 'Current event: {ITEM.LASTVALUE}'
              priority: AVERAGE
              description: 'The IPMI sensor reports an abnormal event or state. Review the hardware sensor in Xen Orchestra or on the server management controller.'
              dependencies:
