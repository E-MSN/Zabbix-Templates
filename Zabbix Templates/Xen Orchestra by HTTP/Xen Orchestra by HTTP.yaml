          item_prototypes:
            - uuid: c925448efcd64a8d90291f45f06217ec
              name: 'IPMI {#IPMI.NAME} [#{#IPMI.INDEX}]: Event'
              type: DEPENDENT
              key: 'xoa.host.ipmi.event[{#IPMI.INDEX}]'
              history: 90d
              value_type: CHAR
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.sensors[{#IPMI.INDEX}]'
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var s = JSON.parse(value);
                      if (!s) {
                          throw 'Sensor unavailable';
                      }
                      if (s.event === undefined || s.event === null || String(s.event).trim() === '') {
                          return 'N/A';
                      }
                      return String(s.event);
              master_item:
                key: xoa.host.ipmi.raw
              tags:
                - tag: component
                  value: hardware
                - tag: sensor
                  value: '{#IPMI.TYPE}'
            - uuid: a4c2488b5a1e47df9a9e001ee47f8932
              name: 'IPMI {#IPMI.NAME} [#{#IPMI.INDEX}]: Value'
              type: DEPENDENT
              key: 'xoa.host.ipmi.value[{#IPMI.INDEX}]'
              history: 90d
              value_type: FLOAT
              units: '{#IPMI.UNIT}'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.sensors[{#IPMI.INDEX}]'
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var s = JSON.parse(value);
                      if (!s || s.value === null || s.value === undefined) {
                          throw 'Sensor unavailable';
                      }
                      var m = /^\s*([+-]?(?:\d+(?:\.\d*)?|\.\d+))(?:\s*(?:degrees?\s*C|°C|RPM|Watts?|Volts?|Amps?|percent|%))?\s*$/i.exec(String(s.value));
                      if (!m || !isFinite(Number(m[1]))) {
                          throw 'Invalid numeric IPMI reading';
                      }
                      return Number(m[1]);
              master_item:
                key: xoa.host.ipmi.raw
              tags:
                - tag: component
                  value: hardware
                - tag: sensor
                  value: '{#IPMI.TYPE}'
                - tag: unit
