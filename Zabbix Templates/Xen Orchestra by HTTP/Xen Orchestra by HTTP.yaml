    - uuid: 137f19e6e2dc4219b33553b812627bc2
      name: 'Type - Machines virtuelles'
  templates:
    - uuid: 8d4ad92902e6440ca14dfa5256d8bf82
      template: 'XCP-ng Host via Xen Orchestra'
      name: 'XCP-ng Host via Xen Orchestra'
      description: 'This template is designed for monitoring XCP-ng hosts through the Xen Orchestra REST API.'
      vendor:
        name: E-MSN
        version: 7.4-2
      groups:
        - name: Templates/Applications
      items:
        - uuid: 536eda7cc745441ca2c5f8d03d62f4f3
          name: 'Host management ICMP reachability'
          type: SIMPLE
          key: 'icmpping[{$XOA.HOST.ADDRESS}]'
          history: 30d
          description: 'ICMP reachability of the XCP-ng host management address.'
          tags:
            - tag: component
              value: health
        - uuid: 71857204253b4c8ab1c97a9625d3ae73
          name: 'XO API: Collection error'
          type: DEPENDENT
          key: xoa.api.error
          history: 30d
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return JSON.parse(value).error;'
          master_item:
            key: xoa.api.health.raw
          tags:
            - tag: component
              value: health
        - uuid: efa148f75ec443748d81732e8b1f52c0
          name: 'XO API: Authentication and connectivity'
          type: SCRIPT
          key: xoa.api.health.raw
          history: '0'
          value_type: TEXT
          params: |
            var p = JSON.parse(value);
            var req = new HttpRequest();
            if (p.proxy && p.proxy !== 'CHANGE_IF_NEEDED') {
                req.setProxy(p.proxy);
            }
            req.addHeader('Cookie: authenticationToken=' + p.token);
            req.addHeader('Accept: application/json');
            var url = String(p.url).replace(/\/+$/, '');
            try {
                var body = req.get(url + '/rest/v0/pools?limit=1');
                var status = req.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'XO HTTP ' + status;
                }
                JSON.parse(body);
                return JSON.stringify({ok: 1, status: status, error: ''});
            } catch (e) {
                return JSON.stringify({ok: 0, status: req.getStatus() || 0, error: String(e)});
            }
          description: 'Checks Xen Orchestra REST API authentication and basic connectivity.'
          timeout: 60s
          parameters:
            - name: proxy
              value: '{$XOA.PROXY.URL}'
            - name: token
              value: '{$XOA.AUTH.TOKEN}'
            - name: url
              value: '{$XOA.URL}'
          tags:
            - tag: component
              value: health
        - uuid: 7317481cf8014f8db412e9c832f2136c
          name: 'XO API: Collection available'
          type: DEPENDENT
          key: xoa.api.ok
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return JSON.parse(value).ok;'
          master_item:
            key: xoa.api.health.raw
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: ef71825066a54bfe923228a700f93e54
              expression: 'max(/XCP-ng Host via Xen Orchestra/xoa.api.ok,3m)=0 and count(/XCP-ng Host via Xen Orchestra/xoa.api.ok,3m)>=3'
              name: 'XO API collection is unavailable'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
