        - uuid: 12203df3d1e546d598e43dd305081ea6
          name: 'Storage physical allocation'
          type: DEPENDENT
          key: xoa.vm.storage.physical.usage
          history: 90d
          units: B
          description: 'Physical allocation of the VM VDIs. Uses chainPhysicalUsage when exposed by Xen Orchestra, otherwise usage. This is not guest filesystem utilization.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var a = JSON.parse(value), total = 0;
                  for (var i = 0; i < a.length; i++) {
                      var v = Number(a[i].usage || 0);
                      if (isFinite(v)) {
                          total += v;
                      }
                  }
                  return total;
          master_item:
            key: xoa.vm.storage.raw
          tags:
            - tag: component
              value: storage
            - tag: target
              value: capacity
        - uuid: a20501cb54dc4f11b061c1091a507669
          name: 'Storage physical allocation percentage'
          type: DEPENDENT
          key: xoa.vm.storage.physical.usage.percent
          history: 90d
          value_type: FLOAT
          units: '%'
          description: 'Physical allocation of the VM VDIs. Uses chainPhysicalUsage when exposed by Xen Orchestra, otherwise usage. This is not guest filesystem utilization.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var a = JSON.parse(value), size = 0, used = 0;
                  for (var i = 0; i < a.length; i++) {
                      var s = Number(a[i].size || 0);
                      var u = Number(a[i].usage || 0);
                      if (isFinite(s)) {
                          size += s;
                      }
                      if (isFinite(u)) {
                          used += u;
                      }
                  }
                  return size > 0 ? Math.max(Math.min(used / size * 100, 100), 0) : 0;
          master_item:
            key: xoa.vm.storage.raw
          tags:
