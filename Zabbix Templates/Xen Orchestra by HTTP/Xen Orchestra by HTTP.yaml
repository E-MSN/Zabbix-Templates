        - uuid: 5a3c4982d5f14f47b3a76a7be55a4714
          name: 'Storage repositories: Get values'
          type: SCRIPT
          key: xoa.host.storage.raw
          delay: 5m
          history: '0'
          value_type: TEXT
          params: |
            function checkedGet(request, url) {
                var response = request.get(url), status = request.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'XO HTTP ' + status;
                }
                return response;
            }
            var params = JSON.parse(value);
            var req = new HttpRequest();
            if (params.proxy && params.proxy !== "CHANGE_IF_NEEDED") {
                req.setProxy(params.proxy);
            }
            req.addHeader('Cookie: authenticationToken=' + params.token);
            req.addHeader('Accept: application/json');
            var serverUrl = params.url.endsWith('/') ? params.url.slice(0, -1) : params.url;
            function getJson(path) {
                return JSON.parse(checkedGet(req, encodeURI(serverUrl + path)));
            }
            var host = getJson('/rest/v0/hosts/' + params.host);
            var pbdIds = host.$PBDs || host.PBDs;
            if (!Array.isArray(pbdIds)) {
                throw 'PBD inventory unavailable';
            }
            var seen = {}, out = [];
            for (var i = 0; i < pbdIds.length; i++) {
                try {
                    var pbdId = String(pbdIds[i]), pbd = getJson(pbdId.indexOf('/rest/') === 0 ? pbdId : '/rest/v0/pbds/' + pbdId);
                    var srId = pbd.SR || pbd.$SR || pbd.sr;
                    if (!srId) {
                        continue;
                    }
                    srId = String(srId);
                    if (seen[srId]) {
                        continue;
                    }
                    seen[srId] = true;
                    var sr = getJson(srId.indexOf('/rest/') === 0 ? srId : '/rest/v0/srs/' + srId), uuid = String(sr.uuid || sr.id || srId);
                    var oc = sr.other_config || sr.otherConfig || {}, sm = sr.sm_config || sr.smConfig || {};
                    out.push({
                        uuid: uuid,
                        name: String(sr.name_label || uuid),
                        content_type: String(sr.content_type || 'unknown'),
                        sr_type: String(sr.SR_type || sr.type || 'unknown'),
                        allocation_strategy: sr.allocationStrategy == null || sr.allocationStrategy === '' ? 'N/A' : String(sr.allocationStrategy).toLowerCase(),
                        shared: sr.shared === true,
                        size: Number(sr.size || 0),
                        physical_usage: Number(sr.physical_usage || 0),
                        virtual_allocation: Number(sr.usage || 0),
                        pbd_uuid: String(pbd.uuid || pbd.id || pbdId),
                        pbd_attached: pbd.attached === true,
                        device_config: JSON.stringify(pbd.device_config || {}),
                        auto_scan: oc['auto-scan'] === true || String(oc['auto-scan']).toLowerCase() === 'true',
                        tags: Array.isArray(sr.tags) ? sr.tags.join(', ') : '',
                        devserial: sm.devserial ? String(sm.devserial) : ''
                    });
                } catch (error) {
                    throw error;
                }
            }
            return JSON.stringify(out);
          description: 'Retrieves storage repositories attached to the XCP-ng host and the data used by dependent items.'
          timeout: 60s
          parameters:
            - name: host
              value: '{$XOA.HOST.UUID}'
            - name: proxy
              value: '{$XOA.PROXY.URL}'
            - name: token
              value: '{$XOA.AUTH.TOKEN}'
            - name: url
              value: '{$XOA.URL}'
          tags:
            - tag: component
              value: raw
            - tag: target
              value: storage
        - uuid: 290c47a23c554e93aa56ac8c07b2acc7
          name: 'Supplemental packs'
          type: DEPENDENT
          key: xoa.host.supplemental.packs
          history: 90d
