        - uuid: 46d0e679a62145e5bb89b4876d5bf594
          name: 'Resident host: Current operational context'
          type: SCRIPT
          key: xoa.vm.host.context.raw
          history: '0'
          value_type: TEXT
          params: |
            var p = JSON.parse(value);
            var req = new HttpRequest();
            if (p.proxy && p.proxy !== 'CHANGE_IF_NEEDED') {
                req.setProxy(p.proxy);
            }
            req.addHeader('Cookie: authenticationToken=' + p.token);
            req.addHeader('Accept: application/json');
            var base = String(p.url);
            while (base.endsWith('/')) {
                base = base.slice(0, -1);
            }
            function get(path) {
                var body = req.get(base + path);
                var status = req.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'XO HTTP ' + status;
                }
                return JSON.parse(body);
            }
            function getId(v) {
                if (v && typeof v === 'object') {
                    v = v.uuid || v.id || v.href;
                }
                if (!v) {
                    return '';
                }
                var s = String(v);
                var parts = s.split('/');
                return parts[parts.length - 1];
            }
            var vm = get('/rest/v0/vms/' + encodeURIComponent(p.vm));
            var hostId = getId(vm.$container);
            if (String(vm.power_state).toLowerCase() !== 'running' && !hostId) {
                return JSON.stringify({maintenance: 0, running: 0, name: 'Unassigned', uuid: ''});
            }
            if (!hostId) {
                throw 'Resident host missing';
            }
            var host = get('/rest/v0/hosts/' + encodeURIComponent(hostId));
            if (typeof host.enabled !== 'boolean' || !host.power_state) {
                throw 'Incomplete resident host';
            }
            return JSON.stringify({
                maintenance: host.enabled === false ? 1 : 0,
                running: String(host.power_state).toLowerCase() === 'running' ? 1 : 0,
                name: host.name_label || hostId,
                uuid: hostId
            });
          description: 'Retrieves the current resident-host state used to suppress VM alerts during host maintenance or host unavailability.'
          timeout: 60s
          parameters:
            - name: proxy
              value: '{$XOA.PROXY.URL}'
            - name: token
              value: '{$XOA.AUTH.TOKEN}'
            - name: url
              value: '{$XOA.URL}'
            - name: vm
              value: '{$XOA.VM.UUID}'
          tags:
            - tag: component
              value: health
