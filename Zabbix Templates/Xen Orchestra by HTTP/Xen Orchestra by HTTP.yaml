        - uuid: e4794dad34f4436a915a71a533d23161
          name: 'Pools: RAM failover headroom estimate'
          type: SCRIPT
          key: xoa.pool.capacity.raw
          delay: 5m
          history: '0'
          value_type: TEXT
          params: |
            var p = JSON.parse(value);
            var req = new HttpRequest();
            if (p.proxy && p.proxy !== 'CHANGE_IF_NEEDED') {
                req.setProxy(p.proxy);
            }
            req.addHeader('Cookie: authenticationToken=' + p.token);
            req.addHeader('Accept: application/json');
            var base = String(p.url).replace(/\/+$/, '');
            function get(path) {
                var body = req.get(encodeURI(base + path));
                var status = req.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'XO HTTP ' + status;
                }
                return JSON.parse(body);
            }
            function getId(v) {
                if (v && typeof v === 'object') {
                    v = v.uuid || v.id || v.href;
                }
                if (!v) {
                    return '';
                }
                var parts = String(v).split('/');
                return parts[parts.length - 1];
            }
            var hosts = get('/rest/v0/hosts?fields=id,$poolId,$pool,enabled,power_state,memory');
            if (!Array.isArray(hosts)) {
                throw 'Invalid hosts response';
            }
            var pools = {};
            for (var i = 0; i < hosts.length; i++) {
                var h = hosts[i];
                if (typeof h === 'string') {
                    h = get(h);
                }
                var pool = getId(h.$poolId || h.$pool);
                if (!pool) {
                    throw 'Missing host pool';
                }
                if (!pools[pool]) {
                    pools[pool] = {uuid: pool, free: 0, largestUsed: 0, largestTotal: 0, eligible: 0, valid: true};
                }
                var q = pools[pool];
                if (h.enabled !== true || String(h.power_state).toLowerCase() !== 'running') {
                    continue;
                }
                var m = h.memory;
                if (!m || m.size == null || m.usage == null) {
                    q.valid = false;
                    continue;
                }
                var size = Number(m.size);
                var used = Number(m.usage);
                if (!isFinite(size) || !isFinite(used) || size <= 0 || used < 0 || used > size) {
                    q.valid = false;
                    continue;
                }
                q.eligible++;
                q.free += size - used;
                q.largestUsed = Math.max(q.largestUsed, used);
                q.largestTotal = Math.max(q.largestTotal, size);
            }
            var result = [];
            for (var key in pools) {
                if (pools.hasOwnProperty(key)) {
                    var q = pools[key];
                    q.margin = q.free - q.largestTotal;
                    result.push(q);
                }
            }
            return JSON.stringify(result);
          description: 'Calculates a RAM-based N+1 failover headroom estimate for each pool. This is not an HA admission-control guarantee.'
          timeout: 60s
          parameters:
            - name: proxy
              value: '{$XOA.PROXY.URL}'
            - name: token
              value: '{$XOA.AUTH.TOKEN}'
            - name: url
              value: '{$XOA.URL}'
          tags:
            - tag: component
              value: health
          triggers:
