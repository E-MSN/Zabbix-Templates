        - uuid: 94e28069fc3f4c428616a3623b97d0ee
          name: 'VM inventory: Get values'
          type: SCRIPT
          key: xoa.vms.discovery.raw
          delay: '{$XOA.DISCOVERY.INTERVAL}'
          history: '0'
          value_type: TEXT
          params: |
            var p = JSON.parse(value);
            var req = new HttpRequest();
            if (p.proxy && p.proxy !== 'CHANGE_IF_NEEDED') {
                req.setProxy(p.proxy);
            }
            req.addHeader('Cookie: authenticationToken=' + p.token);
            req.addHeader('Accept: application/json');
            var base = String(p.url).replace(/\/+$/, '');
            function get(path) {
                if (typeof path !== 'string' || path.indexOf('/rest/v0/') !== 0) {
                    throw 'Invalid XO resource path';
                }
                var body = req.get(encodeURI(base + path));
                var status = req.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'XO HTTP ' + status;
                }
                var data = JSON.parse(body);
                if (data === null || typeof data !== 'object') {
                    throw 'Invalid XO JSON response';
                }
                return data;
            }
            function id(v) {
                if (v && typeof v === 'object') {
                    v = v.uuid || v.id || v.href;
                }
                if (v === null || v === undefined) {
                    return '';
                }
                var s = String(v);
                if (s.indexOf('/rest/v0/') >= 0) {
                    var parts = s.split('/');
                    return parts[parts.length - 1];
                }
                return s;
            }
            function list(path) {
                var a = get(path), out = [];
                if (!Array.isArray(a)) {
                    throw 'Expected XO collection';
                }
                for (var n = 0; n < a.length; n++) {
                    out.push(typeof a[n] === 'string' ? get(a[n]) : a[n]);
                }
                return out;
            }
            function index(a) {
                var m = {};
                for (var n = 0; n < a.length; n++) {
                    m[id(a[n])] = a[n];
                }
                return m;
            }
            function seconds(v) {
                if (v === null || v === undefined || v === '') {
                    return 0;
                }
                var n = Number(v);
                if (!isFinite(n)) {
                    n = Date.parse(v) / 1000;
                }
                return isFinite(n) && n > 0 ? Math.floor(n > 1e11 ? n / 1000 : n) : 0;
            }
            var pools = index(list('/rest/v0/pools?fields=id,uuid,name_label'));
            var hosts = index(list('/rest/v0/hosts?fields=id,uuid,name_label,$poolId,$pool'));
            var a = list('/rest/v0/vms?fields=id,uuid,name_label,$poolId,$pool,$container'), out = [];
            for (var n = 0; n < a.length; n++) {
                var v = a[n], u = id(v), pool = pools[id(v.$poolId || v.$pool)], h = hosts[id(v.$container)];
                if (!u) {
                    throw 'VM identifier missing';
                }
                out.push({uuid: u, url: '/rest/v0/vms/' + u, name: v.name_label || u, pool: pool ? pool.name_label : 'N/A', host: h ? h.name_label : 'Unassigned'});
            }
            return JSON.stringify(out);
          description: 'Retrieves Xen Orchestra VMs used by VM discovery.'
          timeout: 60s
          parameters:
            - name: proxy
              value: '{$XOA.PROXY.URL}'
            - name: token
              value: '{$XOA.AUTH.TOKEN}'
            - name: url
              value: '{$XOA.URL}'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: e6638a63a08143b3ac115a466a81885a
              expression: 'nodata(/Xen Orchestra by HTTP/xoa.vms.discovery.raw,2h)=1'
              name: 'VM inventory: Get values: No collection data'
              priority: WARNING
              dependencies:
                - name: 'Xen Orchestra API is unavailable'
                  expression: 'max(/Xen Orchestra by HTTP/xoa.api.ok,3m)=0 and count(/Xen Orchestra by HTTP/xoa.api.ok,3m)>=3'
              tags:
                - tag: scope
                  value: availability
