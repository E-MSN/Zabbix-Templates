        - uuid: 1458d489beef4863be6f18f36ac41a24
          name: 'Check Token Validity'
          delay: 5m
          attempts: '3'
          http_proxy: '{$XOA.PROXY.URL}'
          headers:
            - name: Cookie
              value: 'authenticationToken={$XOA.AUTH.TOKEN}'
            - name: Accept
              value: application/json
          steps:
            - name: 'Check Token Validity'
              url: '{$XOA.URL}/rest/v0/pools'
              status_codes: '200'
      tags:
        - tag: class
          value: software
        - tag: role
          value: manager
        - tag: subclass
          value: virtualization
        - tag: target
          value: xen-orchestra
      macros:
        - macro: '{$XOA.ALARMS.ENABLED}'
          value: '1'
          description: 'Set to 1 to enable notifications for retained Xen Orchestra alarm records. These records are not treated as proof that the original condition is still active.'
        - macro: '{$XOA.AUTH.TOKEN}'
          type: SECRET_TEXT
          description: 'Authentication token generated in Xen Orchestra.'
        - macro: '{$XOA.BACKUP.EXPECTED}'
          value: '0'
          description: 'Set to 1 for backup jobs whose successful execution must be monitored. Override per job UUID when required.'
        - macro: '{$XOA.BACKUP.MAX.AGE}'
          value: 26h
          description: 'Maximum allowed age of the last successful backup. Override per job UUID, especially for non-daily jobs.'
        - macro: '{$XOA.BACKUP.MAX.DURATION}'
          value: 6h
          description: 'Maximum allowed running backup duration. Override per job UUID when required.'
        - macro: '{$XOA.BACKUP.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Regular expression matching backup job names excluded from discovery.'
        - macro: '{$XOA.DISCOVERY.INTERVAL}'
          value: 15m
          description: 'Inventory discovery interval.'
        - macro: '{$XOA.MAINTENANCE}'
          value: '0'
          description: 'Set to 1 to suppress operational alerts during planned work. Set to 0 for normal monitoring. Collection errors remain visible.'
        - macro: '{$XOA.NODATA}'
          value: 15m
          description: 'Maximum allowed silence for essential collectors.'
        - macro: '{$XOA.POOL.HA.EXPECTED}'
          value: '0'
          description: 'Set to 1 per pool UUID when high availability is expected to be enabled. Set to 0 otherwise.'
        - macro: '{$XOA.POOL.N1.MONITOR}'
          value: '0'
          description: 'Set to 1 per pool UUID to enable the RAM-based N+1 headroom warning. This is not an HA admission-control guarantee.'
        - macro: '{$XOA.PROXY.URL}'
          description: 'HTTP proxy URL used to reach Xen Orchestra. Leave empty when no proxy is required.'
        - macro: '{$XOA.RECOVERY.MARGIN}'
          value: '5'
          description: 'Recovery hysteresis, in percentage points, for utilization triggers.'
        - macro: '{$XOA.RESPONSE.TIME.SLOW}'
          value: '3'
          description: 'Xen Orchestra API response-time threshold, in seconds, used by the slow-response trigger.'
        - macro: '{$XOA.SR.IGNORE}'
          value: '^(DVD drives|XCP-ng Tools|Removable storage)$'
          description: 'Regular expression matching storage repositories excluded from discovery.'
        - macro: '{$XOA.SR.THRESHOLD.CRIT}'
          value: '90'
          description: 'Critical storage repository physical usage threshold, in percent.'
        - macro: '{$XOA.SR.THRESHOLD.WARN}'
          value: '80'
          description: 'Warning storage repository physical usage threshold, in percent.'
        - macro: '{$XOA.STATS.INTERVAL}'
          value: 1m
          description: 'Statistics polling interval. Xen Orchestra statistics are requested with one-minute granularity.'
        - macro: '{$XOA.STATS.MAX.AGE}'
          value: '300'
          description: 'Maximum accepted source statistics age, in seconds. Older values are discarded.'
        - macro: '{$XOA.TASK.LONG.RUNNING}'
          value: '1800'
          description: 'Task duration, in seconds, after which a running Xen Orchestra task is considered long-running.'
        - macro: '{$XOA.URL}'
          value: CHANGE_IF_NEEDED
          description: 'Base URL used to reach the Xen Orchestra REST API.'
        - macro: '{$XOA.VM.IGNORE}'
          value: '^(.*\[Importing.*|VM-Health Check - .*|.* - \([0-9]{8}T[0-9]{6}Z\))$'
          description: 'Regular expression matching importing, health-check, and Continuous Replication VMs excluded from discovery.'
