                - tag: pool
                  value: '{#SR.POOL}'
                - tag: repository
                  value: '{#SR.NAME}'
            - uuid: d190c5ce3cf74cadab68f9c33082d72d
              name: 'Pool {#SR.POOL}: SR {#SR.NAME}: VDI count'
              type: DEPENDENT
              key: 'xoa.sr.vdi.count[{#SR.URL}]'
              history: 90d
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      return Array.isArray(d.VDIs) ? d.VDIs.length : 0;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
