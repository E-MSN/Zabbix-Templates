          name: 'IPMI sensors: Get values'
          type: SCRIPT
          key: xoa.host.ipmi.raw
          delay: 5m
          history: '0'
          value_type: TEXT
          params: |
            var p = JSON.parse(value), req = new HttpRequest();
            if (p.proxy && p.proxy !== 'CHANGE_IF_NEEDED') {
                req.setProxy(p.proxy);
            }
            req.addHeader('Cookie: authenticationToken=' + p.token);
            req.addHeader('Accept: application/json');
            var base = p.url.endsWith('/') ? p.url.slice(0, -1) : p.url;
            try {
                var body = req.get(encodeURI(base + '/rest/v0/plugins/ipmi-sensors/hosts/' + p.host + '/ipmi'));
                var st = req.getStatus();
                if (st !== 200) {
                    return JSON.stringify({available: false, status: st, sensors: []});
                }
                var d = JSON.parse(body);
                d.available = true;
                return JSON.stringify(d);
            } catch (e) {
                return JSON.stringify({available: false, status: 0, sensors: []});
            }
          description: 'Retrieves IPMI sensor data for the XCP-ng host through the Xen Orchestra IPMI plugin.'
          timeout: 30s
          parameters:
            - name: host
              value: '{$XOA.HOST.UUID}'
            - name: proxy
              value: '{$XOA.PROXY.URL}'
            - name: token
              value: '{$XOA.AUTH.TOKEN}'
            - name: url
              value: '{$XOA.URL}'
          tags:
            - tag: component
              value: raw
            - tag: target
              value: ipmi
