            - uuid: 768822b0fc4a4147ab0d441140623623
              name: 'Backup job {#BACKUP.NAME}: Targets'
              type: DEPENDENT
              key: 'xoa.backup.job.targets[{#BACKUP.UUID}]'
              history: 90d
              value_type: TEXT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value), out = [];
                      function walk(o, p) {
                          if (o == null) {
                              return;
                          }
                          if (typeof o === 'string') {
                              out.push(p + '=' + o);
                              return;
                          }
                          if (Array.isArray(o)) {
                              if (o.length) {
                                  out.push(p + '=' + o.join('|'));
                              }
                              return;
                          }
                          if (typeof o === 'object') {
                              for (var k in o) {
                                  walk(o[k], p ? p + '.' + k : k);
                              }
                          }
                      }
                      walk(d.remotes, 'remotes');
                      walk(d.srs, 'srs');
                      return out.length ? out.join('; ') : 'N/A';
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 12h
              master_item:
