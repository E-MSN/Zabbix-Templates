        - uuid: ecb07656b77444d9897dc4b5ed937e9e
          name: 'Virtual network interface discovery'
          type: SCRIPT
          key: xoa.vm.vif.discovery
          delay: '{$XOA.DISCOVERY.INTERVAL}'
          params: |
            function checkedGet(request, url) {
                var response = request.get(url), status = request.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'XO HTTP ' + status;
                }
                return response;
            }
            var p = JSON.parse(value), req = new HttpRequest();
            if (p.proxy && p.proxy !== 'CHANGE_IF_NEEDED') {
                req.setProxy(p.proxy);
            }
            req.addHeader('Cookie: authenticationToken=' + p.token);
            req.addHeader('Accept: application/json');
            var base = p.url.endsWith('/') ? p.url.slice(0, -1) : p.url;
            function get(path) {
                return JSON.parse(checkedGet(req, encodeURI(base + path)));
            }
            var vm = get('/rest/v0/vms/' + p.vm), ids = vm.VIFs || vm.$VIFs || [], out = [], nc = {};
            for (var i = 0; i < ids.length; i++) {
                try {
                    var id = String(ids[i]), v = get('/rest/v0/vifs/' + id), dev = String(v.device == null ? i : v.device), nId = String(v.$network || v.network || ''), nName = 'unknown';
                    if (nId) {
                        if (nc[nId] === undefined) {
                            try {
                                nc[nId] = get(nId.indexOf('/rest/') === 0 ? nId : '/rest/v0/networks/' + nId);
                            } catch (e) {
                                nc[nId] = null;
                            }
                        }
                        if (nc[nId]) {
                            nName = String(nc[nId].name_label || nId);
                        }
                    }
                    out.push({uuid: id, device: dev, index: dev, network_uuid: nId, network_name: nName});
                } catch (e) {
                    throw e;
                }
            }
            return JSON.stringify(out);
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1h
          description: 'Discovers virtual network interfaces attached to the VM.'
