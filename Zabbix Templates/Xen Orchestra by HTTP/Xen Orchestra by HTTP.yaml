              type: DEPENDENT
              key: 'xoa.sr.used.virtual[{#SR.URL}]'
              history: 90d
              units: B
              description: 'Virtual allocated usage reported by Xen Orchestra. On thin-provisioned SRs it can be greater than physical size.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.usage
              master_item:
                key: 'xoa.sr.raw[{#SR.URL}]'
              tags:
                - tag: component
