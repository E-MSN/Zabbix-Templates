              name: 'Network Interface {#PIF.DEVICE}: Link transition state'
              type: DEPENDENT
              key: 'xoa.host.pif.link.state[{#PIF.UUID}]'
              history: 30d
              description: '0: eligible physical link down; 1: eligible physical link up; 2: not physical or not attached. Every valid sample is stored, including unchanged states. No heartbeat throttling: this prevents replay after manual closure.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      if (typeof d.physical !== 'boolean' || typeof d.attached !== 'boolean') {
                          throw 'Interface eligibility unavailable';
                      }
                      if (!d.physical || !d.attached) {
                          return 2;
                      }
                      if (typeof d.carrier !== 'boolean') {
                          throw 'Carrier unavailable';
                      }
                      return d.carrier ? 1 : 0;
