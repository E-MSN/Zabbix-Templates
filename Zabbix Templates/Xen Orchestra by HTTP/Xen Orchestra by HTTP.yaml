          trigger_prototypes:
            - uuid: 48fb9f93d72a4a55a381ef5937c2a608
              expression: |
                nodata(/XCP-ng VM via Xen Orchestra/xoa.vm.vif.raw[{#VIF.UUID}],{$XOA.NODATA})=1
                and {$XOA.MAINTENANCE}=0
                and ({$XOA.DISABLED.IS.MAINTENANCE}=0
                or last(/XCP-ng VM via Xen Orchestra/xoa.vm.host.maintenance)=0)
              name: 'Virtual Network Interface {#VIF.DEVICE}: Get values: No collection data'
              priority: WARNING
              dependencies:
                - name: 'XO API collection is unavailable'
                  expression: 'max(/XCP-ng VM via Xen Orchestra/xoa.api.ok,3m)=0 and count(/XCP-ng VM via Xen Orchestra/xoa.api.ok,3m)>=3'
