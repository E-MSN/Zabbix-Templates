            - uuid: 087dcb24233f4f3c8a88bc7d01abe3a4
              expression: |
                (last(/Xen Orchestra by HTTP/xoa.sr.used.percentage[{#SR.URL}])>{$XOA.SR.THRESHOLD.WARN}
