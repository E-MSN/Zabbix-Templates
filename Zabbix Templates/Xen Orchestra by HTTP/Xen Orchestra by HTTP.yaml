        - uuid: 0429d39be3304e87a9fde2fa305de27a
          name: 'Virtual disks: Get values'
          type: SCRIPT
          key: xoa.vm.storage.raw
          delay: 5m
          history: '0'
          value_type: TEXT
          params: |
            function checkedGet(request, url) {
                var response = request.get(url), status = request.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'XO HTTP ' + status;
                }
                return response;
            }
            var params = JSON.parse(value), req = new HttpRequest();
            if (params.proxy && params.proxy !== 'CHANGE_IF_NEEDED') {
                req.setProxy(params.proxy);
            }
            req.addHeader('Cookie:  authenticationToken=' + params.token);
            req.addHeader('Accept: application/json');
            var serverUrl = params.url.endsWith('/') ? params.url.slice(0, -1) : params.url;
            function getJson(path) {
                return JSON.parse(checkedGet(req, encodeURI(serverUrl + path)));
            }
            var list = getJson('/rest/v0/vms/' + params.vm + '/vdis?fields=id,name_label,name_description,size,usage,chainPhysicalUsage,VDI_type,$SR,$VBDs,cbt_enabled,missing,parent,snapshots,tags');
            var out = [];
            var srCache = {};
            if (!Array.isArray(list)) {
                throw 'VDI inventory unavailable';
            }
            for (var i = 0; i < list.length; i++) {
                try {
                    var vdi = list[i];
                    if (typeof vdi === 'string') {
                        vdi = getJson(vdi);
                    } else if (vdi && (vdi.size === undefined || vdi.usage === undefined)) {
                        var href = vdi.href || (vdi.id ? '/rest/v0/vdis/' + vdi.id : null);
                        if (href) {
                            vdi = getJson(href);
                        }
                    }
                    if (!vdi || String(vdi.VDI_type || '').toLowerCase() !== 'user') {
                        continue;
                    }
                    var srId = vdi.$SR || vdi.SR || '', sr = null;
                    if (srId) {
                        srId = String(srId);
                        if (srCache[srId] === undefined) {
                            try {
                                srCache[srId] = getJson(srId.indexOf('/rest/') === 0 ? srId : '/rest/v0/srs/' + srId);
                            } catch (e) {
                                srCache[srId] = null;
                            }
                        }
                        sr = srCache[srId];
                    }
                    if (sr && String(sr.content_type || '').toLowerCase() === 'iso') {
                        continue;
                    }
                    var id = String(vdi.uuid || vdi.id || '');
                    if (!id) {
                        continue;
                    }
                    var vbd = null, vbds = vdi.$VBDs || vdi.VBDs || [];
                    if (Array.isArray(vbds) && vbds.length) {
                        try {
                            for (var bi = 0; bi < vbds.length; bi++) {
                                var bid = String(vbds[bi]), candidate = getJson(bid.indexOf('/rest/') === 0 ? bid : '/rest/v0/vbds/' + bid);
                                var owner = candidate.VM || candidate.$VM;
                                if (owner && typeof owner === 'object') {
                                    owner = owner.uuid || owner.id;
                                }
                                if (String(owner).replace(/^\/rest\/v0\/vms\//, '') === String(params.vm)) {
                                    vbd = candidate;
                                    break;
                                }
                            }
                            if (!vbd) {
                                throw 'No VBD belongs to monitored VM';
                            }
                        } catch (e) {
                            throw e;
                        }
                    }
                    if (!vbd) {
                        throw 'VBD unavailable';
                    }
                    var dev = vbd.device ? String(vbd.device) : '', sk = /^xvd[a-z]$/.test(dev) ? dev.slice(3) : '';
                    out.push({
                        uuid: id,
                        name: String(vdi.name_label || id),
                        description: String(vdi.name_description || ''),
                        size: Number(vdi.size || 0),
                        usage: Number(vdi.chainPhysicalUsage !== undefined && vdi.chainPhysicalUsage !== null ? vdi.chainPhysicalUsage : vdi.usage || 0),
                        sr: srId ? String(srId) : '',
                        sr_name: sr ? String(sr.name_label || srId) : String(srId || 'unknown'),
                        allocation_strategy: sr && sr.allocationStrategy != null && sr.allocationStrategy !== '' ? String(sr.allocationStrategy).toLowerCase() : 'N/A',
                        cbt: vdi.cbt_enabled === true,
                        missing: vdi.missing === true,
                        parent: vdi.parent ? String(vdi.parent) : '',
                        snapshot_count: Array.isArray(vdi.snapshots) ? vdi.snapshots.length : 0,
                        tags: Array.isArray(vdi.tags) ? vdi.tags.join(', ') : '',
                        vbd_uuid: vbd ? String(vbd.uuid || vbd.id || '') : '',
                        device: dev,
                        stats_key: sk,
                        attached: vbd ? vbd.attached === true : false,
                        bootable: vbd ? vbd.bootable === true : false,
                        read_only: vbd ? vbd.read_only === true : false
                    });
                } catch (e) {
                    throw e;
                }
            }
            return JSON.stringify(out);
          description: 'Retrieves virtual disks attached to the VM and the data used by dependent items.'
          timeout: 60s
          parameters:
            - name: proxy
              value: '{$XOA.PROXY.URL}'
            - name: token
              value: '{$XOA.AUTH.TOKEN}'
            - name: url
              value: '{$XOA.URL}'
            - name: vm
              value: '{$XOA.VM.UUID}'
          tags:
            - tag: component
              value: raw
            - tag: target
              value: storage
