        - uuid: 23912f95c51c408d93df365b8ed34af6
          name: 'CPU usage'
          type: DEPENDENT
          key: xoa.vm.stats.cpu
          history: 90d
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  function num(v) {
                      if (v === null || v === undefined || v === '' || typeof v === 'boolean' || !isFinite(Number(v))) {
                          throw 'Metric unavailable';
                      }
                      return Number(v);
                  }
                  var stamp = num(d.endTimestamp), now = Date.now() / 1000;
                  if (stamp > 1e11) {
                      stamp /= 1000;
                  }
                  if (now - stamp > Number('{$XOA.STATS.MAX.AGE}') || stamp - now > 120) {
                      throw 'Stale or future statistics';
                  }
                  function sample(a) {
                      if (!Array.isArray(a) || !a.length) {
                          throw 'Metric unavailable';
                      }
                      return num(a[a.length - 1]);
                  }
                  function aggregate(o, mean) {
                      var sum = 0, n = 0;
                      if (!o || typeof o !== 'object') {
                          throw 'Metric unavailable';
                      }
                      for (var k in o) {
                          if (o.hasOwnProperty(k)) {
                              sum += sample(o[k]);
                              n++;
                          }
                      }
                      if (!n) {
                          throw 'Metric unavailable';
                      }
                      return mean ? sum / n : sum;
                  }
                  return sample(d.stats.cpuUsage);
          master_item:
            key: xoa.vms.stats.raw
          tags:
            - tag: component
              value: stats
            - tag: target
              value: cpu
        - uuid: 67e6c9fe8add4db59d4eef2dce93f73f
          name: 'Statistics: Valid CPU sample'
          type: DEPENDENT
          key: xoa.vm.stats.cpu.available
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  function num(v) {
                      if (v === null || v === undefined || v === '' || typeof v === 'boolean' || !isFinite(Number(v))) {
                          throw 'Metric unavailable';
                      }
                      return Number(v);
                  }
                  var stamp = num(d.endTimestamp), now = Date.now() / 1000;
                  if (stamp > 1e11) {
                      stamp /= 1000;
                  }
                  if (now - stamp > Number('{$XOA.STATS.MAX.AGE}') || stamp - now > 120) {
                      throw 'Stale or future statistics';
                  }
                  function sample(a) {
                      if (!Array.isArray(a) || !a.length) {
                          throw 'Metric unavailable';
                      }
                      return num(a[a.length - 1]);
                  }
                  function aggregate(o, mean) {
                      var sum = 0, n = 0;
                      if (!o || typeof o !== 'object') {
                          throw 'Metric unavailable';
                      }
                      for (var k in o) {
                          if (o.hasOwnProperty(k)) {
                              sum += sample(o[k]);
                              n++;
                          }
                      }
                      if (!n) {
                          throw 'Metric unavailable';
                      }
                      return mean ? sum / n : sum;
                  }
                  try {
                      aggregate(d.stats.cpus, true);
                      return 1;
                  } catch (e) {
                      return 0;
