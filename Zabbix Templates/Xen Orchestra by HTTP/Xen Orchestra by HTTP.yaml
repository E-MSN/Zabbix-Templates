                  value: vm
            - uuid: b16275be3b5741d9b199b3965856c86f
              name: 'Backup job {#BACKUP.NAME}: Get job status'
              type: SCRIPT
              key: 'xoa.backup.vm.raw[{#BACKUP.UUID}]'
              delay: 5m
              history: '0'
              value_type: TEXT
              params: |
                var p = JSON.parse(value), req = new HttpRequest();
                if (p.proxy && p.proxy !== 'CHANGE_IF_NEEDED') {
                    req.setProxy(p.proxy);
                }
                req.addHeader('Cookie: authenticationToken=' + p.token);
                req.addHeader('Accept: application/json');
                var base = String(p.url).replace(/\/+$/, '');
                function get(path) {
                    if (typeof path !== 'string' || path.indexOf('/rest/v0/') !== 0) {
                        throw 'Invalid XO resource path';
                    }
                    var body = req.get(encodeURI(base + path)), status = req.getStatus();
                    if (status < 200 || status >= 300) {
                        throw 'XO HTTP ' + status;
                    }
                    var data = JSON.parse(body);
                    if (data === null || typeof data !== 'object') {
                        throw 'Invalid XO JSON response';
                    }
                    return data;
                }
                function id(v) {
                    if (v && typeof v === 'object') {
                        v = v.uuid || v.id || v.href;
                    }
                    return v == null ? '' : String(v).replace(/^\/rest\/v0\/[^/]+\//, '');
                }
                function list(path) {
                    var a = get(path), out = [];
                    if (!Array.isArray(a)) {
                        throw 'Expected XO collection';
                    }
                    for (var n = 0; n < a.length; n++) {
                        out.push(typeof a[n] === 'string' ? get(a[n]) : a[n]);
                    }
                    return out;
                }
                function index(a) {
                    var m = {};
                    for (var n = 0; n < a.length; n++) {
                        m[id(a[n])] = a[n];
                    }
                    return m;
                }
                function seconds(v) {
                    if (v === null || v === undefined || v === '') {
                        return 0;
                    }
                    var n = Number(v);
                    if (!isFinite(n)) {
                        n = Date.parse(v) / 1000;
                    }
                    return isFinite(n) && n > 0 ? Math.floor(n > 1e11 ? n / 1000 : n) : 0;
                }
                var a = list('/rest/v0/backup-logs?filter=jobId:' + p.uuid + '&fields=id,jobId,jobName,status,start,end'), last = null, success = 0;
                for (var n = 0; n < a.length; n++) {
                    var b = a[n];
                    if (b.jobId !== p.uuid) {
                        continue;
                    }
                    var start = seconds(b.start), end = seconds(b.end);
                    if (!last || start > last.start) {
                        last = {id: b.id, name: b.jobName || p.uuid, status: String(b.status || 'unknown').toLowerCase(), start: start, end: end};
                    }
                    if (String(b.status).toLowerCase() === 'success' && end > success) {
                        success = end;
                    }
                }
                if (!last) {
                    last = {id: '', name: p.uuid, status: 'none', start: 0, end: 0};
                }
                last.lastSuccess = success;
                last.lastSuccessAge = success ? Math.max(0, Math.floor(Date.now() / 1000) - success) : 0;
                last.runningDuration = last.start > 0 && ['pending', 'running', 'started'].indexOf(last.status) !== -1 ? Math.max(0, Math.floor(Date.now() / 1000) - last.start) : 0;
                last.start *= 1000;
                last.end *= 1000;
                return JSON.stringify(last);
              timeout: 60s
              parameters:
                - name: proxy
                  value: '{$XOA.PROXY.URL}'
                - name: token
                  value: '{$XOA.AUTH.TOKEN}'
                - name: url
                  value: '{$XOA.URL}'
                - name: uuid
                  value: '{#BACKUP.UUID}'
              tags:
                - tag: component
                  value: raw
                - tag: target
                  value: vm
              trigger_prototypes:
                - uuid: 300ff39ccfaf462f975d792cf28cfab3
                  expression: 'nodata(/Xen Orchestra by HTTP/xoa.backup.vm.raw[{#BACKUP.UUID}],{$XOA.NODATA})=1'
                  name: 'Backup job {#BACKUP.NAME}: Get job status: No collection data'
                  priority: WARNING
                  dependencies:
                    - name: 'Xen Orchestra API is unavailable'
                      expression: 'max(/Xen Orchestra by HTTP/xoa.api.ok,3m)=0 and count(/Xen Orchestra by HTTP/xoa.api.ok,3m)>=3'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 1e36a34c950f4afbac07f89fb1d0cc17
              name: 'Backup job {#BACKUP.NAME}: Backup start'
              type: DEPENDENT
              key: 'xoa.backup.vm.start[{#BACKUP.UUID}]'
              history: 90d
              units: unixtime
              preprocessing:
                - type: JSONPATH
