        - macro: '{$XOA.IPMI.EXPECTED}'
          value: '1'
          description: 'Set to 1 when IPMI sensors are expected to be available. Set to 0 to disable the IPMI availability alert.'
        - macro: '{$XOA.LATENCY.CRIT}'
          value: '50'
          description: 'Critical read/write latency threshold, in milliseconds.'
        - macro: '{$XOA.LATENCY.FACTOR}'
          value: '1'
          description: 'Multiplier used to convert Xen Orchestra latency values to milliseconds.'
        - macro: '{$XOA.LATENCY.WARN}'
          value: '20'
          description: 'Warning read/write latency threshold, in milliseconds. Tune this value to the storage backend.'
        - macro: '{$XOA.MAINTENANCE}'
          value: '0'
          description: 'Set to 1 to suppress operational alerts during planned work. Set to 0 for normal monitoring. Collection errors remain visible.'
        - macro: '{$XOA.MEMORY.CRIT}'
          value: '90'
          description: 'Critical host memory usage threshold, in percent.'
        - macro: '{$XOA.MEMORY.WARN}'
          value: '75'
          description: 'Warning host memory usage threshold, in percent.'
        - macro: '{$XOA.NETWORK.UTIL.WARN}'
          value: '85'
          description: 'Warning per-direction physical interface utilization threshold, in percent.'
        - macro: '{$XOA.NODATA}'
          value: 15m
          description: 'Maximum allowed silence for essential collectors.'
        - macro: '{$XOA.PIF.MONITOR}'
          value: '1'
          description: 'Default physical-interface monitoring flag intended for per-interface overrides.'
        - macro: '{$XOA.PING.ENABLED}'
          value: '1'
          description: 'Set to 1 to enable ICMP monitoring of the host management address. Set to 0 to disable it.'
        - macro: '{$XOA.PROXY.URL}'
          description: 'HTTP proxy URL used to reach Xen Orchestra. Leave empty when no proxy is required.'
        - macro: '{$XOA.RECOVERY.MARGIN}'
          value: '5'
          description: 'Recovery hysteresis, in percentage points, for utilization triggers.'
        - macro: '{$XOA.SR.IGNORE}'
          value: '^(DVD drives|XCP-ng Tools|Removable storage)$'
          description: 'Regular expression matching storage repositories whose selected metrics are excluded by discovery overrides.'
        - macro: '{$XOA.STATS.INTERVAL}'
          value: 1m
          description: 'Statistics polling interval. Xen Orchestra statistics are requested with one-minute granularity.'
        - macro: '{$XOA.STATS.MAX.AGE}'
          value: '300'
          description: 'Maximum accepted source statistics age, in seconds. Older values are discarded.'
        - macro: '{$XOA.URL}'
          value: CHANGE_IF_NEEDED
          description: 'Base URL used to reach the Xen Orchestra REST API.'
