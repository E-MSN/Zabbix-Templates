                and
                last(/Xen Orchestra by HTTP/xoa.sr.type.content[{#SR.URL}])<>"iso") and {$XOA.MAINTENANCE}=0 and last(/Xen Orchestra by HTTP/xoa.sr.maintenance[{#SR.URL}])=0
              recovery_mode: RECOVERY_EXPRESSION
