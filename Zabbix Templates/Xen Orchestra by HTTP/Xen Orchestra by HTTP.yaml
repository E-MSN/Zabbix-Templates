                    and last(/XCP-ng Host via Xen Orchestra/xoa.host.pif.link.state[{#PIF.UUID}],#2)=1
                    and {$XOA.MAINTENANCE}=0
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/XCP-ng Host via Xen Orchestra/xoa.host.pif.link.state[{#PIF.UUID}])<>0 or {$XOA.MAINTENANCE}=1'
