        - uuid: a677aa05843c4b9aa336d8163e3202d6
          name: 'CPU usage per core discovery'
          type: DEPENDENT
          key: xoa.host.stats.cpu.discovery
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1h
          description: 'Discovers per-core CPU statistics reported by Xen Orchestra.'
          item_prototypes:
            - uuid: dbedb6c005e64c2297763b9494b4db70
              name: 'CPU core {#CORE} usage'
              type: DEPENDENT
              key: 'xoa.host.stats.cpu.usage[{#CORE}]'
              value_type: FLOAT
              units: '%'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      var stamp = Number(d.endTimestamp);
                      if (stamp > 1e11) {
                          stamp /= 1000;
                      }
                      var maxAge = Number('{$XOA.STATS.MAX.AGE}');
                      var now = Date.now() / 1000;
                      if (!isFinite(stamp) || now - stamp > maxAge || stamp - now > 120) {
                          throw 'Stale or future statistics';
                      }
                      var cpus = d.stats && d.stats.cpus;
                      if (!cpus) {
                          throw 'CPU statistics unavailable';
                      }
                      var core = String('{#CORE}');
                      var values = cpus[core] || cpus['cpu' + core];
                      if (!Array.isArray(values) || !values.length) {
                          throw 'Metric unavailable for CPU ' + core;
                      }
                      var result = values[values.length - 1];
                      if (result === null || result === '' || !isFinite(Number(result))) {
                          throw 'Invalid CPU value';
                      }
                      return Number(result);
              master_item:
                key: xoa.host.stats.raw
              tags:
                - tag: component
                  value: stats
                - tag: target
                  value: cpu
          master_item:
            key: xoa.host.stats.raw
          lld_macro_paths:
            - lld_macro: '{#CORE.KEY}'
              path: $.key
            - lld_macro: '{#CORE}'
              path: $.core
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value), c = d.stats && d.stats.cpus;
                  if (!c || !Object.keys(c).length) {
                      throw 'CPU discovery unavailable';
                  }
                  var out = [];
                  for (var k in c) {
                      if (c.hasOwnProperty(k)) {
                          out.push({core: k.replace(/^cpu/, ''), key: k, vcpu: k});
                      }
                  }
                  return JSON.stringify(out);
