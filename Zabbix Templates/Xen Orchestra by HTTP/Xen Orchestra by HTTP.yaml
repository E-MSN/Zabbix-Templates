            - uuid: e129398467fd4e75975432c187d3f81b
              name: 'Virtual Network Interface {#VIF.DEVICE}: TX checksumming'
              type: DEPENDENT
              key: 'xoa.vm.vif.tx.checksum[{#VIF.UUID}]'
