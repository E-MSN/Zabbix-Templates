        - uuid: f5f79dd77d6843c999515e1d040baa18
          name: 'Virtual network discovery'
          type: SCRIPT
          key: xoa.host.network.discovery
          delay: '{$XOA.DISCOVERY.INTERVAL}'
          params: |
            function checkedGet(request, url) {
                var response = request.get(url), status = request.getStatus();
                if (status <  200 || status >= 300) {
                    throw 'XO HTTP ' + status;
                }
                return response;
            }
            var params = JSON.parse(value);
             var req = new HttpRequest();
            if (params.proxy && params.proxy !== "CHANGE_IF_NEEDED") {
                req.setProxy(params.proxy);
            }
             req.addHeader('Cookie: authenticationToken=' + params.token);
            req.addHeader('Accept: application/json');
            var server_url = params.url.endsWith('/')  ? params.url.slice(0, -1) : params.url;
            function getJson(path) {
                return JSON.parse(checkedGet(req, encodeURI(server_url  + path)));
            }
            var host = getJson('/rest/v0/hosts/' + params.host);
            var pifs = host.PIFs || host.$PIFs || [], result = [], networkCache  = {};
            for (var i = 0; i < pifs.length; i++) {
                var uuid = String(pifs[i]);
                try {
                    var pif = getJson('/rest/v0/pifs/'  + uuid);
                    var device = pif.device === undefined || pif.device === null || String(pif.device) === '' ? uuid : String(pif.device);
                     var m = device.match(/([0-9]+)$/), index = m ? m[1] : '-1';
                    var netId = pif.$network || pif.network || '';
                     var netName = 'unknown';
                    if (netId) {
                        netId = String(netId);
                        if (networkCache[netId]  === undefined) {
                            try {
                                networkCache[netId] = getJson(netId.indexOf('/rest/') === 0 ? netId  : '/rest/v0/networks/' + netId);
                            } catch (e) {
                                networkCache[netId] = null;
                             }
                        }
                        var n = networkCache[netId];
                        if (n) {
                            netName = String(n.name_label  || netId);
                        }
                    }
                    result.push({uuid: uuid, device: device, index: String(index), vlan: String(pif.vlan  == null ? -1 : pif.vlan), network_uuid: String(netId || ''), network_name: netName, bridge: n && n.bridge ? String(n.bridge) :  'N/A', mtu: n && n.MTU != null ? String(n.MTU) : String(pif.mtu || 0)});
                } catch (error) {
                    throw error;
                }
             }
            return JSON.stringify(result);
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1h
          description: 'Discovers host-associated virtual/VLAN PIFs separately from physical interfaces.'
