            - uuid: 1c85f36b68ae432989b009137bbceeed
              name: 'Virtual Network Interface {#VIF.DEVICE}: Incoming traffic'
              type: DEPENDENT
              key: 'xoa.vm.vif.stats.rx[{#VIF.UUID}]'
              history: 90d
              value_type: FLOAT
              units: Bps
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      function num(v) {
                          if (v === null || v === undefined || v === '' || typeof v === 'boolean' || !isFinite(Number(v))) {
                              throw 'Metric unavailable';
                          }
                          return Number(v);
                      }
                      var stamp = num(d.endTimestamp), now = Date.now() / 1000;
                      if (stamp > 1e11) {
                          stamp /= 1000;
                      }
                      if (now - stamp > Number('{$XOA.STATS.MAX.AGE}') || stamp - now > 120) {
                          throw 'Stale or future statistics';
                      }
                      function sample(a) {
                          if (!Array.isArray(a) || !a.length) {
                              throw 'Metric unavailable';
                          }
                          return num(a[a.length - 1]);
                      }
                      function aggregate(o, mean) {
                          var sum = 0, n = 0;
                          if (!o || typeof o !== 'object') {
                              throw 'Metric unavailable';
                          }
                          for (var k in o) {
                              if (o.hasOwnProperty(k)) {
                                  sum += sample(o[k]);
                                  n++;
                              }
                          }
                          if (!n) {
                              throw 'Metric unavailable';
                          }
                          return mean ? sum / n : sum;
                      }
                      var o = d.stats && d.stats.vifs && d.stats.vifs.rx, k = String('{#VIF.INDEX}');
                      if (!o || !Array.isArray(o[k]) || !o[k].length) {
                          throw 'Metric unavailable';
                      }
                      var v = num(o[k][o[k].length - 1]);
                      return isFinite(v) ? v : function() {
                          throw 'Metric unavailable';
                      }();
              master_item:
                key: xoa.vms.stats.raw
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#VIF.DEVICE}'
