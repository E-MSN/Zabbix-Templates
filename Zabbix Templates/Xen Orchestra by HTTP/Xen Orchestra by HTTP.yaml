            - uuid: 4ca54def98724bbbaa6d4e101c5a7aa4
              name: 'Backup job {#BACKUP.NAME}: Backup name'
              type: DEPENDENT
              key: 'xoa.backup.vm.name[{#BACKUP.UUID}]'
              history: 90d
              value_type: TEXT
              preprocessing:
