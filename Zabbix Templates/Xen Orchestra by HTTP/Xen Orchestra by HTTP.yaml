    - uuid: 5f69e71a0ed1418da4daf08e4dc22b7c
      template: 'Xen Orchestra by HTTP'
      name: 'Xen Orchestra by HTTP'
      description: 'This template is designed for monitoring Xen Orchestra through the REST API.'
      vendor:
        name: E-MSN
        version: 7.4-2
      groups:
        - name: Templates/Applications
      items:
        - uuid: ef91788e73de443fb646c67d2c958876
          name: 'XO native alarms: Get records'
          type: SCRIPT
          key: xoa.alarms.raw
          delay: 2m
          history: '0'
          value_type: TEXT
          params: |
            var p = JSON.parse(value);
            var req = new HttpRequest();
            if (p.proxy && p.proxy !== 'CHANGE_IF_NEEDED') {
                req.setProxy(p.proxy);
            }
            req.addHeader('Cookie: authenticationToken=' + p.token);
            req.addHeader('Accept: application/json');
            var base = String(p.url);
            while (base.endsWith('/')) {
                base = base.slice(0, -1);
            }
            var path = '/rest/v0/alarms?fields=' + encodeURIComponent('id,uuid,name,body,object,time,$poolId,$pool');
            function get(path) {
                var body = req.get(base + path);
                var status = req.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'XO HTTP ' + status;
                }
                return JSON.parse(body);
            }
            var data = get(path);
            if (!Array.isArray(data)) {
                throw 'Unexpected alarms response';
            }
            var alarms = [];
            for (var i = 0; i < data.length; i++) {
                var alarm = data[i];
                if (typeof alarm === 'string') {
                    alarm = get(alarm);
                }
                alarms.push(alarm);
            }
            return JSON.stringify(alarms);
          description: 'Retrieves retained Xen Orchestra alarm records used by alarm discovery.'
          timeout: 60s
          parameters:
            - name: proxy
              value: '{$XOA.PROXY.URL}'
            - name: token
              value: '{$XOA.AUTH.TOKEN}'
            - name: url
              value: '{$XOA.URL}'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 529d35c7f93241ffa9ab3626e5df0c1a
              expression: 'nodata(/Xen Orchestra by HTTP/xoa.alarms.raw,{$XOA.NODATA})=1'
              name: 'XO native alarms: Get records: No collection data'
              priority: WARNING
              dependencies:
                - name: 'Xen Orchestra API is unavailable'
                  expression: 'max(/Xen Orchestra by HTTP/xoa.api.ok,3m)=0 and count(/Xen Orchestra by HTTP/xoa.api.ok,3m)>=3'
              tags:
                - tag: scope
                  value: availability
        - uuid: d45161911e514810b544804a184d5287
          name: 'XO API: Collection error'
          type: DEPENDENT
          key: xoa.api.error
          history: 30d
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return JSON.parse(value).error;'
          master_item:
            key: xoa.api.health.raw
          tags:
            - tag: component
              value: health
        - uuid: 67a867048f6f43b394ca059103160769
          name: 'XO API: Authentication and connectivity'
          type: SCRIPT
          key: xoa.api.health.raw
          history: '0'
          value_type: TEXT
          params: |
            var p = JSON.parse(value);
            var req = new HttpRequest();
            if (p.proxy && p.proxy !== 'CHANGE_IF_NEEDED') {
                req.setProxy(p.proxy);
            }
            req.addHeader('Cookie: authenticationToken=' + p.token);
            req.addHeader('Accept: application/json');
            var url = String(p.url).replace(/\/+$/, '');
            try {
                var body = req.get(url + '/rest/v0/pools?limit=1');
                var status = req.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'XO HTTP ' + status;
                }
                JSON.parse(body);
                return JSON.stringify({ok: 1, status: status, error: ''});
            } catch (e) {
                return JSON.stringify({ok: 0, status: req.getStatus() || 0, error: String(e)});
            }
          description: 'Checks Xen Orchestra REST API authentication and basic connectivity.'
          timeout: 60s
          parameters:
            - name: proxy
              value: '{$XOA.PROXY.URL}'
            - name: token
              value: '{$XOA.AUTH.TOKEN}'
            - name: url
              value: '{$XOA.URL}'
          tags:
            - tag: component
              value: health
        - uuid: b9aafefc97944be6b072748c361e6a5a
          name: 'XO API: Collection available'
          type: DEPENDENT
          key: xoa.api.ok
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return JSON.parse(value).ok;'
          master_item:
            key: xoa.api.health.raw
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 800be5a22d0f4d6c813338a839effade
              expression: 'max(/Xen Orchestra by HTTP/xoa.api.ok,3m)=0 and count(/Xen Orchestra by HTTP/xoa.api.ok,3m)>=3'
              name: 'Xen Orchestra API is unavailable'
              opdata: 'Availability: {ITEM.LASTVALUE}'
              priority: HIGH
              description: 'Authenticated XO API requests fail for three observations. See XO API: Collection error.'
              dependencies:
                - name: 'Authentication Token for Xen Orchestra is invalid'
                  expression: 'last(/Xen Orchestra by HTTP/web.test.rspcode[Check Token Validity,Check Token Validity])=401'
                  recovery_expression: 'last(/Xen Orchestra by HTTP/web.test.rspcode[Check Token Validity,Check Token Validity])=200'
              tags:
                - tag: target
                  value: 'xoa api'
        - uuid: 7142b4ff9e2a454989ac2457d9b75ff3
          name: 'Check Xen Orchestra API availability'
          type: DEPENDENT
          key: xoa.api.service.available
          description: 'Stores the result of the Xen Orchestra API availability check.'
          valuemap:
            name: 'XOA Port availability'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return JSON.parse(value).ok;'
          master_item:
            key: xoa.api.health.raw
          tags:
