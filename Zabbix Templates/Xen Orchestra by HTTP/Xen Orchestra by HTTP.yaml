                last(/Xen Orchestra by HTTP/xoa.sr.used.percentage[{#SR.URL}])<({$XOA.SR.THRESHOLD.CRIT}-{$XOA.RECOVERY.MARGIN})
                or {$XOA.MAINTENANCE}=1
                or last(/Xen Orchestra by HTTP/xoa.sr.maintenance[{#SR.URL}])=1
              name: 'Pool {#SR.POOL}: SR {#SR.NAME} free space is critically low'
