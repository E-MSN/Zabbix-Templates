        - uuid: c3b501c87c5346a5806d76323d820fd0
          name: 'vCPU discovery'
          type: DEPENDENT
          key: xoa.vm.stats.vcpu.discovery
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1h
          description: 'Discovers VM virtual CPUs reported in Xen Orchestra statistics.'
          item_prototypes:
            - uuid: b72b845e062644c7b7a83a63c10788db
              name: 'vCPU {#VCPU} usage'
              type: DEPENDENT
              key: 'xoa.vm.stats.vcpu.usage[{#VCPU}]'
              history: 90d
              value_type: FLOAT
              units: '%'
              description: 'REST v0 per-vCPU utilization normalized from fraction to percent.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      function num(v) {
                          if (v === null || v === undefined || v === '' || typeof v === 'boolean' || !isFinite(Number(v))) {
                              throw 'Metric unavailable';
                          }
                          return Number(v);
                      }
                      var stamp = num(d.endTimestamp), now = Date.now() / 1000;
                      if (stamp > 1e11) {
                          stamp /= 1000;
                      }
                      if (now - stamp > Number('{$XOA.STATS.MAX.AGE}') || stamp - now > 120) {
                          throw 'Stale or future statistics';
                      }
                      function sample(a) {
                          if (!Array.isArray(a) || !a.length) {
                              throw 'Metric unavailable';
                          }
                          return num(a[a.length - 1]);
                      }
                      function aggregate(o, mean) {
                          var sum = 0, n = 0;
                          if (!o || typeof o !== 'object') {
                              throw 'Metric unavailable';
                          }
                          for (var k in o) {
                              if (o.hasOwnProperty(k)) {
                                  sum += sample(o[k]);
                                  n++;
                              }
                          }
                          if (!n) {
                              throw 'Metric unavailable';
                          }
                          return mean ? sum / n : sum;
                      }
                      var c = d.stats && d.stats.cpus, a = c && c[String("{#VCPU}")];
                      return Array.isArray(a) && a.length ? num(a[a.length - 1]) : function() {
                          throw 'Metric unavailable';
                      }();
              master_item:
                key: xoa.vms.stats.raw
              tags:
                - tag: component
                  value: stats
                - tag: target
                  value: cpu
          master_item:
            key: xoa.vms.stats.raw
          lld_macro_paths:
            - lld_macro: '{#VCPU}'
              path: $.vcpu
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value), c = d.stats && d.stats.cpus;
                  if (!c || !Object.keys(c).length) {
                      throw 'CPU discovery unavailable';
                  }
                  var out = [];
                  for (var k in c) {
                      if (c.hasOwnProperty(k)) {
                          out.push({core: k.replace(/^cpu/, ''), key: k, vcpu: k});
                      }
                  }
                  return JSON.stringify(out);
