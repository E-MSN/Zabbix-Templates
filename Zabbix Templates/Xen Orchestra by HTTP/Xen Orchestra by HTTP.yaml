          name: 'IP addresses'
          type: DEPENDENT
          key: xoa.vm.ip.addresses
          history: 90d
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value), a = d.addresses || {}, out = [];
                  if (Array.isArray(a)) {
                      out = a;
                  } else {
                      for (var k in a) {
                          if (a.hasOwnProperty(k)) {
                              var v = a[k];
                              if (Array.isArray(v)) {
                                  out = out.concat(v);
                              } else if (v) {
                                  out.push(v);
                              }
                          }
                      }
                  }
                  out = out.map(String).filter(function(v, i, s) {
                      return v && s.indexOf(v) === i;
                  });
                  return out.length ? out.join(', ') : 'N/A';
            - type: DISCARD_UNCHANGED_HEARTBEAT
