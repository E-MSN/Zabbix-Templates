        - uuid: aecf2255554b47c2a6a3a8736bc1958d
          name: 'XO tasks: Get summary'
          type: SCRIPT
          key: xoa.tasks.raw
          delay: 5m
          history: '0'
          value_type: TEXT
          params: |
            function checkedGet(request, url) {
                var response = request.get(url), status = request.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'XO HTTP ' + status;
                }
                return response;
            }
            var p = JSON.parse(value);
            var req = new HttpRequest();
            if (p.proxy && p.proxy !== 'CHANGE_IF_NEEDED') {
                req.setProxy(p.proxy);
            }
            req.addHeader('Cookie:  authenticationToken=' + p.token);
            req.addHeader('Accept: application/json');
            var base = p.url.endsWith('/') ? p.url.slice(0, -1) : p.url;
            var now = Date.now();
            var hour = 3600000;
            var longSec = Number(p.long) || 1800;
            function get(path) {
                var body = checkedGet(req, encodeURI(base + path));
                var status = req.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'HTTP ' + status;
                }
                return JSON.parse(body);
            }
            function resolveTask(task) {
                if (typeof task === 'string') {
                    return get(task);
                }
                if (task && task.href && (task.status === undefined || task.start === undefined)) {
                    return get(task.href);
                }
                return task || {};
            }
            function getTasks(filter) {
                var fields = 'id,status,start,end,updatedAt,properties,result,name,method';
                try {
                    return get('/rest/v0/tasks?filter=' + filter + '&fields=' + fields);
                } catch (e) {
                    var list = get('/rest/v0/tasks?filter=' + filter);
                    var tasks = [];
                    for (var i = 0; i < list.length; i++) {
                        try {
                            tasks.push(resolveTask(list[i]));
                        } catch (e2) {
                            throw e2;
                        }
                    }
                    return tasks;
                }
            }
            function toMilliseconds(value) {
                var n = Number(value || 0);
                if (!isFinite(n) || n <= 0) {
                    return 0;
                }
                return n < 100000000000 ? n * 1000 : n;
            }
            var pending = [];
            var failures = [];
            try {
                pending = getTasks('status:pending');
                failures = getTasks('status:failure');
            } catch (e) {
                throw e;
            }
            var running = pending.length;
            var longRunning = 0;
            for (var i = 0; i < pending.length; i++) {
                try {
                    var task = resolveTask(pending[i]);
                    var started = toMilliseconds(task.start);
                    if (started > 0 && (now - started) / 1000 > longSec) {
                        longRunning++;
                    }
                } catch (e) {
                    throw e;
                }
            }
            var failedHour = 0;
            var last = null;
            for (var j = 0; j < failures.length; j++) {
                try {
                    var failedTask = resolveTask(failures[j]);
                    var ended = toMilliseconds(failedTask.end || failedTask.updatedAt || failedTask.start);
                    if (ended > 0 && now >= ended && now - ended <= hour) {
                        failedHour++;
                    }
                    if (ended > 0 && (!last || ended > last.time)) {
                        last = {time: ended, task: failedTask};
                    }
                } catch (e) {
                    throw e;
                }
            }
            var lastFailedName = 'N/A';
            var lastFailedError = 'N/A';
            var lastFailedTime = 0;
            if (last) {
                var task = last.task;
                var properties = task.properties || {};
                var result = task.result;
                lastFailedTime = Math.floor(last.time / 1000);
                lastFailedName = String(properties.name || properties.method || task.name || task.method || task.id || 'N/A');
                if (result !== undefined && result !== null) {
                    if (typeof result === 'string' || typeof result === 'number') {
                        lastFailedError = String(result);
                    } else {
                        lastFailedError = String(result.message || result.name || result.code || JSON.stringify(result));
                    }
                }
            }
            return JSON.stringify({
                failedHour: failedHour,
                running: running,
                longRunning: longRunning,
                lastFailedName: lastFailedName,
                lastFailedError: lastFailedError,
                lastFailedTime: lastFailedTime
            });
          description: 'Retrieves Xen Orchestra task status and summarizes failed, running, and long-running tasks.'
          timeout: 60s
          parameters:
            - name: long
              value: '{$XOA.TASK.LONG.RUNNING}'
            - name: proxy
              value: '{$XOA.PROXY.URL}'
            - name: token
              value: '{$XOA.AUTH.TOKEN}'
            - name: url
              value: '{$XOA.URL}'
          tags:
            - tag: component
              value: raw
            - tag: target
              value: task
          triggers:
            - uuid: 30d72e0117204737a7d3b533bbde654b
              expression: 'nodata(/Xen Orchestra by HTTP/xoa.tasks.raw,{$XOA.NODATA})=1'
              name: 'XO tasks: Get summary: No collection data'
              priority: WARNING
              dependencies:
                - name: 'Xen Orchestra API is unavailable'
                  expression: 'max(/Xen Orchestra by HTTP/xoa.api.ok,3m)=0 and count(/Xen Orchestra by HTTP/xoa.api.ok,3m)>=3'
              tags:
                - tag: scope
                  value: availability
        - uuid: 297703ef3cf0463caadba1972bc3f0d3
          name: 'Running XO tasks'
