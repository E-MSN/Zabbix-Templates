      discovery_rules:
        - uuid: c40fbc27dc5e467194ffa9d4db55ba22
          name: 'Host certificate discovery'
          type: DEPENDENT
          key: xoa.host.certificate.discovery
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1h
          description: 'Discovers certificates reported by the XCP-ng host and creates certificate expiration items and triggers.'
          item_prototypes:
            - uuid: 225ca33044d44115bc3a3888cb789fdf
              name: 'Certificate {#CERT.FINGERPRINT}: Days until expiration'
              type: DEPENDENT
              key: 'xoa.host.certificate.days["{#CERT.FINGERPRINT}"]'
              history: 90d
              value_type: FLOAT
              units: '!d'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value), a = Array.isArray(d.certificates) ? d.certificates : [], f = String('{#CERT.FINGERPRINT}'), v = 0;
                      for (var j = 0; j < a.length; j++) {
                          if (String(a[j].fingerprint) === f) {
                              v = a[j].notAfter;
                              break;
                          }
                      }
                      if (v == null || v === '') {
                          return null;
                      }
                      var ts;
                      if (typeof v === 'number') {
                          ts = v > 100000000000 ? Math.floor(v / 1000) : Math.floor(v);
                      } else {
                          var n = Date.parse(v);
                          ts = isNaN(n) ? Number(v) : Math.floor(n / 1000);
                      }
                      if (!isFinite(ts)) {
                          return null;
                      }
                      return Math.floor((ts - Math.floor(Date.now() / 1000)) / 86400);
              master_item:
                key: xoa.host.raw
              tags:
                - tag: component
                  value: security
              trigger_prototypes:
                - uuid: 4119783021b7423ea6750bca4cb4fff4
                  expression: 'last(/XCP-ng Host via Xen Orchestra/xoa.host.certificate.days["{#CERT.FINGERPRINT}"])<7'
                  name: 'Host certificate {#CERT.FINGERPRINT} expires in less than 7 days'
                  opdata: 'Days until expiration: {ITEM.LASTVALUE}'
                  priority: AVERAGE
                  description: 'The XCP-ng host certificate expires in less than 7 days and should be renewed before expiration.'
                  dependencies:
                    - name: 'XO API collection is unavailable'
                      expression: 'max(/XCP-ng Host via Xen Orchestra/xoa.api.ok,3m)=0 and count(/XCP-ng Host via Xen Orchestra/xoa.api.ok,3m)>=3'
                  tags:
                    - tag: scope
                      value: security
                - uuid: 5a518d2cb7644169a853f8b6153d2440
                  expression: 'last(/XCP-ng Host via Xen Orchestra/xoa.host.certificate.days["{#CERT.FINGERPRINT}"])<30'
                  name: 'Host certificate {#CERT.FINGERPRINT} expires in less than 30 days'
                  opdata: 'Days until expiration: {ITEM.LASTVALUE}'
                  priority: WARNING
                  description: 'The XCP-ng host certificate expires in less than 30 days. Plan certificate renewal before expiration.'
                  dependencies:
                    - name: 'Host certificate {#CERT.FINGERPRINT} expires in less than 7 days'
                      expression: 'last(/XCP-ng Host via Xen Orchestra/xoa.host.certificate.days["{#CERT.FINGERPRINT}"])<7'
                    - name: 'XO API collection is unavailable'
                      expression: 'max(/XCP-ng Host via Xen Orchestra/xoa.api.ok,3m)=0 and count(/XCP-ng Host via Xen Orchestra/xoa.api.ok,3m)>=3'
                  tags:
                    - tag: scope
                      value: security
            - uuid: dafdf0f44a6743fbbd65456b6e5e5f80
              name: 'Certificate {#CERT.FINGERPRINT}: Expiration date'
              type: DEPENDENT
              key: 'xoa.host.certificate.expiry["{#CERT.FINGERPRINT}"]'
              history: 90d
              units: unixtime
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value), a = Array.isArray(d.certificates) ? d.certificates : [], f = String('{#CERT.FINGERPRINT}');
                      for (var i = 0; i < a.length; i++) {
                          if (String(a[i].fingerprint) === f) {
                              var v = a[i].notAfter;
                              if (typeof v === 'number') {
                                  return v > 100000000000 ? Math.floor(v / 1000) : Math.floor(v);
                              }
                              var n = Date.parse(v);
                              return isNaN(n) ? null : Math.floor(n / 1000);
                          }
                      }
                      return null;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 12h
              master_item:
                key: xoa.host.raw
              tags:
                - tag: component
                  value: security
          master_item:
            key: xoa.host.raw
          lld_macro_paths:
            - lld_macro: '{#CERT.FINGERPRINT}'
              path: $.fingerprint
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value), a = Array.isArray(d.certificates) ? d.certificates : [], out = [];
                  for (var i = 0; i < a.length; i++) {
                      if (a[i] && a[i].fingerprint) {
                          out.push({fingerprint: String(a[i].fingerprint)});
                      }
                  }
                  return JSON.stringify(out);
        - uuid: 0a20ef2c87614f8394c560f1c7ca7405
          name: 'IPMI numeric sensor discovery'
          type: DEPENDENT
          key: xoa.host.ipmi.numeric.discovery
          enabled_lifetime_type: DISABLE_AFTER
