        - uuid: a5a3107e50a540f1a34a2e8a4cfc5d77
          name: 'Backup job inventory: Get values'
          type: SCRIPT
          key: xoa.backup.discovery.raw
          delay: '{$XOA.DISCOVERY.INTERVAL}'
          history: '0'
          value_type: TEXT
          params: |
            var p = JSON.parse(value);
            var req = new HttpRequest();
            if (p.proxy && p.proxy !== 'CHANGE_IF_NEEDED') {
                req.setProxy(p.proxy);
            }
            req.addHeader('Cookie: authenticationToken=' + p.token);
            req.addHeader('Accept: application/json');
            var base = String(p.url).replace(/\/+$/, '');
            function get(path) {
                if (typeof path !== 'string' || path.indexOf('/rest/v0/') !== 0) {
                    throw 'Invalid XO resource path';
                }
                var body = req.get(encodeURI(base + path));
                var status = req.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'XO HTTP ' + status;
                }
                var data = JSON.parse(body);
                if (data === null || typeof data !== 'object') {
                    throw 'Invalid XO JSON response';
                }
                return data;
            }
            function id(v) {
                if (v && typeof v === 'object') {
                    v = v.uuid || v.id || v.href;
                }
                if (v === null || v === undefined) {
                    return '';
                }
                var s = String(v);
                if (s.indexOf('/rest/v0/') >= 0) {
                    var parts = s.split('/');
                    return parts[parts.length - 1];
                }
                return s;
            }
            function list(path) {
                var a = get(path), out = [];
                if (!Array.isArray(a)) {
                    throw 'Expected XO collection';
                }
                for (var n = 0; n < a.length; n++) {
                    out.push(typeof a[n] === 'string' ? get(a[n]) : a[n]);
                }
                return out;
            }
            function index(a) {
                var m = {};
                for (var n = 0; n < a.length; n++) {
                    m[id(a[n])] = a[n];
                }
                return m;
            }
            function seconds(v) {
                if (v === null || v === undefined || v === '') {
                    return 0;
                }
                var n = Number(v);
                if (!isFinite(n)) {
                    n = Date.parse(v) / 1000;
                }
                return isFinite(n) && n > 0 ? Math.floor(n > 1e11 ? n / 1000 : n) : 0;
            }
            var a = list('/rest/v0/backup-jobs?fields=id,name'), out = [];
            for (var n = 0; n < a.length; n++) {
                var u = id(a[n]);
                out.push({uuid: u, url: '/rest/v0/backup-jobs/' + u, name: a[n].name || u});
            }
            return JSON.stringify(out);
          description: 'Retrieves Xen Orchestra backup jobs used by backup job discovery.'
          timeout: 60s
          parameters:
            - name: proxy
              value: '{$XOA.PROXY.URL}'
            - name: token
              value: '{$XOA.AUTH.TOKEN}'
            - name: url
              value: '{$XOA.URL}'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: c0efb55cbe514bbeb5f9329bf7bac3bb
              expression: 'nodata(/Xen Orchestra by HTTP/xoa.backup.discovery.raw,2h)=1'
              name: 'Backup job inventory: Get values: No collection data'
              priority: WARNING
              dependencies:
                - name: 'Xen Orchestra API is unavailable'
                  expression: 'max(/Xen Orchestra by HTTP/xoa.api.ok,3m)=0 and count(/Xen Orchestra by HTTP/xoa.api.ok,3m)>=3'
              tags:
                - tag: scope
                  value: availability
        - uuid: 34095417b959413eafb9336d7b0bcf4e
          name: 'Backup repositories: Get values'
          type: SCRIPT
          key: xoa.backup.repositories.raw
          delay: 15m
          history: '0'
          value_type: TEXT
          params: |
            function checkedGet(request, url) {
                var response = request.get(url), status = request.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'XO HTTP ' + status;
                }
                return response;
            }
            var p = JSON.parse(value), req = new HttpRequest();
            if (p.proxy && p.proxy !== 'CHANGE_IF_NEEDED') {
                req.setProxy(p.proxy);
            }
            req.addHeader('Cookie: authenticationToken=' + p.token);
            req.addHeader('Accept: application/json');
            var base = p.url.endsWith('/') ? p.url.slice(0, -1) : p.url;
            function get(path) {
                var b = checkedGet(req, encodeURI(base + path));
                var s = req.getStatus();
                if (s < 200 || s >= 300) {
                    throw 'HTTP ' + s;
                }
                return JSON.parse(b);
            }
            var list = [];
            try {
                list = get('/rest/v0/backup-repositories');
            } catch (e) {
                throw e;
            }
            var out = [];
            for (var i = 0; i < list.length; i++) {
                try {
                    var r = list[i];
                    if (typeof r === 'string') {
                        r = get(r);
                    } else if (r.href) {
                        r = get(r.href);
                    }
                    var id = String(r.id || r.uuid || ''), health = -1;
                    if (!id) {
                        continue;
                    }
                    try {
                        var h = get('/rest/v0/backup-repositories/' + id + '/health');
                        health = h && h.success === true ? 1 : 0;
                    } catch (e) {
                        health = -1;
                    }
                    var b = Array.isArray(r.benchmarks) && r.benchmarks.length ? r.benchmarks[r.benchmarks.length - 1] : {};
                    var u = String(r.url || '');
                    var type = (u.match(/^([^:]+):/) || [])[1] || 'unknown';
                    var safe = u.replace(/\/\/[^\/@]+@/, '//***@');
                    out.push({
                        uuid: id,
                        name: String(r.name || id),
                        enabled: r.enabled === true,
                        health: health,
                        type: type,
                        location: safe,
                        read: Number(b.readRate || 0),
                        write: Number(b.writeRate || 0),
                        benchmark: Number(b.timestamp || 0)
                    });
                } catch (e) {
                    throw e;
                }
            }
            return JSON.stringify(out);
          description: 'Retrieves Xen Orchestra backup repository inventory and health information.'
          timeout: 60s
