            - uuid: b9baccd3b3f24ae9bb58387dfc164b05
              name: 'Backup job {#BACKUP.NAME}: Backup duration'
              type: DEPENDENT
              key: 'xoa.backup.vm.duration[{#BACKUP.UUID}]'
              history: 90d
              units: uptime
              preprocessing:
