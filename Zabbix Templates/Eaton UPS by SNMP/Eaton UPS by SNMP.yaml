          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          history: 7d
          valuemap:
            name: zabbix.host.available
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: network
            - tag: component
              value: system
          triggers:
            - uuid: ed17d38b8cfd46df880fbc8f77f32594
              expression: 'max(/Eaton UPS - Network M2 and M3 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'SNMP is unavailable on {HOST.NAME}'
              priority: AVERAGE
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Eaton UPS - Network M2 and M3 by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
