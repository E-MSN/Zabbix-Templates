        - uuid: b469ab3a98a54489aff0e49ead5cfdc6
          name: 'UPS firmware version'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.534.1.1.3.0
          key: xups.ident.software_version
          delay: 1d
          history: 90d
          value_type: CHAR
          tags:
            - tag: component
              value: identity
          triggers:
            - uuid: 92663afab5704a6ca0ba5bc750267723
              expression: |
                last(/Eaton UPS - Network M2 and M3 by SNMP/xups.ident.software_version,#1)<>last(/Eaton UPS - Network M2 and M3 by SNMP/xups.ident.software_version,#2)
                and length(last(/Eaton UPS - Network M2 and M3 by SNMP/xups.ident.software_version))>0
              name: 'UPS firmware version has changed'
              priority: INFO
              description: 'UPS firmware/software version has changed.'
              manual_close: 'YES'
              tags:
                - tag: component
                  value: firmware
                - tag: scope
                  value: change
