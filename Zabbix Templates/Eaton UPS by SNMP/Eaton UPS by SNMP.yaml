                  expression: 'last(/Eaton UPS - Network MS Legacy by SNMP/ups.test.result)=3'
                - name: 'UPS card communication status is not OK'
                  expression: 'last(/Eaton UPS - Network MS Legacy by SNMP/upsmg.card.communication_status)<>1'
                - name: 'UPS is on bypass'
                  expression: 'last(/Eaton UPS - Network MS Legacy by SNMP/upsmg.output.on_bypass)=1'
                - name: 'UPS is running on battery'
                  expression: 'last(/Eaton UPS - Network MS Legacy by SNMP/upsmg.output.on_battery)=1'
