        - uuid: a66dc918d67c42fda8f2f10d4e49c47d
          name: 'Bypass frequency'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.534.1.5.1.0
          key: xups.bypass.frequency
