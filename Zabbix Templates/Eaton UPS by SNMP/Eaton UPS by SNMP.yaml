          triggers:
            - uuid: e4a08775111e44588ceece603f2b6a01
              expression: 'max(/Eaton UPS - Network M2 and M3 by SNMP/xups.battery.charge,5m)<{$UPS.BATTERY.CHARGE.MIN}'
              name: 'Battery charge is low'
              priority: HIGH
              description: 'Battery charge stayed below threshold during the last 5 minutes.'
              tags:
                - tag: component
                  value: battery
                - tag: scope
                  value: capacity
        - uuid: b07aae9d99484fff9df29c3837e3f624
          name: 'Battery current'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.534.1.2.3.0
          key: xups.battery.current
