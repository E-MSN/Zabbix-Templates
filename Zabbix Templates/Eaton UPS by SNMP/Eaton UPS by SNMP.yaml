                - name: 'UPS battery status requires attention'
                  expression: 'last(/Eaton UPS - Network MS Legacy by SNMP/upsmg.battery.low)=1 or last(/Eaton UPS - Network MS Legacy by SNMP/upsmg.battery.charger_fault)=1 or last(/Eaton UPS - Network MS Legacy by SNMP/upsmg.battery.fault)=1 or last(/Eaton UPS - Network MS Legacy by SNMP/upsmg.battery.replacement)=1 or last(/Eaton UPS - Network MS Legacy by SNMP/upsmg.battery.no_battery)=1 or last(/Eaton UPS - Network MS Legacy by SNMP/upsmg.battery.unavailable)=1'
