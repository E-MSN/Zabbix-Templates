    - uuid: 8e31c57a40b940668ce3d258c444dcd4
      template: 'Eaton UPS - Network MS Legacy by SNMP'
      name: 'Eaton UPS - Network MS Legacy by SNMP'
      description: |
        Template for legacy Eaton/MGE UPS equipped with Network-MS network cards.
        This template uses the following MIBs:
        - SNMPv2-MIB
        - UPS-MIB
        - MG-SNMP-UPS-MIB
      vendor:
        name: E-MSN
        version: 7.4-10
      groups:
        - name: Templates/Power
      items:
        - uuid: 4fd558a53fc749f490d55038c21ff847
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          delay: '60'
          history: 1w
          valuemap:
            name: 'Service state'
          tags:
            - tag: application
              value: status
          triggers:
            - uuid: c1513072ef524d289cb607703ebe3fdd
              expression: 'max(/Eaton UPS - Network MS Legacy by SNMP/icmpping,#3)=0'
              name: 'ICMP Ping: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 847a2688bf7e421f81dcc066ea69cc34
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: '%'
          tags:
            - tag: application
              value: status
          triggers:
            - uuid: d2dafdb090da4c668a70037f9cb0895c
              expression: 'min(/Eaton UPS - Network MS Legacy by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Eaton UPS - Network MS Legacy by SNMP/icmppingloss,5m)<100'
              name: 'ICMP Ping: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Eaton UPS - Network MS Legacy by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: c6f1ab8a1a4e4c2095fa568a53a71ece
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: s
          tags:
            - tag: application
              value: status
          triggers:
            - uuid: e58c62bca44a4645b0ea5c300b2ab54b
