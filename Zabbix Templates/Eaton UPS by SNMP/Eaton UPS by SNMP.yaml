zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 45cb0846e7fe49f79c02ff0888969cf6
      name: Templates/Power
  templates:
    - uuid: ccfd83e1a7f2423ea9d1a8b7954cf4c3
      template: 'Eaton UPS - Network M2 and M3 by SNMP'
      name: 'Eaton UPS - Network M2 & M3 by SNMP'
      description: |
        Template for Eaton UPS equipped with Network-M2 or Network-M3 network cards.
        This template uses the following MIBs:
        - SNMPv2-MIB
        - UPS-MIB
        - XUPS-MIB
        - EATON-SENSOR-MIB
      vendor:
        name: E-MSN
        version: 7.4-10
      groups:
        - name: Templates/Power
      items:
        - uuid: ee9b0b36d53f4438b6b26c0e7d942c7b
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          delay: '60'
          history: 1w
          valuemap:
            name: 'Service state'
          tags:
            - tag: application
              value: status
          triggers:
            - uuid: 5c53ddfb66e740209e237be026cee62f
              expression: 'max(/Eaton UPS - Network M2 and M3 by SNMP/icmpping,#3)=0'
              name: 'ICMP Ping: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 122a5347e34d4c1d843e065c7606efb5
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: '%'
          tags:
            - tag: application
              value: status
          triggers:
            - uuid: afc5386321364392af60a4b730fc4345
              expression: 'min(/Eaton UPS - Network M2 and M3 by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Eaton UPS - Network M2 and M3 by SNMP/icmppingloss,5m)<100'
              name: 'ICMP Ping: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Eaton UPS - Network M2 and M3 by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 2a2ad57936f142aea7cf37c7469fdc74
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: s
          tags:
            - tag: application
              value: status
          triggers:
            - uuid: b5a2878ad350409f881d0c105807bc43
              expression: 'avg(/Eaton UPS - Network M2 and M3 by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'ICMP Ping: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'ICMP Ping: High ICMP ping loss'
                  expression: 'min(/Eaton UPS - Network M2 and M3 by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Eaton UPS - Network M2 and M3 by SNMP/icmppingloss,5m)<100'
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Eaton UPS - Network M2 and M3 by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 81704259a3c84a8abcec1227265a82dd
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: sysDescr
          delay: 1d
          history: 90d
          value_type: TEXT
          inventory_link: NOTES
          tags:
            - tag: component
              value: system
        - uuid: c3a82acf426043c183a3432624a291c6
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: sysName
          delay: 1d
          history: 90d
          value_type: CHAR
          inventory_link: NAME
          tags:
            - tag: component
              value: system
        - uuid: 795b1a8e1b244f508d0343f89a5840dd
          name: 'System object ID'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.2.0
          key: sysObjectID
          delay: 1d
          history: 90d
          value_type: CHAR
          tags:
            - tag: component
              value: system
        - uuid: f5f1329d2e2a4f41bfc23b17b039b103
          name: 'SNMP uptime'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: sysUpTime
          history: 90d
          units: uptime
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: e01c17a7e6104b0f957b203e705afd6a
              expression: 'last(/Eaton UPS - Network M2 and M3 by SNMP/sysUpTime)<10m'
              name: 'SNMP agent has restarted'
              priority: INFO
              description: 'SNMP uptime is lower than 10 minutes.'
              tags:
                - tag: component
                  value: system
                - tag: scope
                  value: availability
        - uuid: 32ec1eec2f95443eaf824de95851ce63
          name: 'Seconds on battery'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.33.1.2.2.0
          key: ups.battery.seconds_on_battery
          history: 90d
          units: s
          tags:
            - tag: component
              value: battery
        - uuid: 52a44b66bebf427893beca891c04b247
          name: 'Battery temperature'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.33.1.2.7.0
          key: ups.battery.temperature
          delay: 5m
          history: 90d
          value_type: FLOAT
          units: °C
          tags:
            - tag: component
              value: battery
        - uuid: 074ade30c5f743878bf2592acfe6df22
          name: 'UPS agent temperature'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.534.1.13.1.0
          key: xups.agent.temperature
          delay: 5m
          history: 90d
          value_type: FLOAT
          units: °C
          tags:
            - tag: component
              value: network
        - uuid: 368d6bbdc88a43db9140b07c16fdcb24
          name: 'UPS alarms count'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.534.1.7.1.0
          key: xups.alarms.count
          history: 90d
          units: '#'
          tags:
            - tag: component
              value: alarms
            - tag: scope
              value: status
          triggers:
            - uuid: c552bf46483f4a69929b2caf142379af
              expression: 'last(/Eaton UPS - Network M2 and M3 by SNMP/xups.alarms.count)>{$UPS.ALARMS.MAX}'
              name: 'UPS has active alarms'
              priority: HIGH
              description: 'UPS alarm counter is greater than configured threshold.'
              dependencies:
                - name: 'Battery charge is low'
                  expression: 'max(/Eaton UPS - Network M2 and M3 by SNMP/xups.battery.charge,5m)<{$UPS.BATTERY.CHARGE.MIN}'
                - name: 'Battery runtime is low'
                  expression: 'max(/Eaton UPS - Network M2 and M3 by SNMP/xups.battery.runtime,5m)<{$UPS.RUNTIME.MIN}'
                - name: 'UPS battery status requires attention'
                  expression: 'last(/Eaton UPS - Network M2 and M3 by SNMP/xups.battery.abm_status)=6 or last(/Eaton UPS - Network M2 and M3 by SNMP/xups.battery.abm_status)=8'
                - name: 'UPS battery test failed'
                  expression: 'last(/Eaton UPS - Network M2 and M3 by SNMP/xups.test.battery_status)=3'
                - name: 'UPS is on bypass'
                  expression: 'last(/Eaton UPS - Network M2 and M3 by SNMP/xups.output.source)=4 or last(/Eaton UPS - Network M2 and M3 by SNMP/xups.output.source)=11'
                - name: 'UPS is running on battery'
                  expression: 'last(/Eaton UPS - Network M2 and M3 by SNMP/xups.output.source)=5'
                - name: 'UPS output load is high'
                  expression: 'min(/Eaton UPS - Network M2 and M3 by SNMP/xups.output.load,5m)>{$UPS.LOAD.MAX}'
              tags:
                - tag: component
                  value: alarms
                - tag: scope
                  value: status
        - uuid: afd8f45c25b1428195d230bb91c2f4ac
          name: 'UPS active notices count'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.534.1.7.18.0
          key: xups.alarms.notices_count
          history: 90d
          units: '#'
          tags:
            - tag: component
              value: alarms
            - tag: scope
              value: status
        - uuid: f8ea344014374ffc8ab6075d148d6015
          name: 'Battery status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.534.1.2.5.0
          key: xups.battery.abm_status
          history: 90d
          valuemap:
            name: 'Eaton xUPS Battery ABM Status'
          tags:
            - tag: component
              value: battery
            - tag: scope
              value: status
          triggers:
            - uuid: f548a506a73f4317be1ab518526eb174
              expression: 'last(/Eaton UPS - Network M2 and M3 by SNMP/xups.battery.abm_status)=6 or last(/Eaton UPS - Network M2 and M3 by SNMP/xups.battery.abm_status)=8'
              name: 'UPS battery status requires attention'
              priority: HIGH
              description: 'Battery is disconnected or check battery is reported.'
              tags:
                - tag: component
                  value: battery
                - tag: scope
                  value: status
        - uuid: 816b194f260b4df7a951a169bafe1d82
          name: 'Battery aged'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.534.1.2.9.0
          key: xups.battery.aged
          delay: 5m
          history: 90d
          valuemap:
            name: 'Eaton xUPS Yes/No'
          tags:
            - tag: component
              value: battery
            - tag: scope
              value: status
        - uuid: c8c00e23047f4e44a946a4aafbf1c34d
          name: 'Battery charge'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.534.1.2.4.0
          key: xups.battery.charge
