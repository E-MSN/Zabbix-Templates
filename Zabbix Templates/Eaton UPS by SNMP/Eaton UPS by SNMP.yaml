        - uuid: 32ec7b2fdfa14e21b776d8999034bb6e
          name: 'Bypass phase count'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.534.1.5.2.0
          key: xups.bypass.phase_count
