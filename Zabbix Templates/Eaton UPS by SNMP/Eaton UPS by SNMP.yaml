        - uuid: f3f61f14a5cd4bd5ab4428d81985cf13
          name: 'Battery runtime'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.534.1.2.1.0
          key: xups.battery.runtime
          history: 90d
          value_type: FLOAT
          units: min
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.016666667'
          tags:
            - tag: component
              value: battery
          triggers:
            - uuid: 8c89ea8becc8486c8d58d041b67119e6
              expression: 'max(/Eaton UPS - Network M2 and M3 by SNMP/xups.battery.runtime,5m)<{$UPS.RUNTIME.MIN}'
              name: 'Battery runtime is low'
              priority: HIGH
              description: 'Estimated runtime stayed below threshold during the last 5 minutes.'
              tags:
                - tag: component
                  value: battery
                - tag: scope
                  value: capacity
        - uuid: b09a82ed0ba84e6f838762d33033988f
          name: 'Battery voltage'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.534.1.2.2.0
          key: xups.battery.voltage
          history: 90d
          value_type: FLOAT
          units: V
          tags:
            - tag: component
