        - uuid: d0c0daaae1c545b997e0bc58537eba6f
          name: 'QNAP External Disk Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#QNAP_DISK_INDEX},1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.1,{#QNAP_DISK_SLOT},1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.2,{#QNAP_DISK_LOCATION},1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.3,{#QNAP_DISK_HEALTH_TEXT},1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.4,{#QNAP_DISK_MODEL},1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.8]'
          key: qnap.external.disk.discovery
          delay: 1h
          filter:
            conditions:
              - macro: '{#QNAP_DISK_LOCATION}'
                value: '^[1-9][0-9]*$'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Uses QNAP Storage Manager disk information.'
          item_prototypes:
            - uuid: 19a113d949644b919de8c1d7dde7173d
              name: 'External disk {#QNAP_DISK_MODEL}: Capacity'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.9.{#SNMPINDEX}'
              key: 'qnap.external.disk.capacity[{#QNAP_DISK_INDEX}]'
              delay: 15m
              units: B
              tags:
                - tag: Application
                  value: Disks
            - uuid: f796563e4a88481e9cf9edad613db5bf
              name: 'External disk {#QNAP_DISK_MODEL}: Location'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.3.{#SNMPINDEX}'
              key: 'qnap.external.disk.location[{#QNAP_DISK_INDEX}]'
              delay: 15m
              tags:
                - tag: Application
                  value: Disks
            - uuid: 69100911025842cd87be15970c1bfa2a
              name: 'External disk {#QNAP_DISK_MODEL}: Model'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.8.{#SNMPINDEX}'
              key: 'qnap.external.disk.model[{#QNAP_DISK_INDEX}]'
              delay: 15m
              value_type: TEXT
              tags:
                - tag: Application
                  value: Disks
            - uuid: 56da16720cb84043ad60dc9c7707be7b
              name: 'External disk {#QNAP_DISK_MODEL}: Slot'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.2.{#SNMPINDEX}'
              key: 'qnap.external.disk.slot[{#QNAP_DISK_INDEX}]'
              delay: 15m
              tags:
                - tag: Application
                  value: Disks
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var rows = JSON.parse(value);
                  var out = [];
                  for (var i = 0; i < rows.length; i++) {
                      var r = rows[i];
                      var hasDiskIndex = Object.prototype.hasOwnProperty.call(r, "{#QNAP_DISK_INDEX}") && String(r["{#QNAP_DISK_INDEX}"]).trim() !== "";
                      var hasLocation = Object.prototype.hasOwnProperty.call(r, "{#QNAP_DISK_LOCATION}") && String(r["{#QNAP_DISK_LOCATION}"]).trim() !== "";
                      var hasModel = Object.prototype.hasOwnProperty.call(r, "{#QNAP_DISK_MODEL}") && String(r["{#QNAP_DISK_MODEL}"]).trim() !== "";
                      var hasHealth =  Object.prototype.hasOwnProperty.call(r, "{#QNAP_DISK_HEALTH_TEXT}") && String(r["{#QNAP_DISK_HEALTH_TEXT}"]).trim() !== "";
                      if (!hasDiskIndex) {
                          continue;
                      }
                      if (!hasLocation && !hasModel && !hasHealth) {
                          continue;
                      }
                      if (!hasLocation) {
                          r["{#QNAP_DISK_LOCATION}"] = "0";
                      }
                      out.push(r);
                  }
                  return JSON.stringify(out);
