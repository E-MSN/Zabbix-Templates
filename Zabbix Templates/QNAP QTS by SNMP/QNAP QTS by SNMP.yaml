zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 5e177452ac0d49d587dba98c4649bcec
      name: 'Templates/NAS & SAN'
  templates:
    - uuid: 2dfda7019a464f74b73754a6b40ef133
      template: 'QNAP QTS by SNMP'
      name: 'QNAP QTS by SNMP'
      description: |
        Template QNAP QTS by SNMP.
        
        MIBs used:
        SNMPv2-MIB
        IF-MIB
        ENTITY-MIB
        HOST-RESOURCES-MIB
        QNAP NAS-MIB
        
        Main QNAP NAS-MIB OIDs use the 1.3.6.1.4.1.24681 macro.
        Default value is 1.3.6.1.4.1.24681.
      vendor:
        name: E-MSN
        version: 7.4-10
      groups:
        - name: 'Templates/NAS & SAN'
      items:
        - uuid: 8a74e6258bca469ea92b25b369343717
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          delay: '60'
          history: 1w
          valuemap:
            name: 'Service state'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: 1c74d30ab82047c69386f0811e065137
              expression: 'max(/QNAP QTS by SNMP/icmpping,#3)=0'
              name: 'ICMP Ping: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 4e717a8235954ecc9ab70d87dcbef1f9
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: '%'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: 2fa73689b4c04da1872463688a2243df
              expression: 'min(/QNAP QTS by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/QNAP QTS by SNMP/icmppingloss,5m)<100'
              name: 'ICMP Ping: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/QNAP QTS by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: bc56eacbd67b4b95b43ac03fecc79c94
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: s
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: c78b83044e184c1792649d46429bd3e8
              expression: 'avg(/QNAP QTS by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'ICMP Ping: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'ICMP Ping: High ICMP ping loss'
                  expression: 'min(/QNAP QTS by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/QNAP QTS by SNMP/icmppingloss,5m)<100'
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/QNAP QTS by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 4fac94bd68204cd3b83ebac332a7843a
          name: 'CPU Temperature'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.24681.1.4.1.1.1.1.4.2.0
          key: qnap.system.cpu.temperature
          units: °C
          description: 'CPU temperature from QNAP Storage Manager CPU table.'
          tags:
            - tag: Application
              value: CPU
            - tag: Application
              value: 'QNAP System'
            - tag: Application
              value: 'System Health'
          triggers:
            - uuid: fb41f02106644b3f8da53d86fb16ec23
              expression: 'avg(/QNAP QTS by SNMP/qnap.system.cpu.temperature,#4)>{$CPU.TEMP.HIGH}'
              name: 'CPU temperature is critical on {HOST.NAME}'
              opdata: 'CPU temp: {ITEM.LASTVALUE1}'
              priority: HIGH
              tags:
                - tag: scope
                  value: temperature
            - uuid: ff1d64a13f3c4c7883f53d97760e43c1
              expression: 'avg(/QNAP QTS by SNMP/qnap.system.cpu.temperature,#4)>{$CPU.TEMP.AVG}'
              name: 'CPU temperature is high on {HOST.NAME}'
              opdata: 'CPU temp: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              dependencies:
                - name: 'CPU temperature is critical on {HOST.NAME}'
                  expression: 'avg(/QNAP QTS by SNMP/qnap.system.cpu.temperature,#4)>{$CPU.TEMP.HIGH}'
              tags:
                - tag: scope
                  value: temperature
        - uuid: ac190952dd094d5988f143b776c9ab22
          name: 'CPU Usage'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.24681.1.3.1.0
          key: qnap.system.cpu.usage
          units: '%'
          description: 'QNAP SystemCPU-UsageEX.'
          tags:
            - tag: Application
              value: CPU
            - tag: Application
              value: 'QNAP System'
            - tag: Application
              value: 'System Health'
          triggers:
            - uuid: e6e2a80ef49a4debb0d2f272ff7c0931
              expression: 'avg(/QNAP QTS by SNMP/qnap.system.cpu.usage,5m)>{$CPU_UTIL_AVG}'
              name: 'CPU usage is high on {HOST.NAME}'
              opdata: 'CPU: {ITEM.LASTVALUE1}'
              priority: WARNING
              tags:
                - tag: scope
                  value: performance
            - uuid: c6c372a35d0045b09d8d1f86cfea4170
              expression: 'avg(/QNAP QTS by SNMP/qnap.system.cpu.usage,5m)>{$CPU_UTIL_HIGH}'
              name: 'CPU usage is too high on {HOST.NAME}'
              opdata: 'CPU: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: performance
        - uuid: 555411d2e17c4739b0e18e3c646da4bb
          name: 'System Description'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: qnap.system.descr
          value_type: TEXT
          description: 'SNMP system description.'
          tags:
            - tag: Application
              value: 'QNAP System'
            - tag: Application
              value: 'System Information'
          triggers:
            - uuid: ef636833028d4b13a2d02356e9ecfee8
              expression: '(last(/QNAP QTS by SNMP/qnap.system.descr,#1)<>last(/QNAP QTS by SNMP/qnap.system.descr,#2))>0'
              name: 'System description has changed on {HOST.NAME}'
              priority: INFO
              description: 'The SNMP system description changed. This can indicate a firmware or system update.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: eed197a9f7e74681b3a67f9267b7ff7d
          name: 'Entity Description'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.47.1.1.1.1.2.1
          key: qnap.system.entity.descr
          delay: 1h
          value_type: TEXT
          inventory_link: HARDWARE
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return String(value).trim();'
          tags:
            - tag: Application
              value: System
        - uuid: 4a5baa30c264478a961845eaf3ada8b7
          name: 'Entity Model'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.47.1.1.1.1.13.1
          key: qnap.system.entity.model
          delay: 1h
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return String(value).trim();'
          tags:
            - tag: Application
              value: System
        - uuid: deb1e7c72cad43ea804c0d0c6cf3f0d7
          name: 'Entity Name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.47.1.1.1.1.7.1
          key: qnap.system.entity.name
          delay: 1h
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return String(value).trim();'
          tags:
            - tag: Application
              value: System
        - uuid: 72c04c015d974d6fb47334ee549930df
          name: 'QTS version'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.47.1.1.1.1.9.1
          key: qnap.system.firmware
          delay: 1h
          value_type: TEXT
          inventory_link: SOFTWARE
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return String(value).trim();'
          tags:
            - tag: Application
              value: System
          triggers:
            - uuid: d7a84ec24f3342359cca8054bf0cfe61
              expression: '(last(/QNAP QTS by SNMP/qnap.system.firmware,#1)<>last(/QNAP QTS by SNMP/qnap.system.firmware,#2))>0'
              name: 'QTS on {HOST.NAME} has been updated'
              priority: INFO
              description: 'Version of QTS has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
                - tag: scope
                  value: security
        - uuid: 1389acf13db147dd82f5455222566876
          name: 'Hardware version'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.47.1.1.1.1.8.1
          key: qnap.system.hardware.version
          delay: 1h
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return String(value).trim();'
          tags:
            - tag: Application
              value: System
        - uuid: e330d7792acf40ad9d4f4b8b3e495538
          name: 'Host Name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.24681.1.3.13.0
          key: qnap.system.hostname
          value_type: TEXT
          description: 'QNAP hostname.'
          tags:
            - tag: Application
              value: 'QNAP System'
            - tag: Application
              value: 'System Information'
        - uuid: 9addff7b22bd422c9160ecca62cb0e57
          name: Manufacturer
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.47.1.1.1.1.12.1
          key: qnap.system.manufacturer
          delay: 1h
          value_type: TEXT
          inventory_link: VENDOR
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return String(value).trim();'
          tags:
            - tag: Application
              value: System
        - uuid: 91e0366d560f45f79a05c615fcf24abd
          name: 'Free Physical Memory'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.24681.1.3.3.0
          key: qnap.system.memory.free
          units: B
          description: 'QNAP SystemFreeMemEX in bytes.'
          tags:
            - tag: Application
              value: Memory
            - tag: Application
              value: 'QNAP System'
            - tag: Application
              value: 'System Health'
        - uuid: 809f75a505684c53b1d9b5c8bbcb4dec
          name: 'Total Physical Memory'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.24681.1.3.2.0
          key: qnap.system.memory.total
          units: B
          description: 'QNAP SystemTotalMemEX in bytes.'
          tags:
            - tag: Application
              value: Memory
            - tag: Application
              value: 'QNAP System'
            - tag: Application
              value: 'System Health'
        - uuid: 97faa0ea9698461a901c9ca7a7444ae3
          name: 'Used Physical Memory'
          type: CALCULATED
          key: qnap.system.memory.used
          units: B
          params: last(//qnap.system.memory.total)-last(//qnap.system.memory.free)
          description: 'Calculated used memory.'
          tags:
            - tag: Application
              value: Memory
            - tag: Application
              value: 'QNAP System'
            - tag: Application
              value: 'System Health'
        - uuid: b86dfe942d594807891e784dff4a02ed
          name: 'Memory Utilization'
          type: CALCULATED
          key: qnap.system.memory.util
          value_type: FLOAT
          units: '%'
          params: 'last(//qnap.system.memory.used)/last(//qnap.system.memory.total)*100'
          description: 'Calculated memory utilization.'
          tags:
            - tag: Application
              value: Memory
            - tag: Application
              value: 'QNAP System'
            - tag: Application
              value: 'System Health'
          triggers:
            - uuid: 09733c56eadd43cebf292e651c52ca97
              expression: 'avg(/QNAP QTS by SNMP/qnap.system.memory.util,5m)>{$MEMORY.UTIL.WARN}'
              name: 'Memory utilization is high on {HOST.NAME}'
              opdata: 'Memory: {ITEM.LASTVALUE1}'
              priority: WARNING
              tags:
                - tag: scope
                  value: performance
        - uuid: 44faf0b9b6024d8db89e047d67e65d9f
          name: 'Model Name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.24681.1.3.12.0
          key: qnap.system.model
          value_type: TEXT
          description: 'QNAP model name.'
          inventory_link: MODEL
          tags:
            - tag: Application
              value: 'QNAP System'
            - tag: Application
              value: 'System Information'
        - uuid: 17c505ccd0cb4d1ba05c2078ab60cf7c
          name: 'System Name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: qnap.system.name
          value_type: TEXT
          description: 'SNMP system name.'
          tags:
            - tag: Application
              value: 'QNAP System'
            - tag: Application
              value: 'System Information'
        - uuid: 119e25c90d974424a9194dd562024bee
          name: 'Serial number'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.47.1.1.1.1.11.1
          key: qnap.system.serial
          delay: 1h
          value_type: TEXT
          inventory_link: SERIALNO_A
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return String(value).trim();'
          tags:
            - tag: Application
              value: System
        - uuid: ad459af16fca47d287ccddcfe8d0e532
          name: 'Software version'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.47.1.1.1.1.10.1
          key: qnap.system.software.version
          delay: 1h
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return String(value).trim();'
          tags:
            - tag: Application
              value: System
        - uuid: 5b3c4002ff2f42679c462b7a3a5982a3
          name: 'System Temperature'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.24681.1.4.1.1.1.1.1.2.1.7.1
          key: qnap.system.temperature
          units: °C
          description: 'System temperature from QNAP Storage Manager system table.'
          tags:
            - tag: Application
              value: 'QNAP System'
            - tag: Application
              value: 'System Health'
          triggers:
            - uuid: e6842e061cfc4aa29f41167cec13466b
              expression: 'avg(/QNAP QTS by SNMP/qnap.system.temperature,#4)>{$SYSTEM.TEMP.HIGH}'
              name: 'System temperature is critical on {HOST.NAME}'
              opdata: 'System temp: {ITEM.LASTVALUE1}'
              priority: HIGH
              tags:
                - tag: scope
                  value: temperature
            - uuid: b7818b0e84ad47b6aeddf54e48096038
              expression: 'avg(/QNAP QTS by SNMP/qnap.system.temperature,#4)>{$SYSTEM.TEMP.AVG}'
              name: 'System temperature is high on {HOST.NAME}'
              opdata: 'System temp: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              dependencies:
                - name: 'System temperature is critical on {HOST.NAME}'
                  expression: 'avg(/QNAP QTS by SNMP/qnap.system.temperature,#4)>{$SYSTEM.TEMP.HIGH}'
              tags:
                - tag: scope
                  value: temperature
        - uuid: c1bcf8c79a464f08a0d5f78ab2b0d7bb
          name: Uptime
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.24681.1.3.4.0
          key: qnap.system.uptime
          units: uptime
          description: 'QNAP system uptime in seconds after TimeTicks conversion.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: Application
              value: 'QNAP System'
            - tag: Application
              value: Status
          triggers:
            - uuid: becfbfe1a619474b885b331fdd8671a8
              expression: 'last(/QNAP QTS by SNMP/qnap.system.uptime)<10m'
              name: '{HOST.NAME} has been restarted'
              priority: INFO
              description: 'System uptime is below 10 minutes.'
              tags:
                - tag: scope
                  value: notice
        - uuid: d5ccd094b1e74df5bb5f4817bed632e9
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          history: 7d
          valuemap:
            name: zabbix.host.available
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: network
            - tag: component
              value: system
          triggers:
            - uuid: 9000e31215a64df79dfd4156db812d3f
              expression: 'max(/QNAP QTS by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'SNMP is unavailable on {HOST.NAME}'
              priority: AVERAGE
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/QNAP QTS by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: e2974e176692403b940e2942ff13403f
          name: 'QNAP Network Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFHIGHSPEED},1.3.6.1.2.1.31.1.1.1.15]'
          key: ifMIB.ifMIBObjects.ifXTable.ifXEntry
          delay: 1h
          filter:
            evaltype: FORMULA
            formula: 'A or (B and (C or D))'
            conditions:
              - macro: '{#IFNAME}'
                value: '^eth[0-9]+$'
                formulaid: A
              - macro: '{#IFNAME}'
                value: '^bond[0-9]+$'
                formulaid: B
              - macro: '{#IFHIGHSPEED}'
                value: '^[1-9][0-9]*$'
                formulaid: C
              - macro: '{#IFADMINSTATUS}'
                value: ^1$
                formulaid: D
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovers physical QNAP interfaces.'
          item_prototypes:
            - uuid: 5fb0e27ad4c64d1d817edc59472adffe
              name: 'Interface {#IFNAME}: Inbound discards'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
              key: 'ifMIB.ifMIBObjects.ifTable.ifEntry.ifInDiscards.[{#IFNAME}]'
              value_type: FLOAT
              units: discards/s
              description: 'The rate of inbound packets discarded even though no errors were detected.'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: Network
                - tag: Interface
                  value: '[{#IFNAME}]'
            - uuid: 1667478a8d9947539a83b1ab54fac06f
              name: 'Interface {#IFNAME}: Inbound errors'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
              key: 'ifMIB.ifMIBObjects.ifTable.ifEntry.ifInErrors.[{#IFNAME}]'
              value_type: FLOAT
              units: errors/s
              description: 'The rate of inbound packets that could not be delivered due to errors.'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: Network
                - tag: Interface
                  value: '[{#IFNAME}]'
            - uuid: ef031d5309ce4ad69a597c2838f30b82
              name: 'Interface {#IFNAME}: Operational status'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'ifMIB.ifMIBObjects.ifTable.ifEntry.ifOperStatus.[{#IFNAME}]'
              description: 'The current operational state of the network interface.'
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              tags:
                - tag: Application
                  value: Network
                - tag: Interface
                  value: '[{#IFNAME}]'
            - uuid: 9f65cfe0fc904ceba528280e31946b1b
              name: 'Interface {#IFNAME}: Outbound discards'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}'
              key: 'ifMIB.ifMIBObjects.ifTable.ifEntry.ifOutDiscards.[{#IFNAME}]'
              value_type: FLOAT
              units: discards/s
              description: 'The rate of outbound packets discarded even though no errors were detected.'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: Network
                - tag: Interface
                  value: '[{#IFNAME}]'
            - uuid: a1c77ec6254c4fabad38fb95fb9e9850
              name: 'Interface {#IFNAME}: Outbound errors'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
              key: 'ifMIB.ifMIBObjects.ifTable.ifEntry.ifOutErrors.[{#IFNAME}]'
              value_type: FLOAT
              units: errors/s
              description: 'The rate of outbound packets that could not be transmitted due to errors.'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: Application
                  value: Network
                - tag: Interface
                  value: '[{#IFNAME}]'
            - uuid: fae9c63de4644dff8f8fe40987341f32
              name: 'Interface {#IFNAME}: Incoming traffic'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'ifMIB.ifMIBObjects.ifXTable.ifXEntry.ifHCInOctets.[{#IFNAME}]'
              value_type: FLOAT
              units: bps
              description: 'The total number of octets received on the interface.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: Network
                - tag: Interface
                  value: '[{#IFNAME}]'
            - uuid: e6e3703bf2b04251ad76d44ffc251fc3
              name: 'Interface {#IFNAME}: Outgoing traffic'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'ifMIB.ifMIBObjects.ifXTable.ifXEntry.ifHCOutOctets.[{#IFNAME}]'
              value_type: FLOAT
              units: bps
              description: 'The total number of octets transmitted out of the interface.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: Network
                - tag: Interface
                  value: '[{#IFNAME}]'
