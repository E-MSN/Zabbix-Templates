                  dependencies:
                    - name: '{#QNAP_HD_DESCR}: temperature is critical'
                      expression: 'avg(/QNAP QTS by SNMP/qnap.internal.disk.temperature[{#QNAP_DISK_INDEX}],#4)>{$DISK.TEMP.HIGH}'
                  tags:
                    - tag: scope
                      value: temperature
          graph_prototypes:
            - uuid: 5e1ddc6785704f048f5f970a67b21795
              name: 'Disk {#QNAP_HD_DESCR}: Temperature'
              show_work_period: 'NO'
              show_triggers: 'NO'
              graph_items:
                - drawtype: BOLD_LINE
                  color: C62828
                  calc_fnc: ALL
                  item:
                    host: 'QNAP QTS by SNMP'
                    key: 'qnap.internal.disk.temperature[{#QNAP_DISK_INDEX}]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var rows = JSON.parse(value);
                  var out = [];
                  for (var i = 0; i < rows.length; i++) {
                      var r = rows[i];
                      var hasDiskIndex = Object.prototype.hasOwnProperty.call(r, "{#QNAP_DISK_INDEX}") && String(r["{#QNAP_DISK_INDEX}"]).trim() !== "";
                      var hasLocation = Object.prototype.hasOwnProperty.call(r, "{#QNAP_DISK_LOCATION}") && String(r["{#QNAP_DISK_LOCATION}"]).trim() !== "";
                      var hasModel = Object.prototype.hasOwnProperty.call(r, "{#QNAP_DISK_MODEL}") && String(r["{#QNAP_DISK_MODEL}"]).trim() !== "";
                      var hasHealth =  Object.prototype.hasOwnProperty.call(r, "{#QNAP_DISK_HEALTH_TEXT}") && String(r["{#QNAP_DISK_HEALTH_TEXT}"]).trim() !== "";
                      if (!hasDiskIndex) {
                          continue;
                      }
                      if (!hasLocation && !hasModel && !hasHealth) {
                          continue;
                      }
                      if (!hasLocation) {
                          r["{#QNAP_DISK_LOCATION}"] = "0";
                      }
                      out.push(r);
                  }
                  return JSON.stringify(out);
