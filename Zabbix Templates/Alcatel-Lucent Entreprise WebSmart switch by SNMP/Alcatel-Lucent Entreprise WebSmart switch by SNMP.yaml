        - uuid: d00057e77d664ba3b1868c35f7af9fad
          name: 'FASTPATH PoE electrical metrics discovery'
          type: DEPENDENT
          key: poe.fastpath.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#POEFASTPATH.PORT}'
                value: '{$POE.PORT.MATCHES}'
          description: |
            OS2220-only dependent discovery for Broadcom FASTPATH PoE electrical metrics.
            Discovers per-port current and voltage; power metrics are handled by the unified PoE power discovery.
          item_prototypes:
            - uuid: 6a21edd6db254b0284222e1289547856
              name: 'PoE port {#POEFASTPATH.PORT}: Current'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.4413.1.1.15.1.1.1.3.1.{#POEFASTPATH.PORT}'
              key: 'poe.port.current.ma[fastpath.{#POEFASTPATH.PORT}]'
              history: 7d
              value_type: FLOAT
              units: mA
              tags:
                - tag: component
                  value: poe
                - tag: poe_port
                  value: '{#POEFASTPATH.PORT}'
            - uuid: c161c66639754586b504c099b3d45e86
              name: 'PoE port {#POEFASTPATH.PORT}: Voltage'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.4413.1.1.15.1.1.1.4.1.{#POEFASTPATH.PORT}'
              key: 'poe.port.voltage.v[fastpath.{#POEFASTPATH.PORT}]'
              history: 7d
              value_type: FLOAT
              units: V
              tags:
                - tag: component
                  value: poe
                - tag: poe_port
                  value: '{#POEFASTPATH.PORT}'
          master_item:
            key: poe.port.power.walk
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var s = String(value || '');
                  var data = [];
                  var seen = {};
                  var re = /(?:iso\.|\.?1\.)3\.6\.1\.4\.1\.4413\.1\.1\.15\.1\.1\.1\.2\.1\.(\d+)\s*=/gi;
                  var m;
                  while ((m = re.exec(s)) !== null) {
                      var port = String(Number(m[1]));
                      if (!seen[port]) {
                          seen[port] = true;
                          data.push({
                              '{#SNMPINDEX}': port,
                              '{#POEFASTPATH.PORT}': port
                          });
                      }
                  }
                  return JSON.stringify({data: data});
