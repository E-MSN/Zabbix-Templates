zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: c93a5775ebb54d89a310009157116987
      template: 'Alcatel-Lucent Entreprise WebSmart switch by SNMP'
      name: 'Alcatel-Lucent Entreprise WebSmart switch by SNMP'
      description: 'SNMP template for Alcatel-Lucent Enterprise WebSmart switches.'
      vendor:
        name: E-MSN
        version: 7.4-11
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: e50f406d7533421b8aa0df0d33024161
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          history: 7d
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: icmp
          triggers:
            - uuid: 8adb1da51c1b448485e991400d5f5116
              expression: 'max(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/icmpping,#3)=0'
              name: 'Unavailable by ICMP ping'
              priority: HIGH
              tags:
                - tag: component
                  value: icmp
                - tag: scope
                  value: availability
        - uuid: f40ecb6d132f432981b7bea91e05afd2
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          history: 7d
          units: '%'
          tags:
            - tag: component
              value: icmp
          triggers:
            - uuid: 16afe9dc050c4dfa891de459c66db339
              expression: 'min(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/icmppingloss,5m)<100'
              name: 'High ICMP ping loss'
              priority: WARNING
              tags:
                - tag: component
                  value: icmp
                - tag: scope
                  value: availability
        - uuid: 8fbe0a40255948d5b0ba089a42ded1f2
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          history: 7d
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: icmp
          triggers:
            - uuid: 5b3462300bc7473e997355fc6ec2d4bf
              expression: 'avg(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'High ICMP ping response time'
              priority: WARNING
              tags:
                - tag: component
                  value: icmp
                - tag: scope
                  value: performance
        - uuid: d2930667af2c43b4865eb3e6fbc276de
          name: 'PoE: Power budget'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.105.1.3.1.1.2.1
          key: poe.budget.w
          history: 7d
          units: W
          description: 'POWER-ETHERNET-MIB::pethMainPsePower. Total PoE budget.'
          tags:
            - tag: component
              value: poe
        - uuid: 57e8cf855a3c4d049827f03bc99a4e6f
          name: 'PoE: Power consumption'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.105.1.3.1.1.4.1,1.3.6.1.4.1.4413.1.1.15.1.1.1.2.1,1.3.6.1.4.1.6486.803.1.2.1.27.1.1.1.1.2.1]'
          key: poe.consumption.w
          history: 7d
          value_type: FLOAT
          units: W
          description: 'Total PoE port load in watts. Uses the per-port actual-power table on OS2220/OS2260 and falls back to POWER-ETHERNET-MIB::pethMainPseConsumptionPower when no supported per-port table is available.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var s = String(value || '');
                  var m;
                  var sum = 0;
                  var count = 0;
                  // OS2220 Broadcom FASTPATH actual per-port power, raw value in mW.
                  var re = /(?:iso\.|\.?1\.)3\.6\.1\.4\.1\.4413\.1\.1\.15\.1\.1\.1\.2\.1\.\d+\s*=\s*(?:Gauge32|INTEGER|Unsigned32):\s*(-?[0-9]+(?:\.[0-9]+)?)/gi;
                  while ((m = re.exec(s)) !== null) {
                      sum += Number(m[1]);
                      count++;
                  }
                  if (count > 0) {
                      return sum * 0.001;
                  }
                  // OS2260 ALE actual per-port power, raw value in mW.
                  sum = 0;
                  count = 0;
                  re = /(?:iso\.|\.?1\.)3\.6\.1\.4\.1\.6486\.803\.1\.2\.1\.27\.1\.1\.1\.1\.2\.1\.\d+\s*=\s*(?:Gauge32|INTEGER|Unsigned32):\s*(-?[0-9]+(?:\.[0-9]+)?)/gi;
                  while ((m = re.exec(s)) !== null) {
                      sum += Number(m[1]);
                      count++;
                  }
                  if (count > 0) {
                      return sum * 0.001;
                  }
                  // Generic fallback: standard POWER-ETHERNET-MIB value is defined in watts.
                  m = s.match(/(?:iso\.|\.?1\.)3\.6\.1\.2\.1\.105\.1\.3\.1\.1\.4\.1\s*=\s*(?:Gauge32|INTEGER|Unsigned32):\s*(-?[0-9]+(?:\.[0-9]+)?)/i);
                  if (m) {
                      return Number(m[1]);
                  }
                  throw 'PoE consumption value not found';
          tags:
            - tag: component
              value: poe
        - uuid: 9cc5906f438c45af8d92ebe43a775bec
          name: 'PoE: Firmware version'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.105.1.3.1.1.6.1,1.3.6.1.4.1.6486.803.1.2.1.27.1.1.2.1.11.1]'
          key: poe.firmware.version
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var s = String(value || '');
                  var m = s.match(/(?:iso\.3\.6\.1\.2\.1\.105\.1\.3\.1\.1\.6\.1|\.?1\.3\.6\.1\.2\.1\.105\.1\.3\.1\.1\.6\.1)\s*=\s*STRING:\s*"([^"]+)"/i);
                  if (m && m[1].trim() !== '') {
                      return m[1].trim();
                  }
                  m = s.match(/(?:iso\.3\.6\.1\.4\.1\.6486\.803\.1\.2\.1\.27\.1\.1\.2\.1\.11\.1|\.?1\.3\.6\.1\.4\.1\.6486\.803\.1\.2\.1\.27\.1\.1\.2\.1\.11\.1)\s*=\s*STRING:\s*"([^"]+)"/i);
                  if (m && m[1].trim() !== '') {
                      return m[1].trim();
                  }
                  throw 'PoE firmware version not found';
          tags:
            - tag: component
              value: poe
        - uuid: 28d2cf038616497796191fb584a93f28
          name: 'PoE: Main operational status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.105.1.3.1.1.3.1
          key: poe.main.status
          history: 7d
          valuemap:
            name: 'PoE main PSE status'
          tags:
            - tag: component
              value: poe
          triggers:
            - uuid: edcb5292c35448d1b9b5d5ef9dffab22
              expression: 'last(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/poe.main.status)<>1'
              name: 'PoE main PSE is not on'
              priority: AVERAGE
              tags:
                - tag: component
                  value: poe
                - tag: scope
                  value: availability
        - uuid: 1193ca437a6c4e8fbf21a4c027ab5b09
          name: 'PoE: Per-port power table'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.4413.1.1.15.1.1.1.2.1,1.3.6.1.4.1.6486.803.1.2.1.27.1.1.1.1.2.1]'
          key: poe.port.power.walk
          delay: 1h
          history: '0'
          value_type: TEXT
          description: 'Raw per-port PoE power table used as the master item for dynamic PoE discovery. Only ports actually exposed by SNMP are discovered.'
          tags:
            - tag: component
              value: poe
        - uuid: 3f329280975345baad17b657540bba60
          name: 'PoE: Usage threshold'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.105.1.3.1.1.5.1
          key: poe.threshold.percent
          history: 7d
          units: '%'
          tags:
            - tag: component
              value: poe
        - uuid: 458c8cc7786a44e48de3b18430d3d2e4
          name: 'PoE: Power utilization'
          type: CALCULATED
          key: poe.utilization.percent
          history: 7d
          value_type: FLOAT
          units: '%'
          params: '100*last(//poe.consumption.w)/last(//poe.budget.w)'
          tags:
            - tag: component
              value: poe
          triggers:
            - uuid: 675d720b0361479083a434c38b22d61d
              expression: 'avg(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/poe.utilization.percent,5m)>{$POE.UTIL.HIGH}'
              name: 'PoE power utilization is high'
              priority: AVERAGE
              tags:
                - tag: component
                  value: poe
                - tag: scope
                  value: capacity
            - uuid: 798a6f61fb6b408ba3bd074a915f8af3
              expression: 'avg(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/poe.utilization.percent,5m)>{$POE.UTIL.WARN}'
              name: 'PoE power utilization is warning'
              priority: WARNING
              dependencies:
                - name: 'PoE power utilization is high'
                  expression: 'avg(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/poe.utilization.percent,5m)>{$POE.UTIL.HIGH}'
              tags:
                - tag: component
                  value: poe
                - tag: scope
                  value: capacity
        - uuid: bf499ee5c13046ec9f2982c0e1c7bb31
          name: 'System contact'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.4.0
          key: 'system.contact[sysContact.0]'
          history: 7d
          value_type: CHAR
          tags:
            - tag: component
              value: system
        - uuid: 5319fd2707a54bd0bab487846d8f1436
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: 'system.descr[sysDescr.0]'
          history: 7d
          value_type: TEXT
          description: 'SNMP sysDescr. Contains model, firmware, Linux version and serial on OS22xx WebSmart switches.'
          tags:
            - tag: component
              value: system
        - uuid: 562ccde80f324326867699bb4541cf12
          name: 'Hardware model'
          type: DEPENDENT
          key: system.hw.model
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var s = String(value || '').trim();
                  var m = s.match(/^([^:]+):/);
                  if (m) {
                      return m[1].trim();
                  }
                  m = s.match(/\b(OS[0-9]{4}(?:-[A-Za-z0-9]+)?)\b/);
                  if (m) {
                      return m[1].trim();
                  }
                  return s;
          master_item:
            key: 'system.descr[sysDescr.0]'
          tags:
            - tag: component
              value: inventory
        - uuid: 45a1481f54f4491199212d9bc7fd45c6
          name: 'Serial number'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.1.1.0,1.3.6.1.2.1.47.1.1.1.1.11]'
          key: system.hw.serialnumber
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var s = String(value || '');
                  // OS2220: serial embedded in sysDescr.
                  var m = s.match(/Serial\s*:\s*([^,"\r\n]+)/i);
                  if (m && m[1].trim() !== '') {
                      return m[1].trim();
                  }
                  // OS2260: prefer the chassis entry at ENTITY-MIB index 209.
                  m = s.match(/(?:iso\.|\.?1\.)3\.6\.1\.2\.1\.47\.1\.1\.1\.1\.11\.209\s*=\s*STRING:\s*"?([^"\r\n]+)"?/i);
                  if (m) {
                      var sn = m[1].trim();
                      if (sn !== '' && sn !== 'N/A') {
                          return sn;
                      }
                  }
                  // Generic fallback: first non-empty ENTITY-MIB serial.
                  var re = /(?:iso\.|\.?1\.)3\.6\.1\.2\.1\.47\.1\.1\.1\.1\.11\.\d+\s*=\s*STRING:\s*"?([^"\r\n]+)"?/gi;
                  while ((m = re.exec(s)) !== null) {
                      var sn = m[1].trim();
                      if (sn !== '' && sn !== 'N/A') {
                          return sn;
                      }
                  }
                  throw 'No serial number found';
            - type: DISCARD_UNCHANGED
          tags:
            - tag: component
              value: inventory
          triggers:
            - uuid: 9d26a88931df44adb8245d7f88b4f0d7
              expression: 'change(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/system.hw.serialnumber)<>0 and length(last(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/system.hw.serialnumber))>0'
              name: 'Serial number has changed'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: component
                  value: inventory
                - tag: scope
                  value: notice
        - uuid: 753a609b04264ca29107e315d6946410
          name: 'System location'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.6.0
          key: 'system.location[sysLocation.0]'
          history: 7d
          value_type: CHAR
          tags:
            - tag: component
              value: system
        - uuid: 1d2850124f774ecbba2582f69dff2928
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: 'system.name[sysName.0]'
          history: 7d
          value_type: CHAR
          tags:
            - tag: component
              value: system
        - uuid: 34d5948cc76a4c47abbf171ee74fd769
          name: 'System object ID'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.2.0
          key: 'system.objectid[sysObjectID.0]'
          history: 7d
          value_type: CHAR
          description: |
            Expected ALE WebSmart sysObjectID branches: 
            - OS2220 1.3.6.1.4.1.6486.800.1.1.2.2.10.*
            - OS2260 1.3.6.1.4.1.6486.803.1.1.2.1.1.1.2.*
          tags:
            - tag: component
              value: system
        - uuid: 8b406fa0ab9d421cafd5329de24f2aa0
          name: 'Firmware version'
          type: DEPENDENT
          key: system.sw.version
          history: 7d
          value_type: CHAR
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var s = String(value || '').trim();
                  var m = s.match(/WebSmart,\s*([^,]+)/);
                  if (m) {
                      return m[1].trim();
                  }
                  m = s.match(/\bOS[0-9]{4}(?:-[A-Za-z0-9]+)?\s+([^,]+)/);
                  if (m) {
                      return m[1].trim();
                  }
                  return s;
          master_item:
            key: 'system.descr[sysDescr.0]'
          tags:
            - tag: component
              value: inventory
          triggers:
            - uuid: 6e120e3721fa4550b02f3261e04e66a0
              expression: 'change(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/system.sw.version)<>0 and length(last(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/system.sw.version))>0'
              name: 'Firmware version has changed'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: component
                  value: inventory
                - tag: scope
                  value: notice
        - uuid: 54784a3ad2054a3198d700f4c75a231d
          name: 'System uptime'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: 'system.uptime[sysUpTime.0]'
          history: 7d
          units: uptime
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 8da1995124174d9f83a3795b9801dd87
              expression: 'last(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/system.uptime[sysUpTime.0])<10m'
              name: 'Device has been restarted'
              priority: INFO
              tags:
                - tag: component
                  value: system
                - tag: scope
                  value: notice
        - uuid: 6d78f85a2c0142b1a9905a2340ac01fb
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          history: 7d
          trends: '0'
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: status
          triggers:
            - uuid: 203a43c2d86b4f0c8ba8e03e7d9bd1ab
              expression: 'max(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'No SNMP data collection'
              priority: AVERAGE
              dependencies:
                - name: 'Unavailable by ICMP ping'
                  expression: 'max(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/icmpping,#3)=0'
              tags:
                - tag: component
                  value: snmp
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: a5a7d703ec444c0481d573aebc7e932c
          name: 'LLDP neighbors discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#LLDP.CHASSIS.SUBTYPE},1.0.8802.1.1.2.1.4.1.1.4,{#LLDP.PORT.ID.SUBTYPE},1.0.8802.1.1.2.1.4.1.1.6]'
          key: lldp.rem.discovery
          delay: 1h
          description: 'Discovers LLDP remote systems from LLDP-MIB.'
          item_prototypes:
            - uuid: 14e25bc14a2b42dfaad5f1714fb082bb
              name: 'LLDP local port {#LLDP.LOCAL.PORT} remote {#LLDP.REM.INDEX}: Chassis ID'
              type: SNMP_AGENT
              snmp_oid: '1.0.8802.1.1.2.1.4.1.1.5.{#SNMPINDEX}'
              key: 'lldp.rem.chassis.id[lldpRemChassisId.{#SNMPINDEX}]'
              history: 7d
              value_type: CHAR
              tags:
                - tag: component
                  value: lldp
                - tag: local_port
                  value: '{#LLDP.LOCAL.PORT}'
            - uuid: 9a73cb44796d447bb54ab0be7edd224f
              name: 'LLDP local port {#LLDP.LOCAL.PORT} remote {#LLDP.REM.INDEX}: Port description'
              type: SNMP_AGENT
              snmp_oid: '1.0.8802.1.1.2.1.4.1.1.8.{#SNMPINDEX}'
              key: 'lldp.rem.port.desc[lldpRemPortDesc.{#SNMPINDEX}]'
              history: 7d
              value_type: CHAR
              tags:
                - tag: component
                  value: lldp
                - tag: local_port
                  value: '{#LLDP.LOCAL.PORT}'
            - uuid: 7a6ec2b754a54c68b17f392f3c703a3f
              name: 'LLDP local port {#LLDP.LOCAL.PORT} remote {#LLDP.REM.INDEX}: Port ID'
              type: SNMP_AGENT
              snmp_oid: '1.0.8802.1.1.2.1.4.1.1.7.{#SNMPINDEX}'
              key: 'lldp.rem.port.id[lldpRemPortId.{#SNMPINDEX}]'
              history: 7d
              value_type: CHAR
              tags:
                - tag: component
                  value: lldp
                - tag: local_port
                  value: '{#LLDP.LOCAL.PORT}'
            - uuid: 9c76cacb410e43709f8425f2eb2303bf
              name: 'LLDP local port {#LLDP.LOCAL.PORT} remote {#LLDP.REM.INDEX}: System description'
              type: SNMP_AGENT
              snmp_oid: '1.0.8802.1.1.2.1.4.1.1.10.{#SNMPINDEX}'
              key: 'lldp.rem.sys.desc[lldpRemSysDesc.{#SNMPINDEX}]'
              history: 7d
              value_type: TEXT
              tags:
                - tag: component
                  value: lldp
                - tag: local_port
                  value: '{#LLDP.LOCAL.PORT}'
            - uuid: 901343d1c6ae429da1d7633eb79e83d7
              name: 'LLDP local port {#LLDP.LOCAL.PORT} remote {#LLDP.REM.INDEX}: System name'
              type: SNMP_AGENT
              snmp_oid: '1.0.8802.1.1.2.1.4.1.1.9.{#SNMPINDEX}'
              key: 'lldp.rem.sys.name[lldpRemSysName.{#SNMPINDEX}]'
              history: 7d
              value_type: CHAR
              tags:
                - tag: component
                  value: lldp
                - tag: local_port
                  value: '{#LLDP.LOCAL.PORT}'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);
                  var data = Array.isArray(obj) ? obj : obj.data;
                  for (var i = 0; i < data.length; i++) {
                      var idx = String(data[i]['{#SNMPINDEX}'] || '');
                      var parts = idx.split('.');
                      data[i]['{#LLDP.TIME.MARK}'] = parts.length >= 3 ? parts[0] : '';
                      data[i]['{#LLDP.LOCAL.PORT}'] = parts.length >= 3 ? parts[1] : idx;
                      data[i]['{#LLDP.REM.INDEX}'] = parts.length >= 3 ? parts[2] : '1';
                  }
                  return JSON.stringify(Array.isArray(obj) ? data : {data: data});
        - uuid: c995ebb0fa8d45b1ada14098ae825a0a
          name: 'Network interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]'
          key: net.if.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.MATCHES}'
          description: |
            Discovers physical ports from IF-MIB/ifXTable.
            CPU, management and loopback interfaces are excluded by default.
          item_prototypes:
            - uuid: 4ebfbee758d64f84a53c23be75fced82
              name: 'Interface {#IFNAME}: Alias'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.18.{#SNMPINDEX}'
              key: 'net.if.alias[ifAlias.{#SNMPINDEX}]'
              history: 7d
              value_type: CHAR
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: be6f17f5186a4e729281675da7f54c71
              name: 'Interface {#IFNAME}: Description'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.2.{#SNMPINDEX}'
              key: 'net.if.descr[ifDescr.{#SNMPINDEX}]'
              history: 7d
              value_type: CHAR
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 46ca7c8d9d494e45809d2fcbecf1c734
              name: 'Interface {#IFNAME}: Inbound discards'
              type: SNMP_AGENT
