        - uuid: d7552eeb999243798277118f6f259b5f
          name: 'PoE power metrics discovery'
          type: DEPENDENT
          key: poe.power.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#POE.PORT}'
                value: '{$POE.PORT.MATCHES}'
          description: |
            Unified per-port PoE power discovery for OS2220 and OS2260 WebSmart switches.
            OS2220 uses the Broadcom FASTPATH enterprise MIB
            OS2260 uses the ALE enterprise MIB.
            
            Both expose per-port power values in mW, normalized to watts by the item prototypes.
          item_prototypes:
            - uuid: e8e2c2ce734142b49256f574d5998d4b
              name: 'PoE port {#POE.PORT}: Power consumption'
              type: SNMP_AGENT
              snmp_oid: '{#POE.POWER.OID}'
              key: 'poe.port.power.consumption.w[{#POE.PORT}]'
              history: 7d
              value_type: FLOAT
              units: W
              description: 'Per-port PoE power consumption. Source OID is selected by discovery according to the switch model; raw value is returned in mW.'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              tags:
                - tag: component
                  value: poe
                - tag: poe_port
                  value: '{#POE.PORT}'
              trigger_prototypes:
                - uuid: 25b2b39d5dc248289c06f4aaea3340aa
                  expression: 'avg(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/poe.port.power.consumption.w[{#POE.PORT}],5m)>{$POE.PORT.POWER.WARN:"{#POE.PORT}"}'
                  name: 'PoE port {#POE.PORT}: High power consumption'
                  priority: WARNING
                  tags:
                    - tag: component
                      value: poe
                    - tag: poe_port
                      value: '{#POE.PORT}'
                    - tag: scope
                      value: capacity
            - uuid: 1c99749dc8c64fe4b05cbfbf50e2a666
              name: 'PoE port {#POE.PORT}: Power limit'
              type: SNMP_AGENT
              snmp_oid: '{#POE.LIMIT.OID}'
              key: 'poe.port.power.limit.w[{#POE.PORT}]'
              history: 7d
              value_type: FLOAT
              units: W
              description: 'Per-port PoE power limit. Source OID is selected by discovery according to the switch model; raw value is returned in mW.'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              tags:
                - tag: component
                  value: poe
                - tag: poe_port
                  value: '{#POE.PORT}'
          graph_prototypes:
            - uuid: 9240aa5d31ef44799a28882267a5ddc7
              name: 'PoE port {#POE.PORT}: Power'
              graph_items:
                - color: 199C0D
                  item:
                    host: 'Alcatel-Lucent Entreprise WebSmart switch by SNMP'
                    key: 'poe.port.power.consumption.w[{#POE.PORT}]'
                - sortorder: '1'
                  color: F63100
                  item:
                    host: 'Alcatel-Lucent Entreprise WebSmart switch by SNMP'
                    key: 'poe.port.power.limit.w[{#POE.PORT}]'
          master_item:
            key: poe.port.power.walk
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var s = String(value || '');
                  var data = [];
                  var seen = {};
                  var m;
                  var port;
                  // OS2220 / Broadcom FASTPATH: discover only rows actually exposed by SNMP.
                  var re = /(?:iso\.|\.?1\.)3\.6\.1\.4\.1\.4413\.1\.1\.15\.1\.1\.1\.2\.1\.(\d+)\s*=/gi;
                  while ((m = re.exec(s)) !== null) {
                      port = String(Number(m[1]));
                      if (!seen[port]) {
                          seen[port] = true;
                          data.push({
                              '{#SNMPINDEX}': port,
                              '{#POE.PORT}': port,
                              '{#POE.POWER.OID}': '1.3.6.1.4.1.4413.1.1.15.1.1.1.2.1.' + port,
                              '{#POE.LIMIT.OID}': '1.3.6.1.4.1.4413.1.1.15.1.1.1.1.1.' + port
                          });
                      }
                  }
                  // OS2260 / ALE: discover only rows actually exposed by SNMP.
                  re = /(?:iso\.|\.?1\.)3\.6\.1\.4\.1\.6486\.803\.1\.2\.1\.27\.1\.1\.1\.1\.2\.1\.(\d+)\s*=/gi;
                  while ((m = re.exec(s)) !== null) {
                      port = String(Number(m[1]));
                      if (!seen[port]) {
                          seen[port] = true;
                          data.push({
                              '{#SNMPINDEX}': port,
                              '{#POE.PORT}': port,
                              '{#POE.POWER.OID}': '1.3.6.1.4.1.6486.803.1.2.1.27.1.1.1.1.2.1.' + port,
                              '{#POE.LIMIT.OID}': '1.3.6.1.4.1.6486.803.1.2.1.27.1.1.1.1.1.1.' + port
                          });
                      }
                  }
                  return JSON.stringify({data: data});
        - uuid: 3699fffea376426b89bd93d9c5885335
          name: 'System resources discovery'
          type: DEPENDENT
          key: system.resources.discovery
          description: |
            Discovery for CPU, RAM and flash metrics.
            Returns no rows on OS2220, so the resource items are not created on that family.
          item_prototypes:
            - uuid: 4e8f1e12fa0f4d29a86e9bedd01fa292
              name: 'CPU utilization'
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.4.1.6486.803.1.2.1.16.1.1.1.1.1.14.0
              key: 'system.cpu.util[{#RESOURCE.MODEL}]'
              history: 7d
              units: '%'
              description: 'Current CPU utilization from the ALE health monitoring MIB.'
              tags:
                - tag: component
                  value: cpu
              trigger_prototypes:
                - uuid: 51ab80dfb0da4f6ab5d4901f9cd88001
                  expression: 'min(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/system.cpu.util[{#RESOURCE.MODEL}],5m)>{$CPU.UTIL.WARN}'
                  name: 'High CPU utilization'
                  priority: WARNING
                  description: 'CPU utilization has remained above {$CPU.UTIL.WARN}% for 5 minutes.'
                  tags:
                    - tag: component
                      value: cpu
                    - tag: scope
                      value: performance
            - uuid: 4d90ac8ed69e46e68b6e6a90238d7aaf
              name: 'Flash free'
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.4.1.6486.803.1.1.1.3.1.1.8.1.2.1
              key: 'system.flash.free[{#RESOURCE.MODEL}]'
              history: 7d
              units: B
              description: 'Free flash file-system space in bytes.'
              tags:
                - tag: component
                  value: storage
            - uuid: 36e8a04c0c0d4fdfa98785186addae6e
              name: 'Flash total'
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.4.1.6486.803.1.1.1.3.1.1.8.1.3.1
              key: 'system.flash.total[{#RESOURCE.MODEL}]'
              history: 7d
              units: B
              description: 'Total flash file-system size in bytes.'
              tags:
                - tag: component
                  value: storage
            - uuid: c1d5888a0472473288bd40675bb46104
              name: 'Flash utilization'
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.4.1.6486.803.1.1.1.3.1.1.9.1.4.1
              key: 'system.flash.util[{#RESOURCE.MODEL}]'
              history: 7d
              units: '%'
              description: 'Percentage of flash storage currently used.'
              tags:
                - tag: component
                  value: storage
              trigger_prototypes:
                - uuid: 2a8f17881eb6436bafe5a866f45d9f6b
                  expression: 'last(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/system.flash.util[{#RESOURCE.MODEL}])>{$FLASH.UTIL.WARN}'
                  name: 'High flash utilization'
                  priority: WARNING
                  description: 'Flash utilization is above {$FLASH.UTIL.WARN}%.'
                  tags:
                    - tag: component
                      value: storage
                    - tag: scope
                      value: capacity
            - uuid: e9f781208ba240d2a55c843f632f2d26
              name: 'Memory utilization'
              type: SNMP_AGENT
              snmp_oid: 1.3.6.1.4.1.6486.803.1.2.1.16.1.1.1.1.1.10.0
              key: 'system.memory.util[{#RESOURCE.MODEL}]'
              history: 7d
              units: '%'
              description: 'Current RAM utilization from the ALE health monitoring MIB.'
              tags:
                - tag: component
                  value: memory
              trigger_prototypes:
                - uuid: 44c6475af72a4a89aab2ca57027aba1c
                  expression: 'min(/Alcatel-Lucent Entreprise WebSmart switch by SNMP/system.memory.util[{#RESOURCE.MODEL}],5m)>{$MEMORY.UTIL.WARN}'
                  name: 'High memory utilization'
                  priority: WARNING
                  description: 'Memory utilization has remained above {$MEMORY.UTIL.WARN}% for 5 minutes.'
                  tags:
                    - tag: component
                      value: memory
                    - tag: scope
                      value: performance
          graph_prototypes:
            - uuid: 516eb39fbdf74e938a948b82cbce714f
              name: '{#RESOURCE.MODEL}: CPU utilization'
              graph_items:
                - color: 199C0D
                  item:
                    host: 'Alcatel-Lucent Entreprise WebSmart switch by SNMP'
                    key: 'system.cpu.util[{#RESOURCE.MODEL}]'
            - uuid: 63f31d2b43dc43a3a830f276bf1c94e3
              name: '{#RESOURCE.MODEL}: Flash storage'
              show_work_period: 'NO'
              show_triggers: 'NO'
              type: PIE
              show_3d: 'YES'
              graph_items:
                - color: 199C0D
                  item:
                    host: 'Alcatel-Lucent Entreprise WebSmart switch by SNMP'
                    key: 'system.flash.free[{#RESOURCE.MODEL}]'
                - sortorder: '1'
                  color: F63100
                  item:
                    host: 'Alcatel-Lucent Entreprise WebSmart switch by SNMP'
                    key: 'system.flash.total[{#RESOURCE.MODEL}]'
            - uuid: b3e32838117b4c35b696c7deb80490b4
              name: '{#RESOURCE.MODEL}: Memory utilization'
              graph_items:
                - color: 2774A4
                  item:
                    host: 'Alcatel-Lucent Entreprise WebSmart switch by SNMP'
                    key: 'system.memory.util[{#RESOURCE.MODEL}]'
          master_item:
            key: 'system.objectid[sysObjectID.0]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var oid = String(value || '');
                  var data = [];
                  if (oid.indexOf('6486.803.1.1.2.1.1.1.2') !== -1) {
                      data.push({
                          '{#RESOURCE.MODEL}': 'OS2260'
                      });
                  }
                  return JSON.stringify({data: data});
