              trigger_prototypes:
                - uuid: 2ffe080bd319472c8559714b13b7da2d
                  expression: 'avg(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/sensor.temp.value[swSensorValue.{#SNMPINDEX}],5m)>{$TEMP_CRIT:"{#SENSOR_INFO}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/sensor.temp.value[swSensorValue.{#SNMPINDEX}],5m)<{$TEMP_CRIT:"{#SENSOR_INFO}"}-3'
                  name: 'Lenovo DB610S: {#SENSOR_INFO}: Temperature is above critical threshold'
