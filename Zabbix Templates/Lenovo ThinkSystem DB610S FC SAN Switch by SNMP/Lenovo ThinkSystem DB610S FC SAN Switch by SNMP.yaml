                  name: 'Lenovo DB610S: {#SENSOR_INFO}: Fan is in critical state'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'Please check the fan unit'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
                - uuid: 0d40f9e28edf4939b6a48e40fa32ce03
                  expression: 'count(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/sensor.fan.status[swSensorStatus.{#SNMPINDEX}],#1,"ne","{$FAN_OK_STATUS}")=1'
                  name: 'Lenovo DB610S: {#SENSOR_INFO}: Fan is not in normal state'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: INFO
                  description: 'Please check the fan unit'
                  dependencies:
                    - name: 'Lenovo DB610S: {#SENSOR_INFO}: Fan is in critical state'
                      expression: 'count(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/sensor.fan.status[swSensorStatus.{#SNMPINDEX}],#1,"eq","{$FAN_CRIT_STATUS}")=1'
                  tags:
                    - tag: scope
