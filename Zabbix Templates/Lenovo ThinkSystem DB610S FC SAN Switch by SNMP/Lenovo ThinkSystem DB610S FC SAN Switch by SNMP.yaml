zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: f71faac2ecaf43e4b251b991cc1bf1af
      name: 'Templates/Network devices'
  templates:
    - uuid: d13d9a98bd7347c49042df08c067fb33
      template: 'Lenovo ThinkSystem DB610S FC SAN Switch by SNMP'
      name: 'Lenovo ThinkSystem DB610S FC SAN Switch by SNMP'
      description: |
        Template for Lenovo ThinkSystem DB610S Fibre Channel SAN switches running Brocade Fabric OS.
        
        MIBs used:
        HOST-RESOURCES-MIB
        SNMPv2-MIB
        ENTITY-MIB
        IF-MIB / IF-MIB ifXTable
        SW-MIB
        FA-EXT-MIB
        FCMGMT-MIB
      vendor:
        name: E-MSN
        version: 7.4-11
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: ecf53c421a454137bcbfdd62b17456f6
          name: 'Fabric domain ID'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.2.1.0]'
          key: 'fabric.domain.id[swDomainID.0]'
          delay: 10m
          description: |
            MIB: SW-MIB
            The domain ID assigned to this switch.
          tags:
            - tag: component
              value: fabric
        - uuid: 01f83b29738b4c259c7e0de2592a0f16
          name: 'Fabric in-order delivery state'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.1.38.0]'
          key: 'fabric.iod.state[swIODState.0]'
          delay: 10m
          description: |
            MIB: SW-MIB
            The configured in-order delivery state.
          valuemap:
            name: 'SW-MIB::swIODState'
          tags:
            - tag: component
              value: fabric
        - uuid: 9008b51f899043578512061e0ab3f1c9
          name: 'Fabric ISL count'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.2.8.0]'
          key: 'fabric.isl.count[swNumInterSwitchLinks.0]'
          delay: 5m
          description: |
            MIB: SW-MIB
            The number of inter-switch links known by the switch.
          tags:
            - tag: component
              value: fabric
        - uuid: ae7a5f95ba8341b28eb365617224c891
          name: 'Registered Fibre Channel devices'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.7.1.0]'
          key: 'fabric.nameserver.count[swNsLocalNumEntry.0]'
          delay: 5m
          description: |
            MIB: SW-MIB
            The number of local Fibre Channel Name Server entries.
          tags:
            - tag: component
              value: fibre-channel
        - uuid: ab74fc10d4a64f8cad880844d20f9cba
          name: 'Fabric principal switch'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.2.2.0]'
          key: 'fabric.principal[swPrincipalSwitch.0]'
          delay: 10m
          description: |
            MIB: SW-MIB
            Indicates whether this switch is the principal switch in the fabric.
          valuemap:
            name: 'SW-MIB::swPrincipalSwitch'
          tags:
            - tag: component
              value: fabric
        - uuid: 7cd2ffccf4ae448d8f15cbda4b68efb2
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          description: |
            The host accessibility by ICMP ping.
            
            0 - ICMP ping fails;
            1 - ICMP ping successful.
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 56aa6c7649de4560a0413e2233af277c
              expression: 'max(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/icmpping,#3)=0'
              name: 'Lenovo DB610S: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 37f970a9660a4af297fb849a6f8614ae
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          description: 'The percentage of lost packets.'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: a6f90dcb8b1e4ff29ddace2d1699dc2c
              expression: 'min(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/icmppingloss,5m)<100'
              name: 'Lenovo DB610S: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'Lenovo DB610S: Unavailable by ICMP ping'
                  expression: 'max(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 995f5c569eda4d83b65d4b93d0d5c80b
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          description: 'The ICMP ping response time (in seconds).'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: aa9a25d218d94218b1cd7c54876dd7ad
              expression: 'avg(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'Lenovo DB610S: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'Lenovo DB610S: High ICMP ping loss'
                  expression: 'min(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/icmppingloss,5m)<100'
                - name: 'Lenovo DB610S: Unavailable by ICMP ping'
                  expression: 'max(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 4bb59ffd13ee466ba95bad6d01b71131
          name: 'SNMP traps (fallback)'
          type: SNMP_TRAP
          key: snmptrap.fallback
          value_type: LOG
          description: 'The item is used to collect all SNMP traps unmatched by other snmptrap items'
          logtimefmt: 'hh:mm:sszyyyy/MM/dd'
          tags:
            - tag: component
              value: network
        - uuid: 4ebafff461f141b6b5fc8abc288bd8c1
          name: 'System contact details'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.4.0]'
          key: 'system.contact[sysContact.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            The textual identification of the contact person for this managed node, together with information on how to contact this person. If no contact information is known, the value is the zero-length string.
          inventory_link: CONTACT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 882f9e5fe1814160b2ae7c1b2e82015f
          name: 'CPU utilization'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.26.1.0]'
          key: 'system.cpu.util[swCpuUsage.0]'
          value_type: FLOAT
          units: '%'
          description: |
            MIB: SW-MIB
            System's CPU usage.
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: 4a12d7944dfc43d8b80c0214d9afed2d
              expression: 'min(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.cpu.util[swCpuUsage.0],5m)>{$CPU.UTIL.CRIT}'
              name: 'Lenovo DB610S: High CPU utilization'
              event_name: 'Lenovo DB610S: High CPU utilization (over {$CPU.UTIL.CRIT}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The CPU utilization is too high. The system might be slow to respond.'
              tags:
                - tag: scope
                  value: performance
        - uuid: 261008c86ac04dcab895fbc413c4a531
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.1.0]'
          key: 'system.descr[sysDescr.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            A textual description of the entity. This value should
            include the full name and version identification of the system's hardware type, software operating-system, and
            networking software.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: dac162285d5247f899fd8cd99f552d95
          name: 'Firmware version'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.1.6.0]'
          key: system.hw.firmware
          delay: 1h
          value_type: CHAR
          description: 'MIB: SW-MIB'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 6cea33a402564820b681d8333949f3ac
              expression: 'last(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.hw.firmware,#1)<>last(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.hw.firmware,#2) and length(last(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.hw.firmware))>0'
              name: 'Lenovo DB610S: Firmware has changed'
              opdata: 'Current value: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'Firmware version has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 38c83213a21b4f239f12edc684649078
          name: 'System model'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.47.1.1.1.1.2.1]'
          key: system.hw.model
          delay: 1h
          value_type: CHAR
          description: |
            MIB: ENTITY-MIB
            The chassis model reported by entPhysicalDescr.
          inventory_link: MODEL
          tags:
            - tag: component
              value: inventory
        - uuid: 91a291e6d6b942c69b4729ee0c0b98f7
          name: 'System part number'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.47.1.1.1.1.13.1]'
          key: system.hw.partnumber
          delay: 1h
          value_type: CHAR
          description: |
            MIB: ENTITY-MIB
            The chassis vendor-specific part number.
          tags:
            - tag: component
              value: inventory
        - uuid: ba327c66febb4b67acd151fd81baac44
          name: 'Factory serial number'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.1.10.0]'
          key: system.hw.serialnumber
          delay: 1h
          value_type: CHAR
          description: 'MIB: SW-MIB'
          inventory_link: SERIALNO_A
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 3e363524fe6346bbacab07a202f94205
              expression: 'last(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.hw.serialnumber,#1)<>last(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.hw.serialnumber,#2) and length(last(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.hw.serialnumber))>0'
              name: 'Lenovo DB610S: Factory serial number has changed'
              event_name: 'Lenovo DB610S: Device has been replaced (new serial number received)'
              priority: INFO
              description: 'Device serial number has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: a0fe1d65e9b14aa2a1338a5bae7703f9
          name: 'Uptime (hardware)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.25.1.1.0]'
          key: 'system.hw.uptime[hrSystemUptime.0]'
          delay: 30s
          trends: '0'
          units: uptime
          description: |
            MIB: HOST-RESOURCES-MIB
            The amount of time since this host was last initialized. Note that this is different from sysUpTime in the SNMPv2-MIB [RFC1907] because sysUpTime is the uptime of the network management portion of the system.
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 80549fa5bcce499e9a159bf536944679
          name: 'System location'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.6.0]'
          key: 'system.location[sysLocation.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            Physical location of the node (e.g., `equipment room`, `3rd floor`). If not provided, the value is a zero-length string.
          inventory_link: LOCATION
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 0a61af0c4bde4ba083aa0bc93e9746b9
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.5.0]'
          key: system.name
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            An administratively-assigned name for this managed node.By convention, this is the node's fully-qualified domain name. If the name is unknown, the value is the zero-length string.
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 022ac149ae7240dbb37436a5ec1c7e92
              expression: 'last(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.name,#1)<>last(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.name,#2) and length(last(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.name))>0'
              name: 'Lenovo DB610S: System name has changed'
              event_name: 'Lenovo DB610S: System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              description: 'The name of the system has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
                - tag: scope
                  value: security
        - uuid: fa167dc3a0144e00aabfba1aed34e39f
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 30s
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            Time (in hundredths of a second) since the network management portion of the system was last re-initialized.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 413e33ff6c55453580b47811212b02a1
          name: 'System object ID'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.2.0]'
          key: 'system.objectid[sysObjectID.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            The vendor's authoritative identification of the network management subsystem contained in the entity. This value is allocated within the SMI enterprises subtree (1.3.6.1.4.1) and provides an easy and unambiguous means for determining`what kind of box' is being managed.  For example, if vendor`Flintstones, Inc.' was assigned the subtree1.3.6.1.4.1.4242, it could assign the identifier 1.3.6.1.4.1.4242.1.1 to its `Fred Router'.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 7df4d1827abe463ea3876b7c36d5a73c
          name: 'POST diagnostic result'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.1.20.0]'
          key: 'system.post.status[swDiagResult.0]'
          delay: 10m
          description: |
            MIB: SW-MIB
            The result of the switch power-on self-test diagnostics.
          valuemap:
            name: 'SW-MIB::swDiagResult'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 3f4288a051314e42a33ea9a918d16622
              expression: 'last(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.post.status[swDiagResult.0])<>1'
              name: 'Lenovo DB610S: POST diagnostic result is not OK'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'The switch reports a failed or degraded POST diagnostic result.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 56ae9cd404a74fc6b719f5e8670a6ddf
          name: 'Serial number'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.47.1.1.1.1.11.1
          key: system.serialnumber
          delay: 1h
          value_type: CHAR
          inventory_link: SERIALNO_B
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: db035643c82f4067b73ff8b28100fb72
              expression: 'last(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.serialnumber,#1)<>last(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.serialnumber,#2) and length(last(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.serialnumber))>0'
              name: 'Lenovo DB610S: Chassis serial number has changed'
              event_name: 'Lenovo DB610S: Device has been replaced (new serial number received)'
              priority: INFO
              description: 'Device serial number has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 111b8c2caa4044689fd089c0e4b8f5f7
          name: 'Overall system health status'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.1.7.0]'
          key: 'system.status[swOperStatus.0]'
          delay: 30s
          trends: '0'
          description: |
            MIB: SW-MIB
            The current operational status of the switch.The states are as follow:
            online(1) means the switch is accessible by an external Fibre Channel port
            offline(2) means the switch is not accessible
            testing(3) means the switch is in a built-in test mode and is not accessible by an external Fibre Channel port
            faulty(4) means the switch is not operational.
          valuemap:
            name: 'SW-MIB::swOperStatus'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: a853de782b034d3387d47f17ef5d1c83
              expression: 'count(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.status[swOperStatus.0],#1,"eq","{$HEALTH_CRIT_STATUS}")=1'
              name: 'Lenovo DB610S: System status is in critical state'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'Please check the device for errors'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
            - uuid: e0799fac95e542adae99f75b02b79bed
              expression: 'count(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.status[swOperStatus.0],#1,"eq","{$HEALTH_WARN_STATUS:\"offline\"}")=1 or count(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.status[swOperStatus.0],#1,"eq","{$HEALTH_WARN_STATUS:\"testing\"}")=1'
              name: 'Lenovo DB610S: System status is in warning state'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Please check the device for warnings'
              dependencies:
                - name: 'Lenovo DB610S: System status is in critical state'
                  expression: 'count(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/system.status[swOperStatus.0],#1,"eq","{$HEALTH_CRIT_STATUS}")=1'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 98385f8d4c514919b282abf9b27cc9bf
          name: 'Memory utilization'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.1588.2.1.1.1.26.6.0]'
          key: 'vm.memory.util[swMemUsage.0]'
          value_type: FLOAT
          units: '%'
          description: |
            MIB: SW-MIB
            Memory utilization in %.
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 4622186caa4b4166b2306f8f036cf200
              expression: 'min(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/vm.memory.util[swMemUsage.0],5m)>{$MEMORY.UTIL.MAX}'
              name: 'Lenovo DB610S: High memory utilization'
              event_name: 'Lenovo DB610S: High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
              priority: AVERAGE
              description: 'The system is running out of free memory.'
              tags:
                - tag: scope
                  value: capacity
                - tag: scope
                  value: performance
        - uuid: 467792751721401ab263b2e98ed51769
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 82cf3ed8bbbf4b4fb49555c9126c55e9
              expression: 'max(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'Lenovo DB610S: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'Lenovo DB610S: Unavailable by ICMP ping'
                  expression: 'max(/Lenovo ThinkSystem DB610S FC SAN Switch by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 7733a47c13eb43d5a44752882a9ac67b
          name: 'Inter-switch links discovery'
          type: SNMP_AGENT
