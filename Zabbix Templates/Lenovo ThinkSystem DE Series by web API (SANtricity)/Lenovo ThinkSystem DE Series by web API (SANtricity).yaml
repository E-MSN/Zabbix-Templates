            - uuid: 1cb878f3a8a144b58889e66a4a7b615d
              name: 'Drive {#DRIVELABEL}: Drive Status code'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.drives.[{#ID},status.numeric]'
              value_type: FLOAT
              trends: '0'
              description: 'Collects drive status code for drive {#DRIVELABEL}.'
              valuemap:
                name: 'SANtricity status mapping'
              preprocessing:
                - type: REGEX
                  parameters:
                    - '.*(?="id":"{#ID}")'
                    - \0
                - type: REGEX
                  parameters:
                    - '({"offline")(?!.*\1).*[^]]'
                    - \0
                - type: REGEX
                  parameters:
                    - '(?<="status":")(.*?)(?=")'
                    - \0
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = String(value).trim();
                      v = v.replace(/^\[/, '').replace(/\]$/, '').replace(/^"|"$/g, '').trim();
                      var map = {
                        '__UNDEFINED': 0,
                        'unknown': 1,
                        'removed': 2,
                        'failed': 3,
                        'noinput': 4,
                        'optimal': 5,
                        'down': 6,
                        'up': 7,
                        'none': 8,
                        'missing': 9,
                        'complete': 10,
                        'partial': 11,
                        'contingent': 12,
                        'exported': 13,
                        'forced': 14,
                        'incomplete': 15,
                        'degraded': 16,
                        'impaired': 17,
                        'creating': 18,
                        'deleting': 19,
                        'serviceMode': 20,
                        'rpaParErr': 21,
                        'suspended': 22,
                        'replaced': 23,
                        'bypassed': 24,
                        'incompatible': 25,
                        'unresponsive': 26,
                        'dataRelocation': 27,
                        'preFailCopy': 28,
                        'preFailCopyPending': 29,
                        'sanitizing': 30,
                        'fullCharging': 31,
                        'nearExpiration': 32,
                        'notInConfig': 33,
                        'configMismatch': 34,
                        'maintenanceCharging': 35,
                        'learning': 36,
                        'overtemp': 37,
                        'replacementRequired': 38,
                        'maxTempExceed': 39,
                        'expired': 40,
                        'nominalTempExceed': 41,
                        'ok': 5,
                        'normal': 5,
                        'nominal': 5
                      };
                      if (Object.prototype.hasOwnProperty.call(map, v)) {
                        return map[v];
                      }
                      return 1;
              master_item:
                key: santricity.storage.systems.id.drives
              tags:
                - tag: Application
                  value: 'Storage Drives'
            - uuid: e13d98a66ae841a897a6ff760e9ab441
              name: 'Drive {#DRIVELABEL}: Drive Status'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.drives.[{#ID},status]'
