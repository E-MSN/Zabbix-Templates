            - uuid: 7955f3943fa14600854f2eba535b9cff
              name: 'Ethernet interface {#CONTROLLER.SLOT}/{#ETHERNET.LABEL}: Name'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.interfaces.ethernet.name[{#CONTROLLER.ID}.{#ETHERNET.ID}]'
              value_type: TEXT
              description: 'Collects name for ethernet interface {#CONTROLLER.SLOT}/{#ETHERNET.LABEL}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $..netInterfaces
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      var groupedData = {};
                      for (var i = 0; i < input.length; i++) {
                          var  innerArray = input[i];
                          for (var j = 0; j < innerArray.length; j++) {
                              var item = innerArray[j];
