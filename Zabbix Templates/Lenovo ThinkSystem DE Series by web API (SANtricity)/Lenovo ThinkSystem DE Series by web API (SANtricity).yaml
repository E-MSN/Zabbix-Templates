                  value: 'Storage Ethernet Interfaces'
          master_item:
            key: santricity.storage.systems.id.hardware.inventory
          lld_macro_paths:
            - lld_macro: '{#CONTROLLER.ID}'
              path: $.controllerRef
            - lld_macro: '{#CONTROLLER.SLOT}'
              path: $.controllerSlot
            - lld_macro: '{#ETHERNET.CHANNEL}'
              path: $.channel
            - lld_macro: '{#ETHERNET.ID}'
              path: $.interfaceRef
            - lld_macro: '{#ETHERNET.LABEL}'
              path: $.interfaceLabel
            - lld_macro: '{#ETHERNET.NAME}'
              path: $.interfaceName
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var root = JSON.parse(value);
                  var controllers = [];
                  if (Array.isArray(root)) {
                      controllers = root[0] && root[0].controllers ? root[0].controllers : root;
                  } else {
                      controllers = root.controllers || [];
                  }
                  var out = [];
                  for (var i = 0; i < controllers.length; i++) {
                      var c = controllers[i];
                      var list = c.netInterfaces || [];
                      for (var j = 0; j < list.length; j++) {
                          if (!list[j].ethernet) {
                              continue;
                          }
                          var e = list[j].ethernet;
                          out.push({
                              controllerRef: e.controllerRef || c.controllerRef || '',
                              controllerSlot: e.controllerSlot || '',
                              interfaceRef: e.interfaceRef || e.id || '',
                              interfaceName: e.interfaceName || '',
                              interfaceLabel: e.physicalLocation && e.physicalLocation.label ? e.physicalLocation.label : '',
                              channel: e.channel || '',
                              linkStatus: e.linkStatus || '',
                              ipv4Address: e.ipv4Address || '',
                              currentSpeed: e.currentSpeed || ''
                          });
                      }
                  }
                  return JSON.stringify(out);
