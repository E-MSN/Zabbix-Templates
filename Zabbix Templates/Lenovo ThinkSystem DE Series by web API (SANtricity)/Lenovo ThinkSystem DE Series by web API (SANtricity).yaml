              tags:
                - tag: Application
                  value: 'Storage FC Interfaces'
            - uuid: e31a1e170eea49b6a7de2818ef88e588
              name: 'FC interface {#CONTROLLER.SLOT}/{#FC.CHANNEL}: Current Interface Speed bps'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.interfaces.fc.currentInterfaceSpeed.bps[{#CONTROLLER.ID}.{#INTERFACE.ID}]'
              value_type: FLOAT
              units: bps
              description: 'Collects current interface speed in bps for FC interface {#CONTROLLER.SLOT}/{#FC.CHANNEL}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.interfaceRef == "{#INTERFACE.ID}")].ioInterfaceTypeData.fibre.currentInterfaceSpeed.first()'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = String(value).trim();
                      v = v.replace(/^\[/, '').replace(/\]$/, '').replace(/^"|"$/g, '').trim();
                      var k = v.toLowerCase().replace(/[^a-z0-9_\.]/g, '');
                      var map = {
                          'speedunknown': 0,
                          'unknown': 0,
                          'none': 0,
                          '__undefined': 0,
                          'undefined': 0,
                          'speednone': 0,
                          'speednotavailable': 0,
                          'notavailable': 0,
                          'speedauto': 0,
                          'auto': 0
                      };
                      if (Object.prototype.hasOwnProperty.call(map, k)) {
                          return map[k];
                      }
                      var m = k.match(/^speed([0-9]+(?:[_\.][0-9]+)?)(meg|mb|m|gig|gb|g|ter|tb|t)$/);
                      if (m) {
                          var n = parseFloat(m[1].replace('_', '.'));
                          if (isNaN(n)) {
                              return 0;
                          }
                          var unit = m[2];
                          if (unit === 'meg' || unit === 'mb' || unit === 'm') {
                              return Math.round(n * 1000000);
                          }
                          if (unit === 'gig' || unit === 'gb' || unit === 'g') {
                              return Math.round(n * 1000000000);
                          }
                          if (unit === 'ter' || unit === 'tb' || unit === 't') {
                              return Math.round(n * 1000000000000);
                          }
                      }
                      return 0;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: santricity.storage.systems.id.interfaces.fc
              tags:
                - tag: Application
                  value: 'Storage FC Interfaces'
