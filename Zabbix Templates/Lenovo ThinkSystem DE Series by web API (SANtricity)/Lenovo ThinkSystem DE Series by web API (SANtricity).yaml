            - uuid: 1292890a62c242cd9733aa09bf0ec47b
              name: 'Controller {#CONTROLLERLABEL}: Status'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.controllers.[{#ID},status]'
              value_type: TEXT
              description: 'Collects status for controller {#CONTROLLERLABEL}.'
              preprocessing:
                - type: REGEX
                  parameters:
                    - '.*(?="id":"{#ID}")'
                    - \0
                - type: REGEX
                  parameters:
                    - '(?!.*"status":)\w+(?=",)'
                    - \0
              master_item:
                key: santricity.storage.systems.id.controllers
              tags:
                - tag: Application
                  value: 'Storage Controllers'
              trigger_prototypes:
                - uuid: 5bb3acd07da04807b79b194d29d6ab48
                  expression: 'find(/Lenovo ThinkSystem DE Series by web API - SANtricity/santricity.storage.systems.id.controllers.[{#ID},status],#1,"like","optimal")=0'
                  name: 'Controller {#CONTROLLERLABEL} Status is not Optimal'
                  priority: HIGH
                  description: 'Alerts when a controller status is not optimal.'
                  manual_close: 'YES'
          master_item:
            key: santricity.storage.systems.id.controllers
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!Array.isArray(data)) {
                      data = [data];
                  }
                  for (var i = 0; i < data.length; i++) {
                      data[i].controllerLabel = '';
                      data[i].controllerSlot = '';
                      data[i].controllerPosition = '';
                      data[i].controllerTrayRef = '';
                      if (data[i].physicalLocation) {
                          if (data[i].physicalLocation.label !== undefined && data[i].physicalLocation.label !== null) {
                              data[i].controllerLabel = data[i].physicalLocation.label;
                          }
                          if (data[i].physicalLocation.slot !== undefined && data[i].physicalLocation.slot !== null) {
                              data[i].controllerSlot = data[i].physicalLocation.slot;
                          }
                          if (data[i].physicalLocation.locationPosition !== undefined && data[i].physicalLocation.locationPosition !== null) {
                              data[i].controllerPosition = data[i].physicalLocation.locationPosition;
                          }
                          if (data[i].physicalLocation.trayRef !== undefined && data[i].physicalLocation.trayRef !== null) {
                              data[i].controllerTrayRef = data[i].physicalLocation.trayRef;
                          }
                      }
                      if (data[i].controllerLabel === '') {
                          data[i].controllerLabel = data[i].controllerRef;
                      }
                  }
                  var json_data = JSON.stringify(data);
                  json_data = json_data.replace(/"([^"]*)":/g, function(v) { return v.toUpperCase(); } );
                  json_data = json_data.replace(/":/g,'}":' );
                  json_data = json_data.replace(/,"(?=[A-Z])/g, ',"{#');
                  json_data = json_data.replace(/{"(?=[A-Z])/g, '{"{#');
                  return(json_data);
