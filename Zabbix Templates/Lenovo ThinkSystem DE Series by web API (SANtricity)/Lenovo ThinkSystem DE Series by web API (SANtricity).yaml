            - uuid: 072a0b3c71c8434fb8b1497d834f225d
              name: 'FC interface {#CONTROLLER.SLOT}/{#FC.CHANNEL}: WWN'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.interfaces.fc.wwn[{#CONTROLLER.ID}.{#INTERFACE.ID}]'
              value_type: TEXT
              description: 'Collects WWN for FC interface {#CONTROLLER.SLOT}/{#FC.CHANNEL}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.interfaceRef == "{#INTERFACE.ID}")].ioInterfaceTypeData.fibre.niceAddressId.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: santricity.storage.systems.id.interfaces.fc
              tags:
                - tag: Application
                  value: 'Storage FC Interfaces'
          master_item:
            key: santricity.storage.systems.id.interfaces.fc
          lld_macro_paths:
            - lld_macro: '{#CONTROLLER.ID}'
              path: $.controllerId
            - lld_macro: '{#CONTROLLER.REF}'
              path: $.controllerRef
            - lld_macro: '{#CONTROLLER.SLOT}'
              path: $.controllerSlot
            - lld_macro: '{#FC.CHANNEL}'
              path: $.fcChannel
            - lld_macro: '{#FC.WWPN}'
              path: $.niceAddressId
            - lld_macro: '{#INTERFACE.ID}'
              path: $.interfaceId
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var interfaces = JSON.parse(value);
                  var out = [];
                  function controllerSlot(controllerId) {
                      if (!controllerId) {
                          return '';
                      }
                      var suffix = controllerId.slice(-4);
                      var n = parseInt(suffix, 10);
                      return isNaN(n) ? '' : String(n);
                  }
                  for (var i = 0; i < interfaces.length; i++) {
                      var iface = interfaces[i];
                      var fibre = iface.ioInterfaceTypeData &&
                                  iface.ioInterfaceTypeData.fibre
                                      ? iface.ioInterfaceTypeData.fibre
                                      : null;
                      if (!fibre) {
                          continue;
                      }
                      var ctrlId = fibre.controllerId || iface.controllerRef || '';
                      var channel = fibre.channel !== undefined ? String(fibre.channel) : '';
                      out.push({
                          controllerRef: iface.controllerRef || ctrlId,
                          controllerId: ctrlId,
                          controllerSlot: controllerSlot(ctrlId),
                          interfaceRef: fibre.interfaceRef || iface.interfaceRef || fibre.id || '',
                          interfaceId: fibre.interfaceId || fibre.interfaceRef || iface.interfaceRef || '',
                          fcChannel: channel,
                          linkStatus: fibre.linkStatus || '',
                          currentInterfaceSpeed: fibre.currentInterfaceSpeed || '',
                          maximumInterfaceSpeed: fibre.maximumInterfaceSpeed || '',
                          portName: fibre.portName || '',
                          niceAddressId: fibre.niceAddressId || '',
                          topology: fibre.topology || '',
                          isDegraded: fibre.isDegraded
                      });
                  }
                  return JSON.stringify(out);
