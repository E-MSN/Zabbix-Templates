          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var out = [];
                  var seen = {};
                  function addEsm(e) {
                      if (e === null || typeof e !== "object") {
                          return;
                      }
                      var ref = e.esmRef || e.esmCanisterRef || e.iomRef || e.canisterRef;
                      if (ref === undefined || ref === null || ref === "") {
                          return;
                      }
                      ref = String(ref);
                      if (seen[ref]) {
                          return;
                      }
                      seen[ref] = true;
                      var loc = e.physicalLocation || {};
                      out.push({
                          "{#ESMREF}": ref,
                          "{#LABEL}": String(loc.label || e.label || e.name || ref),
                          "{#SLOT}": String(loc.slot !== undefined ? loc.slot : (e.slot !== undefined ? e.slot : "")),
