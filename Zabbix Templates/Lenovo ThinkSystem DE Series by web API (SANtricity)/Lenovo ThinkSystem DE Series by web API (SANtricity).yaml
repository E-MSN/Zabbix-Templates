          description: 'Collects raw SANtricity API data for drives.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  json_data = value
                     json_data = json_data.replace(/(?="protectionInformationCapabilities":)(.*?)},(?=")/g, '');
                     return(json_data);
          timeout: 7s
          url: '{$SANTRICITY.SCHEME}://{$SANTRICITY.IP}:{$SANTRICITY.PORT}/devmgr/v2/storage-systems/{$SANTRICITY.SYSTEM.ID}/drives'
          tags:
