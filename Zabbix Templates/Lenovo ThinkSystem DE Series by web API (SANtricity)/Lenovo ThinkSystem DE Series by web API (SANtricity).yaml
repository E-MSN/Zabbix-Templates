        - uuid: 89fb41cef14a46b0aedb0cec578983b1
          name: 'Drives Discovery'
          type: DEPENDENT
          key: santricity.storage.systems.id.drives.discovery
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovers storage drives for monitoring.'
          item_prototypes:
            - uuid: 866d8870f43342efbb6015bac72d49fb
              name: 'Drive {#DRIVELABEL}: Current Speed bps'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.drives.[{#ID},currentSpeed.bps]'
              value_type: FLOAT
              units: bps
              description: 'Collects current speed in bps for drive {#DRIVELABEL}.'
              preprocessing:
                - type: REGEX
                  parameters:
                    - '.*(?="id":"{#ID}")'
                    - \0
                - type: REGEX
                  parameters:
                    - '({"offline")(?!.*\1).*[^]]'
                    - \0
                - type: REGEX
                  parameters:
                    - '(?<="currentSpeed":")(.*?)(?=")'
                    - \0
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = String(value).trim();
                      v = v.replace(/^\[/, '').replace(/\]$/, '').replace(/^"|"$/g, '').trim();
                      var k = v.toLowerCase().replace(/[^a-z0-9_\.]/g, '');
                      var map = {
                          'speedunknown': 0,
                          'unknown': 0,
                          'none': 0,
                          '__undefined': 0,
                          'undefined': 0,
                          'speednone': 0,
                          'speednotavailable': 0,
                          'notavailable': 0,
                          'speedauto': 0,
                          'auto': 0
                      };
                      if (Object.prototype.hasOwnProperty.call(map, k)) {
                          return map[k];
                      }
                      var m = k.match(/^speed([0-9]+(?:[_\.][0-9]+)?)(meg|mb|m|gig|gb|g|ter|tb|t)$/);
                      if (m) {
                          var n = parseFloat(m[1].replace('_', '.'));
                          if (isNaN(n)) {
                              return 0;
                          }
                          var unit = m[2];
                          if (unit === 'meg' || unit === 'mb' || unit === 'm') {
                              return Math.round(n * 1000000);
                          }
                          if (unit === 'gig' || unit === 'gb' || unit === 'g') {
                              return Math.round(n * 1000000000);
                          }
                          if (unit === 'ter' || unit === 'tb' || unit === 't') {
                              return Math.round(n * 1000000000000);
                          }
                      }
                      return 0;
              master_item:
                key: santricity.storage.systems.id.drives
              tags:
                - tag: Application
                  value: 'Storage Drives'
