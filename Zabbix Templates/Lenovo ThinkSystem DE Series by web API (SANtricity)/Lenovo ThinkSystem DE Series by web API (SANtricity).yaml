        - uuid: 704d430a949b4dde80f40d390631ca5a
          name: 'Hot-Spares Discovery'
          type: DEPENDENT
          key: santricity.storage.systems.id.hotspare.discovery
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovers hot spare drives for monitoring.'
          item_prototypes:
            - uuid: 5571986f6c2e42f39608f441b0a6317a
              name: 'Hot Spare Drive ID {#DRIVEREF}: In Use numeric'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.hotspare.[{#DRIVEREF},inUse.numeric]'
              value_type: FLOAT
              trends: '0'
              description: 'Collects in-use state numeric for hot spare drive ID {#DRIVEREF}.'
              valuemap:
                name: 'SANtricity boolean mapping'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.driveRef=="{#DRIVEREF}")].inUse'
                - type: REGEX
                  parameters:
                    - '^\[?(true|false)\]?'
                    - \1
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = String(value).trim().toLowerCase();
                      v = v.replace(/^\[/, '').replace(/\]$/, '').replace(/^"|"$/g, '').trim();
                      if (v === 'true' || v === '1' || v === 'yes') { return 1; }
                      if (v === 'false' || v === '0' || v === 'no') { return 0; }
                      return 1;
              master_item:
                key: santricity.storage.systems.id.hotspare
              tags:
                - tag: Application
                  value: 'Storage Hot Spare Drives'
            - uuid: 542ea444a8ad48589d70b9923de047e7
              name: 'Hot Spare Drive ID {#DRIVEREF}: In Use'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.hotspare.[{#DRIVEREF},inUse]'
              value_type: TEXT
              description: 'Collects in-use state for hot spare drive ID {#DRIVEREF}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.driveRef=="{#DRIVEREF}")].inUse'
                - type: REGEX
                  parameters:
                    - '^\[?(true|false)\]?'
                    - \1
              master_item:
                key: santricity.storage.systems.id.hotspare
              tags:
                - tag: Application
                  value: 'Storage Hot Spare Drives'
              trigger_prototypes:
                - uuid: 82405c526b404d03a0bae86fef0fdf74
                  expression: 'find(/Lenovo ThinkSystem DE Series by web API - SANtricity/santricity.storage.systems.id.hotspare.[{#DRIVEREF},inUse],#1,"like","true")=1'
                  name: 'Hot-Spare Drive ID {#DRIVEREF} is in Use'
                  priority: HIGH
                  description: 'Alerts when a hot spare drive is in use.'
                  manual_close: 'YES'
          master_item:
            key: santricity.storage.systems.id.hotspare
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  json_data = value
                  json_data = json_data.replace(/"([^"]*)":/g, function(v) { return v.toUpperCase(); } );
                  json_data = json_data.replace(/":/g,'}":' );
                  json_data = json_data.replace(/,"(?=[A-Z])/g, ',"{#');
                  json_data = json_data.replace(/{"(?=[A-Z])/g, '{"{#');
                  return(json_data);
        - uuid: bde2d05f2d464063b42610e4beaba834
          name: 'Ethernet Interfaces Discovery'
          type: DEPENDENT
          key: santricity.storage.systems.id.interfaces.ethernet.discovery
          lifetime_type: DELETE_NEVER
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 3d
          description: 'Discovers Ethernet interfaces for monitoring.'
          item_prototypes:
            - uuid: 4115cea652e141b2aa89c3c3097ea639
              name: 'Ethernet interface {#CONTROLLER.SLOT}/{#ETHERNET.LABEL}: Current Speed bps'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.interfaces.ethernet.currentSpeed.bps[{#CONTROLLER.ID}.{#ETHERNET.ID}]'
              value_type: FLOAT
              units: bps
              description: 'Collects current speed in bps for ethernet interface {#CONTROLLER.SLOT}/{#ETHERNET.LABEL}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $..netInterfaces
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      var groupedData = {};
                      for (var i = 0; i < input.length; i++) {
                          var innerArray = input[i];
                          for (var j = 0; j < innerArray.length; j++) {
                              var item = innerArray[j];
                              var controllerRef = item.ethernet.controllerRef;
                              var interfaceRef = item.ethernet.id;
                              if (!groupedData[controllerRef]) {
                                  groupedData[controllerRef] = {};
                              }
                              groupedData[controllerRef][interfaceRef] = item.ethernet;
                          }
                      }
                      return JSON.stringify(groupedData, null, 2);
                - type: JSONPATH
                  parameters:
                    - '$.["{#CONTROLLER.ID}"].["{#ETHERNET.ID}"].currentSpeed'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = String(value).trim();
                      v = v.replace(/^\[/, '').replace(/\]$/, '').replace(/^"|"$/g, '').trim();
                      var k = v.toLowerCase().replace(/[^a-z0-9_\.]/g, '');
                      var map = {
                          'speedunknown': 0,
                          'unknown': 0,
                          'none': 0,
                          '__undefined': 0,
                          'undefined': 0,
                          'speednone': 0,
                          'speednotavailable': 0,
                          'notavailable': 0,
                          'speedauto': 0,
                          'auto': 0
                      };
                      if (Object.prototype.hasOwnProperty.call(map, k)) {
                          return map[k];
                      }
                      var m = k.match(/^speed([0-9]+(?:[_\.][0-9]+)?)(meg|mb|m|gig|gb|g|ter|tb|t)$/);
                      if (m) {
                          var n = parseFloat(m[1].replace('_', '.'));
                          if (isNaN(n)) {
                              return 0;
                          }
                          var unit = m[2];
                          if (unit === 'meg' || unit === 'mb' || unit === 'm') {
                              return Math.round(n * 1000000);
                          }
                          if (unit === 'gig' || unit === 'gb' || unit === 'g') {
                              return Math.round(n * 1000000000);
                          }
                          if (unit === 'ter' || unit === 'tb' || unit === 't') {
                              return Math.round(n * 1000000000000);
                          }
                      }
                      return 0;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: santricity.storage.systems.id.controllers
              tags:
                - tag: Application
                  value: 'Storage Ethernet Interfaces'
            - uuid: 116bb224bf6a4b0a86c630ba9dc3260d
              name: 'Ethernet interface {#CONTROLLER.SLOT}/{#ETHERNET.LABEL}: IP Address'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.interfaces.ethernet.ipAddress[{#CONTROLLER.ID}.{#ETHERNET.ID}]'
              value_type: TEXT
              description: 'Collects IP address for ethernet interface {#CONTROLLER.SLOT}/{#ETHERNET.LABEL}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $..netInterfaces
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      var groupedData = {};
                      for (var i = 0; i < input.length; i++) {
                          var  innerArray = input[i];
                          for (var j = 0; j < innerArray.length; j++) {
                              var item = innerArray[j];
                              var controllerRef = item.ethernet.controllerRef;
                              var interfaceRef = item.ethernet.id;
                              if (!groupedData[controllerRef]) {
                                  groupedData[controllerRef] = {};
                              }
                              groupedData[controllerRef][interfaceRef]  = item.ethernet;
                          }
                      }
                      return JSON.stringify(groupedData, null, 2);
                - type: JSONPATH
                  parameters:
                    - '$.["{#CONTROLLER.ID}"].["{#ETHERNET.ID}"].ipv4Address'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: santricity.storage.systems.id.controllers
              tags:
                - tag: Application
                  value: 'Storage Ethernet Interfaces'
            - uuid: ef30153fc2a347b9b53a94c52ccd817f
