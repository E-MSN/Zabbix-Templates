        - uuid: 1eff0b43ee6a4c80a1381549db57f47d
          name: 'Controllers Discovery'
          type: DEPENDENT
          key: santricity.storage.systems.id.controllers.discovery
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovers storage controllers for monitoring.'
          item_prototypes:
            - uuid: d0c72ccca6fe497184d3dbd683bb807d
              name: 'Controller {#CONTROLLERLABEL}: Active numeric'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.controllers.[{#ID},active.numeric]'
              value_type: FLOAT
              trends: '0'
              description: 'Collects numeric active state for controller {#CONTROLLERLABEL}.'
              valuemap:
                name: 'SANtricity boolean mapping'
              preprocessing:
                - type: REGEX
                  parameters:
                    - '.*(?="id":"{#ID}")'
                    - \0
                - type: REGEX
                  parameters:
                    - '(?!.*"active": )\w+(?=,)'
                    - \0
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = String(value).trim().toLowerCase();
                      v = v.replace(/^\[/, '').replace(/\]$/, '').replace(/^"|"$/g, '').trim();
                      if (v === 'true' || v === '1' || v === 'yes') { return 1; }
                      if (v === 'false' || v === '0' || v === 'no') { return 0; }
                      return 1;
              master_item:
                key: santricity.storage.systems.id.controllers
              tags:
                - tag: Application
                  value: 'Storage Controllers'
            - uuid: 27fba0a9dcf3476d845f88310151629b
