            - uuid: 88e0e25dc5c24bdfa667c6946af6d7cb
              name: 'Pool {#POOL.LABEL}: Raid Status code'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.system.config.pools.[{$SANTRICITY.SYSTEM.ID},{#POOL.LABEL},raidStatus.numeric]'
              value_type: FLOAT
