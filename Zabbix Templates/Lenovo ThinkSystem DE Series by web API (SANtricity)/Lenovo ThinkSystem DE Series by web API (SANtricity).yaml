        - uuid: ccadcb060c9046a5af50c489c8ea9965
          name: 'SANtricity: Get Lockdown Status raw data'
          type: HTTP_AGENT
          key: santricity.storage.systems.id.lockdown.status
          delay: 5m
          history: 90d
          value_type: TEXT
          authtype: BASIC
          username: '{$SANTRICITY.USERNAME}'
          password: '{$SANTRICITY.PASSWORD}'
          description: 'Collects raw SANtricity API data for lockdown status.'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?<="isLockdown":)(.*?)(?=,)'
                - \0
          timeout: 7s
          url: '{$SANTRICITY.SCHEME}://{$SANTRICITY.IP}:{$SANTRICITY.PORT}/devmgr/v2/storage-systems/{$SANTRICITY.SYSTEM.ID}/lockdownstatus'
          tags:
            - tag: Application
              value: 'Storage Lockdown Status'
        - uuid: 5584e46a325c4495acb13e1574395a21
          name: 'SANtricity: Get Lockdown Status numeric'
          type: HTTP_AGENT
          key: santricity.storage.systems.id.lockdown.status.numeric
          delay: 5m
          history: 90d
          value_type: FLOAT
          trends: '0'
          authtype: BASIC
          username: '{$SANTRICITY.USERNAME}'
          password: '{$SANTRICITY.PASSWORD}'
          description: 'Collects numeric SANtricity API data for lockdown status.'
          valuemap:
            name: 'SANtricity boolean mapping'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?<="isLockdown":)(.*?)(?=,)'
                - \0
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = String(value).trim().toLowerCase();
                  v = v.replace(/^\[/, '').replace(/\]$/, '').replace(/^"|"$/g, '').trim();
                  if (v === 'true' || v === '1' || v === 'yes') { return 1; }
                  if (v === 'false' || v === '0' || v === 'no') { return 0; }
                  return 1;
          timeout: 7s
