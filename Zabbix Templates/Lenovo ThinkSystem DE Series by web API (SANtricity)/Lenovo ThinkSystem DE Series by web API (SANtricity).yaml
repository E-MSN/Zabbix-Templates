                  manual_close: 'YES'
            - uuid: c3ba1e51ef7f4828a2069420ceaf3db7
              name: 'Drive {#DRIVELABEL}: Usable Capacity'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.drives.[{#SERIALNUMBER},usableCapacity]'
              units: B
              description: 'Collects usable capacity for drive {#DRIVELABEL}.'
              preprocessing:
                - type: REGEX
                  parameters:
                    - '.*(?="id":"{#ID}")'
                    - \0
                - type: REGEX
                  parameters:
                    - '({"offline")(?!.*\1).*[^]]'
                    - \0
                - type: REGEX
                  parameters:
                    - '(?<="usableCapacity":")(.*?)(?=")'
                    - \0
              master_item:
                key: santricity.storage.systems.id.drives
              tags:
                - tag: Application
                  value: 'Storage Drives'
          trigger_prototypes:
            - uuid: c610eb79c3b04414948cfda5b51e270c
              expression: |
                last(/Lenovo ThinkSystem DE Series by web API - SANtricity/santricity.storage.systems.id.drives.[{#ID},spareBlocksRemainingPercent])
                < {$HIGH_SPARE_BLOCKS_REMAINING_PERCENT}
                and
                last(/Lenovo ThinkSystem DE Series by web API - SANtricity/santricity.storage.systems.id.drives.[{#ID},driveMediaType])="ssd"
              name: 'Drive {#DRIVELABEL} Spare Blocks Remaining Percent is <{$HIGH_SPARE_BLOCKS_REMAINING_PERCENT}%'
              priority: HIGH
              description: 'Alerts when SSD spare blocks remaining fall below the threshold.'
              manual_close: 'YES'
          master_item:
            key: santricity.storage.systems.id.drives
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!Array.isArray(data)) {
                      data = [data];
                  }
                  for (var i = 0; i < data.length; i++) {
                      data[i].driveTrayRef = '';
                      data[i].driveSlot = '';
                      data[i].drivePosition = '';
                      data[i].driveLabel = '';
                      if (data[i].physicalLocation) {
                          if (data[i].physicalLocation.trayRef !== undefined && data[i].physicalLocation.trayRef !== null) {
                              data[i].driveTrayRef = data[i].physicalLocation.trayRef;
                          }
                          if (data[i].physicalLocation.slot !== undefined && data[i].physicalLocation.slot !== null) {
                              data[i].driveSlot = data[i].physicalLocation.slot;
                          }
                          if (data[i].physicalLocation.locationPosition !== undefined && data[i].physicalLocation.locationPosition !== null) {
                              data[i].drivePosition = data[i].physicalLocation.locationPosition;
                          }
                          if (data[i].physicalLocation.label !== undefined && data[i].physicalLocation.label !== null) {
                              data[i].driveLabel = data[i].physicalLocation.label;
                          }
                      }
                      if (data[i].driveLabel === '') {
                          data[i].driveLabel = data[i].driveSlot;
                      }
                  }
                  var json_data = JSON.stringify(data);
                  json_data = json_data.replace(/"([^"]*)":/g, function(v) { return v.toUpperCase(); } );
                  json_data = json_data.replace(/":/g,'}":' );
                  json_data = json_data.replace(/,"(?=[A-Z])/g, ',"{#');
                  json_data = json_data.replace(/{"(?=[A-Z])/g, '{"{#');
                  return(json_data);
        - uuid: a60f99b17c224ac08f313f8ffa11c0b9
          name: 'Drive Health History Discovery'
          type: DEPENDENT
          key: santricity.storage.systems.id.drives.drive.health.history.discovery
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovers SSD health history entries for monitoring.'
          item_prototypes:
            - uuid: 1039c67b028e4d80aef690d53c5a2cc8
              name: 'Drive {#DRIVELABEL}: Temperature'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.drives.ssd.health.[{#DRIVEWWN},temperatureInCelsius]'
              value_type: FLOAT
              units: °C
              description: 'Collects temperature for drive {#DRIVELABEL}.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var root = JSON.parse(value);
                      var driveWwn = '{#DRIVEWWN}'.toLowerCase();
                      var serialNumber = '{#SERIALNUMBER}';
                       var best = null;
                      var bestTime = 0;
                      if (!root.collections || !Array.isArray(root.collections)) {
                          throw  'No collections';
                      }
                      for (var c = 0; c < root.collections.length; c++) {
                          var collection = root.collections[c];
                          if (!collection.ssdDriveWearStatistics || !Array.isArray(collection.ssdDriveWearStatistics)) {
                               continue;
                          }
                          for (var i = 0; i < collection.ssdDriveWearStatistics.length; i++) {
                              var ssd  = collection.ssdDriveWearStatistics[i];
                              var currentWwn = '';
                              if (ssd.driveWwn !== undefined  && ssd.driveWwn !== null) {
                                  currentWwn = String(ssd.driveWwn).toLowerCase();
                              }
                               var currentSerial = '';
                              if (ssd.serialNumber !== undefined && ssd.serialNumber !== null) {
                                   currentSerial = String(ssd.serialNumber);
                              }
                              if (currentWwn !== driveWwn && currentSerial  !== serialNumber) {
                                  continue;
                              }
                              if (ssd.temperatureInCelsius === undefined  || ssd.temperatureInCelsius === null) {
                                  continue;
                              }
                              var ts = 0;
                              if  (ssd.timestamp !== undefined && ssd.timestamp !== null) {
                                  ts = Date.parse(ssd.timestamp);
                                   if (isNaN(ts)) {
                                      ts = 0;
                                  }
                              }
                              if (best === null ||  ts >= bestTime) {
                                  best = ssd;
                                  bestTime = ts;
                              }
                          }
                      }
                      if (best ===  null) {
                          throw 'No SSD temperature for drive';
                      }
                      var value = Number(best.temperatureInCelsius);
                      if  (!isFinite(value) || value <= 0) {
                          throw 'Invalid SSD temperature: ' + best.temperatureInCelsius;
                      }
                       return value;
              master_item:
                key: santricity.storage.systems.id.drives.drive.health.history
              tags:
                - tag: Application
                  value: 'Storage SSD Drive Health'
              trigger_prototypes:
                - uuid: aa2f1c8cc7bc40c895f0b07b2111051e
                  expression: 'min(/Lenovo ThinkSystem DE Series by web API - SANtricity/santricity.storage.systems.id.drives.ssd.health.[{#DRIVEWWN},temperatureInCelsius],#3)>={$TEMP_DRIVE_HIGH}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'min(/Lenovo ThinkSystem DE Series by web API - SANtricity/santricity.storage.systems.id.drives.ssd.health.[{#DRIVEWWN},temperatureInCelsius],#3)<={$TEMP_DRIVE_WARN}'
                  name: 'Drive {#DRIVELABEL}: Temperature High (>{$TEMP_DRIVE_HIGH})'
                  priority: HIGH
                  description: 'Alerts when drive temperature exceeds the high threshold.'
                  manual_close: 'YES'
                - uuid: 23849b1f78c247359cf9300209e482a3
                  expression: 'min(/Lenovo ThinkSystem DE Series by web API - SANtricity/santricity.storage.systems.id.drives.ssd.health.[{#DRIVEWWN},temperatureInCelsius],#3)>={$TEMP_DRIVE_WARN}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'min(/Lenovo ThinkSystem DE Series by web API - SANtricity/santricity.storage.systems.id.drives.ssd.health.[{#DRIVEWWN},temperatureInCelsius],#3)<={$TEMP_DRIVE_WARN}'
                  name: 'Drive {#DRIVELABEL}: Temperature Warning (>{$TEMP_DRIVE_WARN})'
                  priority: WARNING
                  description: 'Alerts when drive temperature exceeds the warning threshold.'
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Drive {#DRIVELABEL}: Temperature High (>{$TEMP_DRIVE_HIGH})'
                      expression: 'min(/Lenovo ThinkSystem DE Series by web API - SANtricity/santricity.storage.systems.id.drives.ssd.health.[{#DRIVEWWN},temperatureInCelsius],#3)>={$TEMP_DRIVE_HIGH}'
                      recovery_expression: 'min(/Lenovo ThinkSystem DE Series by web API - SANtricity/santricity.storage.systems.id.drives.ssd.health.[{#DRIVEWWN},temperatureInCelsius],#3)<={$TEMP_DRIVE_WARN}'
          graph_prototypes:
            - uuid: 1f8649d2340c40ffa0c44e4b3bdbf155
              name: 'Drive {#DRIVELABEL}: Temperature'
              graph_items:
                - sortorder: '1'
                  drawtype: GRADIENT_LINE
                  color: 43A047
                  calc_fnc: ALL
                  item:
                    host: 'Lenovo ThinkSystem DE Series by web API - SANtricity'
                    key: 'santricity.storage.systems.id.drives.ssd.health.[{#DRIVEWWN},temperatureInCelsius]'
          master_item:
            key: santricity.storage.systems.id.drives
          lld_macro_paths:
            - lld_macro: '{#DRIVELABEL}'
              path: $.driveLabel
            - lld_macro: '{#DRIVEPOSITION}'
              path: $.drivePosition
            - lld_macro: '{#DRIVESLOT}'
              path: $.driveSlot
            - lld_macro: '{#DRIVETRAYREF}'
              path: $.driveTrayRef
            - lld_macro: '{#DRIVEWWN}'
              path: $.driveWwn
            - lld_macro: '{#SERIALNUMBER}'
              path: $.serialNumber
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var drives = JSON.parse(value);
                  
                  if (!Array.isArray(drives)) {
                      drives = [drives];
                  }
                  var data = [];
                  for (var i = 0; i < drives.length; i++) {
                      var d = drives[i];
                      var mediaType = '';
                      if (d.driveMediaType !== undefined && d.driveMediaType !== null) {
                          mediaType = String(d.driveMediaType).toLowerCase();
                      }
                      if (mediaType !== 'ssd') {
                          continue;
                      }
                      d.driveWwn = '';
                      d.driveLabel = '';
                      d.driveSlot = '';
                      d.drivePosition = '';
                      d.driveTrayRef = '';
                      if (d.worldWideName !== undefined && d.worldWideName !== null) {
                          d.driveWwn = d.worldWideName;
                      } else if (d.driveRef !== undefined && d.driveRef !== null) {
                          d.driveWwn = d.driveRef;
                      } else if (d.id !== undefined && d.id !== null) {
                          d.driveWwn = d.id;
                      }
                      if (d.physicalLocation) {
                          if (d.physicalLocation.label !== undefined && d.physicalLocation.label !== null) {
                              d.driveLabel = d.physicalLocation.label;
                          }
                          if (d.physicalLocation.slot !== undefined && d.physicalLocation.slot !== null) {
                              d.driveSlot = d.physicalLocation.slot;
                          }
                          if (d.physicalLocation.locationPosition !== undefined && d.physicalLocation.locationPosition !== null) {
                              d.drivePosition = d.physicalLocation.locationPosition;
                          }
                          if (d.physicalLocation.trayRef !== undefined && d.physicalLocation.trayRef !== null) {
                              d.driveTrayRef = d.physicalLocation.trayRef;
                          }
                      }
                      if (d.driveLabel === '') {
                          d.driveLabel = d.driveSlot;
                      }
                      data.push(d);
                  }
                  return JSON.stringify(data);
        - uuid: 8e07633219da496ab05f368c120251c0
