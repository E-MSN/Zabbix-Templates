        - uuid: bbec7da1c6384e5c9d2a0b40c639e706
          name: 'Overall Status code'
          type: DEPENDENT
          key: santricity.storage.systems.id.status.numeric
          history: 90d
          value_type: FLOAT
          trends: '0'
          description: 'Collects the numeric storage array overall status.'
          valuemap:
            name: 'SANtricity status mapping'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?<="id":"{$SANTRICITY.SYSTEM.ID}",).*'
                - \0
            - type: REGEX
              parameters:
                - '(?<="status":")(.*?)(?=\")'
                - \0
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = String(value).trim();
                  v = v.replace(/^\[/, '').replace(/\]$/, '').replace(/^"|"$/g, '').trim();
                   var map = {
                    '__UNDEFINED': 0,
                    'unknown': 1,
                    'removed': 2,
                    'failed': 3,
                    'noinput': 4,
                    'optimal': 5,
                    'down': 6,
                    'up': 7,
                    'none': 8,
                    'missing': 9,
                    'complete': 10,
                    'partial': 11,
                    'contingent': 12,
                    'exported': 13,
                    'forced': 14,
                    'incomplete': 15,
                    'degraded': 16,
                    'impaired': 17,
                    'creating': 18,
                    'deleting': 19,
                    'serviceMode': 20,
                    'rpaParErr': 21,
                    'suspended': 22,
                    'replaced': 23,
                    'bypassed': 24,
                    'incompatible': 25,
                    'unresponsive': 26,
                    'dataRelocation': 27,
                    'preFailCopy': 28,
                    'preFailCopyPending': 29,
                    'sanitizing': 30,
                    'fullCharging': 31,
                    'nearExpiration': 32,
                    'notInConfig': 33,
                    'configMismatch': 34,
                    'maintenanceCharging': 35,
                    'learning': 36,
                    'overtemp': 37,
                    'replacementRequired': 38,
                    'maxTempExceed': 39,
                    'expired': 40,
                    'nominalTempExceed': 41,
                    'needsAttn': 42,
                    'neverContacted':43,
                    'newDevice':44,
                    'offline':45,
                    'lockDown':46,
                    'ok': 5,
                    'normal': 5,
                    'nominal': 5
                  };
                  if (Object.prototype.hasOwnProperty.call(map, v)) {
                    return map[v];
                  }
                  return 1;
          master_item:
            key: santricity.storage.systems
          tags:
            - tag: Application
              value: 'Global Health'
