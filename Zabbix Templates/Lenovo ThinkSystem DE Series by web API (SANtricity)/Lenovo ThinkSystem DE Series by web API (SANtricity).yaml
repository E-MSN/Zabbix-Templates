              name: 'Controller {#CONTROLLERLABEL}: Status code'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.controllers.[{#ID},status.numeric]'
              value_type: FLOAT
              trends: '0'
              description: 'Collects numeric status for controller {#CONTROLLERLABEL}.'
              valuemap:
                name: 'SANtricity status mapping'
              preprocessing:
                - type: REGEX
                  parameters:
                    - '.*(?="id":"{#ID}")'
                    - \0
                - type: REGEX
                  parameters:
                    - '(?!.*"status":)\w+(?=",)'
                    - \0
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = String(value).trim();
                      v = v.replace(/^\[/, '').replace(/\]$/, '').replace(/^"|"$/g, '').trim();
                       var map = {
                        '__UNDEFINED': 0,
                        'unknown': 1,
                        'removed': 2,
                        'failed': 3,
                        'noinput': 4,
                        'optimal': 5,
                        'down': 6,
                        'up': 7,
                        'none': 8,
                        'missing': 9,
