              name: 'SAS interface {#CONTROLLER.SLOT}/{#SAS.PORT}: Status code'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.interfaces.sas.status[{#CONTROLLER.ID}.{#INTERFACE.ID}]'
              value_type: FLOAT
              trends: '0'
              description: 'Collects numeric status for SAS interface {#CONTROLLER.SLOT}/{#SAS.PORT}.'
              valuemap:
                name: 'SANtricity status mapping'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.interfaceRef == "{#INTERFACE.ID}")].ioInterfaceTypeData.sas.iocPort.state.first()'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = String(value).trim();
                      v = v.replace(/^\[/, '').replace(/\]$/, '').replace(/^"|"$/g, '').trim();
                      var map = {
                        '__UNDEFINED': 0,
                        'unknown': 1,
                        'removed': 2,
                        'failed': 3,
                        'noinput': 4,
                        'optimal': 5,
                        'down': 6,
                        'up': 7,
                        'none': 8,
                        'missing': 9,
                        'complete': 10,
                        'partial': 11,
                        'contingent': 12,
                        'exported': 13,
                        'forced': 14,
                        'incomplete': 15,
                        'degraded': 16,
                        'impaired': 17,
                        'creating': 18,
                        'deleting': 19,
                        'serviceMode': 20,
                        'rpaParErr': 21,
                        'suspended': 22,
                        'replaced': 23,
                        'bypassed': 24,
                        'incompatible': 25,
                        'unresponsive': 26,
                        'dataRelocation': 27,
                        'preFailCopy': 28,
                        'preFailCopyPending': 29,
                        'sanitizing': 30,
                        'fullCharging': 31,
                        'nearExpiration': 32,
                        'notInConfig': 33,
                        'configMismatch': 34,
                        'maintenanceCharging': 35,
                        'learning': 36,
                        'overtemp': 37,
                        'replacementRequired': 38,
                        'maxTempExceed': 39,
                        'expired': 40,
                        'nominalTempExceed': 41,
                        'ok': 5,
                        'normal': 5,
                        'nominal': 5
                      };
                      if (Object.prototype.hasOwnProperty.call(map, v)) {
                        return map[v];
                      }
                      return 1;
              master_item:
                key: santricity.storage.systems.id.interfaces.sas
              tags:
                - tag: Application
                  value: 'Storage SAS Interfaces'
              trigger_prototypes:
                - uuid: fdae387879ac46b886decfe1ef13d6cf
                  expression: '{$SANTRICITY.SAS.IFCONTROL:"{#CONTROLLER.ID}.{#INTERFACE.ID}"}=1 and last(/Lenovo ThinkSystem DE Series by web API - SANtricity/santricity.storage.systems.id.interfaces.sas.status[{#CONTROLLER.ID}.{#INTERFACE.ID}])<>5'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Lenovo ThinkSystem DE Series by web API - SANtricity/santricity.storage.systems.id.interfaces.sas.status[{#CONTROLLER.ID}.{#INTERFACE.ID}])=5 or {$SANTRICITY.SAS.IFCONTROL:"{#CONTROLLER.ID}.{#INTERFACE.ID}"}=0'
                  name: 'SAS interface {#CONTROLLER.SLOT}/{#SAS.PORT} status is abnormal'
                  priority: AVERAGE
                  description: 'Alerts when a SAS interface status is abnormal.'
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: health
          master_item:
            key: santricity.storage.systems.id.interfaces.sas
          lld_macro_paths:
            - lld_macro: '{#CONTROLLER.ID}'
              path: $.controllerId
            - lld_macro: '{#CONTROLLER.SLOT}'
              path: $.controllerSlot
            - lld_macro: '{#INTERFACE.ID}'
              path: $.interfaceId
            - lld_macro: '{#SAS.CHANNEL}'
              path: $.sasChannel
            - lld_macro: '{#SAS.PORT.ID}'
              path: $.sasPortIdentifier
            - lld_macro: '{#SAS.PORT}'
              path: $.sasPort
            - lld_macro: '{#SAS.REMOTE.HOST.PORT}'
              path: $.remoteHostPortAddress
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var interfaces = JSON.parse(value);
                  var out = [];
                  if (!Array.isArray(interfaces)) {
                      interfaces = [interfaces];
                  }
                  function controllerSlot(controllerId) {
                      if (!controllerId) {
                          return '';
                      }
                      var suffix = controllerId.slice(-4);
                      var n = parseInt(suffix, 10);
                      return isNaN(n) ? '' : String(n);
                  }
                  function sasPort(channel) {
                      var n = parseInt(channel, 10);
                      if (isNaN(n)) {
                          return '';
                      }
                      return n > 2 ? String(n - 2) : String(n);
                  }
                  for (var i = 0; i < interfaces.length; i++) {
                      var iface = interfaces[i];
                      var sas = iface.ioInterfaceTypeData && iface.ioInterfaceTypeData.sas ? iface.ioInterfaceTypeData.sas : null;
                      if (!sas) {
                          continue;
                      }
                      var port = sas.iocPort || {};
                      if (iface.channelType !== 'hostside') {
                          continue;
                      }
                      if (port.portMode !== 'externalIn') {
                          continue;
                      }
                      var attached = port.attachedDevice || {};
                      var attachedData = attached.sasAttachedDeviceData || {};
                      var portTypeData = port.portTypeData || {};
                      var ctrlId = sas.controllerId || iface.controllerRef || '';
                      var channel = sas.channel !== undefined ? String(sas.channel) : '';
                      out.push({
                          controllerId: ctrlId,
                          controllerSlot: controllerSlot(ctrlId),
                          interfaceRef: sas.interfaceRef || iface.interfaceRef || sas.id || '',
                          interfaceId: sas.interfaceId || sas.interfaceRef || iface.interfaceRef || '',
                          sasChannel: channel,
                          sasPort: sasPort(channel),
                          sasStatus: port.state || 'unknown',
                          sasPortMode: port.portMode || '',
                          sasPortIdentifier: portTypeData.portIdentifier || '',
                          remoteHostPortAddress: attachedData.remoteHostPortAddress || ''
                      });
                  }
                  return JSON.stringify(out);
