                        'partial': 11,
                        'contingent': 12,
                        'exported': 13,
                        'forced': 14,
                        'incomplete': 15,
                        'degraded': 16,
                        'impaired': 17,
                        'creating': 18,
                        'deleting': 19,
                        'serviceMode': 20,
                        'rpaParErr': 21,
                        'suspended': 22,
                        'replaced': 23,
                        'bypassed': 24,
                        'incompatible': 25,
                        'unresponsive': 26,
                        'dataRelocation': 27,
                        'preFailCopy': 28,
                        'preFailCopyPending': 29,
                        'sanitizing': 30,
                        'fullCharging': 31,
                        'nearExpiration': 32,
                        'notInConfig': 33,
                        'configMismatch': 34,
                        'maintenanceCharging': 35,
                        'learning': 36,
                        'overtemp': 37,
                        'replacementRequired': 38,
                        'maxTempExceed': 39,
                        'expired': 40,
                        'nominalTempExceed': 41,
                        'ok': 5,
                        'normal': 5,
                        'nominal': 5
                      };
                      if (Object.prototype.hasOwnProperty.call(map, v)) {
                        return map[v];
                      }
                      return 1;
