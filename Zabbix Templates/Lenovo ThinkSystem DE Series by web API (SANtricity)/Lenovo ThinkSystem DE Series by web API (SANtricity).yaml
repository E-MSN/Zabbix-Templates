                          "{#STATUS}": String(e.status || e.state || "unknown").trim()
                      });
                  }
                  function walk(o) {
                      if (o === null || typeof o !== "object") {
                          return;
                      }
                      if (Array.isArray(o)) {
                          for (var i = 0; i < o.length; i++) {
                              walk(o[i]);
                          }
                          return;
                      }
                      if (Array.isArray(o.esms)) {
                          for (var j = 0; j < o.esms.length; j++) {
                              addEsm(o.esms[j]);
                          }
                      }
                      for (var k in o) {
                          if (o.hasOwnProperty(k)) {
                              walk(o[k]);
                          }
                      }
                  }
                  walk(data);
                  return JSON.stringify(out);
