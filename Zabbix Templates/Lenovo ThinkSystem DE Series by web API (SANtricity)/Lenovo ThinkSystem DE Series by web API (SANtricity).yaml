          name: 'ESM/IOM Discovery'
          type: DEPENDENT
          key: santricity.storage.systems.id.hardware.inventory.esm.discovery
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovers ESM/IOM modules for monitoring.'
          item_prototypes:
            - uuid: 3e679c84fa8042fbb3336857354b4243
              name: 'Controller {#LABEL}/{#SLOT} ESM: Current Speed bps'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.hardware.inventory.[{#ESMREF}.{#SLOT},esmCurrentSpeed.bps]'
              value_type: FLOAT
              units: bps
              description: 'Collects current speed in bps for controller {#LABEL}/{#SLOT} esm.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var ref = "{#ESMREF}";
                      var data = JSON.parse(value);
                      function scanEsms(o) {
                          if (o === null || typeof o !== "object") {
                              return null;
                          }
                          if (Array.isArray(o)) {
                              for (var i = 0; i < o.length; i++) {
                                  var r = scanEsms(o[i]);
                                  if (r !== null) {
                                      return r;
                                  }
                              }
                              return null;
                          }
                          if (Array.isArray(o.esms)) {
                              for (var j = 0; j < o.esms.length; j++) {
                                  var e = o.esms[j];
                                  var eRef = e.esmRef || e.esmCanisterRef || e.iomRef || e.canisterRef;
                                  if (String(eRef) === String(ref)) {
                                      return String(e.currentSpeed || 'speedUnknown').trim();
                                  }
                              }
                          }
                          for (var k in o) {
                              if (o.hasOwnProperty(k)) {
                                  var x = scanEsms(o[k]);
                                  if (x !== null) {
                                      return x;
                                  }
                              }
                          }
                          return null;
                      }
                      var v = scanEsms(data);
                      if (v === null) {
                          throw "ESM/IOM not found";
                      }
                      return v;
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = String(value).trim();
                      v = v.replace(/^\[/, '').replace(/\]$/, '').replace(/^"|"$/g, '').trim();
                      var k = v.toLowerCase().replace(/[^a-z0-9_\.]/g, '');
                      var map = {
                          'speedunknown': 0,
                          'unknown': 0,
                          'none': 0,
                          '__undefined': 0,
                          'undefined': 0,
                          'speednone': 0,
                          'speednotavailable': 0,
                          'notavailable': 0,
                          'speedauto': 0,
                          'auto': 0
                      };
                      if (Object.prototype.hasOwnProperty.call(map, k)) {
                          return map[k];
                      }
                      var m = k.match(/^speed([0-9]+(?:[_\.][0-9]+)?)(meg|mb|m|gig|gb|g|ter|tb|t)$/);
                      if (m) {
                          var n = parseFloat(m[1].replace('_', '.'));
                          if (isNaN(n)) {
                              return 0;
                          }
                          var unit = m[2];
                          if (unit === 'meg' || unit === 'mb' || unit === 'm') {
                              return Math.round(n * 1000000);
                          }
                          if (unit === 'gig' || unit === 'gb' || unit === 'g') {
                              return Math.round(n * 1000000000);
                          }
                          if (unit === 'ter' || unit === 'tb' || unit === 't') {
                              return Math.round(n * 1000000000000);
                          }
                      }
                      return 0;
