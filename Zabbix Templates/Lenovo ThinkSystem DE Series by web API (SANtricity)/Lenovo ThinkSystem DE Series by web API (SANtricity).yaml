                  expression: 'find(/Lenovo ThinkSystem DE Series by web API - SANtricity/santricity.storage.systems.id.controllers.[{#ID},active],#1,"like","true")=0'
                  name: 'Controller {#CONTROLLERLABEL} is not Active'
