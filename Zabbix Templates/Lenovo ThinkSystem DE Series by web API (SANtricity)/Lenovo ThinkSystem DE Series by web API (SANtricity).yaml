          master_item:
            key: santricity.storage.systems.id.controllers
          lld_macro_paths:
            - lld_macro: '{#CONTROLLERID}'
              path: $.controllerId
            - lld_macro: '{#CONTROLLERLABEL}'
              path: $.controllerLabel
            - lld_macro: '{#CONTROLLERPOSITION}'
              path: $.controllerPosition
            - lld_macro: '{#CONTROLLERSLOT}'
              path: $.controllerSlot
            - lld_macro: '{#CONTROLLERTRAYREF}'
              path: $.controllerTrayRef
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var controllers = JSON.parse(value);
                  if (!Array.isArray(controllers)) {
                      controllers = [controllers];
                  }
                  var data = [];
                  for (var i = 0; i < controllers.length; i++) {
                      var c = controllers[i];
                      var controllerId = '';
                      var controllerLabel = '';
                      var controllerSlot = '';
                      var controllerPosition = '';
                      var controllerTrayRef = '';
                      if (c.controllerRef !== undefined && c.controllerRef !== null) {
                          controllerId = c.controllerRef;
                      } else if (c.id !== undefined && c.id !== null) {
                          controllerId = c.id;
                      }
                      if (c.physicalLocation) {
                          if (c.physicalLocation.label !== undefined && c.physicalLocation.label !== null) {
                              controllerLabel = c.physicalLocation.label;
                          }
                          if (c.physicalLocation.slot !== undefined && c.physicalLocation.slot !== null) {
                              controllerSlot = c.physicalLocation.slot;
                          }
                          if (c.physicalLocation.locationPosition !== undefined && c.physicalLocation.locationPosition !== null) {
                              controllerPosition = c.physicalLocation.locationPosition;
                          }
                          if (c.physicalLocation.trayRef !== undefined && c.physicalLocation.trayRef !== null) {
                              controllerTrayRef = c.physicalLocation.trayRef;
                          }
                      }
                      if (controllerLabel === '') {
                          controllerLabel = controllerId;
                      }
                      data.push({
                          controllerId: controllerId,
                          controllerLabel: controllerLabel,
                          controllerSlot: controllerSlot,
                          controllerPosition: controllerPosition,
                          controllerTrayRef: controllerTrayRef
                      });
                  }
                  return JSON.stringify(data);
        - uuid: 5778136a1e3d48679cfd2aa05ec4b18b
