        - uuid: acbb2af96a044d38bb79d01e7a43e3e4
          name: 'Password Set numeric'
          type: DEPENDENT
          key: santricity.storage.systems.id.password.set.numeric
          history: 90d
          value_type: FLOAT
          trends: '0'
          description: 'Collects the numeric SANtricity password configured state.'
          valuemap:
            name: 'SANtricity boolean mapping'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?<="id":"{$SANTRICITY.SYSTEM.ID}",).*'
                - \0
            - type: REGEX
              parameters:
                - '(?<="passwordSet":)(.*?)(?=,)'
                - \0
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = String(value).trim().toLowerCase();
                  v = v.replace(/^\[/, '').replace(/\]$/, '').replace(/^"|"$/g, '').trim();
                  if (v === 'true' || v === '1' || v === 'yes') { return 1; }
