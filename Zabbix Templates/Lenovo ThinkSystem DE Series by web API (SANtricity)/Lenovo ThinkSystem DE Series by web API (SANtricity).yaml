zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 3097d88f9bd741b69eac32e51be0f0b9
      name: 'Templates/NAS & SAN'
  templates:
    - uuid: 38fa1ac92ba54d749af081ba2116a11b
      template: 'Lenovo ThinkSystem DE Series by web API - SANtricity'
      name: 'Lenovo ThinkSystem DE Series by web API (SANtricity)'
      description: 'Monitors Lenovo ThinkSystem DE Series arrays through the SANtricity Web Services API.'
      vendor:
        name: E-MSN
        version: 7.4-12
      groups:
        - name: 'Templates/NAS & SAN'
      items:
        - uuid: c18d2180cb71473db8bf599fcfb63ee6
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          delay: '60'
          history: 1w
          valuemap:
            name: 'Service state'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: 4726dd0999ee44da8918ffcd4b1059f8
              expression: 'max(/Lenovo ThinkSystem DE Series by web API - SANtricity/icmpping,#3)=0'
              name: 'ICMP Ping: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 4247e04466b74f41bcf854f73b2484cf
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: '%'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: 51b0b4cef8514747942cc1e294932510
              expression: 'min(/Lenovo ThinkSystem DE Series by web API - SANtricity/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Lenovo ThinkSystem DE Series by web API - SANtricity/icmppingloss,5m)<100'
              name: 'ICMP Ping: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Lenovo ThinkSystem DE Series by web API - SANtricity/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: e90844ed1b2f4a18be6917133f281361
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: s
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: f472ceaf5c6b46efb41b925bbe740b78
              expression: 'avg(/Lenovo ThinkSystem DE Series by web API - SANtricity/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'ICMP Ping: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'ICMP Ping: High ICMP ping loss'
                  expression: 'min(/Lenovo ThinkSystem DE Series by web API - SANtricity/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Lenovo ThinkSystem DE Series by web API - SANtricity/icmppingloss,5m)<100'
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Lenovo ThinkSystem DE Series by web API - SANtricity/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: b881393eb37b456ea2eef7cbc076f549
          name: 'SAN Name'
          type: DEPENDENT
          key: santricity.san.name
          value_type: TEXT
          inventory_link: NAME
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[*].name'
            - type: REGEX
              parameters:
                - '"(.*?)"'
                - \1
          master_item:
            key: santricity.storage.systems.id.about
          tags:
            - tag: Application
              value: 'Storage About Info'
        - uuid: dd183bb94b8d4bc3ba7eb769587f8f88
          name: 'SAN NVSRAM version'
          type: DEPENDENT
          key: santricity.san.nvram.version
          value_type: TEXT
          description: 'Collects the storage array NVSRAM version.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[0].codeVersions[?(@.codeModule==''nvsram'')].versionString'
            - type: REGEX
              parameters:
                - '"(.*?)"'
                - \1
          master_item:
            key: santricity.storage.systems.id.firmware
          tags:
            - tag: Application
              value: 'Storage Firmware'
        - uuid: 04cdd24b61144ecb8ee131ba7c3343d1
          name: 'SAN OS version'
          type: DEPENDENT
          key: santricity.san.os.version
          value_type: TEXT
          description: 'Collects the storage array OS version.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[0].codeVersions[?(@.codeModule==''bundleDisplay'')].versionString'
            - type: REGEX
              parameters:
                - '"(.*?)"'
                - \1
          master_item:
            key: santricity.storage.systems.id.firmware
          tags:
            - tag: Application
              value: 'Storage Firmware'
        - uuid: 75c4a9327e75473d8b89559e6233018e
          name: 'SAN Serial Number'
          type: DEPENDENT
          key: santricity.san.sn
          value_type: TEXT
          description: 'Collects the storage array serial number.'
          inventory_link: SERIALNO_A
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[*].serialNumber'
            - type: REGEX
              parameters:
                - '"(.*?)"'
                - \1
          master_item:
            key: santricity.storage.systems.id.about
          tags:
            - tag: Application
              value: 'Storage About Info'
        - uuid: 00c6d36012544a66998b407d1e24b538
          name: 'SANtricity: Get Storage Systems raw data'
          type: HTTP_AGENT
          key: santricity.storage.systems
          delay: 5m
          history: 1h
          value_type: TEXT
          authtype: BASIC
          username: '{$SANTRICITY.USERNAME}'
          password: '{$SANTRICITY.PASSWORD}'
          description: 'Collects raw SANtricity API data for storage systems.'
          timeout: 7s
          url: '{$SANTRICITY.SCHEME}://{$SANTRICITY.IP}:{$SANTRICITY.PORT}/devmgr/v2/storage-systems'
          tags:
            - tag: Application
              value: 'Storage Systems ID'
        - uuid: 812042426dc045dd9778ff0111e9d3d7
          name: 'Certificate Status'
          type: DEPENDENT
          key: santricity.storage.systems.certificate.status
          history: 90d
          value_type: TEXT
          description: 'Collects the SANtricity certificate status.'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?<="id":"{$SANTRICITY.SYSTEM.ID}",).*'
                - \0
            - type: REGEX
              parameters:
                - '(?<="certificateStatus":")(.*?)(?=\")'
                - \0
          master_item:
            key: santricity.storage.systems
          tags:
            - tag: Application
              value: 'Storage Systems ID'
        - uuid: 17eef76892334687959eed04604a9d6e
          name: 'SANtricity: Get About raw data'
          type: HTTP_AGENT
          key: santricity.storage.systems.id.about
          delay: 5m
          history: 1h
          value_type: TEXT
          authtype: BASIC
          username: '{$SANTRICITY.USERNAME}'
          password: '{$SANTRICITY.PASSWORD}'
          description: 'Collects raw SANtricity API data for array identity and version details.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return(''['' + value + '']'')'
          timeout: 7s
          url: '{$SANTRICITY.SCHEME}://{$SANTRICITY.IP}:{$SANTRICITY.PORT}/devmgr/v2/storage-systems/{$SANTRICITY.SYSTEM.ID}/about'
          tags:
            - tag: Application
              value: 'Storage About Info'
          triggers:
            - uuid: 97e6a4a34f774eb3963706b21e68c7a7
              expression: 'nodata(/Lenovo ThinkSystem DE Series by web API - SANtricity/santricity.storage.systems.id.about,900s)=1'
              name: 'SANtricity API: No data retrieved in last 15 minutes'
              priority: HIGH
              description: 'Alerts when the SANtricity API "About" endpoint has not returned data for 15 minutes, indicating a possible API connectivity, authentication, or configuration issue.'
              manual_close: 'YES'
              dependencies:
                - name: 'Cannot Connect to Web API {$SANTRICITY.IP}'
                  expression: 'sum(/Lenovo ThinkSystem DE Series by web API - SANtricity/web.test.fail[SANtricity API check],#3)>=3'
                  recovery_expression: 'sum(/Lenovo ThinkSystem DE Series by web API - SANtricity/web.test.fail[SANtricity API check],#6)=0'
        - uuid: e441958a50af488f93f83c7856e8e50f
          name: 'SANtricity: Get Passwords raw data'
          type: HTTP_AGENT
          key: santricity.storage.systems.id.admin.password.status
          delay: 5m
          history: 1h
          value_type: TEXT
          authtype: BASIC
          username: '{$SANTRICITY.USERNAME}'
          password: '{$SANTRICITY.PASSWORD}'
          description: 'Collects raw SANtricity API data for password status.'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?<="adminPasswordSet":)(.*?)(?=,)'
                - \0
          timeout: 7s
          url: '{$SANTRICITY.SCHEME}://{$SANTRICITY.IP}:{$SANTRICITY.PORT}/devmgr/v2/storage-systems/{$SANTRICITY.SYSTEM.ID}/passwords'
          tags:
            - tag: Application
              value: 'Storage Admin Password Status'
          triggers:
            - uuid: b8a0d58a3da9496db1a62d223023e19f
              expression: 'find(/Lenovo ThinkSystem DE Series by web API - SANtricity/santricity.storage.systems.id.admin.password.status,#1,"like","true")=0'
              name: 'Admin Password not set'
              priority: AVERAGE
              description: 'Alerts when the SANtricity admin password is not configured.'
              manual_close: 'YES'
        - uuid: cce9b8afb06e423db90dd8ce456c10ea
          name: 'SANtricity: Get Passwords Numeric raw data'
          type: HTTP_AGENT
          key: santricity.storage.systems.id.admin.password.status.numeric
          delay: 5m
          history: 1h
          value_type: FLOAT
          trends: '0'
          authtype: BASIC
          username: '{$SANTRICITY.USERNAME}'
          password: '{$SANTRICITY.PASSWORD}'
          description: 'Collects numeric SANtricity API data for password status.'
          valuemap:
            name: 'SANtricity boolean mapping'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?<="adminPasswordSet":)(.*?)(?=,)'
                - \0
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = String(value).trim().toLowerCase();
                  v = v.replace(/^\[/, '').replace(/\]$/, '').replace(/^"|"$/g, '').trim();
                  if (v === 'true' || v === '1' || v === 'yes') { return 1; }
                  if (v === 'false' || v === '0' || v === 'no') { return 0; }
                  return 1;
          timeout: 7s
          url: '{$SANTRICITY.SCHEME}://{$SANTRICITY.IP}:{$SANTRICITY.PORT}/devmgr/v2/storage-systems/{$SANTRICITY.SYSTEM.ID}/passwords'
          tags:
            - tag: Application
              value: 'Storage Admin Password Status'
        - uuid: dc31bb01f4554ff8b114bd2674e9b1fb
