        - uuid: 7da243e846914d5391f68e750b7ec82b
          name: 'Volume Groups Discovery'
          type: DEPENDENT
          key: santricity.storage.systems.id.volumegroups.discovery
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovers volume groups for monitoring.'
          item_prototypes:
            - uuid: 8e05f8b3d75c422da1643ab2538e3a2f
              name: 'Volume Group {#LABEL}: Raid Level'
              type: DEPENDENT
              key: 'santricity.storage.systems.id.system.config.volumegroups.name.[{$SANTRICITY.SYSTEM.ID},{#LABEL},{#RAIDLEVEL}]'
              value_type: TEXT
              description: 'Collects RAID level for volume group {#LABEL}.'
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(?<="label":"{#LABEL}").*'
                    - \0
                - type: REGEX
                  parameters:
                    - '(?<="raidLevel":")(.*?)(?=\")'
                    - \0
              master_item:
                key: santricity.storage.systems.id.system.config
              tags:
                - tag: Application
                  value: 'Storage Volume Groups'
          master_item:
            key: santricity.storage.systems.id.system.config
          preprocessing:
            - type: JSONPATH
              parameters:
                - $..volumeGroups
            - type: JAVASCRIPT
              parameters:
                - |
                  var json_data = value;
                  json_data = json_data.replace(/"([^"]+)":/g, function(match, p1) {
                      return '"' + p1.toUpperCase() + '":';
                  });
                  json_data = json_data.replace(/"([A-Z0-9_]+)":/g, function(match, p1) {
                      return '"{#' + p1 + '}":';
                  });
                  json_data = json_data.replace(/\[(?=\[)/g, '');
                  json_data = json_data.replace(/(\])(?!.*\1)/g, '');
                  return json_data;
