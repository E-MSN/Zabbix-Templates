              trigger_prototypes:
                - uuid: de1cff1f64d8495f9fafc2cab5d220f0
                  expression: 'find(/Lenovo ThinkSystem DE Series by web API - SANtricity/santricity.storage.systems.id.hardware.inventory.[{#ESMREF}.{#SLOT},esmStatus],#1,"regexp","^(optimal|ok|normal|nominal|unknown)$")=0'
