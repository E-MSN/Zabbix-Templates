zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: f175c6ddd9a34a5a8a78b10197eba736
      name: 'Templates/Network devices'
  templates:
    - uuid: 66a923e094d246c4a486e06e068a050c
      template: 'Cisco Wireless LAN Controller by SNMP'
      name: 'Cisco Wireless LAN Controller by SNMP'
      description: |
        Template for Cisco AireOS Wireless LAN Controller.
        
        MIBs used:
        - SNMPv2-MIB
        - IF-MIB
        - AIRESPACE-SWITCHING-MIB
        - AIRESPACE-WIRELESS-MIB
        - CISCO-LWAPP-CDP-MIB
      vendor:
        name: E-MSN
        version: 7.4-3
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: ad054d907e4a4ede9991c959bca0112b
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          delay: '60'
          history: 1w
          valuemap:
            name: 'Service state'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: 464e3694058041b2aad595f923d91fbf
              expression: 'max(/Cisco Wireless LAN Controller by SNMP/icmpping,#3)=0'
              name: 'ICMP Ping: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: ef84b9c198ce453294d331bcdce08347
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: '%'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: e5c06d99cfda41f393f9cde9614a2c0a
              expression: 'min(/Cisco Wireless LAN Controller by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Cisco Wireless LAN Controller by SNMP/icmppingloss,5m)<100'
              name: 'ICMP Ping: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Cisco Wireless LAN Controller by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 410bfd45f410429facc02d02822bb07f
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: s
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: 31de7e9a6a504d2ba836b6fabf14c918
              expression: 'avg(/Cisco Wireless LAN Controller by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'ICMP Ping: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'ICMP Ping: High ICMP ping loss'
                  expression: 'min(/Cisco Wireless LAN Controller by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Cisco Wireless LAN Controller by SNMP/icmppingloss,5m)<100'
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Cisco Wireless LAN Controller by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 8afb04fd8c484b6ebb489d9beefab1d7
          name: 'WLC: SNMP walk controller interfaces'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.2.2.1.8,1.3.6.1.2.1.2.2.1.7,1.3.6.1.2.1.31.1.1.1.18,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.2.2.1.2,1.3.6.1.2.1.2.2.1.3,1.3.6.1.2.1.31.1.1.1.6,1.3.6.1.2.1.31.1.1.1.10,1.3.6.1.2.1.2.2.1.14,1.3.6.1.2.1.2.2.1.20,1.3.6.1.2.1.2.2.1.19,1.3.6.1.2.1.2.2.1.13,1.3.6.1.2.1.31.1.1.1.15]'
          key: net.if.walk
          history: '0'
          value_type: TEXT
          description: 'IF-MIB controller interface discovery and 64-bit traffic counters.'
          tags:
            - tag: component
              value: raw
        - uuid: b381c539774e459b8083ec881a36478d
          name: 'System contact'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.4.0]'
          key: system.contact
          delay: 15m
          value_type: CHAR
          inventory_link: CONTACT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 74898a984ae94a2ab7b7f251fb8fc476
          name: 'System location'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.6.0]'
          key: system.location
          delay: 15m
          value_type: CHAR
          inventory_link: LOCATION
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 82bfeee4903d461c8f02618987a2af2f
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.5.0]'
          key: system.name
          delay: 15m
          value_type: CHAR
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 533ec0b6955048469ec2fae604d62163
          name: 'System uptime'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: system.net.uptime
          trends: '0'
          units: uptime
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 37f11403df0444b0bf364f989fbe2b8f
              expression: 'last(/Cisco Wireless LAN Controller by SNMP/system.net.uptime)<10m'
              name: 'Cisco WLC: Controller has been restarted'
              priority: WARNING
              description: 'The SNMP sysUpTime indicates that the controller restarted less than 10 minutes ago.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 0bbe2e713c8d43338c293d13b0c7f463
          name: 'WLC: AP capacity utilization'
          type: CALCULATED
          key: wlc.ap.capacity
          delay: 5m
          value_type: FLOAT
          units: '%'
          params: 'last(//wlc.ap.count)/last(//wlc.ap.max)*100'
          tags:
            - tag: component
              value: access-point
          triggers:
            - uuid: 4bf2fccea3ba4da19240229212461cd2
              expression: 'min(/Cisco Wireless LAN Controller by SNMP/wlc.ap.capacity,15m)>{$WLC.AP.CAPACITY.WARN}'
              name: 'Cisco WLC: AP capacity utilization is high'
              event_name: 'Cisco WLC: AP capacity utilization is high (>{$WLC.AP.CAPACITY.WARN}%)'
              opdata: 'Capacity: {ITEM.LASTVALUE1}'
              priority: WARNING
              tags:
                - tag: scope
                  value: capacity
        - uuid: e6eee488715e417895d9eb3d3b769de9
          name: 'WLC: Associated APs'
          type: DEPENDENT
          key: wlc.ap.count
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#APNAME}'
                - 1.3.6.1.4.1.14179.2.2.1.1.3
                - '0'
            - type: JAVASCRIPT
              parameters:
                - 'return JSON.parse(value).length;'
          master_item:
            key: wlc.ap.walk
          tags:
            - tag: component
              value: access-point
          triggers:
            - uuid: fa41d024b3c24f858053638589d4ab20
              expression: '{$WLC.AP.MIN}>0 and last(/Cisco Wireless LAN Controller by SNMP/wlc.ap.count)<{$WLC.AP.MIN}'
              name: 'Cisco WLC: Number of associated APs is below expected minimum'
              event_name: 'Cisco WLC: Associated AP count below {$WLC.AP.MIN}'
              opdata: 'Associated APs: {ITEM.LASTVALUE1}'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
        - uuid: 94dcf6e07187455bbdcfef557fe2de9f
          name: 'WLC: Maximum supported APs'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.14179.1.1.1.18.0]'
          key: wlc.ap.max
          delay: 1h
          tags:
            - tag: component
              value: controller
        - uuid: 26e76e3031204e0792992ad695e84532
          name: 'WLC: SNMP walk access points'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.14179.2.2.1.1.2,1.3.6.1.4.1.14179.2.2.1.1.3,1.3.6.1.4.1.14179.2.2.1.1.4,1.3.6.1.4.1.14179.2.2.1.1.6,1.3.6.1.4.1.14179.2.2.1.1.8,1.3.6.1.4.1.14179.2.2.1.1.16,1.3.6.1.4.1.14179.2.2.1.1.17,1.3.6.1.4.1.14179.2.2.1.1.19]'
          key: wlc.ap.walk
          delay: 2m
          history: '0'
          value_type: TEXT
          description: 'AIRESPACE-WIRELESS-MIB access point inventory and state.'
          tags:
            - tag: component
              value: raw
        - uuid: f13195dc24c74413b845b884d3693f38
          name: 'WLC: SNMP walk AP CDP neighbours'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.9.9.623.1.3.1.1.2,1.3.6.1.4.1.9.9.623.1.3.1.1.6,1.3.6.1.4.1.9.9.623.1.3.1.1.8,1.3.6.1.4.1.9.9.623.1.3.1.1.9,1.3.6.1.4.1.9.9.623.1.3.1.1.12]'
          key: wlc.cdp.walk
          delay: 15m
          history: '0'
          value_type: TEXT
          description: 'CISCO-LWAPP-CDP-MIB AP-to-switch neighbour information.'
          tags:
            - tag: component
              value: raw
        - uuid: a05a30f4b7fe406bb9809012c81992d4
          name: 'WLC: Total WLAN clients'
          type: DEPENDENT
          key: wlc.clients.total
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#CLIENTS}'
                - 1.3.6.1.4.1.14179.2.1.1.1.38
                - '0'
            - type: JAVASCRIPT
              parameters:
                - 'var a=JSON.parse(value), s=0; for (var i=0;i<a.length;i++) { s += Number(a[i][''{#CLIENTS}''] || 0); } return s;'
          master_item:
            key: wlc.wlan.walk
          tags:
            - tag: component
              value: wlan
        - uuid: fc92dbe5dbbf4dff8f6911f12cbadb50
          name: 'WLC: CPU utilization'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.14179.1.1.5.1.0]'
          key: wlc.cpu.util
          units: '%'
          tags:
            - tag: component
              value: controller
          triggers:
            - uuid: cf660c7ed13b4126909326fb4062509c
              expression: 'min(/Cisco Wireless LAN Controller by SNMP/wlc.cpu.util,5m)>{$WLC.CPU.WARN}'
              name: 'Cisco WLC: High CPU utilization'
              event_name: 'Cisco WLC: High CPU utilization (>{$WLC.CPU.WARN}% for 5m)'
              opdata: 'CPU: {ITEM.LASTVALUE1}'
              priority: WARNING
              tags:
                - tag: scope
                  value: performance
        - uuid: 2f840a948e20411e87f32133e229d286
          name: 'WLC: Free memory'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.14179.1.1.5.3.0]'
          key: wlc.memory.free
          delay: 5m
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: controller
        - uuid: 69a231b8fb63415ca6d6fd4f7c507809
          name: 'WLC: Total memory'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.14179.1.1.5.2.0]'
          key: wlc.memory.total
          delay: 5m
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: controller
        - uuid: e64af9fe104b45fcb775571839982984
          name: 'WLC: Memory utilization'
          type: CALCULATED
          key: wlc.memory.util
          delay: 5m
          value_type: FLOAT
          units: '%'
          params: '(last(//wlc.memory.total)-last(//wlc.memory.free))/last(//wlc.memory.total)*100'
          tags:
            - tag: component
              value: controller
          triggers:
            - uuid: 43f8f825d2484089b5c6f1366e87f133
              expression: 'min(/Cisco Wireless LAN Controller by SNMP/wlc.memory.util,5m)>{$WLC.MEMORY.WARN}'
              name: 'Cisco WLC: High memory utilization'
              event_name: 'Cisco WLC: High memory utilization (>{$WLC.MEMORY.WARN}% for 5m)'
              opdata: 'Memory: {ITEM.LASTVALUE1}'
              priority: WARNING
              tags:
                - tag: scope
                  value: performance
        - uuid: 4aa9f0a5ec504941a86882d9e88453d4
          name: 'WLC: Model'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.14179.1.1.1.3.0]'
          key: wlc.model
          delay: 1h
          value_type: CHAR
          inventory_link: MODEL
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: controller
        - uuid: e5b74c5e8ca04fd5867e5912421e52a9
          name: 'WLC: SNMP walk AP radios'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.14179.2.2.2.1.4,1.3.6.1.4.1.14179.2.2.2.1.6,1.3.6.1.4.1.14179.2.2.2.1.12,1.3.6.1.4.1.14179.2.2.2.1.15,1.3.6.1.4.1.14179.2.2.2.1.34,1.3.6.1.4.1.14179.2.2.13.1.1,1.3.6.1.4.1.14179.2.2.13.1.2,1.3.6.1.4.1.14179.2.2.13.1.3,1.3.6.1.4.1.14179.2.2.13.1.4,1.3.6.1.4.1.14179.2.2.13.1.24]'
          key: wlc.radio.walk
          delay: 2m
          history: '0'
          value_type: TEXT
          description: 'AIRESPACE-WIRELESS-MIB radio state, channel, clients and utilization.'
          tags:
            - tag: component
              value: raw
        - uuid: 89adfebb63c64ac68d21f07ccee0d6c2
          name: 'WLC: Serial number'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.14179.1.1.1.4.0]'
          key: wlc.serial
          delay: 1h
          value_type: CHAR
          inventory_link: SERIALNO_A
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: controller
        - uuid: fe27927482ca414e87e4efce86406298
          name: 'WLC: AireOS version'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.14179.1.1.1.14.0]'
          key: wlc.software
          delay: 1h
          value_type: CHAR
          inventory_link: SOFTWARE
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: controller
          triggers:
            - uuid: 4595587c2f0347d9884651f0e4d1b2f8
              expression: 'last(/Cisco Wireless LAN Controller by SNMP/wlc.software,#1)<>last(/Cisco Wireless LAN Controller by SNMP/wlc.software,#2) and length(last(/Cisco Wireless LAN Controller by SNMP/wlc.software))>0'
              name: 'Cisco WLC: AireOS version has changed'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: d2b5afa85ba64fc2bb3956cc03f45acb
          name: 'WLC: SNMP walk WLANs'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.14179.2.1.1.1.2,1.3.6.1.4.1.14179.2.1.1.1.6,1.3.6.1.4.1.14179.2.1.1.1.38,1.3.6.1.4.1.14179.2.1.1.1.42]'
          key: wlc.wlan.walk
          delay: 2m
          history: '0'
          value_type: TEXT
          description: 'AIRESPACE-WIRELESS-MIB WLAN/SSID state and client counters.'
          tags:
            - tag: component
              value: raw
        - uuid: 573b6109cbbe48c2bac27857c6301284
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: eea2bf24ace74dedbe9c47d2e822ad0f
              expression: 'max(/Cisco Wireless LAN Controller by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'Cisco WLC: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: fa0e3534230e4361b30ccb786c632d08
          name: 'Controller network interface discovery'
          type: DEPENDENT
          key: net.if.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFNAME}'
                value: '{$WLC.IF.IFNAME.MATCHES}'
              - macro: '{#IFNAME}'
                value: '{$WLC.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: 'Discovers the WLC network interfaces from IF-MIB.'
          item_prototypes:
            - uuid: 4263707a67e8414c9fa0b8635c1acb1f
              name: 'Interface {#IFNAME}: Inbound discards'
              type: DEPENDENT
              key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: aad3e3520dfc4d649a7f66e0bdc83fca
              name: 'Interface {#IFNAME}: Inbound errors'
              type: DEPENDENT
              key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 0bee467cf15847fb9d58893d826ff6f5
              name: 'Interface {#IFNAME}: Bits received'
              type: DEPENDENT
              key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
              units: bps
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 9543fa49be954ae7866b02c52fb4b17c
              name: 'Interface {#IFNAME}: Outbound discards'
              type: DEPENDENT
              key: 'net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 0e269e624b1644fda738d8f6487cf9fe
              name: 'Interface {#IFNAME}: Outbound errors'
              type: DEPENDENT
              key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: a4c003a0d3fc481e800f76f1a29535c4
              name: 'Interface {#IFNAME}: Bits sent'
              type: DEPENDENT
              key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
              units: bps
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 6500d01ff64d48bca49596c084fa68bb
              name: 'Interface {#IFNAME}: Speed'
              type: CALCULATED
              key: 'net.if.speed.connected[{#SNMPINDEX}]'
              trends: '0'
              units: bps
              params: |
                last(//net.if.speed[ifHighSpeed.{#SNMPINDEX}])*
                (last(//net.if.status[ifOperStatus.{#SNMPINDEX}])=1)
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 7739c0b0a1294465b7360d06c4439811
              name: 'Interface {#IFNAME}: Reported speed'
              type: DEPENDENT
              key: 'net.if.speed[ifHighSpeed.{#SNMPINDEX}]'
              trends: '0'
              units: bps
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
                    - '0'
