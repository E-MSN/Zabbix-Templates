                - uuid: a6d7eec5eadf44148b0d5ae0fb246735
                  expression: 'min(/Hikvision NVR by web API/hikvision_nvr.storage.hdd[{#HDD_ID}.smart.temperature],15m)>{$HIKVISION.HDD.SMART.TEMP.WARN}'
                  name: 'Hikvision: HDD {#HDD_ID} SMART temperature is high'
                  event_name: 'Hikvision: HDD {#HDD_ID} "{#HDD_NAME}" SMART temperature is above {$HIKVISION.HDD.SMART.TEMP.WARN} °C'
                  opdata: 'Temperature: {ITEM.LASTVALUE1}'
