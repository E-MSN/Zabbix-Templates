  triggers:
    - uuid: 947aebd95def4c5b96e793da92a891f4
      expression: 'last(/Hikvision NVR by web API/hikvision_nvr.get_info.login_status)=1 or last(/Hikvision NVR by web API/hikvision_nvr.get_status.login_status)=1 or last(/Hikvision NVR by web API/hikvision_nvr.get_channels.login_status)=1 or last(/Hikvision NVR by web API/hikvision_nvr.get_storage.login_status)=1'
      name: 'Hikvision: ISAPI authentication failed'
      priority: HIGH
      description: 'At least one required Hikvision ISAPI endpoint rejected the configured credentials.'
      dependencies:
        - name: 'ICMP Ping: Unavailable by ICMP ping'
          expression: 'max(/Hikvision NVR by web API/icmpping,#3)=0'
      tags:
        - tag: scope
          value: availability
    - uuid: aa577cf1be954f3f974a7c6d92679ffb
      expression: 'last(/Hikvision NVR by web API/hikvision_nvr.get_info.login_status)=2 or last(/Hikvision NVR by web API/hikvision_nvr.get_status.login_status)=2 or last(/Hikvision NVR by web API/hikvision_nvr.get_channels.login_status)=2 or last(/Hikvision NVR by web API/hikvision_nvr.get_storage.login_status)=2'
      name: 'Hikvision: ISAPI web API is unavailable'
      priority: AVERAGE
      description: 'At least one required Hikvision ISAPI endpoint could not be queried or returned an invalid response.'
      dependencies:
        - name: 'ICMP Ping: Unavailable by ICMP ping'
          expression: 'max(/Hikvision NVR by web API/icmpping,#3)=0'
      tags:
