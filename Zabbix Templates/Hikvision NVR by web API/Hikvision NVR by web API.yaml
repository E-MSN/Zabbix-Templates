            - uuid: bb64464c39dd4eab8c06edbf734ba848
              name: 'HDD {#HDD_ID}: SMART Reallocated sector count'
              type: DEPENDENT
              key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.reallocated_sectors]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var attributes = data.attributes || [];
                      var requested = String('5');
                      for (var i = 0; i < attributes.length; i++) {
                          var attribute = attributes[i] || {};
                          if (String(attribute.attributeID) !== requested) continue;
                          var raw = attribute.rawValue;
                          if (raw === undefined || raw === null) throw 'SMART raw value not available';
                          var match = String(raw).match(/\d+/);
                          if (!match) throw 'SMART raw value is not numeric';
                          return parseInt(match[0], 10);
                      }
                      throw 'SMART attribute not reported';
              master_item:
                key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.raw]'
              tags:
                - tag: component
                  value: hdd
            - uuid: bb758480c750490daf71e5749e715e88
              name: 'HDD {#HDD_ID}: SMART temperature'
              type: DEPENDENT
              key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.temperature]'
              value_type: FLOAT
              units: °C
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      if (!data.smart) throw 'SMART data not available';
                      var raw = data.smart.temprature;
                      if (raw === undefined || raw === null) raw = data.smart.temperature;
                      var result = parseFloat(raw);
                      if (!isFinite(result)) throw 'SMART temperature not available';
                      return result;
              master_item:
                key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.raw]'
              tags:
