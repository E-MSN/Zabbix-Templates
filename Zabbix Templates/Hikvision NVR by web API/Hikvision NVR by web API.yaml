        - uuid: 622dcaa621694bcd8e7a42f776700205
          name: 'Get cameras'
          type: HTTP_AGENT
          key: hikvision_nvr.get_channels
          delay: 5m
          history: '0'
          value_type: TEXT
          authtype: DIGEST
          username: '{$HIKVISION_ISAPI.USER}'
          password: '{$HIKVISION_ISAPI.PASSWORD}'
          description: 'Raw and normalized response from the Hikvision ISAPI camera channel list endpoint.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: '{"html":{"head":{"title":"Connection error"}}}'
            - type: XML_TO_JSON
              error_handler: CUSTOM_VALUE
              error_handler_params: '{"html":{"head":{"title":"Connection error"}}}'
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (data.html) {
                      return value;
                  }
                  var channels = [];
                  if (data.InputProxyChannelList && data.InputProxyChannelList.InputProxyChannel) {
                      channels = data.InputProxyChannelList.InputProxyChannel;
                  }
                  if (!Array.isArray(channels)) {
                      channels = [channels];
                  }
                  channels = channels.filter(function (channel) {
                      return channel && channel.id !== undefined && channel.id !== null;
                  }).map(function (channel) {
                      channel.id = String(channel.id);
                      return channel;
                  });
                  return JSON.stringify({channels: channels});
          url: '{$HIKVISION_ISAPI.SCHEME}://{$HIKVISION_ISAPI.HOST}:{$HIKVISION_ISAPI.PORT}/ISAPI/ContentMgmt/InputProxy/channels'
          status_codes: '200,401'
          tags:
            - tag: component
              value: raw
        - uuid: 7eb58f6cb4794bf7bb52dcfeed4dd0ba
          name: 'Get cameras: Login status'
          type: DEPENDENT
          key: hikvision_nvr.get_channels.login_status
          valuemap:
            name: 'Login status'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                      var data = JSON.parse(value);
                      var title = '';
                      if (data.html && data.html.head && data.html.head.title) {
                          title = String(data.html.head.title).toLowerCase();
                      }
                      if (title.indexOf('unauthorized') !== -1) {
                          return 1;
                      }
                      if (title.indexOf('connection error') !== -1) {
                          return 2;
                      }
                      return 0;
                  }
                  catch (error) {
                      return 2;
                  }
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: hikvision_nvr.get_channels
          tags:
            - tag: component
              value: system
