            - uuid: 5e8c5fe17fd345b5a38015f77c166697
              name: 'HDD {#HDD_ID}: Status code'
              type: DEPENDENT
              key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.status.code]'
              valuemap:
