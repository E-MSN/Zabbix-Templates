              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.hdds[?(@.id == "{#HDD_ID}")].status.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: unknown
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var status = String(value).toLowerCase();
                      if (status === 'ok' || status === 'normal') {
                          return 1;
                      }
                      if (status === '' || status === 'unknown') {
                          return 2;
                      }
                      return 0;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
