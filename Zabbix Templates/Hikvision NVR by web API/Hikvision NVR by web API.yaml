      discovery_rules:
        - uuid: b982f95ad0634fb88ab81614623bc0c6
          name: 'Cameras discovery'
          type: DEPENDENT
          key: hikvision_nvr.channels.discovery
          item_prototypes:
            - uuid: 155b14662ec844a2ad90b280a54f930c
              name: 'Camera status request: Camera {#CAM_ID}'
              type: HTTP_AGENT
              key: 'hikvision_nvr.camera.status[{#CAM_ID}.info]'
              delay: 5m
              history: '0'
              value_type: TEXT
              authtype: DIGEST
              username: '{$HIKVISION_ISAPI.USER}'
              password: '{$HIKVISION_ISAPI.PASSWORD}'
              description: 'Raw response from the Hikvision ISAPI status endpoint for camera {#CAM_ID}.'
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '{"html":{"head":{"title":"Connection error"}}}'
                - type: XML_TO_JSON
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '{"html":{"head":{"title":"Connection error"}}}'
              url: '{$HIKVISION_ISAPI.SCHEME}://{$HIKVISION_ISAPI.HOST}:{$HIKVISION_ISAPI.PORT}/ISAPI/ContentMgmt/InputProxy/channels/{#CAM_ID}/status'
              status_codes: '200,401'
              tags:
                - tag: component
                  value: raw
            - uuid: d760742d13394d32abf22b8e7ba100f3
              name: 'Camera {#CAM_ID}: Connection status code'
              type: DEPENDENT
              key: 'hikvision_nvr.camera[{#CAM_ID}.connection.code]'
              valuemap:
                name: 'Camera connection status code'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                          var data = JSON.parse(value);
                          var status = null;
                          if (
                              data.InputProxyChannelStatus &&
                              data.InputProxyChannelStatus.chanDetectResult !== undefined &&
                              data.InputProxyChannelStatus.chanDetectResult !== null
                          ) {
                              status = String(
                                  data.InputProxyChannelStatus.chanDetectResult
                              ).trim();
                          }
                          if (!status) {
                              return 255;
                          }
                          var normalizedStatus = status.toLowerCase();
                          var statusCodes = {
                              'connect': 1,
                              'connected': 1,
                              'normal': 1,
                              'ok': 1,
                              'success': 1,
                              'online': 1,
                              'connecting': 2,
                              'oversysbandwidth': 3,
                              'domainerror': 4,
                              'ipcstreamfail': 5,
                              'channoerror': 6,
                              'ipaddrconflictwithdev': 7,
                              'ipaddrconflicwithipc': 8,
                              'ipaddrconflictwithipc': 8,
                              'errorusernameorpasswd': 9,
                              'netunreachable': 10,
                              'unknownerror': 11,
                              'notexist':  12,
                              'ipcstreamtypenotsupport': 13,
                              'ipcresolutionnotsupport': 14,
                              'networkerror': 15,
                              'userpwderror': 16,
                              'noenoughbandwidth': 17,
                              'ipchannelconflict': 18,
                              'offline': 19,
                              'disconnect': 19,
                              'disconnected': 19
                          };
                          if (
                              Object.prototype.hasOwnProperty.call(
                                  statusCodes,
                                  normalizedStatus
                              )
                          ) {
                              return statusCodes[normalizedStatus];
                          }
                          return 255;
                      }
                      catch (error) {
                          return 255;
                      }
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'hikvision_nvr.camera.status[{#CAM_ID}.info]'
              tags:
                - tag: component
                  value: camera
            - uuid: 903827d645cb439aafe2670bb760bc36
              name: 'Camera {#CAM_ID}: Connection'
              type: DEPENDENT
              key: 'hikvision_nvr.camera[{#CAM_ID}.connection]'
              value_type: CHAR
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.InputProxyChannelStatus.chanDetectResult
                  error_handler: CUSTOM_VALUE
                  error_handler_params: unknown
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'hikvision_nvr.camera.status[{#CAM_ID}.info]'
              tags:
                - tag: component
                  value: camera
            - uuid: b006574c210647658a1ded0cdc48120f
              name: 'Camera {#CAM_ID}: IP Address'
              type: DEPENDENT
              key: 'hikvision_nvr.camera[{#CAM_ID}.ip]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.channels[?(@.id == "{#CAM_ID}")].sourceInputPortDescriptor.ipAddress.first()'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: hikvision_nvr.get_channels
              tags:
                - tag: component
                  value: camera
            - uuid: b5c7845b9af746f2b15b46a40db23b1d
              name: 'Camera {#CAM_ID}: Management port'
              type: DEPENDENT
              key: 'hikvision_nvr.camera[{#CAM_ID}.management_port]'
              description: 'Camera management port reported by the InputProxyChannel configuration.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.channels[?(@.id == "{#CAM_ID}")].sourceInputPortDescriptor.managePortNo.first()'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: hikvision_nvr.get_channels
              tags:
                - tag: component
                  value: camera
            - uuid: 03c1343ef0a545c5a3c6ae14133bcb14
              name: 'Camera {#CAM_ID}: Name'
              type: DEPENDENT
              key: 'hikvision_nvr.camera[{#CAM_ID}.name]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.channels[?(@.id == "{#CAM_ID}")].name.first()'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: hikvision_nvr.get_channels
              tags:
                - tag: component
                  value: camera
            - uuid: 9f113f3d75a84bd49f32fd209580b5da
              name: 'Camera {#CAM_ID}: Proxy protocol'
              type: DEPENDENT
              key: 'hikvision_nvr.camera[{#CAM_ID}.proxy.protocol]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.channels[?(@.id == "{#CAM_ID}")].sourceInputPortDescriptor.proxyProtocol.first()'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: hikvision_nvr.get_channels
              tags:
                - tag: component
                  value: camera
            - uuid: 7c30d99f72ee4e6092574aa9e115d89c
              name: 'Camera {#CAM_ID}: Online status code'
              type: DEPENDENT
              key: 'hikvision_nvr.camera[{#CAM_ID}.status.code]'
              valuemap:
                name: 'Camera status code'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      try {
                          var data = JSON.parse(value);
                          var online = data.InputProxyChannelStatus ? data.InputProxyChannelStatus.online : null;
                          if (online === true || online === 1 || String(online).toLowerCase() === 'true') {
                              return 1;
                          }
                          if (online === false || online === 0 || String(online).toLowerCase() === 'false') {
                              return 0;
                          }
                          return 2;
                      }
                      catch (error) {
                          return 2;
                      }
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'hikvision_nvr.camera.status[{#CAM_ID}.info]'
              tags:
                - tag: component
                  value: camera
            - uuid: 60aa9aad114c4a15a89d8110ae87c3a1
              name: 'Camera {#CAM_ID}: Online status'
              type: DEPENDENT
              key: 'hikvision_nvr.camera[{#CAM_ID}.status]'
              value_type: CHAR
              valuemap:
                name: 'Online status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.InputProxyChannelStatus.online
                  error_handler: CUSTOM_VALUE
                  error_handler_params: unknown
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'hikvision_nvr.camera.status[{#CAM_ID}.info]'
              tags:
                - tag: component
                  value: camera
          trigger_prototypes:
            - uuid: c79defdb07d1470c9a8d8e3b850568aa
              expression: 'last(/Hikvision NVR by web API/hikvision_nvr.camera[{#CAM_ID}.status.code])=0 and last(/Hikvision NVR by web API/hikvision_nvr.camera[{#CAM_ID}.connection])<>"notExist"'
              name: 'Hikvision: Camera {#CAM_ID} is offline'
              event_name: 'Hikvision: Camera {#CAM_ID} "{#CAM_NAME}" ({#CAM_IP}) is offline'
              opdata: 'Online: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'The camera reports an offline state. Channels reported as not existing are ignored.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Hikvision NVR by web API/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
          master_item:
            key: hikvision_nvr.get_channels
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var out = [];
                  var channels = data.channels || [];
                  if (!Array.isArray(channels)) {
                      channels = [channels];
                  }
                  channels.forEach(function (cam) {
                      var descriptor = cam.sourceInputPortDescriptor || {};
                      out.push({
                          "{#CAM_ID}": String(cam.id),
                          "{#CAM_NAME}": cam.name || ('Camera ' + cam.id),
                          "{#CAM_IP}": descriptor.ipAddress || ''
                      });
                  });
                  return JSON.stringify(out);
        - uuid: 6efadfe2785046d5909325a5c6e1f844
          name: 'Storage discovery'
          type: DEPENDENT
          key: hikvision_nvr.storage.discovery
          item_prototypes:
            - uuid: 0c1b5e9dd33f406197d58b2a9428c036
              name: 'HDD {#HDD_ID}: Capacity'
              type: DEPENDENT
              key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.capacity]'
              value_type: FLOAT
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.hdds[?(@.id == "{#HDD_ID}")].capacity.first()'
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '1048576'
              master_item:
                key: hikvision_nvr.get_storage
              tags:
