            - uuid: 9066b22a39a54b88adb581613721cbea
              name: 'HDD {#HDD_ID}: Used space'
              type: DEPENDENT
              key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.usedspace]'
              value_type: FLOAT
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.hdds[?(@.id == "{#HDD_ID}")].first()'
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var disk = JSON.parse(value);
                      var capacity = parseFloat(disk.capacity);
                      var free = parseFloat(disk.freeSpace);
                      if (!isFinite(capacity) || !isFinite(free)) {
                          throw 'Invalid disk capacity data';
                      }
                      return Math.max(0, capacity - free) * 1048576;
              master_item:
                key: hikvision_nvr.get_storage
              tags:
                - tag: component
                  value: hdd
            - uuid: de8db1184b724d09905dc851309d6324
              name: 'HDD {#HDD_ID}: Utilization'
              type: DEPENDENT
              key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.util]'
              value_type: FLOAT
              units: '%'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.hdds[?(@.id == "{#HDD_ID}")].first()'
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var disk = JSON.parse(value);
                      var capacity = parseFloat(disk.capacity);
                      var free = parseFloat(disk.freeSpace);
                      if (!isFinite(capacity) || !isFinite(free) || capacity <= 0) {
                          throw 'Invalid disk capacity data';
                      }
                      return Math.max(0, Math.min(100, (capacity - free) * 100 / capacity));
              master_item:
                key: hikvision_nvr.get_storage
              tags:
                - tag: component
                  value: hdd
              trigger_prototypes:
                - uuid: 641e9d86bae64580aaa47d964179b8b6
