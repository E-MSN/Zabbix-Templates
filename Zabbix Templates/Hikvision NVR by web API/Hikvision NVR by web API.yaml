                  value: hdd
            - uuid: 6129784d438946e2bb037c1b9bc1aeed
              name: 'HDD {#HDD_ID}: Free space'
              type: DEPENDENT
              key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.freespace]'
              value_type: FLOAT
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.hdds[?(@.id == "{#HDD_ID}")].freeSpace.first()'
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '1048576'
              master_item:
                key: hikvision_nvr.get_storage
              tags:
                - tag: component
                  value: hdd
            - uuid: ad4390f02a2d4c61bbabfd7e38bc717c
              name: 'HDD {#HDD_ID}: Name'
              type: DEPENDENT
              key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.name]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.hdds[?(@.id == "{#HDD_ID}")].hddName.first()'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: hikvision_nvr.get_storage
              tags:
                - tag: component
                  value: hdd
            - uuid: f928562c1130427e8d1ed9ce8ab72edf
              name: 'HDD {#HDD_ID}: SMART attributes'
              type: DEPENDENT
              key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.attributes]'
              history: 7d
              value_type: TEXT
              description: 'Raw SMART attribute list returned by the NVR.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      if (!data.attributes || !Array.isArray(data.attributes) || data.attributes.length === 0) throw 'SMART attributes not available';
                      return JSON.stringify(data.attributes);
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.raw]'
              tags:
                - tag: component
                  value: hdd
            - uuid: ea6f2b6247804b4faa4eaac0fb3638d8
              name: 'HDD {#HDD_ID}: SMART endpoint status'
              type: DEPENDENT
              key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.endpoint_status]'
              valuemap:
                name: 'SMART endpoint status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $._endpoint_status
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.raw]'
              tags:
                - tag: component
                  value: hdd
            - uuid: 3b6475f5ef6f452b82ef8fe2e37eb742
              name: 'HDD {#HDD_ID}: SMART Offline uncorrectable sector count'
              type: DEPENDENT
              key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.offline_uncorrectable]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var attributes = data.attributes || [];
                      var requested = String('198');
                      for (var i = 0; i < attributes.length; i++) {
                          var attribute = attributes[i] || {};
                          if (String(attribute.attributeID) !== requested) continue;
                          var raw = attribute.rawValue;
                          if (raw === undefined || raw === null) throw 'SMART raw value not available';
                          var match = String(raw).match(/\d+/);
                          if (!match) throw 'SMART raw value is not numeric';
                          return parseInt(match[0], 10);
                      }
                      throw 'SMART attribute not reported';
              master_item:
                key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.raw]'
              tags:
                - tag: component
                  value: hdd
            - uuid: 073a44b00972452eaab4ab6fe9872082
              name: 'HDD {#HDD_ID}: SMART overall health code'
              type: DEPENDENT
              key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.overall_health.code]'
              valuemap:
                name: 'SMART overall health code'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var status = String(value || '').trim().toLowerCase().replace(/[\s_-]+/g, '');
                      if (status === 'functional' || status === 'ok' || status === 'normal') return 0;
                      if (status === 'badsectors' || status === 'badsector') return 1;
                      if (status === 'fault' || status === 'failed' || status === 'error') return 2;
                      return 255;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.overall_health]'
              tags:
                - tag: component
                  value: hdd
              trigger_prototypes:
                - uuid: 1c95bd470e4d405397faa6f33ab65a93
                  expression: 'last(/Hikvision NVR by web API/hikvision_nvr.storage.hdd[{#HDD_ID}.smart.overall_health.code])=2'
                  name: 'Hikvision: HDD {#HDD_ID} SMART reports a fault'
                  event_name: 'Hikvision: HDD {#HDD_ID} "{#HDD_NAME}" SMART reports a fault'
                  opdata: 'Health: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'The NVR SMART summary reports a disk fault.'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: 889c53f7dee44ddab9945d0d7c4f68e7
                  expression: 'last(/Hikvision NVR by web API/hikvision_nvr.storage.hdd[{#HDD_ID}.smart.overall_health.code])=1'
                  name: 'Hikvision: HDD {#HDD_ID} SMART reports bad sectors'
                  event_name: 'Hikvision: HDD {#HDD_ID} "{#HDD_NAME}" SMART reports bad sectors'
                  opdata: 'Health: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'The NVR SMART summary reports bad sectors on the disk.'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 8169fd7919974120ac780a60aba86162
              name: 'HDD {#HDD_ID}: SMART overall health'
              type: DEPENDENT
              key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.overall_health]'
              value_type: TEXT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      if (!data.smart) throw 'SMART data not available';
                      var result = data.smart.allEvaluaingStatus;
                      if (result === undefined || result === null) result = data.smart.allEvaluatingStatus;
                      if (result === undefined || result === null || String(result) === '') throw 'SMART overall health not available';
                      return String(result);
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.raw]'
              tags:
                - tag: component
                  value: hdd
            - uuid: 5cffe8ebd0bf4121a7f1a87b24a31153
              name: 'HDD {#HDD_ID}: SMART Current pending sector count'
              type: DEPENDENT
              key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.pending_sectors]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var attributes = data.attributes || [];
                      var requested = String('197');
                      for (var i = 0; i < attributes.length; i++) {
                          var attribute = attributes[i] || {};
                          if (String(attribute.attributeID) !== requested) continue;
                          var raw = attribute.rawValue;
                          if (raw === undefined || raw === null) throw 'SMART raw value not available';
                          var match = String(raw).match(/\d+/);
                          if (!match) throw 'SMART raw value is not numeric';
                          return parseInt(match[0], 10);
                      }
                      throw 'SMART attribute not reported';
              master_item:
                key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.raw]'
              tags:
                - tag: component
                  value: hdd
            - uuid: b48eb4feaf3244f78fc39c0cbbe3f301
              name: 'HDD {#HDD_ID}: SMART power-on days'
              type: DEPENDENT
              key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.power_on_days]'
              units: d
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      if (!data.smart) throw 'SMART data not available';
                      var result = parseInt(data.smart.powerOnDay, 10);
                      if (!isFinite(result) || result < 0) throw 'SMART power-on days not available';
                      return result;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.raw]'
              tags:
                - tag: component
                  value: hdd
            - uuid: 267e7e40d3284efc983815c5baed4bc2
              name: 'HDD {#HDD_ID}: Get SMART status'
              type: HTTP_AGENT
              key: 'hikvision_nvr.storage.hdd[{#HDD_ID}.smart.raw]'
              history: '0'
              value_type: TEXT
              authtype: DIGEST
              username: '{$HIKVISION_ISAPI.USER}'
              password: '{$HIKVISION_ISAPI.PASSWORD}'
              description: 'Raw and normalized response from the Hikvision HDD SMART status endpoint.'
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '{"html":{"head":{"title":"Connection error"}}}'
                - type: XML_TO_JSON
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '{"html":{"head":{"title":"Connection error"}}}'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var title = '';
                      if (data.html && data.html.head && data.html.head.title) {
                          title = String(data.html.head.title).toLowerCase();
                          if (title.indexOf('unauthorized') !== -1 || title.indexOf('forbidden') !== -1) {
                              return JSON.stringify({_endpoint_status: 1, _error: title});
                          }
                          return JSON.stringify({_endpoint_status: 2, _error: title || 'HTTP response error'});
                      }
                      var smart = data.SMARTTestStatus || data.SmartTestStatus || data.smartTestStatus;
                      if (!smart) {
                          if (data.ResponseStatus || data.responseStatus) {
                              return JSON.stringify({_endpoint_status: 3, response: data.ResponseStatus || data.responseStatus});
                          }
                          return JSON.stringify({_endpoint_status: 3, response: data});
                      }
                      var attributes = [];
                      if (smart.TestResultList && smart.TestResultList.TestResult) {
                          attributes = smart.TestResultList.TestResult;
                      }
                      if (!Array.isArray(attributes)) {
                          attributes = attributes ? [attributes] : [];
                      }
                      return JSON.stringify({
                          _endpoint_status: 0,
                          smart: smart,
                          attributes: attributes
                      });
              url: '{$HIKVISION_ISAPI.SCHEME}://{$HIKVISION_ISAPI.HOST}:{$HIKVISION_ISAPI.PORT}/ISAPI/ContentMgmt/Storage/hdd/{#HDD_ID}/SMARTTest/status'
