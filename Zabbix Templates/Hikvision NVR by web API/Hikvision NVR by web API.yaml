        - uuid: c6877e7ac673403b90c589ecfb96e987
          name: 'Memory utilization'
          type: DEPENDENT
          key: hikvision_nvr.memory.util
          value_type: FLOAT
          units: '%'
          description: 'Percentage of used memory calculated from the used and available memory values reported by the NVR.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var memory = data.DeviceStatus && data.DeviceStatus.MemoryList ? data.DeviceStatus.MemoryList.Memory : null;
                  
                  if (Array.isArray(memory)) {
                      memory = memory[0];
                  }
                  if (!memory) {
                      throw 'Memory data is missing';
                  }
                  var used = parseFloat(memory.memoryUsage);
                  var available = parseFloat(memory.memoryAvailable);
                  var total = used + available;
                  if (!isFinite(used) || !isFinite(available) || total <= 0) {
                      throw 'Invalid memory data';
                  }
                  return used * 100 / total;
          master_item:
            key: hikvision_nvr.get_status
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: a0b6fafcb6f74e2389748d20c5e29611
