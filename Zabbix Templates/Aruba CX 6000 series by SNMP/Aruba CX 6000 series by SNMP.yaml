                  value: vsx
          master_item:
            key: aruba.vsx.walk
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var lines = value.split("\n");
                  var roleOid = '1.3.6.1.4.1.47196.4.1.1.3.7.1.4.1.0';
                  var operationalOids = {
                      '1.3.6.1.4.1.47196.4.1.1.3.7.1.4.2.0': true,
                      '1.3.6.1.4.1.47196.4.1.1.3.7.2.1.1.0': true,
                      '1.3.6.1.4.1.47196.4.1.1.3.7.2.2.1.0': true
                  };
                  function normalizeOid(oid) {
                      oid = String(oid || '').replace(/^\./, '');
                      if (oid.indexOf('iso.3.6.') === 0) {
                          oid = '1.3.6.' + oid.substring('iso.3.6.'.length);
                      }
                      return oid;
                  }
                  function getLastNumericValue(line) {
                      var match = String(line).match(/(-?\d+)\s*$/);
                      return match ? match[1] : '';
                  }
                  for (var i = 0; i < lines.length; i++) {
                      var line = lines[i];
                      if (!line) {
                          continue;
                      }
                      var oid = normalizeOid(line.split(/\s+/)[0]);
                      if (oid === roleOid) {
                          var role = getLastNumericValue(line);
                          if (role === '1' || role === '2') {
                              return JSON.stringify([{'{#VSXINSTANCE}': '1'}]);
                          }
                      }
                      if (operationalOids[oid]) {
                          return JSON.stringify([{'{#VSXINSTANCE}': '1'}]);
                      }
                  }
                  return JSON.stringify([]);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 7d5d0bc1468b44ad9a19b1e1bf99a6e5
          name: 'Chassis / stack member discovery'
          type: DEPENDENT
          key: entity.chassis.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#ENTCLASS}'
                value: ^3$
          description: 'Discovering chassis and stack members from ENTITY-MIB entPhysicalTable.'
          item_prototypes:
            - uuid: 8984d172541e4c5f9c752f7aa2dfa007
              name: 'Chassis [{#CHASSISNO}]: Description'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.2.{#SNMPINDEX}'
              key: 'entity.chassis.descr[entPhysicalDescr.{#SNMPINDEX}]'
              delay: 30m
              value_type: CHAR
              description: |
                MIB: ENTITY-MIB
                Physical entity description.
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: chassis
            - uuid: b34ef2a8cc18453289a3f5bf1fa86663
              name: 'Chassis [{#CHASSISNO}]: Firmware'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.10.{#SNMPINDEX}'
              key: 'entity.chassis.firmware[entPhysicalSoftwareRev.{#SNMPINDEX}]'
              delay: 30m
              value_type: CHAR
              description: |
                MIB: ENTITY-MIB
                Physical entity software revision.
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: chassis
              trigger_prototypes:
                - uuid: d246917ab34f43cab02c8991d8dbc65e
                  expression: |
                    last(/Aruba CX 6000 series by SNMP/entity.chassis.firmware[entPhysicalSoftwareRev.{#SNMPINDEX}],#1)<>last(/Aruba CX 6000 series by SNMP/entity.chassis.firmware[entPhysicalSoftwareRev.{#SNMPINDEX}],#2)
                    and
                    length(last(/Aruba CX 6000 series by SNMP/entity.chassis.firmware[entPhysicalSoftwareRev.{#SNMPINDEX}],#1))>0
                  name: 'Chassis [{#CHASSISNO}]: Firmware version has changed'
                  opdata: 'Current firmware: {ITEM.LASTVALUE1}'
                  priority: INFO
                  description: |
                    The firmware version has changed for this chassis/member.
                    This is usually expected after a firmware upgrade.
                    Acknowledge to close the problem manually.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: e298dbf013894eb4a8e9bf55c0d5d9ea
              name: 'Chassis [{#CHASSISNO}]: Model'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.13.{#SNMPINDEX}'
              key: 'entity.chassis.model[entPhysicalModelName.{#SNMPINDEX}]'
              delay: 30m
              value_type: CHAR
              description: |
                MIB: ENTITY-MIB
                Physical entity model name.
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: chassis
            - uuid: 85ea5435cc09423fa44ef208110ed1a8
              name: 'Chassis [{#CHASSISNO}]: Serial number'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.47.1.1.1.1.11.{#SNMPINDEX}'
              key: 'entity.chassis.serial[entPhysicalSerialNum.{#SNMPINDEX}]'
              delay: 30m
              value_type: CHAR
              description: |
                MIB: ENTITY-MIB
                Physical entity serial number.
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: chassis
          master_item:
            key: entity.physical.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#ENTDESCR}'
                - 1.3.6.1.2.1.47.1.1.1.1.2
                - '0'
                - '{#ENTCLASS}'
                - 1.3.6.1.2.1.47.1.1.1.1.5
                - '0'
                - '{#ENTNAME}'
                - 1.3.6.1.2.1.47.1.1.1.1.7
                - '0'
                - '{#ENTSOFTWARE}'
                - 1.3.6.1.2.1.47.1.1.1.1.10
                - '0'
                - '{#ENTSERIAL}'
                - 1.3.6.1.2.1.47.1.1.1.1.11
                - '0'
                - '{#ENTMODEL}'
                - 1.3.6.1.2.1.47.1.1.1.1.13
                - '0'
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  for (var i = 0; i < data.length; i++) {
                      var idx = parseInt(data[i]['{#SNMPINDEX}'],   10);
                      if (!isNaN(idx)) {
                          data[i]['{#CHASSISNO}'] = String(idx >= 100000 ? Math.floor(idx / 100000)   : idx);
                      } else {
                          data[i]['{#CHASSISNO}'] = data[i]['{#SNMPINDEX}'];
                      }
                  }
                  return JSON.stringify(data);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 6d46c48f1c9e47699e64f221dbee7493
          name: 'Network interfaces discovery'
          type: DEPENDENT
          key: net.if.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.MATCHES}'
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFALIAS}'
                value: '{$NET.IF.IFALIAS.MATCHES}'
              - macro: '{#IFALIAS}'
                value: '{$NET.IF.IFALIAS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.MATCHES}'
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFOPERSTATUS}'
                value: '{$NET.IF.IFOPERSTATUS.MATCHES}'
              - macro: '{#IFOPERSTATUS}'
                value: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.MATCHES}'
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: |
            Discovering interfaces from IF-MIB.
            Traffic counters use ifHCInOctets/ifHCOutOctets and speed uses ifHighSpeed.
          item_prototypes:
            - uuid: 3173ae87725c4a29860cd277fdb7b9b3
              name: 'Interface {#IFNAME}: Excessive collisions'
              type: DEPENDENT
              key: 'net.if.collision.excessive[dot3StatsExcessiveCollisions.{#SNMPINDEX}]'
              units: pps
              description: |
                MIB: EtherLike-MIB
                Count of frames for which transmission failed due to excessive collisions.
                Value is stored as a per-second rate from the raw Counter32 value.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.10.7.2.1.9.{#SNMPINDEX}'
                    - '0'
                  error_handler: DISCARD_VALUE
                - type: CHANGE_PER_SECOND
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3m
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 8b25cfc54a9a4e86a31be2f7c527f154
              name: 'Interface {#IFNAME}: Late collisions'
              type: DEPENDENT
              key: 'net.if.collision.late[dot3StatsLateCollisions.{#SNMPINDEX}]'
              units: pps
              description: |
                MIB: EtherLike-MIB
                Count of late collision events detected on this interface.
                Value is stored as a per-second rate from the raw Counter32 value.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.10.7.2.1.10.{#SNMPINDEX}'
                    - '0'
                  error_handler: DISCARD_VALUE
                - type: CHANGE_PER_SECOND
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3m
              master_item:
                key: net.if.walk
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 0fde09074c1e40c1812b3fd1b80ab382
              name: 'Interface {#IFNAME}: Multiple collision frames'
              type: DEPENDENT
              key: 'net.if.collision.multiple[dot3StatsMultipleCollisionFrames.{#SNMPINDEX}]'
              units: pps
              description: |
                MIB: EtherLike-MIB
                Count of successfully transmitted frames for which transmission was inhibited by more than one collision.
                Value is stored as a per-second rate from the raw Counter32 value.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.10.7.2.1.5.{#SNMPINDEX}'
                    - '0'
                  error_handler: DISCARD_VALUE
                - type: CHANGE_PER_SECOND
                - type: DISCARD_UNCHANGED_HEARTBEAT
