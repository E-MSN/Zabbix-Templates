        - uuid: a1a96027779e41b69348a51049224f1f
          name: 'SNMP walk network interfaces'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.2.2.1.8,1.3.6.1.2.1.2.2.1.7,1.3.6.1.2.1.31.1.1.1.18,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.2.2.1.2,1.3.6.1.2.1.2.2.1.3,1.3.6.1.2.1.31.1.1.1.6,1.3.6.1.2.1.31.1.1.1.10,1.3.6.1.2.1.2.2.1.14,1.3.6.1.2.1.2.2.1.20,1.3.6.1.2.1.2.2.1.19,1.3.6.1.2.1.2.2.1.13,1.3.6.1.2.1.31.1.1.1.15,1.3.6.1.2.1.10.7.2.1.3,1.3.6.1.2.1.10.7.2.1.4,1.3.6.1.2.1.10.7.2.1.5,1.3.6.1.2.1.10.7.2.1.9,1.3.6.1.2.1.10.7.2.1.10,1.3.6.1.2.1.10.7.2.1.13]'
