            - uuid: 4328949ffbc94611934ea004dc6f1bfd
              name: 'VSF port [{#VSF.PORT}]: Operational status'
              type: DEPENDENT
              key: 'aruba.vsf.port.status[arubaWiredVsfv2PortOperStatus.{#SNMPINDEX}]'
              description: 'VSF port operational status.'
              valuemap:
                name: 'ARUBAWIRED-VSFv2-MIB::linkStatus'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.15.1.4.1.2.{#SNMPINDEX}'
                    - '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      function clean(v) {
                          v = String(v || '').trim().toLowerCase();
                          v = v.replace(/^string:\s*/, '');
                          v = v.replace(/^octetstring:\s*/, '');
                          v = v.replace(/^"|"$/g, '');
                          return v;
                      }
                      var v  = clean(value);
                      if (v === 'up') { return 1; }
                      if (v === 'down') { return 2; }
                      if (v === '' || v === 'unknown') { return 0; }
                      return 3;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: aruba.vsf.walk
              tags:
                - tag: component
                  value: vsf
                - tag: vsf_port
                  value: '{#VSF.PORT}'
            - uuid: 505ace1a2506423094cfeeb130aeb57b
              name: 'VSF port [{#VSF.PORT}]: Status detail'
              type: DEPENDENT
              key: 'aruba.vsf.port.status_str[arubaWiredVsfv2PortStatusStr.{#SNMPINDEX}]'
              value_type: CHAR
              description: 'Detailed status string for the VSF interface.'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.15.1.4.1.3.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: aruba.vsf.walk
              tags:
                - tag: component
                  value: vsf
                - tag: vsf_port
                  value: '{#VSF.PORT}'
          master_item:
            key: aruba.vsf.walk
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var lines = value.split("\n");
                  var base = '1.3.6.1.4.1.47196.4.1.1.3.15.1.4.1.1';
                  var ifNameBase = '1.3.6.1.2.1.31.1.1.1.1';
                  var seen = {};
                  var ifNames = {};
                  var ports  = [];
                  var out = [];
                  function normalizeOid(oid) {
                      oid = String(oid || '').replace(/^\./, '');
                      if (oid.indexOf('iso.3.6.') === 0) {
                          oid = '1.3.6.' +  oid.substring('iso.3.6.'.length);
                      }
                      return oid;
                  }
                  function extractValue(line) {
                      var pos = line.indexOf('=');
                      if (pos === -1)  { return ''; }
                      var  v = line.substring(pos + 1).trim();
                      v = v.replace(/^STRING:\s*/i, '');
                      v = v.replace(/^\"|\"$/g, '');
                      return v;
                  }
                  for (var i = 0; i < lines.length;  i++) {
                      var line = lines[i];
                      if (!line) { continue; }
                      var oid = normalizeOid(line.split(/\s+/)[0]);
                      if (oid.indexOf(ifNameBase  + '.') === 0) {
                           var ifidx = oid.substring(ifNameBase.length + 1);
                          ifNames[ifidx] = extractValue(line);
                           continue;
                      }
                      if (oid.indexOf(base + '.') !== 0) { continue;  }
                      var idx = oid.substring(base.length  + 1);
                      if (!idx || seen[idx]) { continue; }
                      seen[idx] = true;
                      ports.push(idx);
                  }
                  for (var j  = 0; j < ports.length;  j++) {
                      var idx = ports[j];
                      out.push({
                          '{#SNMPINDEX}': idx,
                          '{#VSF.PORT}': ifNames[idx] || ('ifIndex ' + idx)
                      });
                  }
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
