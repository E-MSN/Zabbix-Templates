        - uuid: 2a5b5b72b5e14c0387cfc55bee71e5c1
          name: 'VSF: Topology'
          type: DEPENDENT
          key: 'aruba.vsf.topology[arubaWiredVsfv2Topology.0]'
          description: |
            MIB: ARUBAWIRED-VSFv2-MIB
            Physical VSF topology normalized to numeric values.
          valuemap:
            name: 'ARUBAWIRED-VSFv2-MIB::topology'
          preprocessing:
            - type: SNMP_WALK_VALUE
              parameters:
                - 1.3.6.1.4.1.47196.4.1.1.3.15.1.1.2.0
                - '0'
            - type: JAVASCRIPT
              parameters:
                - |
                  function clean(v) {
                      v = String(v || '').trim().toLowerCase();
                      v = v.replace(/^string:\s*/, '');
                      v = v.replace(/^octetstring:\s*/, '');
                      v = v.replace(/^"|"$/g, '');
                      return v;
                  }
                  var v = clean(value);
                  if (v === 'standalone') { return 1; }
                  if (v === 'chain') { return 2; }
                  if (v === 'ring') { return 3; }
                  if (v  === '' || v === 'unknown') { return 0; }
                  return 4;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: aruba.vsf.walk
          tags:
            - tag: component
              value: vsf
        - uuid: afa49fe44a344299a0b8d8c5a5c221d2
          name: 'SNMP walk VSF'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.47196.4.1.1.3.15.1,1.3.6.1.2.1.31.1.1.1.1]'
