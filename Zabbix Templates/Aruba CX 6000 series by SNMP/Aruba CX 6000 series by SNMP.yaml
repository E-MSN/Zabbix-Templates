                    host: 'Aruba CX 6000 series by SNMP'
                    key: 'poe.port.reserved_power[arubaWiredPoePethPsePortReservedPower.{#SNMPINDEX}]'
          master_item:
            key: peth.walk
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var lines = value.split("\n");
                  var admin_base = '1.3.6.1.2.1.105.1.1.1.3';
                  var ports = [];
                  var seen = {};
                  function normalizeOid(oid) {
                      oid = String(oid || '').replace(/^\./, '');
                      if (oid.indexOf('iso.3.6.') === 0) {
                          oid = '1.3.6.' + oid.substring('iso.3.6.'.length);
                      }
                      return oid;
                  }
                  for (var i = 0; i < lines.length;  i++) {
                      var line = lines[i];
                      if (!line) {
                          continue;
                      }
                      var  oid = normalizeOid(line.split(/\s+/)[0]);
                      if (oid.indexOf(admin_base + '.') !== 0) {
                          continue;
                      }
                      var idx = oid.substring(admin_base.length + 1);
                      if (!idx || seen[idx]) {
                          continue;
                      }
                      seen[idx] = true;
                      ports.push(idx);
                  }
                  var out = [];
                  for (var j = 0; j < ports.length; j++)  {
                      var idx = ports[j];
                      var p = idx.split('.');
                      if (p.length < 2) {
                          continue;
                      }
                      var group = p[0];
                      var port = p.slice(1).join('.');
                      var portName = group + '/1/' + port;
                      out.push({
                          '{#SNMPINDEX}': idx,
                          '{#PETHGROUP}': group,
                          '{#PETHPORT}': port,
                          '{#POEPORT}': portName
                      });
                  }
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
