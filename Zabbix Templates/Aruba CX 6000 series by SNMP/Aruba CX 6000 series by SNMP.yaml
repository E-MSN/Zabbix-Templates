                  value: vsf
                - tag: vsf_member
                  value: '{#VSF.MEMBER}'
            - uuid: 35938e4ab4884fe4b7ce6fb764739572
              name: 'VSF member [{#VSF.MEMBER}]: Status'
              type: DEPENDENT
              key: 'aruba.vsf.member.status[arubaWiredVsfv2MemberStatus.{#SNMPINDEX}]'
              description: 'VSF member status normalized from text to numeric.'
              valuemap:
                name: 'ARUBAWIRED-VSFv2-MIB::memberStatus'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.15.1.2.1.3.{#SNMPINDEX}'
                    - '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      function clean(v) {
                          v = String(v || '').trim().toLowerCase();
                          v = v.replace(/^string:\s*/, '');
                          v = v.replace(/^octetstring:\s*/, '');
                          v = v.replace(/^"|"$/g, '');
                          return v;
                      }
                      var v = clean(value);
                      if (v === 'ready' || v === 'ok' || v === 'up') { return 1; }
                      if (v === 'booting' || v === 'initializing' || v  === 'init' || v === 'joining' || v === 'provisioning') { return 2; }
                      if (v === 'down' || v === 'fault' || v === 'faulty' || v === 'failed' || v === 'failure' || v === 'not_ready' || v === 'not ready' || v === 'missing') { return 3; }
                      if (v === '' || v === 'unknown') { return 0; }
                      return 4;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: aruba.vsf.walk
              tags:
                - tag: component
                  value: vsf
                - tag: vsf_member
                  value: '{#VSF.MEMBER}'
              trigger_prototypes:
                - uuid: 38c1b539705846cabe7c444a1c701205
                  expression: 'last(/Aruba CX 6000 series by SNMP/aruba.vsf.member.status[arubaWiredVsfv2MemberStatus.{#SNMPINDEX}])<>1'
                  name: 'Aruba: VSF member [{#VSF.MEMBER}]: Status is not "ready"'
                  event_name: 'Aruba: VSF member [{#VSF.MEMBER}]: Status is not "ready": {ITEM.LASTVALUE}'
                  opdata: 'Current status: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'VSF member status is not ready.'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 6c04f0b08ad640acacf5cffea3f4e677
              name: 'VSF member [{#VSF.MEMBER}]: Uptime'
              type: DEPENDENT
              key: 'aruba.vsf.member.uptime[arubaWiredVsfv2MemberBootTime.{#SNMPINDEX}]'
              units: uptime
              description: 'VSF member boot time / uptime in TimeTicks, converted to seconds.'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.15.1.2.1.11.{#SNMPINDEX}'
                    - '0'
                - type: MULTIPLIER
                  parameters:
                    - '0.01'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 30m
              master_item:
                key: aruba.vsf.walk
              tags:
                - tag: component
                  value: vsf
                - tag: vsf_member
                  value: '{#VSF.MEMBER}'
          master_item:
            key: aruba.vsf.walk
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var lines = value.split("\n");
                  var base = '1.3.6.1.4.1.47196.4.1.1.3.15.1.2.1.1';
                  var seen = {};
                  var out  = [];
                  function normalizeOid(oid) {
                      oid = String(oid || '').replace(/^\./, '');
                      if (oid.indexOf('iso.3.6.') === 0) {
                          oid = '1.3.6.' + oid.substring('iso.3.6.'.length);
                      }
                      return oid;
                  }
                  function getOid(line) {
                      var pos = line.indexOf('=');
                      var oid = pos === -1 ? line : line.substring(0, pos);
                      return normalizeOid(oid.trim());
                  }
                  for (var i = 0; i < lines.length; i++) {
                      var line = lines[i];
                      if (!line) { continue; }
                      var oid = getOid(line);
                      if (oid.indexOf(base + '.') !== 0) { continue; }
                      var idx = oid.substring(base.length + 1);
                      if (!idx || seen[idx]) { continue; }
                      seen[idx] = true;
                      out.push({
                          '{#SNMPINDEX}': idx,
                          '{#VSF.MEMBER}': idx
                      });
                  }
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: d9d98720055549519d65de7745784729
