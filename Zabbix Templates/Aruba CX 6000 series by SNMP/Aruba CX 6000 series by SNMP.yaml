              name: 'VSF link [{#VSF.MEMBER}/{#VSF.LINK}]: Peer member'
              type: DEPENDENT
              key: 'aruba.vsf.link.peer_member[arubaWiredVsfv2LinkPeerMemberId.{#SNMPINDEX}]'
