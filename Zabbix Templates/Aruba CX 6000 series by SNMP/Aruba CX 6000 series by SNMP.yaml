              key: 'aruba.vsf.port.peer_product_type[arubaWiredVsfv2PortPeerProductType.{#SNMPINDEX}]'
              value_type: CHAR
              description: 'Product type of the peer VSF switch connected to this interface.'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.15.1.4.1.6.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
