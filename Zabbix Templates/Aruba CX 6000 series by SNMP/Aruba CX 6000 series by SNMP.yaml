            - uuid: e8b3dc978764401ab693ba28bfa7968a
              name: 'Module [{#SNMPVALUE}]: Storage security utilization'
              type: DEPENDENT
              key: 'aruba.system.storage.security.utilization[arubaWiredSystemInfoStorageSecurity.{#SNMPINDEX}]'
              units: '%'
              description: |
                MIB: ARUBAWIRED-SYSTEMINFO-MIB
                Utilization of security storage partition in percent.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.22.1.0.1.1.8.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: aruba.system.resource.walk
              tags:
                - tag: component
                  value: memory
            - uuid: 1c7f46cafdef4c5d8df1af93378b2058
              name: 'Module [{#SNMPVALUE}]: Storage self test utilization'
              type: DEPENDENT
              key: 'aruba.system.storage.selftest.utilization[arubaWiredSystemInfoStorageSelftest.{#SNMPINDEX}]'
              units: '%'
              description: |
                MIB: ARUBAWIRED-SYSTEMINFO-MIB
                Utilization of self test storage partition in percent.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.22.1.0.1.1.9.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: aruba.system.resource.walk
              tags:
                - tag: component
                  value: memory
          master_item:
            key: aruba.system.resource.walk
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  const data = value.split("\n");
                  var base_oid = ".1.3.6.1.4.1.47196.4.1.1.3.22.1.0.1.1.3",
                  lld_json = [];
                  for (var line in data) {
                      var index = data[line].indexOf(base_oid);
                      if (index !== -1) {
                          var result = [],
                              oid = data[line].split(' ')[0],
                              tail = oid.substring(index + base_oid.length + 1),
                              parts = tail.split('.');
                          var i = 0;
                          while (i < parts.length) {
                              var len = parseInt(parts[i]);
                              if (isNaN(len) || len < 1 || i + len >= parts.length) {
                                  i++;
                                  continue;
                              }
                              var isAscii = true;
                              for (var j = 0; j < len; j++) {
                                  var val = parseInt(parts[i + 1 + j]);
                                  if (val < 32 || val > 126) {
                                      isAscii = false;
                                      break;
                                  }
                              }
                              if  (isAscii) {
                                  var str = '';
                                  for (var j = 0; j < len; j++) {
                                      str += String.fromCharCode(parseInt(parts[i + 1 + j]));
                                  }
                                  result.push(str);
                                  i = i + 1 + len;
                              } else {
                                  i++;
                              }
                          }
                          lld_json.push({'{#SNMPVALUE}': result.join("  "), '{#SNMPINDEX}': tail});
                      }
                  }
                  return JSON.stringify(lld_json);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 3959b7df1cee48a383ed8e7f713d350d
          name: 'Sensor discovery'
          type: DEPENDENT
          key: aruba.sensor.discovery
          description: |
            Used for discovering temperature sensors from ARUBAWIRED-TEMPSENSOR-MIB.
            Temperature is reported in milli-degrees Celsius and converted to Celsius.
          item_prototypes:
            - uuid: da628070ff6241c6854217b682b9223b
              name: 'Sensor [{#SNMPVALUE}]: State'
              type: DEPENDENT
              key: 'aruba.system.sensors[arubaWiredTempSensorState.{#SNMPINDEX}]'
              description: |
                MIB value is returned as text by Aruba CX and normalized to an unsigned integer.
                Mapping:
                0 - unknown/unmapped
                1 - ok/normal
                2 - warning
                3 - critical/fault/failed
                4 - absent/not present
                5 - disabled
                6 - unsupported
              valuemap:
                name: 'Aruba hardware status'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.11.3.1.1.6.{#SNMPINDEX}'
                    - '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = String(value).trim().toLowerCase();
                      if (v === '1' || v === 'ok' || v === 'normal' || v === 'good' || v === 'present') {
                          return 1;
                      }
                      if (v === '2' || v === 'warning' || v === 'warn' || v === 'minor') {
                            return 2;
                      }
                      if (v === '3' || v === 'critical' || v === 'crit' || v === 'major' || v === 'fault' || v === 'faulty' || v === 'failed' || v === 'failure' || v === 'error') {
                          return 3;
                      }
                      if (v === '4' || v === 'absent' || v === 'not present' || v === 'notpresent' || v === 'n/a' || v === 'na') {
                          return 4;
                      }
                       if  (v === '5' || v === 'disabled' || v === 'disable') {
                          return 5;
                      }
                      if (v === '6' || v === 'unsupported' || v === 'not supported' || v === 'notsupported') {
                          return 6;
                      }
                      return 0;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 12h
              master_item:
                key: aruba.system.sensor.walk
              tags:
                - tag: component
                  value: sensor
                - tag: sensor
                  value: '{#SNMPVALUE}'
              trigger_prototypes:
                - uuid: 5125cd35cbff4af48fa7e07e16d52037
                  expression: 'last(/Aruba CX 6000 series by SNMP/aruba.system.sensors[arubaWiredTempSensorState.{#SNMPINDEX}])<>1'
                  name: 'Aruba: Sensor [{#SNMPVALUE}]: State is not "normal"'
                  event_name: 'Aruba: Sensor [{#SNMPVALUE}]: State is not "normal": {ITEM.LASTVALUE}'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'The temperature sensor state is not normal (1).'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
            - uuid: 67cead5ee85940509127996429c6100d
              name: 'Sensor [{#SNMPVALUE}]: Temperature'
              type: DEPENDENT
              key: 'aruba.system.sensors[arubaWiredTempSensorTemperature.{#SNMPINDEX}]'
              value_type: FLOAT
              units: °C
              description: |
                MIB: ARUBAWIRED-TEMPSENSOR-MIB
                Current temperature value read from the temperature sensor.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.11.3.1.1.7.{#SNMPINDEX}'
                    - '0'
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: aruba.system.sensor.walk
              tags:
                - tag: component
                  value: sensor
                - tag: sensor
                  value: '{#SNMPVALUE}'
          graph_prototypes:
            - uuid: 6ccf36882aae4d2e83685f8171a22535
              name: 'Sensor [{#SNMPVALUE}]: Temperature'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: 'Aruba CX 6000 series by SNMP'
                    key: 'aruba.system.sensors[arubaWiredTempSensorTemperature.{#SNMPINDEX}]'
          master_item:
            key: aruba.system.sensor.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#SNMPVALUE}'
                - 1.3.6.1.4.1.47196.4.1.1.3.11.3.1.1.5
                - '0'
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: f74713f0259c4050bca30b7498547a6e
          name: 'VSF link discovery'
          type: DEPENDENT
          key: aruba.vsf.link.discovery
          description: 'Discovers VSF logical links from ARUBAWIRED-VSFv2-MIB.'
          item_prototypes:
            - uuid: 6a1163e2df6f4753a3dc05caea39d333
              name: 'VSF link [{#VSF.MEMBER}/{#VSF.LINK}]: Peer link'
              type: DEPENDENT
