            - uuid: 444b6b4431dc4ca5b95f92413726da2a
              name: 'VSF member [{#VSF.MEMBER}]: Role'
              type: DEPENDENT
              key: 'aruba.vsf.member.role[arubaWiredVsfv2MemberRole.{#SNMPINDEX}]'
              description: 'VSF member role normalized from text to numeric.'
              valuemap:
                name: 'ARUBAWIRED-VSFv2-MIB::memberRole'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.15.1.2.1.2.{#SNMPINDEX}'
                    - '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      function clean(v) {
                          v = String(v || '').trim().toLowerCase();
                          v = v.replace(/^string:\s*/, '');
                          v = v.replace(/^octetstring:\s*/, '');
                          v = v.replace(/^"|"$/g, '');
                          return v;
                      }
                      var v  = clean(value);
                      if (v === 'conductor' || v === 'commander') { return 1; }
                      if (v === 'standby') { return 2;  }
                      if (v === 'member') { return 3; }
                      if (v === '' || v === 'unknown') { return 0; }
                      return 4;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: aruba.vsf.walk
              tags:
                - tag: component
                  value: vsf
                - tag: vsf_member
                  value: '{#VSF.MEMBER}'
            - uuid: 746bf33d4863455f87b6b8c8d1ee8ed1
              name: 'VSF member [{#VSF.MEMBER}]: Serial number'
              type: DEPENDENT
