          item_prototypes:
            - uuid: c8d169da3b3044339cda9ab128c2e67c
              name: 'VSF member [{#VSF.MEMBER}]: Boot image'
              type: DEPENDENT
              key: 'aruba.vsf.member.boot_image[arubaWiredVsfv2MemberBootImage.{#SNMPINDEX}]'
              value_type: CHAR
              description: 'VSF member boot image.'
              preprocessing:
                - type: SNMP_WALK_VALUE
