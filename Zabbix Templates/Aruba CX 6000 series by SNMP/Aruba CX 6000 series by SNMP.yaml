                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.15.1.3.1.4.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: aruba.vsf.walk
              tags:
                - tag: component
                  value: vsf
                - tag: vsf_link
                  value: '{#VSF.LINK}'
                - tag: vsf_member
                  value: '{#VSF.MEMBER}'
            - uuid: 24a62ebe57964504958e02983236f753
              name: 'VSF link [{#VSF.MEMBER}/{#VSF.LINK}]: Local port list'
              type: DEPENDENT
              key: 'aruba.vsf.link.port_list[arubaWiredVsfv2LinkPortList.{#SNMPINDEX}]'
              value_type: CHAR
              description: 'Interface or interface list associated to this VSF link.'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.15.1.3.1.6.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: aruba.vsf.walk
              tags:
                - tag: component
                  value: vsf
                - tag: vsf_link
                  value: '{#VSF.LINK}'
                - tag: vsf_member
                  value: '{#VSF.MEMBER}'
            - uuid: 719cdf0669cf4780aa9a28ae21e48330
              name: 'VSF link [{#VSF.MEMBER}/{#VSF.LINK}]: Status'
              type: DEPENDENT
              key: 'aruba.vsf.link.status[arubaWiredVsfv2LinkOperStatus.{#SNMPINDEX}]'
              description: 'VSF link operational status.'
              valuemap:
                name: 'ARUBAWIRED-VSFv2-MIB::linkStatus'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.15.1.3.1.3.{#SNMPINDEX}'
                    - '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      function clean(v) {
                          v = String(v || '').trim().toLowerCase();
                          v = v.replace(/^string:\s*/, '');
                          v = v.replace(/^octetstring:\s*/, '');
                          v = v.replace(/^"|"$/g, '');
                          return v;
                      }
                      var v  = clean(value);
                      if (v === 'up') { return 1; }
                      if (v === 'down') { return 2; }
                      if (v === '' || v === 'unknown') { return 0; }
                      return 3;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: aruba.vsf.walk
              tags:
                - tag: component
                  value: vsf
                - tag: vsf_link
                  value: '{#VSF.LINK}'
                - tag: vsf_member
                  value: '{#VSF.MEMBER}'
              trigger_prototypes:
                - uuid: 6a672710401a4cbfb833f8b09b856fe3
                  expression: 'last(/Aruba CX 6000 series by SNMP/aruba.vsf.link.status[arubaWiredVsfv2LinkOperStatus.{#SNMPINDEX}])<>1'
                  name: 'Aruba: VSF link [{#VSF.MEMBER}/{#VSF.LINK}]: Status is not "up"'
                  event_name: 'Aruba: VSF link [{#VSF.MEMBER}/{#VSF.LINK}]: Status is not "up": {ITEM.LASTVALUE}'
                  opdata: 'Current status: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'VSF link operational status is not up.'
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: aruba.vsf.walk
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var lines = value.split("\n");
                  var base = '1.3.6.1.4.1.47196.4.1.1.3.15.1.3.1.3';
                  var seen = {};
                  var out  = [];
                  function normalizeOid(oid) {
                      oid = String(oid || '').replace(/^\./, '');
                      if (oid.indexOf('iso.3.6.') === 0) {
                          oid = '1.3.6.' + oid.substring('iso.3.6.'.length);
                      }
                      return oid;
                  }
                  function getOid(line) {
                      var pos = line.indexOf('=');
                      var oid = pos === -1 ? line : line.substring(0, pos);
                      return normalizeOid(oid.trim());
                  }
                  for (var i = 0; i < lines.length; i++) {
                      var line = lines[i];
                      if (!line) { continue; }
                      var oid = getOid(line);
                      if (oid.indexOf(base + '.') !== 0) { continue; }
                      var idx = oid.substring(base.length + 1);
                      if (!idx || seen[idx]) { continue; }
                      var p = idx.split('.');
                      if (p.length < 2) { continue;  }
                      seen[idx] = true;
                      out.push({
                          '{#SNMPINDEX}': idx,
                          '{#VSF.MEMBER}': p[0],
                          '{#VSF.LINK}': p.slice(1).join('.')
                      });
                  }
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 0d396fe32a684d16b7fd1d7fb359f4ae
          name: 'VSF member discovery'
          type: DEPENDENT
          key: aruba.vsf.member.discovery
