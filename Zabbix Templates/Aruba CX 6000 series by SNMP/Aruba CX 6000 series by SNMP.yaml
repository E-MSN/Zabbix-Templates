  triggers:
    - uuid: 4766a9fae4774f73a1f1c31a218dcfc3
      expression: '(last(/Aruba CX 6000 series by SNMP/system.hw.uptime[hrSystemUptime.0])>0 and last(/Aruba CX 6000 series by SNMP/system.hw.uptime[hrSystemUptime.0])<10m) or (last(/Aruba CX 6000 series by SNMP/system.hw.uptime[hrSystemUptime.0])=0 and last(/Aruba CX 6000 series by SNMP/system.net.uptime[sysUpTime.0])<10m)'
      name: 'Aruba: Host has been restarted'
      event_name: 'Aruba: {HOST.NAME} has been restarted (uptime < 10m)'
      priority: WARNING
      description: 'Uptime is less than 10 minutes.'
      manual_close: 'YES'
      dependencies:
        - name: 'Aruba: No SNMP data collection'
          expression: 'max(/Aruba CX 6000 series by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
      tags:
        - tag: scope
          value: notice
  graphs:
    - uuid: 539d569940ce4f2a9b404598b809093e
      name: 'ICMP response time'
      yaxismax: '0'
      graph_items:
        - color: 199C0D
          item:
            host: 'Aruba CX 6000 series by SNMP'
            key: icmppingsec
