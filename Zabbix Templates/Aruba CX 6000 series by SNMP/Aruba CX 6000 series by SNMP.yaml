              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: f0f943afb2e942cabffa93f467dd1c42
              name: 'Interface {#IFNAME}: Single collision frames'
              type: DEPENDENT
              key: 'net.if.collision.single[dot3StatsSingleCollisionFrames.{#SNMPINDEX}]'
              units: pps
              description: |
                MIB: EtherLike-MIB
                Count of successfully transmitted frames for which transmission was inhibited by exactly one collision.
                Value is stored as a per-second rate from the raw Counter32 value.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.10.7.2.1.4.{#SNMPINDEX}'
                    - '0'
                  error_handler: DISCARD_VALUE
                - type: CHANGE_PER_SECOND
                - type: DISCARD_UNCHANGED_HEARTBEAT
