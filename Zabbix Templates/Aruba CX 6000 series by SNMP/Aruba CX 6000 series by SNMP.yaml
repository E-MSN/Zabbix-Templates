            - tag: component
              value: system
        - uuid: 7a9be44e58cb46559b6bae8ea9d567d4
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.1.0]'
          key: 'system.descr[sysDescr.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            A textual description of the entity. This value should
            include the full name and version identification of the system's hardware type, software operating-system, and
            networking software.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 2b9f33d6897e4ee1addc1c4ec98bfd06
          name: 'Uptime (hardware)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.25.1.1.0]'
          key: 'system.hw.uptime[hrSystemUptime.0]'
          trends: '0'
          units: uptime
          description: |
            MIB: HOST-RESOURCES-MIB
            The amount of time since this host was last initialized. Note that this is different from sysUpTime in the SNMPv2-MIB [RFC1907] because sysUpTime is the uptime of the network management portion of the system.
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: df2a179b60364b82aff79ffeebdb9399
          name: 'System location'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.6.0]'
          key: 'system.location[sysLocation.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            Physical location of the node (e.g., `equipment room`, `3rd floor`). If not provided, the value is a zero-length string.
          inventory_link: LOCATION
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 52a10a3523254ad2aac5b336b049e0a0
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.5.0]'
          key: system.name
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            An administratively-assigned name for this managed node.By convention, this is the node's fully-qualified domain name. If the name is unknown, the value is the zero-length string.
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 93b8a396ddd2403aaca414c75fcb2c1e
              expression: 'last(/Aruba CX 6000 series by SNMP/system.name,#1)<>last(/Aruba CX 6000 series by SNMP/system.name,#2) and length(last(/Aruba CX 6000 series by SNMP/system.name))>0'
              name: 'Aruba: System name has changed'
              event_name: 'Aruba: System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              description: 'The name of the system has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
                - tag: scope
                  value: security
        - uuid: f56b6b608d7048ebadb751c104a67aca
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            Time (in hundredths of a second) since the network management portion of the system was last re-initialized.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: fc8caad908ca4e49a21110c533f7e299
          name: 'System object ID'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.2.0]'
          key: 'system.objectid[sysObjectID.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            The vendor's authoritative identification of the network management subsystem contained in the entity. This value is allocated within the SMI enterprises subtree (1.3.6.1.4.1) and provides an easy and unambiguous means for determining`what kind of box' is being managed.  For example, if vendor`Flintstones, Inc.' was assigned the subtree1.3.6.1.4.1.4242, it could assign the identifier 1.3.6.1.4.1.4242.1.1 to its `Fred Router'.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: d0438fbcef654410a34fa8bc48e45a2c
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 29f4138f106346a2ab508e246fbd0734
              expression: 'max(/Aruba CX 6000 series by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'Aruba: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'Aruba: Unavailable by ICMP ping'
                  expression: 'max(/Aruba CX 6000 series by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 7a207fd5447548758a108aa2215b089d
          name: 'Fan discovery'
          type: DEPENDENT
          key: aruba.fan.discovery
          description: 'Used for discovering fans from ARUBAWIRED-FAN-MIB.'
          item_prototypes:
            - uuid: 3a594e63342c40e69f2ed95bbcf540a2
              name: 'Fan [{#SNMPVALUE}]: Speed'
              type: DEPENDENT
              key: 'aruba.fan.speed[arubaWiredFanRPM.{#SNMPINDEX}]'
              value_type: FLOAT
              units: RPM
              description: |
                MIB: ARUBAWIRED-FAN-MIB
                Current RPM read for the fan. 6100 models can report 0 when RPM readback is unavailable.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.11.5.1.1.8.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: aruba.system.fan.walk
              tags:
                - tag: component
                  value: fan
                - tag: fan
                  value: '{#SNMPVALUE}'
            - uuid: 5ab20aa8f00c44c1862770c014477c1e
              name: 'Fan [{#SNMPVALUE}]: Status'
              type: DEPENDENT
              key: 'aruba.fan.status[arubaWiredFanStatus.{#SNMPINDEX}]'
              description: |
                MIB value is returned as text by Aruba CX and normalized to an unsigned integer.
                Mapping:
                0 - unknown/unmapped
                1 - ok/normal
                2 - warning
                3 - critical/fault/failed
                4 - absent/not present
                5 - disabled
                6 - unsupported
              valuemap:
                name: 'Aruba hardware status'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.11.5.1.1.5.{#SNMPINDEX}'
                    - '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = String(value).trim().toLowerCase();
                      if (v === '1' || v === 'ok' || v === 'normal' || v === 'good' || v === 'present') {
                          return 1;
                      }
                      if (v === '2' || v === 'warning' || v === 'warn' || v === 'minor') {
                            return 2;
                      }
                      if (v === '3' || v === 'critical' || v === 'crit' || v === 'major' || v === 'fault' || v === 'faulty' || v === 'failed' || v === 'failure' || v === 'error') {
                          return 3;
                      }
                      if (v === '4' || v === 'absent' || v === 'not present' || v === 'notpresent' || v === 'n/a' || v === 'na') {
                          return 4;
                      }
                       if  (v === '5' || v === 'disabled' || v === 'disable') {
                          return 5;
                      }
                      if (v === '6' || v === 'unsupported' || v === 'not supported' || v === 'notsupported') {
                          return 6;
                      }
                      return 0;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: aruba.system.fan.walk
              tags:
                - tag: component
                  value: fan
                - tag: fan
                  value: '{#SNMPVALUE}'
              trigger_prototypes:
                - uuid: 4aad688f5446467aa0905a0ba52c1c56
                  expression: 'last(/Aruba CX 6000 series by SNMP/aruba.fan.status[arubaWiredFanStatus.{#SNMPINDEX}])<>1'
                  name: 'Aruba: Fan [{#SNMPVALUE}]: Status is not "ok"'
                  event_name: 'Aruba: Fan [{#SNMPVALUE}]: Status is not "ok": {ITEM.LASTVALUE}'
                  opdata: 'Current status: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'The fan status is not ok (1).'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: performance
          master_item:
            key: aruba.system.fan.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#SNMPVALUE}'
                - 1.3.6.1.4.1.47196.4.1.1.3.11.5.1.1.4
                - '0'
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: f2aa273f4c7d415fa081a206821629fd
          name: 'LAG discovery'
          type: DEPENDENT
          key: aruba.lag.discovery
          description: 'LAG discovery uses IF-MIB to discover LAG interfaces and IEEE8023-LAG-MIB to retrieve LACP member ports.'
          item_prototypes:
            - uuid: e964f6e216474a3c918e095a4a944eac
              name: 'Interface {#LAGNAME}: Members'
              type: DEPENDENT
              key: 'aruba.lag.members[{#LAGINDEX}]'
              value_type: TEXT
              description: |
                MIB:
                - IF-MIB
                - IEEE8023-LAG-MIB
                LAG ports members.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var lines = value.split("\n");
                      var targetLag = '{#LAGINDEX}';
                      var ifNameBase = '1.3.6.1.2.1.31.1.1.1.1.';
                      var lagMembersBase = '1.2.840.10006.300.43.1.1.2.1.1.';
                      var selectedAggBase = '1.2.840.10006.300.43.1.2.1.1.12.';
                      var attachedAggBase = '1.2.840.10006.300.43.1.2.1.1.13.';
                      var ifNames = {};
                      var directMembers = '';
                      var ports = {};
                      function normalizeOid(oid) {
                          oid = String(oid || '').replace(/^\./, '');
                          if (oid.indexOf('iso.2.840.') === 0) {
                              oid = '1.2.840.' + oid.substring('iso.2.840.'.length);
                          }
                          if (oid.indexOf('iso.3.6.') === 0) {
                              oid = '1.3.6.' + oid.substring('iso.3.6.'.length);
                          }
                          return oid;
                      }
                      function getStringValue(line) {
                          var m = String(line).match(/=\s+(?:STRING:\s+)?\"(.*)\"\s*$/);
                          if (m) {
                              return m[1].trim().replace(/\s+/g, '');
                          }
                          return '';
                      }
                      function getIntegerValue(line) {
                          var m = String(line).match(/=\s+INTEGER:\s+(-?\d+)\s*$/);
                          if (m) {
                              return m[1];
                          }
                          return '';
                      }
                      function addPortIfTarget(aggIndex, portIndex) {
                          if (aggIndex === targetLag) {
                              ports[portIndex] = true;
                          }
                      }
                      for (var i = 0; i < lines.length; i++) {
                          var line = lines[i];
                          if (!line) {
                              continue;
                          }
                          var oid = normalizeOid(line.split(/\s+=\s+/)[0]);
                          if (oid.indexOf(ifNameBase) === 0) {
                              var ifIndex = oid.substring(ifNameBase.length);
                              ifNames[ifIndex] = getStringValue(line);
                              continue;
                          }
                          if (oid === lagMembersBase + targetLag) {
                              directMembers = getStringValue(line);
                              continue;
                          }
                          if (oid.indexOf(selectedAggBase) === 0) {
                              var portIndex1 = oid.substring(selectedAggBase.length);
                              addPortIfTarget(getIntegerValue(line), portIndex1);
                              continue;
                          }
                          if (oid.indexOf(attachedAggBase) === 0) {
                              var portIndex2 = oid.substring(attachedAggBase.length);
                              addPortIfTarget(getIntegerValue(line), portIndex2);
                              continue;
                          }
                      }
                      if (directMembers) {
                          return directMembers;
                      }
                      var list = [];
                      for (var portIndex in ports) {
                          if (!ports.hasOwnProperty(portIndex)) {
                              continue;
                          }
                          list.push({
                              index: parseInt(portIndex, 10),
                              name: ifNames[portIndex] || portIndex
                          });
                      }
                      list.sort(function(a, b) {
                          return a.index - b.index;
                      });
                      return list.map(function(p) {
                          return p.name;
                      }).join(',');
              master_item:
                key: aruba.lag.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#LAGNAME}'
          master_item:
            key: aruba.lag.walk
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var lines = value.split("\n");
                  var ifNameBase = '1.3.6.1.2.1.31.1.1.1.1.';
                  var lagMembersBase = '1.2.840.10006.300.43.1.1.2.1.1.';
                  var selectedAggBase = '1.2.840.10006.300.43.1.2.1.1.12.';
                  var attachedAggBase = '1.2.840.10006.300.43.1.2.1.1.13.';
                  var ifNames = {};
                  var directMembers = {};
                  var aggPorts = {};
                  function normalizeOid(oid) {
                      oid = String(oid || '').replace(/^\./, '');
                      if (oid.indexOf('iso.2.840.') === 0) {
                          oid = '1.2.840.' + oid.substring('iso.2.840.'.length);
                      }
                      if (oid.indexOf('iso.3.6.') === 0) {
                          oid = '1.3.6.' + oid.substring('iso.3.6.'.length);
                      }
                      return oid;
                  }
                  function getStringValue(line) {
                      var m = String(line).match(/=\s+(?:STRING:\s+)?\"(.*)\"\s*$/);
                      if (m) {
                          return m[1].trim();
                      }
                  
                      return '';
                  }
                  function getIntegerValue(line) {
                      var m = String(line).match(/=\s+INTEGER:\s+(-?\d+)\s*$/);
                      if (m) {
                          return m[1];
                      }
                      return '';
                  }
                  function addPortToAgg(aggIndex, portIndex) {
                      if (!aggIndex || aggIndex === '0' || aggIndex === '65534') {
                          return;
                      }
                      if (!aggPorts[aggIndex]) {
                          aggPorts[aggIndex] = {};
                      }
                      aggPorts[aggIndex][portIndex] = true;
                  }
                  for (var i = 0; i < lines.length; i++) {
                      var line = lines[i];
                      if (!line) {
                          continue;
                      }
                      var oid = normalizeOid(line.split(/\s+=\s+/)[0]);
                      if (oid.indexOf(ifNameBase) === 0) {
                          var ifIndex = oid.substring(ifNameBase.length);
                          ifNames[ifIndex] = getStringValue(line);
                          continue;
                      }
                      if (oid.indexOf(lagMembersBase) === 0) {
                          var lagIndex = oid.substring(lagMembersBase.length);
                          directMembers[lagIndex] = getStringValue(line).replace(/\s+/g, '');
                          continue;
                      }
                      if (oid.indexOf(selectedAggBase) === 0) {
                          var portIndex1 = oid.substring(selectedAggBase.length);
                          addPortToAgg(getIntegerValue(line), portIndex1);
                          continue;
                      }
                      if (oid.indexOf(attachedAggBase) === 0) {
                          var portIndex2 = oid.substring(attachedAggBase.length);
                          addPortToAgg(getIntegerValue(line), portIndex2);
                          continue;
                      }
                  }
                  var data = [];
                  for (var idx in ifNames) {
                      if (!ifNames.hasOwnProperty(idx)) {
                          continue;
                      }
                      var lagName = ifNames[idx];
                      if (!/^lag[0-9]+$/i.test(lagName)) {
                          continue;
                      }
                      var members = directMembers[idx] || '';
                      if (!members && aggPorts[idx]) {
                          var ports = [];
                          for (var portIndex in aggPorts[idx]) {
                              if (!aggPorts[idx].hasOwnProperty(portIndex)) {
                                  continue;
                              }
                              ports.push({
                                  index: parseInt(portIndex, 10),
                                  name: ifNames[portIndex] || portIndex
                              });
                          }
                          ports.sort(function(a, b) {
                              return a.index - b.index;
                          });
                          members = ports.map(function(p) {
                              return p.name;
                          }).join(',');
                      }
                      var count = 0;
                      if (members) {
                          count = members.split(',').filter(function(v) {
                              return v !== '';
                          }).length;
                      }
                      data.push({
                          '{#LAGINDEX}': idx,
                          '{#LAGNAME}': lagName,
                          '{#LAGMEMBERS}': members,
                          '{#LAGMEMBERCOUNT}': String(count)
                      });
                  }
                  return JSON.stringify(data);
        - uuid: 499ef4e26547491fba5dc4dcddb1ff58
          name: 'PSU discovery'
          type: DEPENDENT
          key: aruba.psu.discovery
          description: 'Used for discovering power supplies from ARUBAWIRED-POWERSUPPLY-MIB.'
          item_prototypes:
            - uuid: 1774d89fbe7847ba852c23edeff9022a
              name: 'PSU [{#SNMPVALUE}]: Model'
              type: DEPENDENT
              key: 'aruba.psu.model[arubaWiredPSUModel.{#SNMPINDEX}]'
              value_type: CHAR
              description: |
                MIB: ARUBAWIRED-POWERSUPPLY-MIB
                Power supply model.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.11.2.1.1.5.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: aruba.system.psu.walk
              tags:
                - tag: component
                  value: psu
                - tag: psu
                  value: '{#SNMPVALUE}'
            - uuid: 2778038559ac4d7faf99fe718a713c60
              name: 'PSU [{#SNMPVALUE}]: Instantaneous power'
              type: DEPENDENT
              key: 'aruba.psu.power[arubaWiredPSUInstantaneousPower.{#SNMPINDEX}]'
              units: W
              description: |
                MIB: ARUBAWIRED-POWERSUPPLY-MIB
                Total instantaneous power supplied by the power supply in watts.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.11.2.1.1.7.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: aruba.system.psu.walk
              tags:
                - tag: component
                  value: psu
                - tag: psu
                  value: '{#SNMPVALUE}'
              trigger_prototypes:
                - uuid: b49fa2ac7c9345f8bdb9dc5c09471dac
                  expression: 'last(/Aruba CX 6000 series by SNMP/aruba.psu.power[arubaWiredPSUInstantaneousPower.{#SNMPINDEX}]) > ({#ARUBA.POWER.SUPPLY.MAX.POWER}*{$ARUBA.POWER.SUPPLY.THR.MAX}/100)'
                  name: 'Aruba: PSU [{#SNMPVALUE}]: High power utilization'
                  event_name: 'Aruba: PSU [{#SNMPVALUE}]: High power utilization: {ITEM.LASTVALUE} (>{$ARUBA.POWER.SUPPLY.THR.MAX}% of maximum)'
                  opdata: 'Current utilization: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'Instantaneous power supplied is greater than {$ARUBA.POWER.SUPPLY.THR.MAX}% of maximum.'
                  tags:
                    - tag: scope
                      value: capacity
                    - tag: scope
                      value: performance
            - uuid: 90794f0edebd4b55acd8bf231be509fb
              name: 'PSU [{#SNMPVALUE}]: Serial number'
              type: DEPENDENT
              key: 'aruba.psu.serial[arubaWiredPSUSerial.{#SNMPINDEX}]'
              value_type: CHAR
              description: |
                MIB: ARUBAWIRED-POWERSUPPLY-MIB
                Power supply serial number.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.11.2.1.1.6.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: aruba.system.psu.walk
              tags:
                - tag: component
                  value: psu
                - tag: psu
                  value: '{#SNMPVALUE}'
            - uuid: 96570cb6004742fa887f34b6dc61cd1b
              name: 'PSU [{#SNMPVALUE}]: Status'
              type: DEPENDENT
              key: 'aruba.psu.status[arubaWiredPSUStatus.{#SNMPINDEX}]'
              description: |
                MIB value is returned as text by Aruba CX and normalized to an unsigned integer.
                Mapping:
                0 - unknown/unmapped
                1 - ok/normal
                2 - warning
                3 - critical/fault/failed
                4 - absent/not present
                5 - disabled
                6 - unsupported
              valuemap:
                name: 'Aruba hardware status'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.47196.4.1.1.3.11.2.1.1.4.{#SNMPINDEX}'
                    - '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = String(value).trim().toLowerCase();
                      if (v === '1' || v === 'ok' || v === 'normal' || v === 'good' || v === 'present') {
                          return 1;
                      }
                      if (v === '2' || v === 'warning' || v === 'warn' || v === 'minor') {
                            return 2;
                      }
                      if (v === '3' || v === 'critical' || v === 'crit' || v === 'major' || v === 'fault' || v === 'faulty' || v === 'failed' || v === 'failure' || v === 'error') {
                          return 3;
                      }
                      if (v === '4' || v === 'absent' || v === 'not present' || v === 'notpresent' || v === 'n/a' || v === 'na') {
                          return 4;
                      }
                      if  (v === '5' || v === 'disabled' || v === 'disable') {
                          return 5;
                      }
                      if (v === '6' || v === 'unsupported' || v === 'not supported' || v === 'notsupported') {
                          return 6;
                      }
                      return 0;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: aruba.system.psu.walk
              tags:
                - tag: component
                  value: psu
                - tag: psu
                  value: '{#SNMPVALUE}'
