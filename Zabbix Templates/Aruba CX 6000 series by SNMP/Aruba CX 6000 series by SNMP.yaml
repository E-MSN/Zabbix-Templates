            - uuid: 481ee8c75e75462fbe25ce389221f8fb
              name: 'VSX: KeepAlive timeout count'
              type: DEPENDENT
              key: 'vsx.keepalive.timeout.count[{#VSXINSTANCE}]'
              description: |
                MIB: ARUBAWIRED-VSX-MIB
                Number of KeepAlive timeouts.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - 1.3.6.1.4.1.47196.4.1.1.3.7.2.2.5.0
                    - '0'
