        - uuid: f315f3e613dc48349f3f7ccb3cd30450
          name: 'Synology Disk Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},.1.3.6.1.4.1.6574.2.1.1.2]'
          key: synoDisk.diskTable.diskEntry
          delay: 1h
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'For all disk entry.'
          item_prototypes:
            - uuid: 5cf05d1e68af46079da81954ef0847ea
              name: '{#SNMPVALUE} Bad sectors count'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6574.2.1.1.9.{#SNMPINDEX}'
              key: 'synoDisk.diskTable.diskEntry.diskBadSector.[{#SNMPINDEX}]'
              delay: 1h
              description: 'The count of each disk I/O bad sector'
              tags:
                - tag: Application
                  value: 'Synology Disk'
              trigger_prototypes:
                - uuid: ff8dc1f61e1c4fdfb36fb38968d29391
                  expression: 'change(/Synology DiskStation by SNMP/synoDisk.diskTable.diskEntry.diskBadSector.[{#SNMPINDEX}])>0'
                  recovery_mode: NONE
                  name: '{#SNMPVALUE}: bad sector count has increased'
                  priority: HIGH
                  description: |
                    The number of bad sectors reported for this disk has increased.
                    Check the disk status manually, review SMART information, and close this problem manually after validation.
                  manual_close: 'YES'
            - uuid: 99465016ec1e44399566a913876a3747
              name: '{#SNMPVALUE} Health Status'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6574.2.1.1.13.{#SNMPINDEX}'
              key: 'synoDisk.diskTable.diskEntry.diskHealthStatus.[{#SNMPINDEX}]'
              delay: 1h
              description: 'Current disk health status reported by DSM.'
              valuemap:
                name: 'SYNOLOGY-DISK-MIB::diskHealthStatus'
              tags:
                - tag: Application
                  value: 'Synology Disk Health'
              trigger_prototypes:
                - uuid: fcaa2f0ec07f433393cb559798c9252e
                  expression: 'last(/Synology DiskStation by SNMP/synoDisk.diskTable.diskEntry.diskHealthStatus.[{#SNMPINDEX}])=3'
                  name: '{#SNMPVALUE}: disk health is critical'
                  priority: HIGH
                  description: 'DSM reports the disk health status as critical.'
                  dependencies:
                    - name: '{#SNMPVALUE}: disk health is failing'
                      expression: 'last(/Synology DiskStation by SNMP/synoDisk.diskTable.diskEntry.diskHealthStatus.[{#SNMPINDEX}])=4'
                - uuid: 67045d3fb6614e199bdca83afdafcecf
                  expression: 'last(/Synology DiskStation by SNMP/synoDisk.diskTable.diskEntry.diskHealthStatus.[{#SNMPINDEX}])=4'
                  name: '{#SNMPVALUE}: disk health is failing'
                  priority: HIGH
                  description: 'DSM reports the disk health status as failing.'
                - uuid: 5c144bf13e3240af8982c900b856eb30
                  expression: 'last(/Synology DiskStation by SNMP/synoDisk.diskTable.diskEntry.diskHealthStatus.[{#SNMPINDEX}])=2'
                  name: '{#SNMPVALUE}: disk health warning'
                  priority: WARNING
                  description: 'DSM reports the disk health status as warning.'
                  dependencies:
                    - name: '{#SNMPVALUE}: disk health is critical'
                      expression: 'last(/Synology DiskStation by SNMP/synoDisk.diskTable.diskEntry.diskHealthStatus.[{#SNMPINDEX}])=3'
                    - name: '{#SNMPVALUE}: disk health is failing'
                      expression: 'last(/Synology DiskStation by SNMP/synoDisk.diskTable.diskEntry.diskHealthStatus.[{#SNMPINDEX}])=4'
            - uuid: 1858194e1ca44c3c9109c5fc15cfb87b
              name: '{#SNMPVALUE} Identify fail count'
