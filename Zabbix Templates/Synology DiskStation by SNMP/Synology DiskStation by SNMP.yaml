            - uuid: c89e26e572f7412c956ea7a49f344807
              name: '{#SNMPVALUE} RAID Name'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6574.3.1.1.2.{#SNMPINDEX}'
              key: 'synoRaid.raidTable.raidEntry.raidName.[{#SNMPINDEX}]'
              delay: 1d
              value_type: TEXT
              description: 'Synology raid name: the name of each raid will be showed here.'
              tags:
                - tag: Application
                  value: 'Synology RAID'
            - uuid: c6aefeed75d047499c0c633d1ee24124
              name: '{#SNMPVALUE} RAID Status'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6574.3.1.1.3.{#SNMPINDEX}'
              key: 'synoRaid.raidTable.raidEntry.raidStatus.[{#SNMPINDEX}]'
              delay: 3m
              description: |
                Synology Raid status: each meanings of status represented describe below:
                [1] Normal: the raid functions normally.
                [11] Degrade: degrade happens when a tolerable failure of disk(s) occurs.
                [12] Crashed:  raid has crashed and just uses for read-only operation.
                
                Note: other status will be showed when creating or deleting raids, including below status:
                [2] Repairing,
                [3] Migrating,
                [4] Expanding, 
                [5] Deleting,
                 [6] Creating(6),
                [7] RaidSyncing,
                [8] RaidParityChecking,
                [9] RaidAssembling and
                [10] Canceling.
              valuemap:
                name: 'SYNOLOGY-RAID-MIB::raidStatus'
              tags:
                - tag: Application
                  value: 'Synology RAID'
              trigger_prototypes:
                - uuid: a77d0dbc873840aa95a8827833f16d73
                  expression: |
                    (
                        last(/Synology DiskStation by SNMP/synoRaid.raidTable.raidEntry.raidStatus.[{#SNMPINDEX}])>1
                        and
                        last(/Synology DiskStation by SNMP/synoRaid.raidTable.raidEntry.raidStatus.[{#SNMPINDEX}])<11
                    )
                    or
                    (
                        last(/Synology DiskStation by SNMP/synoRaid.raidTable.raidEntry.raidStatus.[{#SNMPINDEX}])>12
                        and
                        last(/Synology DiskStation by SNMP/synoRaid.raidTable.raidEntry.raidStatus.[{#SNMPINDEX}])<21
                    )
                  name: 'RAID operation is in progress on {HOST.NAME}'
                  opdata: 'Status: {ITEM.LASTVALUE1}'
                  priority: WARNING
                - uuid: 26214e2d73ec4f5aad5490e36572f80c
                  expression: 'last(/Synology DiskStation by SNMP/synoRaid.raidTable.raidEntry.raidStatus.[{#SNMPINDEX}])=12'
                  name: 'RAID status is crashed on {HOST.NAME}'
                  priority: HIGH
                - uuid: d51db37d6a1c430196f1236ca5cb3543
                  expression: 'last(/Synology DiskStation by SNMP/synoRaid.raidTable.raidEntry.raidStatus.[{#SNMPINDEX}])=11'
                  name: 'RAID status is degraded on {HOST.NAME}'
                  priority: AVERAGE
                - uuid: e24b5c7a7c28461182dfef5ebea41319
                  expression: 'last(/Synology DiskStation by SNMP/synoRaid.raidTable.raidEntry.raidStatus.[{#SNMPINDEX}])=21'
                  name: 'RAID status is unknown on {HOST.NAME}'
                  priority: AVERAGE
            - uuid: d84729aa45694f3d986d87daaa454623
              name: '{#SNMPVALUE} RAID Total Size'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6574.3.1.1.5.{#SNMPINDEX}'
              key: 'synoRaid.raidTable.raidEntry.raidTotalSize.[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: B
              description: 'Total size of volume / disk group.'
              tags:
                - tag: Application
                  value: 'Synology RAID'
            - uuid: 514a0e187f2248eeafd8fcab7516ec76
              name: '{#SNMPVALUE} RAID Used Percent'
              type: CALCULATED
              key: 'synoRaid.raidTable.raidEntry.raidUsedPercent.[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: '%'
              params: '(last(//synoRaid.raidTable.raidEntry.raidTotalSize.[{#SNMPINDEX}])-last(//synoRaid.raidTable.raidEntry.raidFreeSize.[{#SNMPINDEX}]))/last(//synoRaid.raidTable.raidEntry.raidTotalSize.[{#SNMPINDEX}])*100'
              description: 'Calculated RAID used percentage.'
              tags:
                - tag: Application
                  value: 'Synology RAID'
            - uuid: 1440407e0e3643ed9dab5541ddf3984c
              name: '{#SNMPVALUE} RAID Used Size'
              type: CALCULATED
              key: 'synoRaid.raidTable.raidEntry.raidUsedSize.[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: B
              params: 'last(//synoRaid.raidTable.raidEntry.raidTotalSize.[{#SNMPINDEX}])-last(//synoRaid.raidTable.raidEntry.raidFreeSize.[{#SNMPINDEX}])'
              description: 'Calculated RAID used size.'
              tags:
                - tag: Application
                  value: 'Synology RAID'
          graph_prototypes:
            - uuid: 8d585a467acc484b901b267a7df3eb13
              name: 'RAID: Space usage on {#SNMPVALUE}'
              show_work_period: 'NO'
              show_triggers: 'NO'
              graph_items:
                - color: '969696'
