          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 0f9694e16fa74b6c8210fe69332c1253
              name: '{#SNMPVALUE} RAID Free Size'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6574.3.1.1.4.{#SNMPINDEX}'
