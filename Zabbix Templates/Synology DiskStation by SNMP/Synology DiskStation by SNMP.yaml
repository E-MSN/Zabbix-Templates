zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 3097d88f9bd741b69eac32e51be0f0b9
      name: 'Templates/NAS & SAN'
  templates:
    - uuid: 59c750b5f0ac4ac8ae8df10bd130c00e
      template: 'Synology DiskStation by SNMP'
      name: 'Synology DiskStation by SNMP'
      description: |
        Template Synology DiskStation by SNMP
        Based on the original template written by Helmut Leonhardt.
        
        MIBs used:
        SNMPv2-MIB
        HOST-RESOURCES-MIB
        IF-MIB
        UCD-SNMP-MIB
        SYNOLOGY-SYSTEM-MIB
        SYNOLOGY-DISK-MIB
        SYNOLOGY-RAID-MIB
        SYNOLOGY-UPS-MIB
        SYNOLOGY-SMART-MIB
        SYNOLOGY-SERVICES-MIB
        SYNOLOGY-STORAGEIO-MIB
        SYNOLOGY-SPACEIO-MIB
        SYNOLOGY-ISCSILUN-MIB
        SYNOLOGY-ISCSITARGET-MIB
      vendor:
        name: E-MSN
        version: 7.4-10
      groups:
        - name: 'Templates/NAS & SAN'
      items:
        - uuid: 5704cbbbcdac40818555f8c0b112e88e
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          delay: '60'
          history: 1w
          valuemap:
            name: 'Service state'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: 78e391ed5fce4ef9b46a15b8f6283d44
              expression: 'max(/Synology DiskStation by SNMP/icmpping,#3)=0'
              name: 'ICMP Ping: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 51d22f99f16d4961a9f7d1a1b7afafd6
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: '%'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: 0d5b500e1347422b8745f41c15862d03
              expression: 'min(/Synology DiskStation by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Synology DiskStation by SNMP/icmppingloss,5m)<100'
              name: 'ICMP Ping: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Synology DiskStation by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 519abfc7e75e4c348be18781da02ae36
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: s
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: 01a48ce9375745a9b7e8a40931b60df6
              expression: 'avg(/Synology DiskStation by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'ICMP Ping: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'ICMP Ping: High ICMP ping loss'
                  expression: 'min(/Synology DiskStation by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Synology DiskStation by SNMP/icmppingloss,5m)<100'
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Synology DiskStation by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 23bc3701820e499fad2c76375efeed17
          name: 'CPU Fan Status'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.6574.1.4.2.0
          key: synoSystem.cpuFanStatus
          history: 90d
          description: 'Returns error if CPU fan fails.'
          valuemap:
            name: 'SYNOLOGY-SYSTEM-MIB::systemStatus'
          tags:
            - tag: Application
              value: CPU
            - tag: Application
              value: 'Synology System'
            - tag: Application
              value: 'System Health'
          triggers:
            - uuid: 167fa4d633d8441b8d4d635d61588e3a
              expression: 'last(/Synology DiskStation by SNMP/synoSystem.cpuFanStatus)<>1'
              name: 'CPU Fan status is critical on {HOST.NAME}'
              priority: HIGH
        - uuid: 5ca7e565d6d6466180a380b27c58c876
          name: 'Load Avg 1 min'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.10.1.5.1
          key: synoSystem.laLoadInt.1
          history: 90d
          value_type: FLOAT
          description: '1 minute load.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: Application
              value: CPU
            - tag: Application
              value: 'Synology System'
            - tag: Application
              value: 'System Health'
        - uuid: b4d279ce76a74e82951ccf72c55ce2f1
          name: 'Load Avg 5 min'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.10.1.5.2
          key: synoSystem.laLoadInt.2
          history: 90d
          value_type: FLOAT
          description: '5 minute load.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: Application
              value: CPU
            - tag: Application
              value: 'Synology System'
            - tag: Application
              value: 'System Health'
        - uuid: bcef2085e88148c6b704ec490e79f3cb
          name: 'Load Avg 15 min'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.10.1.5.3
          key: synoSystem.laLoadInt.3
          history: 90d
          value_type: FLOAT
          description: '15 minute load.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: Application
              value: CPU
            - tag: Application
              value: 'Synology System'
            - tag: Application
              value: 'System Health'
        - uuid: 9399953a6d4f40adba5e7034584c469f
          name: 'Model Name'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.6574.1.5.1.0
          key: synoSystem.modelName
          delay: 1h
          history: 90d
          value_type: TEXT
          description: 'Model name of this NAS.'
          inventory_link: MODEL
          tags:
            - tag: Application
              value: 'Synology System'
            - tag: Application
              value: 'System Information'
        - uuid: 75964584d66947f8a7dffbe004989ec4
          name: 'System Name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: synoSystem.Name
          delay: 1h
          history: 90d
          value_type: TEXT
          description: 'Name of this NAS.'
          tags:
            - tag: Application
              value: 'Synology System'
            - tag: Application
              value: 'System Information'
        - uuid: bc267aa3275e49d984a55df287af4e57
          name: 'Power Status'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.6574.1.3.0
          key: synoSystem.powerStatus
          history: 90d
          description: 'Returns error if power supplies fail'
          valuemap:
            name: 'SYNOLOGY-SYSTEM-MIB::powerStatus'
          tags:
            - tag: Application
              value: 'Synology System'
          triggers:
            - uuid: c023c484912a4e68a761edc1c3972795
              expression: 'last(/Synology DiskStation by SNMP/synoSystem.powerStatus)<>1'
              name: 'Power status failed on {HOST.NAME}'
              priority: HIGH
        - uuid: 81ac620098534f44af8f3400dbafa9c4
          name: 'Serial Number'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.6574.1.5.2.0
          key: synoSystem.serialNumber
          delay: 1h
          history: 90d
          value_type: TEXT
          description: 'Model serial number'
          inventory_link: SERIALNO_A
          tags:
            - tag: Application
              value: 'Synology System'
            - tag: Application
              value: 'System Information'
        - uuid: 4977e7cdafad4615b8d138e77c8f53e2
          name: 'CPU Idle'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.11.11.0
          key: synoSystem.ssCpuIdle
          history: 90d
          units: '%'
          description: 'The percentage of processor time spent idle, calculated over the last minute.'
          tags:
            - tag: Application
              value: CPU
            - tag: Application
              value: 'Synology System'
            - tag: Application
              value: 'System Health'
          triggers:
            - uuid: f20f256a72384c9ca8fb9a92b8c9bfd3
              expression: 'avg(/Synology DiskStation by SNMP/synoSystem.ssCpuIdle,5m)<{$CPU_UTIL_AVG}'
              name: 'CPU Usage is high on {HOST.NAME}'
              priority: AVERAGE
            - uuid: f1f9c56d9de24865b32a2d189820708d
              expression: 'avg(/Synology DiskStation by SNMP/synoSystem.ssCpuIdle,5m)<{$CPU_UTIL_HIGH}'
              name: 'CPU Usage is too high on {HOST.NAME}'
              priority: HIGH
        - uuid: 284433a9f57b431fad0a26b7c5914f98
          name: 'CPU System'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.11.10.0
          key: synoSystem.ssCpuSystem
          history: 90d
          units: '%'
          description: 'The percentage of CPU time spent processing system-level code, calculated over the last minute.'
          tags:
            - tag: Application
              value: CPU
            - tag: Application
              value: 'Synology System'
            - tag: Application
              value: 'System Health'
        - uuid: 446fe2a7d7794b8884ef35271591b345
          name: 'CPU User'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.11.9.0
          key: synoSystem.ssCpuUser
          history: 90d
          units: '%'
          description: 'The percentage of CPU time spent processing user-level code.'
          tags:
            - tag: Application
              value: CPU
            - tag: Application
              value: 'Synology System'
            - tag: Application
              value: 'System Health'
        - uuid: 8cbf061a87004b57953c82d3d7f0fd38
          name: 'System Fan Status'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.6574.1.4.1.0
          key: synoSystem.systemFanStatus
          history: 90d
          description: 'Returns error if system fan fails.'
          valuemap:
            name: 'SYNOLOGY-SYSTEM-MIB::systemStatus'
          tags:
            - tag: Application
              value: 'Synology System'
            - tag: Application
              value: 'System Health'
          triggers:
            - uuid: d6399324eab8492f9a264474d7cdb39b
              expression: 'last(/Synology DiskStation by SNMP/synoSystem.systemFanStatus)<>1'
              name: 'System Fan status is critical on {HOST.NAME}'
              priority: HIGH
        - uuid: 74dd04d8f6ba4890bf924ae2de033218
          name: 'System Status'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.6574.1.1.0
          key: synoSystem.systemStatus
          history: 90d
          description: 'System partition status.'
          valuemap:
            name: 'SYNOLOGY-SYSTEM-MIB::systemStatus'
          tags:
            - tag: Application
              value: 'Synology System'
            - tag: Application
              value: 'System Health'
          triggers:
            - uuid: 025eba299cc240339778c0c4a10dafb8
              expression: 'last(/Synology DiskStation by SNMP/synoSystem.systemStatus)<>1'
              name: 'System Partition is critical on {HOST.NAME}'
              priority: DISASTER
        - uuid: 51c0b69cab8b4269acfd7388d99c7cc6
          name: Uptime
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.25.1.1.0
          key: synoSystem.sysUpTime
          delay: 30s
          history: 2w
          trends: '0'
          units: uptime
          description: 'The time (in hundredths of a second) since the network management portion of the system was last re-initialized.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: Application
              value: Status
            - tag: Application
              value: 'Synology System'
          triggers:
            - uuid: a719e09f297041249ed67a63d0db1b94
              expression: 'last(/Synology DiskStation by SNMP/synoSystem.sysUpTime)<10m'
              name: '{HOST.NAME} has been restarted'
              event_name: 'Synology: {HOST.NAME} has been restarted (uptime < 10m)'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 4ae03dba84874ce4b3d41b9b3be0a79b
          name: 'System Temperature'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.6574.1.2.0
          key: synoSystem.temperature
          delay: 3m
          history: 90d
          units: C
          description: 'Temperature of this NAS.'
          tags:
            - tag: Application
              value: 'Synology System'
            - tag: Application
              value: 'System Health'
          triggers:
            - uuid: b29a2764a8db4bceb69fdde886e6bb86
              expression: 'avg(/Synology DiskStation by SNMP/synoSystem.temperature,#4)>{$SYSTEM.TEMP.HIGH}'
              name: 'System temperature is critical on {HOST.NAME}'
              priority: HIGH
            - uuid: 43524ee074b5496ab60566fccf0d212c
              expression: 'avg(/Synology DiskStation by SNMP/synoSystem.temperature,#4)>{$SYSTEM.TEMP.AVG}'
              name: 'System temperature is high on {HOST.NAME}'
              priority: AVERAGE
              dependencies:
                - name: 'System temperature is critical on {HOST.NAME}'
                  expression: 'avg(/Synology DiskStation by SNMP/synoSystem.temperature,#4)>{$SYSTEM.TEMP.HIGH}'
        - uuid: 82eaac980c24493c8366ead576ad897c
          name: 'Upgrade Available'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.6574.1.5.4.0
          key: synoSystem.upgradeAvailable
          delay: 1h
          history: 90d
          description: 'Checks whether a new version or update of DSM is available'
          valuemap:
            name: 'SYNOLOGY-SYSTEM-MIB::upgradeAvailable'
          tags:
            - tag: Application
              value: 'Synology System'
            - tag: Application
              value: 'System Information'
          triggers:
            - uuid: 2e83045c61e74fc3aebab41f2c6bab57
              expression: 'last(/Synology DiskStation by SNMP/synoSystem.upgradeAvailable)=1'
              name: 'Update available on {HOST.NAME}'
              priority: AVERAGE
              manual_close: 'YES'
        - uuid: defcb84db0c74e6e8cd55e30216cd646
          name: Version
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.6574.1.5.3.0
          key: synoSystem.version
          delay: 1h
          history: 90d
          value_type: TEXT
          description: 'The version of DSM'
          inventory_link: OS
          tags:
            - tag: Application
              value: 'Synology System'
            - tag: Application
              value: 'System Information'
          triggers:
            - uuid: 6e41945ead3b4c99b4c04e4febf913a2
              expression: '(last(/Synology DiskStation by SNMP/synoSystem.version,#1)<>last(/Synology DiskStation by SNMP/synoSystem.version,#2))>0'
              name: 'DSM on {HOST.NAME} has been updated'
              priority: INFO
              manual_close: 'YES'
        - uuid: ba089b34e8324dbda87a4799fe900a36
          name: 'Total Physical Available'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.4.6.0
          key: ucdavis.memory.memAvailReal
          delay: 3m
          history: 90d
          units: B
          description: 'The amount of real/physical memory currently unused or available.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: Application
              value: Memory
            - tag: Application
              value: 'System Health'
        - uuid: a243388f5be3464a82b66c48ff07c3d3
          name: 'Total Swap Available'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.4.4.0
          key: ucdavis.memory.memAvailSwap
          delay: 3m
          history: 90d
          units: B
          description: 'The amount of swap space currently unused or available.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: Application
              value: Memory
            - tag: Application
              value: 'System Health'
        - uuid: 3f4768b742e24aeb9bde6e14959b2461
          name: 'Total Buffer Memory'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.4.14.0
          key: ucdavis.memory.memBuffer
          delay: 3m
          history: 90d
          units: B
          description: 'The total amount of real or virtual memory currently allocated for use as memory buffers.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: Application
              value: Memory
            - tag: Application
              value: 'System Health'
        - uuid: 92577e2f114d4a04ab5509258e3cd49c
          name: 'Total Cached Memory'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.4.15.0
          key: ucdavis.memory.memCached
          delay: 3m
          history: 90d
          units: B
          description: 'The total amount of real or virtual memory currently allocated for use as cached memory.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: Application
              value: Memory
            - tag: Application
              value: 'System Health'
        - uuid: cf4659cddcd640e48c0f308d8927e96d
          name: 'Total Shared Memory'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.4.13.0
          key: ucdavis.memory.memShared
          delay: 3m
          history: 90d
          units: B
          description: 'The total amount of real or virtual memory currently allocated for use as shared memory.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: Application
              value: Memory
            - tag: Application
              value: 'System Health'
        - uuid: f158ed3b2028490fab4c741acfcfd942
          name: 'Total Free Memory'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.4.11.0
          key: ucdavis.memory.memTotalFree
          delay: 3m
          history: 90d
          units: B
          description: 'The total amount of memory free or available for use on this host.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: Application
              value: Memory
            - tag: Application
              value: 'System Health'
        - uuid: 20358ecc44a4474e8e5350998e53fa19
          name: 'Total Physical Memory'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.4.5.0
          key: ucdavis.memory.memTotalReal
          delay: 3m
          history: 90d
          units: B
          description: 'The total amount of real/physical memory installed on this host.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: Application
              value: Memory
            - tag: Application
              value: 'System Health'
        - uuid: 9c0125a35d274bf68cac6cdc29971f82
          name: 'Total Swap Space'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.4.3.0
          key: ucdavis.memory.memTotalSwap
          delay: 3m
          history: 90d
          units: B
          description: 'The total amount of swap space configured for this host.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: Application
              value: Memory
            - tag: Application
              value: 'System Health'
        - uuid: da53b188dc9c4eee9486e993b6f8feb4
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          history: 7d
          valuemap:
            name: zabbix.host.available
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: network
            - tag: component
              value: system
          triggers:
            - uuid: 8a3541fda5ad470dac2ecd9823ebb228
              expression: 'max(/Synology DiskStation by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'SNMP is unavailable on {HOST.NAME}'
              priority: AVERAGE
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Synology DiskStation by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 06c187a93ea24441aa7df2765357d58a
          name: 'Synology Storage Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#STORAGEINDEX},.1.3.6.1.2.1.25.2.3.1.1,{#STORAGEDESCR},.1.3.6.1.2.1.25.2.3.1.3,{#STORAGEUNIT},.1.3.6.1.2.1.25.2.3.1.4]'
          key: host.hrStorage.hrStorageTable.hrStorageEntry
          delay: 1h
          filter:
            conditions:
              - macro: '{#STORAGEDESCR}'
                value: /volume
          lifetime_type: DELETE_IMMEDIATELY
          item_prototypes:
            - uuid: 42f0a25d170b43998ea18392aa883b06
              name: 'Storage Size on {#STORAGEDESCR}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.25.2.3.1.5.{#STORAGEINDEX}'
              key: 'host.hrStorage.hrStorageTable.hrStorageEntry.hrStorageSize[{#STORAGEINDEX}]'
              delay: 3m
              units: B
              description: 'The size of the storage represented by this entry.'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '{#STORAGEUNIT}'
              tags:
                - tag: Application
                  value: Disk
            - uuid: 5229fa8b154c4fa9b5d730fcc5d69ec9
              name: 'Storage Percent Used on {#STORAGEDESCR}'
              type: CALCULATED
              key: 'host.hrStorage.hrStorageTable.hrStorageEntry.hrStorageUsed[{#STORAGEINDEX},pct]'
              delay: 5m
              units: '%'
              params: 'last(//host.hrStorage.hrStorageTable.hrStorageEntry.hrStorageUsed[{#STORAGEINDEX}])/last(//host.hrStorage.hrStorageTable.hrStorageEntry.hrStorageSize[{#STORAGEINDEX}])*100'
              description: '% of disk space used.'
              tags:
                - tag: Application
                  value: Disk
              trigger_prototypes:
                - uuid: 38bb824ba8634585aef181747a62bfbd
                  expression: 'last(/Synology DiskStation by SNMP/host.hrStorage.hrStorageTable.hrStorageEntry.hrStorageUsed[{#STORAGEINDEX},pct])>{$DISK_UTIL_HIGH}'
                  name: 'Disk Space is critical on {#STORAGEDESCR}'
                  priority: HIGH
                - uuid: 20c61e4970e74e8a93a24ec5b8104fdc
                  expression: 'last(/Synology DiskStation by SNMP/host.hrStorage.hrStorageTable.hrStorageEntry.hrStorageUsed[{#STORAGEINDEX},pct])>{$DISK_UTIL_WARN}'
                  name: 'Disk Space is low on {#STORAGEDESCR}'
                  priority: WARNING
                  dependencies:
                    - name: 'Disk Space is critical on {#STORAGEDESCR}'
