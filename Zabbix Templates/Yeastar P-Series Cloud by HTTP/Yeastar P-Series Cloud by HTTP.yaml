      discovery_rules:
        - uuid: 82ae1fa7d6a24fc1a1c2adb314c6b4bf
          name: 'Extension discovery'
          type: DEPENDENT
          key: yeastar.extension.discovery
          description: 'Automatically discovers extensions and endpoint connection states.'
          item_prototypes:
            - uuid: b566841fe9374a579e1a5091ab3d4835
              name: 'Extension {#NAME}: Linkus desktop'
              type: DEPENDENT
              key: 'yeastar.extension.desktop[{#ID}]'
              description: 'Connection status of the Linkus desktop client for this extension.'
              valuemap:
                name: 'Yeastar connection state'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var a = JSON.parse(value).extensions;
                      var o = a.filter(function(v) {
                          return String(v.id) ===  "{#ID}";
                      })[0];
                      if (!o) { throw "Resource missing"; }
                      return o.online_status.linkus_desktop.status;
              master_item:
                key: yeastar.raw
              tags:
                - tag: component
                  value: extension
            - uuid: daba05d9c2754559bdb8522e5111ba44
              name: 'Extension {#NAME}: Email'
              type: DEPENDENT
              key: 'yeastar.extension.email[{#ID}]'
              value_type: CHAR
              description: 'Email address configured for this extension.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var extensions = JSON.parse(value).extensions;
                      var extension = extensions.filter(function(e) {
                          return String(e.id) === "{#ID}";
                      })[0];
                      if (!extension) { throw "Resource missing"; }
                      return String(extension.email_addr || "");
              master_item:
                key: yeastar.raw
              tags:
                - tag: component
                  value: extension
            - uuid: 5597667294de47408e97b0248b01e14d
              name: 'Extension {#NAME}: Registered IP addresses'
              type: DEPENDENT
              key: 'yeastar.extension.ip[{#ID}]'
              value_type: TEXT
              description: 'Registered IP addresses for this extension.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var extension = data.extensions.filter(function(e) {
                          return String(e.id) === "{#ID}";
                      })[0];
                      if (!extension || !extension.online_status) return "";
                      var result = [];
                      var devices = extension.online_status;
                      Object.keys(devices).forEach(function(type) {
                          var list = devices[type].status_list || [];
                          list.forEach(function(device) {
                              if (Number(device.status) === 1 && device.ip) {
                                  result.push(type + ": " + device.ip);
                              }
                          });
                      });
                      return result.join(", ");
              master_item:
                key: yeastar.raw
              tags:
                - tag: component
                  value: extension
            - uuid: 1fabbeeed76e41f9bb40d31177278c1a
              name: 'Extension {#NAME}: Linkus device type'
              type: DEPENDENT
              key: 'yeastar.extension.linkus.devtype[{#ID}]'
              value_type: TEXT
              description: 'Linkus Mobile device type for this extension.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var extension = data.extensions.filter(function(e) {
                          return String(e.id) === "{#ID}";
                      })[0];
                      if (!extension || !extension.online_status) return "";
                      var mobile = extension.online_status.linkus_mobile || {};
                      var list = mobile.status_list || [];
                      return list.filter(function(device) {
                          return Number(device.status) === 1 && device.linkus_dev_type;
                      }).map(function(device) {
                          return device.linkus_dev_type;
                      }).join(", ");
              master_item:
                key: yeastar.raw
              tags:
                - tag: component
                  value: extension
            - uuid: 5762368ef8454f1eba04b033c61abca8
              name: 'Extension {#NAME}: Linkus mobile'
              type: DEPENDENT
              key: 'yeastar.extension.mobile[{#ID}]'
              description: 'Connection status of the Linkus mobile client for this extension.'
              valuemap:
                name: 'Yeastar connection state'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var a = JSON.parse(value).extensions;
                      var o = a.filter(function(v) {
                          return String(v.id) ===  "{#ID}";
                      })[0];
                      if (!o) { throw "Resource missing"; }
                      return o.online_status.linkus_mobile.status;
              master_item:
                key: yeastar.raw
              tags:
                - tag: component
                  value: extension
            - uuid: 0acd7165e5a34edfb97318ce73201a94
              name: 'Extension {#NAME}: Name'
              type: DEPENDENT
              key: 'yeastar.extension.name[{#ID}]'
              value_type: CHAR
              description: 'Caller ID display name configured for this extension.'
              preprocessing:
