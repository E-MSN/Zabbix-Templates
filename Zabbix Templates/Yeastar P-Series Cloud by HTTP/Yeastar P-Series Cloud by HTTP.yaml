            - uuid: f3dbf4e01c284e3ba82a6bcfd2a1cfb0
              name: 'Extension {#NAME}: SIP registered'
              type: DEPENDENT
              key: 'yeastar.extension.sip[{#ID}]'
              description: 'Indicates whether at least one SIP endpoint is registered to this extension.'
              valuemap:
                name: 'Yeastar connection state'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var a = JSON.parse(value).extensions;
                      var o = a.filter(function(v) {
                          return String(v.id) ===  "{#ID}";
                      })[0];
                      if (!o) {
                          throw "Resource missing";
                      }
                      var sip = o.online_status && o.online_status.sip_phone;
                       if (!sip) {
                          return 0;
                      }
                      if (Array.isArray(sip.status_list)) {
                          for (var i = 0; i < sip.status_list.length;  i++) {
                              if (Number(sip.status_list[i].status) === 1) {
                                  return 1;
                              }
                           }
                          return 0;
                      }
                      return Number(sip.status) === 1 ? 1 : 0;
              master_item:
                key: yeastar.raw
              tags:
                - tag: component
                  value: extension
            - uuid: f1c78617788c40ab89084fc8fd72af61
