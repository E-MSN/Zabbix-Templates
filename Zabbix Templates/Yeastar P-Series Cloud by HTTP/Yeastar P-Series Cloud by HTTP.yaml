        - uuid: 910d0175194a4249956c936097248354
          name: 'Yeastar: Collect API data'
          type: SCRIPT
          key: yeastar.raw
          history: 1d
          value_type: TEXT
          params: |
            var p = JSON.parse(value);
            var base = String(p.url).replace(/\/$/, '') + '/openapi/v1.0/';
            var http = new HttpRequest();
            http.addHeader('User-Agent: Zabbix');
            http.addHeader('Content-Type: application/json');
            function request(path, body) {
                var response = body === null ? http.get(base + path) : http.post(base + path, JSON.stringify(body));
                if (http.getStatus() !== 200) { throw 'HTTP ' + http.getStatus() + ' for ' + path; }
                var result = JSON.parse(response);
                if (result.errcode !== 0) { throw path + ': ' + result.errcode + ' ' + result.errmsg; }
                return result;
            }
            var auth = request('get_token', {username: p.id, password: p.secret});
            var token = encodeURIComponent(auth.access_token);
            function get(path) {
                return request(path + (path.indexOf('?') < 0 ? '?' : '&') + 'access_token=' + token, null);
            }
            try {
                var output = {
                    system: get('system/information').data,
                    capacity: get('system/capacity').data
                };
                output.trunks = get('trunk/list').data || [];
                output.extensions = get('extension/list').data || [];
                output.ring_groups = get('ringgroup/list').data || [];
                var queues = get('queue/list');
                output.queues = queues.queue_list || [];
                for (var i = 0; i < output.queues.length; i++) {
                    var q = output.queues[i];
                    var calls = get('queue/call_status?id=' + encodeURIComponent(q.id));
                    var agents = get('queue/agent_status?id=' + encodeURIComponent(q.id));
                    var list = agents.data || [];
                    q.stats = {
                        waiting: calls.waiting_calls || 0,
                        active: calls.active_calls || 0,
                        ringing: calls.ringing_calls || 0,
                        agents_total: list.length,
                        agents_logged: list.filter(function(a) { return a.is_login === 1; }).length,
                        agents_paused: list.filter(function(a) { return a.is_login === 1 && a.is_pause === 1; }).length,
                        agents_available: list.filter(function(a) {
                            return a.is_login === 1 && a.is_pause === 0 && a.call_status === 1;
                        }).length
                    };
                }
                return JSON.stringify(output);
            } finally {
                try {
                    request('del_token?access_token=' + token, null);
                } catch (e) {
                }
            }
          description: 'Collects PBX system information, licensed capacity, SIP trunks, extensions, ring groups and call queue statistics through the REST API.'
          timeout: 30s
          parameters:
            - name: id
              value: '{$YEASTAR.CLIENT.ID}'
            - name: secret
              value: '{$YEASTAR.CLIENT.SECRET}'
            - name: url
              value: '{$YEASTAR.URL}'
          tags:
            - tag: component
              value: api
          triggers:
            - uuid: 793eaea8a21744af98b3fa3fd9339cf4
              expression: 'nodata(/Yeastar P-Series Cloud by HTTP/yeastar.raw,5m)=1'
              name: 'Yeastar: No API data for 5minutes'
              priority: HIGH
              description: |
                No successful API data collection has been received from the Yeastar PBX for 5 minutes.
                
                Possible causes:
                - PBX unavailable
                - Network connectivity issue
                - API authentication failure
                - API rate limit exceeded
        - uuid: 141831116df4428a990c882b751bd87b
