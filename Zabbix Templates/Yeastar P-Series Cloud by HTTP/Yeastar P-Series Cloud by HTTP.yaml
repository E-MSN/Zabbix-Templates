        - uuid: 57ae652015db4d5a8a998236c67f1491
          name: 'Yeastar: Collect active calls'
          type: SCRIPT
          key: yeastar.calls.raw
          history: 1d
          value_type: TEXT
          params: |
            var p = JSON.parse(value);
            var base = String(p.url).replace(/\/$/, '') + '/openapi/v1.0/';
            var http = new HttpRequest();
            http.addHeader('User-Agent: Zabbix');
            http.addHeader('Content-Type: application/json');
            function request(path, body) {
                var response = body === null ? http.get(base + path) : http.post(base + path, JSON.stringify(body));
                if (http.getStatus() !== 200) {
                    throw 'HTTP ' + http.getStatus() + ' for ' + path;
                }
                var result = JSON.parse(response);
                if (result.errcode !== 0) {
                    throw path + ': ' + result.errcode + ' ' + result.errmsg;
                }
                return result;
            }
            var auth = request('get_token', {
                username: p.id,
                password: p.secret
            });
            var token = encodeURIComponent(auth.access_token);
            function get(path) {
                return request(path + (path.indexOf('?') < 0 ? '?' : '&') + 'access_token=' + token, null);
            }
            function uniqueCalls(calls) {
                var seen = {};
                var result = [];
                for (var i = 0; i < calls.length; i++) {
                    var call = calls[i];
                    if (!call || call.call_id === undefined || call.call_id === null) {
                        throw 'Call without call_id';
                    }
                    var id = String(call.call_id);
                    if (Object.prototype.hasOwnProperty.call(seen, id)) { continue; }
                    seen[id] = true;
                    result.push(call);
                }
                return result;
            }
            function countTrunks(calls, direction, trunks) {
                for (var i = 0; i < calls.length; i++) {
                    var names = {};
                    var members = calls[i].members || [];
                    for (var j = 0; j < members.length; j++) {
                        var member = members[j][direction];
                        if (!member || !member.trunk_name) { continue; }
                        names[String(member.trunk_name)] = true;
                    }
                    for (var name in names) {
                        if (!Object.prototype.hasOwnProperty.call(names, name)) { continue; }
                        if (!Object.prototype.hasOwnProperty.call(trunks, name)) {
                            trunks[name] = {inbound: 0, outbound: 0, total: 0};
                        }
                        trunks[name][direction]++;
                        trunks[name].total++;
                    }
                }
            }
            try {
                var inbound = uniqueCalls(get('call/query?type=inbound').data || []);
                var outbound = uniqueCalls(get('call/query?type=outbound').data || []);
                var internal = uniqueCalls(get('call/query?type=internal').data || []);
                var trunks = {};
                countTrunks(inbound, 'inbound', trunks);
                countTrunks(outbound, 'outbound', trunks);
                var externalIds = {};
                for (var i = 0; i < inbound.length; i++) {
                    externalIds[String(inbound[i].call_id)] = true;
                }
                for (var j = 0; j < outbound.length; j++) {
                    externalIds[String(outbound[j].call_id)] = true;
                }
                var output = {
                    inbound: inbound.length,
                    outbound: outbound.length,
                    internal: internal.length,
                    external: Object.keys(externalIds).length,
                    trunks: trunks
                };
                return JSON.stringify(output);
            } finally {
                try {
                    request('del_token?access_token=' + token, null);
                } catch (e) {
                    Zabbix.log(3, 'Yeastar: Token revocation failed: ' + e);
                }
            }
          description: 'Collects current inbound, outbound and internal calls through the REST API.'
          timeout: 30s
          parameters:
            - name: id
              value: '{$YEASTAR.CLIENT.ID}'
            - name: secret
              value: '{$YEASTAR.CLIENT.SECRET}'
            - name: url
              value: '{$YEASTAR.URL}'
          tags:
            - tag: component
              value: api
