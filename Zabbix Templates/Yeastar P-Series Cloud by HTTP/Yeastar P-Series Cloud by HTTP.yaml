  triggers:
    - uuid: d24ce92b2ff74a65befe1b263a216b48
      expression: |
        last(/Yeastar P-Series Cloud by HTTP/yeastar.capacity.calls)>0
        and
        last(/Yeastar P-Series Cloud by HTTP/yeastar.capacity.calls.used)*100
        /
        last(/Yeastar P-Series Cloud by HTTP/yeastar.capacity.calls)
        >= {$YEASTAR.CALLS.ALLOC.CRIT}
        and {$YEASTAR.CALLS.ALLOC.ENABLED}=1
      name: 'Yeastar: Concurrent call allocation above {$YEASTAR.CALLS.ALLOC.CRIT}%'
      priority: AVERAGE
      description: |
        The allocated concurrent call capacity has reached {$YEASTAR.CALLS.ALLOC.CRIT}% of the licensed concurrent call capacity.
        This alert can be disabled using the {$YEASTAR.CALLS.ALLOC.ENABLED} macro.
      tags:
        - tag: component
          value: capacity
        - tag: scope
          value: calls
    - uuid: 1b8be400b469410db384f72eebc0c523
      expression: |
        last(/Yeastar P-Series Cloud by HTTP/yeastar.capacity.calls)>0
        and
        last(/Yeastar P-Series Cloud by HTTP/yeastar.capacity.calls.used)*100
        /
        last(/Yeastar P-Series Cloud by HTTP/yeastar.capacity.calls)
        >= {$YEASTAR.CALLS.ALLOC.WARN}
        and {$YEASTAR.CALLS.ALLOC.ENABLED}=1
      name: 'Yeastar: Concurrent call allocation above {$YEASTAR.CALLS.ALLOC.WARN}%'
      priority: WARNING
      description: |
        The allocated concurrent call capacity has reached {$YEASTAR.CALLS.ALLOC.WARN}% of the licensed concurrent call capacity.
        This alert can be disabled using the {$YEASTAR.CALLS.ALLOC.ENABLED} macro.
      dependencies:
        - name: 'Yeastar: Concurrent call allocation above {$YEASTAR.CALLS.ALLOC.CRIT}%'
          expression: |
            last(/Yeastar P-Series Cloud by HTTP/yeastar.capacity.calls)>0
            and
            last(/Yeastar P-Series Cloud by HTTP/yeastar.capacity.calls.used)*100
            /
            last(/Yeastar P-Series Cloud by HTTP/yeastar.capacity.calls)
            >= {$YEASTAR.CALLS.ALLOC.CRIT}
            and {$YEASTAR.CALLS.ALLOC.ENABLED}=1
      tags:
        - tag: component
          value: capacity
        - tag: scope
          value: calls
