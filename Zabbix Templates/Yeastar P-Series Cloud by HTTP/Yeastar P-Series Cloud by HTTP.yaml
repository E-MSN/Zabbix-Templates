                      if (!extension) { throw "Resource missing"; }
                      return String(extension.caller_id_name || "");
              master_item:
                key: yeastar.raw
              tags:
                - tag: component
                  value: extension
            - uuid: b2ac6d9e6c774f7492e81eaba94236ef
              name: 'Extension {#NAME}: Presence'
              type: DEPENDENT
              key: 'yeastar.extension.presence[{#ID}]'
              value_type: CHAR
              description: 'Presence status configured for this extension.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var a = JSON.parse(value).extensions;
                      var o = a.filter(function(v) {
                          return String(v.id) ===  "{#ID}";
                      })[0];
                      if (!o) { throw "Resource missing"; }
