zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: a1d618f5770344d18bdae7c4edf296ba
      name: Templates/Power
  templates:
    - uuid: 1cd45808e69d419db54ab24948e4a491
      template: 'SOCOMEC UPS NetVision by SNMP'
      name: 'SOCOMEC UPS NetVision by SNMP'
      description: |
        Template for SOCOMEC UPS equiped with NetVision v7 or v8 network cards.
        
        NetVision v8 compatibility notes:
        Some NetVision v8 counters return sentinel values such as 65535, 655350, 65533 or -1 when a metric is not available.
        These values are discarded by preprocessing before unit conversion to avoid invalid graphs.
      vendor:
        name: E-MSN
        version: 7.4-10
      groups:
        - name: Templates/Power
      items:
        - uuid: d532744a53694a64b2c21eebb250719f
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          delay: '60'
          history: 1w
          valuemap:
            name: 'Service state'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: f8002020d25c4958b5ffc3243372b9c1
              expression: 'max(/SOCOMEC UPS NetVision by SNMP/icmpping,#3)=0'
              name: 'ICMP Ping: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 6876c2cf6b764b1eb5389852e0e45458
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: '%'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: 79ad013667fa42e19bdd0c982ebac1e5
              expression: 'min(/SOCOMEC UPS NetVision by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/SOCOMEC UPS NetVision by SNMP/icmppingloss,5m)<100'
              name: 'ICMP Ping: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/SOCOMEC UPS NetVision by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 2098994feaf1473fb4a7d206bdfd21cf
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: s
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: c53553869f4c40098090ff1fb1f17bd6
              expression: 'avg(/SOCOMEC UPS NetVision by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'ICMP Ping: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'ICMP Ping: High ICMP ping loss'
                  expression: 'min(/SOCOMEC UPS NetVision by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/SOCOMEC UPS NetVision by SNMP/icmppingloss,5m)<100'
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/SOCOMEC UPS NetVision by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 727737f4fe084b31a3abcc7438aa913e
          name: Uptime
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: 'system.uptime[sysUpTime.0]'
          units: uptime
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: ddee7c3479354ab69327b7825ee25198
          name: 'Alarm - Battery Temp'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.6.3.16.0
          key: upsAlarmBatteryTemperature.0
          history: 7d
          description: 'Battery Temperature Alarm. (A020)'
          tags:
            - tag: application
              value: alarm
          triggers:
            - uuid: 311503f5d4dd44dcbbeaa2d53424e408
              expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsAlarmBatteryTemperature.0)<>0'
              name: '{HOSTNAME} - UPS battery temperature alarm is active'
              priority: HIGH
        - uuid: ba54e1c35df44debaa884dfebca9e09f
          name: 'Alarm - Fan Fault'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.6.3.32.0
          key: upsAlarmFansFailure.0
          history: 7d
          description: 'Fans failure. (A054)'
          tags:
            - tag: application
              value: alarm
          triggers:
            - uuid: db73c9b8793e40488a59c44df7358dfb
              expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsAlarmFansFailure.0)<>0'
              name: '{HOSTNAME} - Fan Fault'
              priority: AVERAGE
        - uuid: d5b8269c8fce4481b25db576b1503704
          name: 'Alarm - UPS LowBattery'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.6.3.14.0
          key: upsAlarmLowBattery.0
          history: 7d
          description: 'The remaining battery run-time is less than or equal to battery low threshold. (A018)'
          tags:
            - tag: application
              value: alarm
          triggers:
            - uuid: bcb6d126180e43f6a70010080b553fbd
              expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsAlarmLowBattery.0)<>0'
              name: '{HOSTNAME} - UPS low battery alarm is active'
              priority: AVERAGE
        - uuid: e4e4d8830bf848e0af247012ffc7e41b
          name: 'Alarm - UPS OnBattery'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.6.3.15.0
          key: upsAlarmOnBattery
          history: 7d
          description: 'The UPS is drawing power from the batteries. (A019)'
          tags:
            - tag: application
              value: alarm
          triggers:
            - uuid: 48542207fede426aa489c977c9f7c6bd
              expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsAlarmOnBattery)<>0'
              name: '{HOSTNAME} - On Battery Power'
              priority: HIGH
              dependencies:
                - name: '{HOSTNAME} - No input power'
                  expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsInputFrequency.0)<{$UPS.INPUT.FREQ.MIN}'
        - uuid: 2cc59e29b77c48ca936d150331b91fbb
          name: 'Alarm - UPS OnBypass'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.6.3.55.0
          key: upsAlarmOnBypass.0
          history: 7d
          description: |
            Load supplied by automatic bypass.
            Load not protected.
          tags:
            - tag: application
              value: alarm
          triggers:
            - uuid: 0202ef22cc444c2c91921a1693491cab
              expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsAlarmOnBypass.0)<>0'
              name: '{HOSTNAME} - OnBypass Mode'
              priority: AVERAGE
        - uuid: 3b6fc3fb02dc4e45bba1c2fe9552f4bf
          name: 'Alarm - UPS Overload'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.6.3.2.0
          key: upsAlarmOverload.0
          history: 7d
          description: 'The output load exceeds the UPS output capacity. (A001)'
          tags:
            - tag: application
              value: alarm
          triggers:
            - uuid: 13d3b33e8a3c4f5ea5fd10bf48c8f9e6
              expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsAlarmOverload.0)<>0'
              name: '{HOSTNAME} - UPS overload alarm is active'
              priority: HIGH
        - uuid: 9856a3447b294e77ad59d993737fc635
          name: 'Alarm Present Quantity'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.6.1.0
          key: upsAlarmsPresent.0
          history: 7d
          description: 'The present number of active alarm conditions.'
          tags:
            - tag: application
              value: alarm
          triggers:
            - uuid: b157fdc61b3944e993c61d8e895232cb
              expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsAlarmsPresent.0)<>0'
              name: '{HOSTNAME} - Active Alarms'
              priority: HIGH
              description: 'Check on the UPS the issue'
              dependencies:
                - name: '{HOSTNAME} - Ambient temperature critical'
                  expression: 'avg(/SOCOMEC UPS NetVision by SNMP/upsAmbientTemperature.0,5m)>{$UPS.TEMP.HIGH}'
                - name: '{HOSTNAME} - Ambient temperature high'
                  expression: 'avg(/SOCOMEC UPS NetVision by SNMP/upsAmbientTemperature.0,5m)>{$UPS.TEMP.WARN}'
                - name: '{HOSTNAME} - Ambient temperature low'
                  expression: 'avg(/SOCOMEC UPS NetVision by SNMP/upsAmbientTemperature.0,5m)<{$UPS.TEMP.LOW}'
                - name: '{HOSTNAME} - Ambient temperature too low'
                  expression: 'avg(/SOCOMEC UPS NetVision by SNMP/upsAmbientTemperature.0,5m)<{$UPS.TEMP.CRIT.LOW}'
                - name: '{HOSTNAME} - Battery charge critical'
                  expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsEstimatedChargeRemaining.0)<{$UPS.BATTERY.CHARGE.CRIT}'
                - name: '{HOSTNAME} - Battery charge low'
                  expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsEstimatedChargeRemaining.0)<{$UPS.BATTERY.CHARGE.WARN}'
                - name: '{HOSTNAME} - Battery depleted'
                  expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsBatteryStatus.0)=4'
                - name: '{HOSTNAME} - Battery low'
                  expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsBatteryStatus.0)=3'
                - name: '{HOSTNAME} - Battery status unknown'
                  expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsBatteryStatus.0)=1'
                - name: '{HOSTNAME} - Fan Fault'
                  expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsAlarmFansFailure.0)<>0'
                - name: '{HOSTNAME} - No input power'
                  expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsInputFrequency.0)<{$UPS.INPUT.FREQ.MIN}'
                - name: '{HOSTNAME} - On Battery Power'
                  expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsAlarmOnBattery)<>0'
                - name: '{HOSTNAME} - OnBypass Mode'
                  expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsAlarmOnBypass.0)<>0'
                - name: '{HOSTNAME} - Output load high'
                  expression: 'avg(/SOCOMEC UPS NetVision by SNMP/upsOutputLoadRate.0,5m)>{$UPS.LOAD.HIGH}'
                - name: '{HOSTNAME} - Output load warning'
                  expression: 'avg(/SOCOMEC UPS NetVision by SNMP/upsOutputLoadRate.0,5m)>{$UPS.LOAD.WARN}'
                - name: '{HOSTNAME} - Output source is not inverter'
                  expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsOutputSource.0)<>{$UPS.OUTPUT.SOURCE.OK}'
                - name: '{HOSTNAME} - UPS battery temperature alarm is active'
                  expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsAlarmBatteryTemperature.0)<>0'
                - name: '{HOSTNAME} - UPS low battery alarm is active'
                  expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsAlarmLowBattery.0)<>0'
                - name: '{HOSTNAME} - UPS overload alarm is active'
                  expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsAlarmOverload.0)<>0'
        - uuid: 364be1a081ba412f902fa40a9e4b93a2
          name: 'Ambient Temperature'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.2.7.0
          key: upsAmbientTemperature.0
          history: 7d
          value_type: FLOAT
          units: °C
          description: |
            The ambient temperature inside the UPS
            A value of 0 is discarded because it usually means the temperature sensor is not present on some SOCOMEC NetVision cards.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = Number(value);
                  if (isNaN(v) || v === 65535 || v === 655350 || v === 65533 || v === -1 || v === 0 || v < -400 || v > 1000) {
                      throw 'Invalid SOCOMEC temperature value: ' + value;
                  }
                  return value;
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: application
              value: temperature
          triggers:
            - uuid: 993f2e06d1374281934cf4a0bb2123d1
              expression: 'avg(/SOCOMEC UPS NetVision by SNMP/upsAmbientTemperature.0,5m)>{$UPS.TEMP.HIGH}'
              name: '{HOSTNAME} - Ambient temperature critical'
              priority: HIGH
              description: 'Ambient temperature is above the high threshold.'
            - uuid: 722324272a9a4139ae2bb95d2edfbece
              expression: 'avg(/SOCOMEC UPS NetVision by SNMP/upsAmbientTemperature.0,5m)>{$UPS.TEMP.WARN}'
              name: '{HOSTNAME} - Ambient temperature high'
              priority: AVERAGE
              description: 'Ambient temperature is above the warning threshold.'
              dependencies:
                - name: '{HOSTNAME} - Ambient temperature critical'
                  expression: 'avg(/SOCOMEC UPS NetVision by SNMP/upsAmbientTemperature.0,5m)>{$UPS.TEMP.HIGH}'
            - uuid: e803c91afdbc4cc09bd94987dabc6d69
              expression: 'avg(/SOCOMEC UPS NetVision by SNMP/upsAmbientTemperature.0,5m)<{$UPS.TEMP.LOW}'
              name: '{HOSTNAME} - Ambient temperature low'
              priority: AVERAGE
              description: 'Ambient temperature is below the warning threshold.'
              dependencies:
                - name: '{HOSTNAME} - Ambient temperature too low'
                  expression: 'avg(/SOCOMEC UPS NetVision by SNMP/upsAmbientTemperature.0,5m)<{$UPS.TEMP.CRIT.LOW}'
            - uuid: ad3d6061ce9f4d72bb276e42742140af
              expression: 'avg(/SOCOMEC UPS NetVision by SNMP/upsAmbientTemperature.0,5m)<{$UPS.TEMP.CRIT.LOW}'
              name: '{HOSTNAME} - Ambient temperature too low'
              priority: HIGH
              description: 'Ambient temperature is below the critical low threshold.'
        - uuid: b26e35ebd71d413a8bed681748a6b252
          name: 'Battery Status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.33.1.2.1.0
          key: upsBatteryStatus.0
          history: 7d
          description: 'Battery status from standard UPS-MIB.'
          valuemap:
            name: 'UPS-MIB - BatteryStatus'
          tags:
            - tag: application
              value: battery
          triggers:
            - uuid: b9e5777442164f53b3faa32dd85b52dd
              expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsBatteryStatus.0)=4'
              name: '{HOSTNAME} - Battery depleted'
              priority: HIGH
            - uuid: e16021fe77e645d8b832e7d65e110637
              expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsBatteryStatus.0)=3'
              name: '{HOSTNAME} - Battery low'
              priority: AVERAGE
            - uuid: bd7e3c9d50cb4c6fab07be055c7ce1ad
              expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsBatteryStatus.0)=1'
              name: '{HOSTNAME} - Battery status unknown'
              priority: AVERAGE
        - uuid: 893dfbcabbae48908f5c115c8c842b61
          name: 'Battery Temperature'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.33.1.2.7.0
          key: upsBatteryTemperature.0
          history: 7d
          value_type: FLOAT
          units: °C
          description: |
            Battery temperature from UPS-MIB.
            A value of 0 is discarded because it usually means the battery temperature sensor is not present on some SOCOMEC NetVision cards.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = Number(value);
                  if (isNaN(v) || v === 65535 || v === 655350 || v === 65533 || v === -1 || v === 0 || v < -40 || v > 100) {
                      throw 'Invalid SOCOMEC temperature value: ' + value;
                  }
                  return value;
          tags:
            - tag: application
              value: battery
            - tag: application
              value: temperature
        - uuid: 5edc782b24f24a489a3a2cfa3275b556
          name: 'Battery Voltage'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.2.5.0
          key: upsBatteryVoltage.0
          history: 7d
          value_type: FLOAT
          units: V
          description: 'Battery voltage.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = Number(value);
                  if (isNaN(v) || v === 65535 || v === 655350 || v === 65533 || v === -1) {
                      throw 'Invalid SOCOMEC sentinel value: ' + value;
                  }
                  return value;
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: application
              value: battery
        - uuid: ca267b8b516e46949d15be554c330d1d
          name: 'Bypass Frequency'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.5.1.0
          key: upsBypassFrequency.0
          history: 7d
          value_type: FLOAT
          units: Hz
          description: 'Bypass frequency.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = Number(value);
                  if (isNaN(v) || v === 65535 || v === 655350 || v === 65533 || v === -1) {
                      throw 'Invalid SOCOMEC sentinel value: ' + value;
                  }
                  return value;
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: application
              value: bypass
        - uuid: 6f9edd4fb5b546908b732064d6a66070
          name: 'UPS nominal power'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.8.1.0
          key: upsConfigOutputPower.0
          delay: 1h
          history: 7d
          value_type: FLOAT
          units: kVA
          description: 'Configured UPS nominal output power.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = Number(value);
                  if (isNaN(v) || v === 65535 || v === 655350 || v === 65533 || v === -1) {
                      throw 'Invalid SOCOMEC sentinel value: ' + value;
                  }
                  return value;
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: application
              value: config
        - uuid: e2673ff69ab6435a877f30529b39320b
          name: 'UPS configured unit kVA'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.8.3.0
          key: upsConfigUnitKva.0
          delay: 1h
          history: 7d
          value_type: FLOAT
          units: kVA
          description: 'UPS configured unit capacity.'
          tags:
            - tag: application
              value: config
        - uuid: 3124a02591394c33bdd475cbc5d526f3
          name: 'Battery Percent'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.2.4.0
          key: upsEstimatedChargeRemaining.0
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'An estimate of the battery charge remaining expressed as a percent of full charge.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = Number(value);
                  if (isNaN(v) || v < 0 || v > 100 || v === 65535 || v === 655350 || v === 65533 || v === -1) {
                      throw 'Invalid SOCOMEC battery charge value: ' + value;
                  }
                  return value;
          tags:
            - tag: application
              value: battery
          triggers:
            - uuid: 5fa1919fbe05491497bfe42b9769c2d7
              expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsEstimatedChargeRemaining.0)<{$UPS.BATTERY.CHARGE.CRIT}'
              name: '{HOSTNAME} - Battery charge critical'
              priority: HIGH
            - uuid: 05726acd77b14968bf124921af5097aa
              expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsEstimatedChargeRemaining.0)<{$UPS.BATTERY.CHARGE.WARN}'
              name: '{HOSTNAME} - Battery charge low'
              priority: AVERAGE
              dependencies:
                - name: '{HOSTNAME} - Battery charge critical'
                  expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsEstimatedChargeRemaining.0)<{$UPS.BATTERY.CHARGE.CRIT}'
        - uuid: 422c697daf8a49d98b90a8ff49ac79b6
          name: 'Battery Time Remaining'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.2.3.0
          key: upsEstimatedMinutesRemaining.0
          history: 7d
          units: '!min'
          description: 'An estimate of the time to battery charge depletion under the present load conditions. Compute when UPS is on battery power.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = Number(value);
                  if (isNaN(v) || v === 65535 || v === 655350 || v === 65533 || v === -1) {
                      throw 'Invalid SOCOMEC sentinel value: ' + value;
                  }
                  return value;
          tags:
            - tag: application
              value: battery
        - uuid: 4acba6cd3bcf43ed837f704ec3c017ef
          name: 'Firmware Version'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.33.1.1.4.0
          key: upsfirmware.0
          delay: 1d
          history: 7d
          value_type: TEXT
          inventory_link: OS
          tags:
            - tag: application
              value: information
        - uuid: a59a7a4e5e2140beadc5e9b696601f1f
          name: Model
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.1.1.0
          key: upsIdentModel.0
          delay: 1d
          history: 7d
          value_type: TEXT
          inventory_link: MODEL
          tags:
            - tag: application
              value: information
        - uuid: 7ca3414dc8ff4742a729830d5cef45bb
          name: 'Serial Number'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.1.2.0
          key: upsIdentSerialNumber.0
          delay: 1d
          history: 7d
          value_type: TEXT
          inventory_link: SERIALNO_A
          tags:
            - tag: application
              value: information
        - uuid: 2c70a14f54d646ae9f29411c76d4ca09
          name: 'Input Frequency'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.3.2.0
          key: upsInputFrequency.0
          history: 7d
          units: Hz
          description: 'The current input frequency to the UPS system.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = Number(value);
                  if (isNaN(v) || v === 65535 || v === 655350 || v === 65533 || v === -1) {
                      throw 'Invalid SOCOMEC sentinel value: ' + value;
                  }
                  return value;
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: application
              value: input
          triggers:
            - uuid: cdb41b57b2274234b75f4be0671f7171
              expression: 'last(/SOCOMEC UPS NetVision by SNMP/upsInputFrequency.0)<{$UPS.INPUT.FREQ.MIN}'
              name: '{HOSTNAME} - No input power'
              priority: HIGH
        - uuid: c408f4458b0c446d9b6fbac4345fa5df
          name: 'Output active power'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.4555.1.1.7.1.4.6.0
          key: upsOutputActivePower.0
          history: 7d
          value_type: FLOAT
          units: kW
          description: 'Output global active power.'
          preprocessing:
