                    - tag: scope
                      value: poe
            - uuid: 84b6251607fd4121835e97a5a42284f8
              name: '{#POEPORTNAME}: Priority'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.105.1.1.1.7.{#SNMPINDEX}'
              key: 'poe.port.priority[{#SNMPINDEX}]'
              delay: 5m
              history: 30d
              description: 'Configured PoE priority for this port.'
              valuemap:
                name: 'PoE port priority'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: poe
            - uuid: b6cb8786ffae4de497bd1e20251bff59
              name: '{#POEPORTNAME}: Short events'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.105.1.1.1.14.{#SNMPINDEX}'
              key: 'poe.port.short.rate[{#SNMPINDEX}]'
              history: 30d
              value_type: FLOAT
              units: eps
              description: 'Rate of PoE short circuit events on this port.'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: poe
          trigger_prototypes:
            - uuid: 8a78c0c2017049d9b421596b58fe5b83
              expression: 'min(/Aruba Instant On 1830 Series by SNMP/poe.port.overload.rate[{#SNMPINDEX}],5m)>0 or min(/Aruba Instant On 1830 Series by SNMP/poe.port.short.rate[{#SNMPINDEX}],5m)>0'
              name: '{#POEPORTNAME}: Electrical fault events detected'
              opdata: 'Events/s: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'PoE overload or short circuit events were detected on this port.'
              tags:
                - tag: scope
                  value: poe
          graph_prototypes:
            - uuid: 3279ab4199334506852a442b62f0e35e
              name: '{#POEPORTNAME}: Power'
              graph_items:
                - color: 199C0D
                  item:
                    host: 'Aruba Instant On 1830 Series by SNMP'
                    key: 'poe.port.power[{#SNMPINDEX}]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  data.forEach(function (row) {
                      var idx = String(row['{#SNMPINDEX}'] || '');
                      var m = idx.match(/^([0-9]+)\.([0-9]+)$/);
                      if (m) {
                          row['{#POEGROUP}'] = m[1];
                          row['{#POEPORT}'] = m[2];
                          row['{#POEPORTNAME}'] = 'PoE Port ' + m[2];
                      } else {
                          row['{#POEGROUP}'] = '';
                          row['{#POEPORT}'] = idx;
                          row['{#POEPORTNAME}'] = 'PoE Port ' + idx;
                      }
                  });
                  return JSON.stringify(data);
        - uuid: 6936e5fb8811406c9b45ed2576eb5e10
          name: 'Thermal sensors discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SENSORTYPE},.1.3.6.1.4.1.11.2.83.2.1.1.1.1,{#SENSORSTATUS},.1.3.6.1.4.1.11.2.83.2.1.1.1.5,{#SENSORUNITS},.1.3.6.1.4.1.11.2.83.2.1.1.1.6]'
          key: thermal.sensor.discovery
          delay: 1h
          description: 'Discovers thermal sensors from the HPE private ENTITY-SENSOR implementation.'
          item_prototypes:
            - uuid: ef1ed562b4874205a647cb23fbb91d78
              name: '{#SENSORNAME}: Status'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.11.2.83.2.1.1.1.5.{#SNMPINDEX}'
              key: 'sensor.status[{#SNMPINDEX}]'
              history: 30d
              description: 'Current operational status of this thermal sensor.'
              valuemap:
                name: 'Entity sensor status'
              tags:
                - tag: component
                  value: sensor
              trigger_prototypes:
                - uuid: c949a1e88b324318a15d4428bf06d567
                  expression: 'last(/Aruba Instant On 1830 Series by SNMP/sensor.status[{#SNMPINDEX}])<>1'
                  name: '{#SENSORNAME}: Status is not OK'
                  opdata: 'Status: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'Thermal sensor operational status is not OK.'
                  tags:
                    - tag: scope
                      value: sensor
            - uuid: f1e21ca0e52d4bf5b950d92a4265d202
              name: '{#SENSORNAME}: Temperature'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.11.2.83.2.1.1.1.4.{#SNMPINDEX}'
              key: 'sensor.value[{#SNMPINDEX}]'
              history: 30d
              value_type: FLOAT
              units: °C
              description: 'Current temperature reported by this thermal sensor.'
              tags:
                - tag: component
                  value: sensor
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  data.forEach(function (row) {
                      var idx = Number(row['{#SNMPINDEX}']);
                      var sensorNumber = idx - 68420480;
                      if (sensorNumber >= 1 && sensorNumber <= 7) {
                          row['{#SENSORNAME}'] = 'Thermal Sensor ' + sensorNumber;
                          row['{#SENSORPHYINDEX}'] = String(idx + 896);
                      }
                      else {
                          row['{#SENSORNAME}'] = 'Sensor ' + idx;
                          row['{#SENSORPHYINDEX}'] = String(idx);
                      }
                  });
                  return JSON.stringify(data);
