        - macro: '{$NET.IF.CRC.WARN}'
          value: '0'
          description: 'Warning threshold for interface CRC/FCS error rate.'
        - macro: '{$NET.IF.ERRORS.WARN}'
          value: '1'
          description: 'Warning threshold for interface error rate.'
        - macro: '{$NET.IF.IFNAME.MATCHES}'
          value: '.*'
          description: 'Regular expression matching interface names to discover.'
        - macro: '{$NET.IF.IFNAME.NOT_MATCHES}'
          value: (^lo$|^Loopback|^InLoopback|^NULL|^VLAN|^vlan|^br|^bridge)
