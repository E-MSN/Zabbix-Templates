  triggers:
    - uuid: a5a6f90836ef4e73819546528f071e98
      expression: |
        last(/Aruba Instant On 1830 Series by SNMP/aruba1830.cloud.manager.mode)=2
        and
        last(/Aruba Instant On 1830 Series by SNMP/aruba1830.cloud.agent.status)<>2
      name: 'Aruba Cloud: Agent status is not active'
      opdata: 'Status: {ITEM.LASTVALUE1}'
      priority: INFO
      description: 'Cloud manager mode is set to cloud, but the cloud agent is not active.'
      manual_close: 'YES'
      tags:
        - tag: scope
          value: availability
        - tag: scope
          value: cloud
    - uuid: 1080647c844042dd84f4c46f16bc0dc2
      expression: |
        last(/Aruba Instant On 1830 Series by SNMP/aruba1830.env.temperature)
        >
        last(/Aruba Instant On 1830 Series by SNMP/aruba1830.env.temperature.critical.threshold)
        and
        last(/Aruba Instant On 1830 Series by SNMP/aruba1830.env.temperature.critical.threshold)>0
      name: 'Environment: Temperature is critical'
      opdata: 'Temperature: {ITEM.LASTVALUE1}'
      priority: HIGH
      description: 'Unit temperature is above the critical threshold reported by the device.'
      tags:
        - tag: scope
          value: temperature
    - uuid: 5e7b0c327d6f4ed690674ced9d355ebf
      expression: |
        last(/Aruba Instant On 1830 Series by SNMP/aruba1830.env.temperature)
        >
        last(/Aruba Instant On 1830 Series by SNMP/aruba1830.env.temperature.warning.threshold)
        and
        last(/Aruba Instant On 1830 Series by SNMP/aruba1830.env.temperature.warning.threshold)>0
      name: 'Environment: Temperature is high'
      opdata: 'Temperature: {ITEM.LASTVALUE1}'
      priority: AVERAGE
      description: 'Unit temperature is above the warning threshold reported by the device.'
      dependencies:
        - name: 'Environment: Temperature is critical'
          expression: |
            last(/Aruba Instant On 1830 Series by SNMP/aruba1830.env.temperature)
            >
            last(/Aruba Instant On 1830 Series by SNMP/aruba1830.env.temperature.critical.threshold)
            and
            last(/Aruba Instant On 1830 Series by SNMP/aruba1830.env.temperature.critical.threshold)>0
      tags:
        - tag: scope
          value: temperature
