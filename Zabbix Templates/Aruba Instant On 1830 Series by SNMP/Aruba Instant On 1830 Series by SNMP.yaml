        - macro: '{$NET.IF.IFTYPE.MATCHES}'
          value: ^(6|161)$
          description: 'Regular expression matching interface types to discover.'
        - macro: '{$POE.PORT.MATCHES}'
          value: '.*'
          description: 'Regular expression matching PoE port indexes to discover.'
        - macro: '{$POE.PSE.UTIL.WARN}'
          value: '80'
          description: 'Main PSE PoE utilization warning threshold in percent.'
