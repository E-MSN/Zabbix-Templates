zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: f71faac2ecaf43e4b251b991cc1bf1af
      name: 'Templates/Network devices'
  templates:
    - uuid: d4294b6286d4428a86c9ff17b84d5770
      template: 'Aruba Instant On 1830 Series by SNMP'
      name: 'Aruba Instant On 1830 Series by SNMP'
      description: |
        Aruba Instant On 1830 series template by SNMP.
        
        MIBs used:
        SNMPv2-MIB
        IF-MIB
        EtherLike-MIB
        POWER-ETHERNET-MIB
        HPE-rndMng
        HPE-Physicaldescription-MIB
        HPE-HWENVIROMENT
        ENTITY-SENSOR-MIB
        HPE-POE-MIB
        HPE-GREEN-MIB
        HPE-CLOUDMANAGER
      vendor:
        name: E-MSN
        version: 7.4.11
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 7bff9b637a9f48698f23f5761a079d56
          name: 'Cloud: Agent status'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.11.2.236.2.0
          key: aruba1830.cloud.agent.status
          delay: 5m
          history: 30d
          description: 'Cloud agent status reported by HPE Cloud Manager MIB.'
          valuemap:
            name: 'Aruba Cloud agent status'
          tags:
            - tag: component
              value: cloud
        - uuid: 5db7d1530896405f8a0e1a9b1df43cc4
          name: 'Cloud: Manager mode'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.11.2.236.1.0
          key: aruba1830.cloud.manager.mode
          delay: 1h
          history: 30d
          description: 'Cloud manager mode reported by HPE Cloud Manager MIB.'
          valuemap:
            name: 'Aruba Cloud manager mode'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: cloud
        - uuid: 0f4132d3269643b295eaf4338e404909
          name: 'Environment: Unit temperature'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.11.2.53.15.1.10.1
          key: aruba1830.env.temperature
          history: 30d
          value_type: FLOAT
          units: °C
          description: 'Current unit temperature reported by the device.'
          tags:
            - tag: component
              value: temperature
        - uuid: f306bdc8ae5b4a3abdccd40119032b02
          name: 'Environment: Unit critical temperature threshold'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.11.2.53.15.1.13.1
          key: aruba1830.env.temperature.critical.threshold
          delay: 1h
          history: 30d
          value_type: FLOAT
          units: °C
          description: 'Critical temperature threshold reported by the device.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: temperature
        - uuid: 1e056a8080e343f6b1b98ad7d4664ee1
          name: 'Environment: Unit temperature status'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.11.2.53.15.1.16.1
          key: aruba1830.env.temperature.status
          history: 30d
          description: 'Overall unit temperature status reported by the device.'
          valuemap:
            name: 'Aruba Temperature status'
          tags:
            - tag: component
              value: temperature
          triggers:
            - uuid: 9b3c3650fcbc4446bd51da72ebefe3f2
              expression: 'last(/Aruba Instant On 1830 Series by SNMP/aruba1830.env.temperature.status)<>1'
              name: 'Environment: Temperature status is not OK'
              opdata: 'Status: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Unit temperature status reported by the device is not OK.'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: temperature
        - uuid: 25ad956090db40c38b0044d77a3700cc
          name: 'Environment: Unit warning temperature threshold'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.11.2.53.15.1.12.1
          key: aruba1830.env.temperature.warning.threshold
          delay: 1h
          history: 30d
          value_type: FLOAT
          units: °C
          description: 'Warning temperature threshold reported by the device.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: temperature
        - uuid: 0ff2782d49144faf94c9df8d43fd9aa2
          name: 'Inventory: Firmware version'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.11.2.53.14.1.3.1
          key: aruba1830.inventory.firmware
          delay: 1h
          history: 90d
          value_type: CHAR
          description: 'Firmware version reported by the device.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: inventory
        - uuid: 9348263d5eba472a96c0530afb2e8e2e
          name: 'Inventory: Hardware version'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.11.2.53.14.1.4.1
          key: aruba1830.inventory.hardware
          delay: 1h
          history: 90d
          value_type: CHAR
          description: 'Hardware version reported by the device.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: inventory
        - uuid: fdfca8de7f19433da706c9e70cef51c5
          name: 'Inventory: Model'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.11.2.53.14.1.11.1
          key: aruba1830.inventory.model
          delay: 1h
          history: 90d
          value_type: CHAR
          description: 'Device model reported by HPE physical description MIB.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: inventory
        - uuid: b1a63d8e48f342cb978389866de975cb
          name: 'Inventory: Serial number'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.11.2.53.14.1.5.1
          key: aruba1830.inventory.serial
          delay: 1h
          history: 90d
          value_type: CHAR
          description: 'Device serial number reported by HPE physical description MIB.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: inventory
        - uuid: 3d02014fc20a491aa4ec1d913fc44203
          name: 'Inventory: Software version'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.11.2.53.4.1.5.1
          key: aruba1830.inventory.software
          delay: 1h
          history: 90d
          value_type: CHAR
          description: 'Software version reported by HPE physical description MIB.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: inventory
        - uuid: fff08fcb2dea46d2bcb9c73a90327812
          name: 'Green Ethernet: Consumption ratio'
          type: CALCULATED
          key: greeneth.consumption.ratio
          delay: 5m
          history: 30d
          value_type: FLOAT
          units: '%'
          params: '100*last(//greeneth.current.consumption)/last(//greeneth.max.consumption)'
          description: 'Current Green Ethernet consumption ratio compared to the estimated maximum consumption.'
          tags:
            - tag: component
              value: power
        - uuid: 03a8e4b0f2984826a45b24661c32874e
          name: 'Green Ethernet: Cumulative power save'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.11.2.134.5.0
          key: greeneth.cumulative.save
          delay: 1h
          history: 90d
          units: Wh
          description: 'Cumulative energy saved by Green Ethernet.'
          tags:
            - tag: component
              value: power
        - uuid: e59007d75a0241208008076300ffb638
          name: 'Green Ethernet: Current energy consumption'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.11.2.134.3.0
          key: greeneth.current.consumption
          delay: 5m
          history: 30d
          value_type: FLOAT
          units: W
          description: 'Current Green Ethernet energy consumption.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.001'
          tags:
            - tag: component
              value: power
        - uuid: 73a032cf256f4bb297401246642d2e96
          name: 'Green Ethernet: Current maximum energy consumption'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.11.2.134.4.0
          key: greeneth.max.consumption
          delay: 5m
          history: 30d
          value_type: FLOAT
          units: W
          description: 'Estimated energy consumption without Green Ethernet savings.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.001'
          tags:
            - tag: component
              value: power
        - uuid: 3c54cc318e264443b3bebb81959e6f96
          name: 'ICMP: Ping'
          type: SIMPLE
          key: icmpping
          history: 1w
          valuemap:
            name: 'Service state'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: eda2db6bb505481a93c87240a7899da1
              expression: 'max(/Aruba Instant On 1830 Series by SNMP/icmpping,#3)=0'
              name: 'ICMP Ping: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 71d90dcf64a1486aba99befca7837e85
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          history: 1w
          value_type: FLOAT
          units: '%'
          valuemap:
            name: 'Service state'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: d9570568eb984173bc3d58799b2a9d7b
              expression: 'max(/Aruba Instant On 1830 Series by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Aruba Instant On 1830 Series by SNMP/icmppingloss,5m)<100'
              name: 'ICMP Ping: High ICMP ping loss'
              priority: AVERAGE
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Aruba Instant On 1830 Series by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: f3f29ff864134247a59c96f1ae0f5309
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          history: 1w
          value_type: FLOAT
          units: s
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: af4f16d49e8e4e149cc6dbc002c7a811
              expression: 'avg(/Aruba Instant On 1830 Series by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'ICMP Ping: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'ICMP Ping: High ICMP ping loss'
                  expression: 'max(/Aruba Instant On 1830 Series by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Aruba Instant On 1830 Series by SNMP/icmppingloss,5m)<100'
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Aruba Instant On 1830 Series by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: b58207a4407b473d8203ec36bce0d676
          name: 'PoE: Main PSE consumption'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.105.1.3.1.1.4.1
          key: 'poe.main.consumption[1]'
          history: 30d
          value_type: FLOAT
          units: W
          description: 'Current PoE power consumption for the main PSE group.'
          tags:
            - tag: component
              value: poe
        - uuid: e880eaa954c34a4e8343fc97742708d7
          name: 'PoE: Main PSE nominal power'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.105.1.3.1.1.2.1
          key: 'poe.main.power[1]'
          delay: 5m
          history: 30d
          units: W
          description: 'Nominal PoE power budget for the main PSE group.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: poe
        - uuid: c622ab296506484ba988fd99134fbc5f
          name: 'PoE: Main PSE operational status'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.105.1.3.1.1.3.1
          key: 'poe.main.status[1]'
          history: 30d
          description: 'Operational status of the main PSE group.'
          valuemap:
            name: 'PSE operational status'
          tags:
            - tag: component
              value: poe
          triggers:
            - uuid: 85986cc225ca4459884798201417e8a0
              expression: 'last(/Aruba Instant On 1830 Series by SNMP/poe.main.status[1])<>1'
              name: 'PoE: Main PSE is not operational'
              opdata: 'Status: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Main PoE PSE operational status is not on.'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: poe
        - uuid: 7a1a08209bff44e5a9f305d5cadf085f
          name: 'PoE: Main PSE temperature'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.11.2.108.2.1.8.1
          key: 'poe.main.temperature[1]'
          history: 30d
          value_type: FLOAT
          units: °C
          description: 'PoE controller temperature. Value 32767 means not available according to the MIB.'
          tags:
            - tag: component
              value: poe
            - tag: component
              value: temperature
          triggers:
            - uuid: 14b9eeec14644736a37b9ea252c81191
              expression: 'last(/Aruba Instant On 1830 Series by SNMP/poe.main.temperature[1])<>32767 and last(/Aruba Instant On 1830 Series by SNMP/poe.main.temperature[1])>{$POE.TEMP.WARN}'
              name: 'PoE: Main PSE temperature is high'
              opdata: 'Temperature: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'PoE controller temperature is above the warning threshold.'
              tags:
                - tag: scope
                  value: poe
                - tag: scope
                  value: temperature
        - uuid: bef23604af8c4503bca33aa1fe771446
          name: 'PoE: Main PSE usage threshold'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.105.1.3.1.1.5.1
          key: 'poe.main.threshold[1]'
          delay: 5m
          history: 30d
          units: '%'
          description: 'Configured PoE usage threshold for the main PSE group.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: poe
        - uuid: b6d8be78eef64a2c9fae3066c40afe94
          name: 'PoE: Main PSE utilization'
          type: CALCULATED
          key: 'poe.main.util[1]'
          history: 30d
          value_type: FLOAT
          units: '%'
          params: '100*last(//poe.main.consumption[1])/last(//poe.main.power[1])'
          description: 'PoE power budget utilization for the main PSE group.'
          tags:
            - tag: component
              value: poe
          triggers:
            - uuid: a7eede353a9d46e09de79d1b2225e117
              expression: 'min(/Aruba Instant On 1830 Series by SNMP/poe.main.util[1],5m)>{$POE.PSE.UTIL.WARN}'
              name: 'PoE: Main PSE utilization is high'
              opdata: 'Utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Main PoE PSE power budget utilization is above the warning threshold.'
              tags:
                - tag: scope
                  value: capacity
                - tag: scope
                  value: poe
        - uuid: 6876c1dabe5b4e23a00cdfc41b7edc72
          name: 'System: Contact'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.4.0
          key: system.contact
          delay: 1h
          history: 30d
          value_type: CHAR
          description: 'SNMP system contact.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 143efb474c424800820750fa4ff44a9e
          name: 'System: CPU utilization'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.11.2.1.8.0
          key: 'system.cpu.util[rlCpuUtilDuringLastMinute]'
          history: 30d
          value_type: FLOAT
          description: 'CPU utilization during the last minute reported by HPE rlCpuUtilDuringLastMinute.'
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: 011118d125664270b5c909b2bf50159a
              expression: 'min(/Aruba Instant On 1830 Series by SNMP/system.cpu.util[rlCpuUtilDuringLastMinute],5m)>{$ARUBA.CPU.UTIL.MAX}'
              name: 'Aruba: High CPU utilization'
              opdata: 'CPU: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'CPU utilization is above the warning threshold for 5 minutes.'
              tags:
                - tag: scope
                  value: performance
        - uuid: e751a62133fe4ea6817eeecb66062b97
          name: 'System: Description'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.1.0
          key: system.descr
          delay: 1h
          history: 30d
          value_type: CHAR
          description: 'SNMP system description.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 79340743153543318d1b4faf336c9dcc
          name: 'System: Location'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.6.0]'
          key: system.location
          delay: 1h
          history: 30d
          value_type: CHAR
          description: 'SNMP system location.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: e263280d0ad642d48ab6cbf25ff783ed
          name: 'System: Name'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.5.0
          key: system.name
          delay: 1h
          history: 30d
          value_type: CHAR
          description: 'SNMP system name.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 2523f6d8b9c44e1da2bd45efd8625d61
          name: 'System: Object ID'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.2.0
          key: system.objectid
          delay: 1h
          history: 30d
          value_type: CHAR
          description: 'SNMP system object identifier.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 61172aceca6b4d9192eb1f301c0c6e57
          name: 'System: Uptime'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.3.0
          key: 'system.uptime[sysUpTime]'
          history: 30d
          value_type: FLOAT
          units: uptime
          description: 'SNMP sysUpTime converted from TimeTicks centiseconds to seconds.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 52b7b4037e2b47cda5b722f69a3708ff
              expression: 'last(/Aruba Instant On 1830 Series by SNMP/system.uptime[sysUpTime])<10m'
              name: 'Aruba: Device has been restarted'
              priority: INFO
              description: 'Device uptime is below 10 minutes.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 39489bfd575347b482de0ee654082c87
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          history: 7d
          valuemap:
            name: 'SNMP available'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: network
            - tag: component
              value: system
          triggers:
            - uuid: 41fb5ed02edc48089c7d695964f9e603
              expression: 'max(/Aruba Instant On 1830 Series by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'Aruba: No SNMP data collection'
              priority: AVERAGE
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 22a8ab43381c48ddbc6d124e1697c91a
          name: 'Fans discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#FANINDEX},.1.3.6.1.4.1.11.2.83.1.1.1.1,{#FANDESCR},.1.3.6.1.4.1.11.2.83.1.1.1.2]'
          key: env.fan.discovery
          delay: 1h
          description: 'Discovers fans from HPE environment MIB. Fanless models may return no rows.'
          item_prototypes:
            - uuid: e5c6295672aa4b9b8f476afefe0e57e5
              name: '{#FANNAME}: Description'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.11.2.83.1.1.1.2.{#SNMPINDEX}'
              key: 'env.fan.description[{#SNMPINDEX}]'
              history: 30d
              value_type: CHAR
              description: 'Raw fan description reported by the device.'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 12h
              tags:
                - tag: component
                  value: fan
            - uuid: bfb4787cfb1d472f8970a94ff27b6123
              name: '{#FANNAME}: State'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.11.2.83.1.1.1.3.{#SNMPINDEX}'
              key: 'env.fan.state[{#SNMPINDEX}]'
              history: 30d
              description: 'Current operational state of this fan.'
              valuemap:
                name: 'Aruba Environment state'
              tags:
                - tag: component
                  value: fan
              trigger_prototypes:
                - uuid: 4d5b42de0d7b4245b6d33207f7f5af1e
                  expression: 'find(/Aruba Instant On 1830 Series by SNMP/env.fan.state[{#SNMPINDEX}],#1,"regexp","{$ARUBA.ENV.STATE.OK}")=0'
                  name: '{#FANNAME}: State is not normal'
                  opdata: 'State: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'Fan state is outside the allowed OK states defined by {$ARUBA.ENV.STATE.OK}.'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: scope
                      value: fan
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  data.forEach(function (row) {
                      var raw = String(row['{#FANDESCR}'] || row['{#FANINDEX}'] || row['{#SNMPINDEX}'] || '');
