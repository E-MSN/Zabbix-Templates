                - tag: scope
                  value: performance
            - uuid: 52af808aba3f499fb672c186f4774568
              name: 'Interface {#IFNAME}: Speed'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
              key: 'net.if.speed[ifHighSpeed.{#SNMPINDEX}]'
              delay: 5m
              history: 7d
              trends: 60d
              units: bps
              description: 'IF-MIB::ifHighSpeed in Mbit/s, converted to bit/s.'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
              tags:
                - tag: component
                  value: interface
                - tag: scope
                  value: capacity
              trigger_prototypes:
                - uuid: 3c4a6f1714064664bfbcff287dee05e8
                  expression: 'change(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])<>0 and last(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0'
                  name: 'Interface {#IFNAME}: speed changed'
                  status: DISABLED
                  discover: NO_DISCOVER
                  priority: INFO
                  description: |
                    The reported interface speed has changed.
                    Disabled by default.
                  dependencies:
                    - name: '{HOST.NAME}: No SNMP data collection'
                      expression: 'max(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: component
                      value: interface
                    - tag: scope
                      value: notice
            - uuid: 5fc94a1bb9e44f4085bafad8fb182df4
              name: 'Interface {#IFNAME}: Operational status'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
              delay: 60s
              history: 7d
              description: 'IF-MIB::ifOperStatus.'
              valuemap:
                name: 'IF-MIB ifOperStatus'
              tags:
                - tag: component
                  value: interface
                - tag: scope
                  value: availability
          trigger_prototypes:
            - uuid: 827a121f6150497182e7577aa3bb7ba1
              expression: 'avg(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/net.if.in.discards[ifInDiscards.{#SNMPINDEX}],5m)>{$IF.DISCARDS.WARN:"{#IFNAME}"} or avg(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/net.if.out.discards[ifOutDiscards.{#SNMPINDEX}],5m)>{$IF.DISCARDS.WARN:"{#IFNAME}"}'
              name: 'Interface {#IFNAME}: discards detected'
              priority: WARNING
              description: 'Interface discards detected over 5 minutes.'
              dependencies:
                - name: '{HOST.NAME}: No SNMP data collection'
                  expression: 'max(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
