              delay: 5m
              history: 7d
              value_type: CHAR
              description: 'IF-MIB::ifAlias.'
              tags:
                - tag: component
                  value: interface
            - uuid: e7ffc0eda4dd4646a4bbb2bdb93e7ee6
              name: 'Interface {#IFNAME}: Description'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.2.{#SNMPINDEX}'
              key: 'net.if.descr[ifDescr.{#SNMPINDEX}]'
              delay: 5m
              history: 7d
              value_type: CHAR
              description: 'IF-MIB::ifDescr.'
              tags:
                - tag: component
                  value: interface
            - uuid: 1a81f0ed08b747daad69aea8c0f919f0
              name: 'Interface {#IFNAME}: Inbound discards'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
