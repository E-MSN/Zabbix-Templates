        - uuid: 7e8e9384707f4bd888dd5bc831e579d0
          name: 'Discover Ethernet Interfaces'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFDESCR},.1.3.6.1.2.1.2.2.1.2,{#IFTYPE},.1.3.6.1.2.1.2.2.1.3,{#IFADMINSTATUS},.1.3.6.1.2.1.2.2.1.7,{#IFOPERSTATUS},.1.3.6.1.2.1.2.2.1.8,{#IFNAME},.1.3.6.1.2.1.31.1.1.1.1,{#IFALIAS},.1.3.6.1.2.1.31.1.1.1.18]'
          key: net.if.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFNAME}'
                value: '{$IFNAME.MATCHES}'
              - macro: '{#IFNAME}'
                value: '{$IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFTYPE}'
                value: '{$IFTYPE.MATCHES}'
              - macro: '{#IFTYPE}'
                value: '{$IFTYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: |
            IF-MIB/IF-X-MIB discovery.
            Uses ifName/ifAlias for names, ifHCInOctets/ifHCOutOctets for 64-bit counters, and admin/oper status for alerting.
          item_prototypes:
            - uuid: 446b1da86f0143a4af3edfc464fc8e4a
              name: 'Interface {#IFNAME}: Administrative status'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}'
              key: 'net.if.admin.status[ifAdminStatus.{#SNMPINDEX}]'
              delay: 60s
              history: 7d
              description: 'IF-MIB::ifAdminStatus.'
              valuemap:
                name: 'IF-MIB ifAdminStatus'
              tags:
                - tag: component
                  value: interface
                - tag: scope
                  value: availability
            - uuid: 4f2b1d49d87245aebf391d5d42f2bda8
              name: 'Interface {#IFNAME}: Alias'
