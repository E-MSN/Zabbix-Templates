                  value: system
            - uuid: 00306cae81d24953906667d8dddd22e9
              name: 'Device serial number of chassis {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.11.{#SNMPINDEX}'
              key: 'serialnumber.slot.[{#SNMPINDEX}]'
