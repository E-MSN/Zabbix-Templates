              units: eps
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: interface
                - tag: scope
                  value: performance
            - uuid: 1079152867354555b7bf3d07dff039eb
              name: 'Interface {#IFNAME}: Bits sent'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
              delay: 60s
