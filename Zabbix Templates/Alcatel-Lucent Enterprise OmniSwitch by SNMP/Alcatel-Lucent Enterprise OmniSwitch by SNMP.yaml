        - uuid: 97fe790320e747668bfa5ccaa5f971a7
          name: 'Discover ALE OmniSwitch Entity common'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},.1.3.6.1.2.1.47.1.1.1.1.4]'
          key: entity.slotindex.common
          delay: 1h
          filter:
            conditions:
              - macro: '{#SNMPINDEX}'
                value: '^([1-8])$'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: |
            ENTITY-MIB::entPhysicalContainedIn.X
            X is the slot number (element of the stack) and VALUE is Entity-value
          item_prototypes:
            - uuid: db1122bdb8734a92b06b3c1421738622
              name: 'Device type of chassis {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.13.{#SNMPINDEX}'
              key: 'devicemodel.slot.[{#SNMPINDEX}]'
