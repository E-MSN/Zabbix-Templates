zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: b1110e76dba8447f947fe58af94a7a6a
      template: 'Alcatel-Lucent Enterprise OmniSwitch by SNMP'
      name: 'Alcatel-Lucent Enterprise OmniSwitch by SNMP'
      description: 'Unified SNMP template for Alcatel-Lucent Enterprise OmniSwitch devices running AOS 6.x and AOS 8.x.'
      vendor:
        name: E-MSN
        version: 7.4-10
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 3ba730573f1148edbb5c7baf5426f615
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          delay: '60'
          history: 1w
          valuemap:
            name: 'Service state'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: 4f09cbc7c5024b21b400e13f23aa0c4e
              expression: 'max(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/icmpping,#3)=0'
              name: 'ICMP Ping: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 3609a4d763584324ab4c3812aac7f571
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: '%'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: fa395dc5bc79436d9312f1a54df7e7d3
              expression: 'min(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/icmppingloss,5m)<100'
              name: 'ICMP Ping: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 504984379c374dbeac7be1791a604a47
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: s
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: dadbea0cf8f64fc3bbf7a4c30ae8c57d
              expression: 'avg(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'ICMP Ping: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'ICMP Ping: High ICMP ping loss'
                  expression: 'min(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/icmppingloss,5m)<100'
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 734a0f03dcac4fa6ac9882a6455c91d3
          name: 'Device contact details'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.4.0
          key: sysContact
          delay: 5m
          history: 7d
          value_type: CHAR
          description: 'SNMPv2-MIB::sysContact.0 - The textual identification of the contact person for this managed node, together with information on how to contact this person. If no contact information is known, the value is the zero-length string.'
          inventory_link: CONTACT
          tags:
            - tag: component
              value: inventory
        - uuid: 54ead5af9a234a2f920b2ba706fac4d7
          name: 'Device description'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.1.0
          key: sysDescr
          delay: 5m
          history: 7d
          value_type: CHAR
          description: 'SNMPv2-MIB::sysDescr.0 - A textual description of the entity. This value should include the full name and version identification of the system''s hardware type, software operating-system, and networking software.'
          inventory_link: HARDWARE
          tags:
            - tag: component
              value: inventory
          triggers:
            - uuid: 7bc880a104a3408097ad10dbade76551
              expression: 'last(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/sysDescr)<>last(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/sysDescr,#2)'
              name: '{HOST.NAME}: Device description changed'
              priority: INFO
              description: |
                Detects a sysDescr change.
                On OmniSwitch devices, this usually indicates a software, firmware, model, or system description change.
              manual_close: 'YES'
              dependencies:
                - name: '{HOST.NAME}: No SNMP data collection'
                  expression: 'max(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: component
                  value: inventory
                - tag: scope
                  value: notice
        - uuid: 7a9ede007dac4a088adb9844a04045ac
          name: 'Device location'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.6.0
          key: sysLocation
          delay: 5m
          history: 7d
          value_type: CHAR
          description: 'SNMPv2-MIB::sysLocation.0 - The physical location of this node (e.g., `telephone closet, 3rd floor''). If the location is unknown, the value is the zero-length string.'
          inventory_link: LOCATION
          tags:
            - tag: component
              value: inventory
        - uuid: 5876a0ef02364baebbd49001bba69fef
          name: 'Device name'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.5.0
          key: sysName
          delay: 5m
          history: 7d
          value_type: CHAR
          description: 'SNMPv2-MIB::sysName.0 - An administratively-assigned name for this managed node. By convention, this is the node''s fully-qualified domain name. If the name is unknown, the value is the zero-length string.'
          inventory_link: NAME
          tags:
            - tag: component
              value: inventory
        - uuid: d1a5bcef49ed484e932e59804c8721a9
          name: SysUptime
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.3.0
          key: SysUptime
          history: 7d
          value_type: FLOAT
          trends: 60d
          units: uptime
          description: 'DISMAN-EVENT-MIB::sysUpTimeInstance - Uptime of the system in TimeTicks (100 timeticks == 1 second)'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 3c2fba0e100941679f1dc2872dc86c38
              expression: 'last(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/SysUptime)<10m'
              name: '{HOST.NAME} has been restarted'
              event_name: 'Alcatel AOS: {HOST.NAME} has been restarted (uptime < 10m)'
              priority: INFO
              dependencies:
                - name: '{HOST.NAME}: No SNMP data collection'
                  expression: 'max(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
        - uuid: f6b3cc1f7489497da1cb23667676c713
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          history: 7d
          valuemap:
            name: zabbix.host.available
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: component
              value: system
            - tag: scope
              value: availability
          triggers:
            - uuid: 211da149146342dd881f460db5329cba
              expression: 'max(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: '{HOST.NAME}: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: |
                SNMP is not available for polling.
                Please check device connectivity and SNMP settings.
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: cd737d8c410c4ab79858ed6eb15c450a
          name: '[AOS 6] Discover ALE OmniSwitch stack/performance'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},.1.3.6.1.4.1.6486.800.1.2.1.5.1.1.2.12.1.1]'
          key: aos6.esmSlotNumber
          delay: 1h
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: |
            ALCATEL-IND1-PORT-MIB::esmSlotNumber.X
            X is the slot number (element of the stack)
          item_prototypes:
            - uuid: 73cd264dfc9f4abea054556c5b2e9e64
              name: '[AOS 6] CPU usage 1 hr max chassis {#SNMPVALUE}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6486.800.1.2.1.16.1.1.2.1.1.17.{#SNMPVALUE}'
              key: 'aos6.cpu1hrmax.slot.[{#SNMPVALUE}]'
              delay: 60s
              history: 7d
              units: '%'
              tags:
                - tag: component
                  value: cpu
                - tag: scope
                  value: performance
            - uuid: 6056768eee9d4902a3f4efe5a2d53fba
              name: '[AOS 6] CPU usage 1 min avg chassis {#SNMPVALUE}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6486.800.1.2.1.16.1.1.2.1.1.15.{#SNMPVALUE}'
              key: 'aos6.cpu1minavg.slot.[{#SNMPVALUE}]'
              delay: 60s
              history: 7d
              units: '%'
              tags:
                - tag: component
                  value: cpu
                - tag: scope
                  value: performance
              trigger_prototypes:
                - uuid: abc58747cec342fdb9f8bee3cd4c929d
                  expression: 'min(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/aos6.cpu1minavg.slot.[{#SNMPVALUE}],5m)>{$ALE.CPU.UTIL.MAX}'
                  name: '[AOS 6] CPU usage on chassis {#SNMPVALUE} > {$ALE.CPU.UTIL.MAX}%'
                  priority: WARNING
                  description: 'CPU remains above the threshold for 5 minutes.'
                  dependencies:
                    - name: '{HOST.NAME}: No SNMP data collection'
                      expression: 'max(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: component
                      value: cpu
                    - tag: scope
                      value: performance
            - uuid: 912feccbd6264ee0a8e1caa1506bd130
              name: '[AOS 6] Freespace /flash chassis {#SNMPVALUE}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6486.800.1.1.1.3.1.1.9.1.3.{#SNMPVALUE}'
              key: 'aos6.flashfreespace.slot.[{#SNMPVALUE}]'
              delay: 60s
              history: 7d
              units: Byte
              tags:
                - tag: component
                  value: storage
                - tag: scope
                  value: capacity
            - uuid: 25c94e2c6d074f68aa632725ed7b93f6
              name: '[AOS 6] Memory usage 1 hr max chassis {#SNMPVALUE}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6486.800.1.2.1.16.1.1.2.1.1.13.{#SNMPVALUE}'
              key: 'aos6.memory1hrmax.slot.[{#SNMPVALUE}]'
              delay: 60s
              history: 7d
              units: '%'
              tags:
                - tag: component
                  value: memory
                - tag: scope
                  value: performance
            - uuid: a78c37e8eb8041c69cee97d04aa05a49
              name: '[AOS 6] Memory usage 1 min avg chassis {#SNMPVALUE}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6486.800.1.2.1.16.1.1.2.1.1.11.{#SNMPVALUE}'
              key: 'aos6.memory1minavg.slot.[{#SNMPVALUE}]'
              delay: 60s
              history: 7d
              units: '%'
              tags:
                - tag: component
                  value: memory
                - tag: scope
                  value: performance
              trigger_prototypes:
                - uuid: 423f79eac91e4689bb74c4804f5adb3c
                  expression: 'min(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/aos6.memory1minavg.slot.[{#SNMPVALUE}],5m)>{$ALE.MEMORY.UTIL.MAX}'
                  name: '[AOS 6] Memory usage on chassis {#SNMPVALUE} > {$ALE.MEMORY.UTIL.MAX}%'
                  priority: WARNING
                  description: 'Memory remains above the threshold for 5 minutes.'
                  dependencies:
                    - name: '{HOST.NAME}: No SNMP data collection'
                      expression: 'max(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: component
                      value: memory
                    - tag: scope
                      value: performance
            - uuid: c1355d1e40f64f4c8e183ca0de38158a
              name: '[AOS 6] RXTX usage 1 hr max chassis {#SNMPVALUE}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6486.800.1.2.1.16.1.1.2.1.1.9.{#SNMPVALUE}'
              key: 'aos6.rxtx1hrmax.slot.[{#SNMPVALUE}]'
              delay: 60s
              history: 7d
              units: '%'
              tags:
                - tag: component
                  value: system
                - tag: scope
                  value: performance
            - uuid: 6ac4c6e8b9b843548fcac365a666632e
              name: '[AOS 6] RXTX usage 1 min avg chassis {#SNMPVALUE}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6486.800.1.2.1.16.1.1.2.1.1.7.{#SNMPVALUE}'
              key: 'aos6.rxtx1minavg.slot.[{#SNMPVALUE}]'
              delay: 60s
              history: 7d
              units: '%'
              tags:
                - tag: component
                  value: system
                - tag: scope
                  value: performance
              trigger_prototypes:
                - uuid: 0267ba14b6d640e69335d72f397d5c65
                  expression: 'min(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/aos6.rxtx1minavg.slot.[{#SNMPVALUE}],5m)>{$ALE.RXTX.UTIL.MAX}'
                  name: '[AOS 6] RXTX load on chassis {#SNMPVALUE} > {$ALE.RXTX.UTIL.MAX}%'
                  priority: WARNING
                  description: 'Internal RX/TX load remains above the threshold for 5 minutes.'
                  dependencies:
                    - name: '{HOST.NAME}: No SNMP data collection'
                      expression: 'max(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
                  tags:
                    - tag: component
                      value: system
                    - tag: scope
                      value: performance
          graph_prototypes:
            - uuid: 896328890c03423c932275c3e194c0de
              name: '[AOS 6] CPU usage slot {#SNMPVALUE}'
              ymin_type_1: FIXED
              ymax_type_1: FIXED
              graph_items:
                - color: 1A7C11
                  calc_fnc: ALL
                  item:
                    host: 'Alcatel-Lucent Enterprise OmniSwitch by SNMP'
                    key: 'aos6.cpu1minavg.slot.[{#SNMPVALUE}]'
                - sortorder: '1'
                  color: 00CCCC
                  calc_fnc: ALL
                  item:
                    host: 'Alcatel-Lucent Enterprise OmniSwitch by SNMP'
                    key: 'aos6.cpu1hrmax.slot.[{#SNMPVALUE}]'
            - uuid: 31d7211501ce4b7fbac413cdb5e287a4
              name: '[AOS 6] Freespace /flash slot {#SNMPVALUE}'
              ymin_type_1: FIXED
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 00AA00
                  calc_fnc: ALL
                  item:
                    host: 'Alcatel-Lucent Enterprise OmniSwitch by SNMP'
                    key: 'aos6.flashfreespace.slot.[{#SNMPVALUE}]'
            - uuid: 5f6cde6caeb74f1288180d6dd1350bcb
              name: '[AOS 6] Memory usage slot {#SNMPVALUE}'
              ymin_type_1: FIXED
              ymax_type_1: FIXED
              graph_items:
                - color: 1A7C11
                  calc_fnc: ALL
                  item:
                    host: 'Alcatel-Lucent Enterprise OmniSwitch by SNMP'
                    key: 'aos6.memory1minavg.slot.[{#SNMPVALUE}]'
                - sortorder: '1'
                  color: 00CCCC
                  calc_fnc: ALL
                  item:
                    host: 'Alcatel-Lucent Enterprise OmniSwitch by SNMP'
                    key: 'aos6.memory1hrmax.slot.[{#SNMPVALUE}]'
            - uuid: 1912b7177e53401aa848e87821aeb244
              name: '[AOS 6] RXTX usage slot {#SNMPVALUE}'
              ymin_type_1: FIXED
              ymax_type_1: FIXED
              graph_items:
                - color: 1A7C11
                  calc_fnc: ALL
                  item:
                    host: 'Alcatel-Lucent Enterprise OmniSwitch by SNMP'
                    key: 'aos6.rxtx1minavg.slot.[{#SNMPVALUE}]'
                - sortorder: '1'
                  color: 00CCCC
                  calc_fnc: ALL
                  item:
                    host: 'Alcatel-Lucent Enterprise OmniSwitch by SNMP'
                    key: 'aos6.rxtx1hrmax.slot.[{#SNMPVALUE}]'
        - uuid: cae842c6e14747ce84c7b2d3098e4fa9
          name: '[AOS 6] Discover ALE OmniSwitch PoE Slot/Port'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},.1.3.6.1.4.1.6486.800.1.2.1.27.1.1.1.1.1]'
          key: aos6.poeSlotPortNumber
          delay: 1h
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: |
            AlcatelIND1InLinePowerEthernet::alaPethPsePortPowerMaximum.X.Y
            X is the slot number (element of the stack) and Y is the port number.
          item_prototypes:
            - uuid: b46b2932b5ba4bbfa0f578e60ec75c3a
              name: '[AOS 6] PoE Power Actual {{#SNMPINDEX}.regsub("([0-9]+)\.([0-9]+)", \1/\2)}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6486.800.1.2.1.27.1.1.1.1.2.{#SNMPINDEX}'
              key: 'aos6.poepoweractual.[{#SNMPINDEX}]'
              delay: 30s
              value_type: FLOAT
              units: W
              description: |
                AlcatelIND1InLinePowerEthernet::alaPethPsePortPowerActual
                This object contains the actual amount of power used by a port
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              tags:
                - tag: component
                  value: poe
                - tag: scope
                  value: capacity
            - uuid: 3989b14655054024b0c6e6c5705e9575
              name: '[AOS 6] PoE Power Maximum {{#SNMPINDEX}.regsub("([0-9]+)\.([0-9]+)", \1/\2)}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6486.800.1.2.1.27.1.1.1.1.1.{#SNMPINDEX}'
              key: 'aos6.poepowermax.[{#SNMPINDEX}]'
              delay: 30s
              value_type: FLOAT
              units: W
              description: |
                AlcatelIND1InLinePowerEthernet::alaPethPsePortPowerMaximum
                This object controls maximum amount of power per port
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              tags:
                - tag: component
                  value: poe
                - tag: scope
                  value: capacity
          trigger_prototypes:
            - uuid: 538a08deae0d41e9b5ee5a3ca7e75d2a
              expression: 'last(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/aos6.poepoweractual.[{#SNMPINDEX}])>=last(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/aos6.poepowermax.[{#SNMPINDEX}]) and last(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/aos6.poepowermax.[{#SNMPINDEX}])>0'
              name: '[AOS 6] PoE maximum reached {{#SNMPINDEX}.regsub("([0-9]+)\.([0-9]+)", \1/\2)}'
              priority: AVERAGE
              description: 'PoE port consumption is equal to or greater than the declared maximum power for the port.'
              dependencies:
                - name: '{HOST.NAME}: No SNMP data collection'
                  expression: 'max(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: component
                  value: poe
                - tag: scope
                  value: capacity
            - uuid: d38858539deb4783bab7712e12d26b95
              expression: 'last(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/aos6.poepoweractual.[{#SNMPINDEX}])>({$ALE.POE.PORT.UTIL.MAX}/100)*last(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/aos6.poepowermax.[{#SNMPINDEX}]) and last(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/aos6.poepowermax.[{#SNMPINDEX}])>0'
              name: '[AOS 6] PoE usage {{#SNMPINDEX}.regsub("([0-9]+)\.([0-9]+)", \1/\2)} > {$ALE.POE.PORT.UTIL.MAX}%'
              priority: WARNING
              description: 'PoE port consumption is close to the maximum allowed power.'
              dependencies:
                - name: '{HOST.NAME}: No SNMP data collection'
                  expression: 'max(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: component
                  value: poe
                - tag: scope
                  value: capacity
          graph_prototypes:
            - uuid: 7ae145c3a83045c9bbaeb758f2d737ec
              name: '[AOS 6] PoE Power {{#SNMPINDEX}.regsub("([0-9]+)\.([0-9]+)", \1/\2)}'
              graph_items:
                - color: 1A7C11
                  calc_fnc: ALL
                  item:
                    host: 'Alcatel-Lucent Enterprise OmniSwitch by SNMP'
                    key: 'aos6.poepoweractual.[{#SNMPINDEX}]'
                - sortorder: '1'
                  color: F63100
                  calc_fnc: ALL
                  item:
                    host: 'Alcatel-Lucent Enterprise OmniSwitch by SNMP'
                    key: 'aos6.poepowermax.[{#SNMPINDEX}]'
        - uuid: eaad3c8873fd4a4395538773e43bbfa0
          name: '[AOS 6] Discover ALE OmniSwitch power supplies'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#ENTDESCR},.1.3.6.1.2.1.47.1.1.1.1.2,{#ENTCLASS},.1.3.6.1.2.1.47.1.1.1.1.5,{#ENTNAME},.1.3.6.1.2.1.47.1.1.1.1.7,{#AOS6PSUOPER},.1.3.6.1.4.1.6486.800.1.1.1.1.1.1.1.2]'
          key: aos6.psu.discovery
          delay: 1h
          filter:
            conditions:
              - macro: '{#AOS6PSUOPER}'
                value: '^[1-8]$'
              - macro: '{#ENTCLASS}'
                value: ^6$
          item_prototypes:
            - uuid: 2286a51f00534ada94110f264d7645c8
              name: '[AOS 6] Power supply {#ENTNAME} description'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.2.1.47.1.1.1.1.2.{#SNMPINDEX}'
              key: 'aos6.psu.description[{#SNMPINDEX}]'
              value_type: TEXT
              tags:
                - tag: component
                  value: power
            - uuid: 60412f4249ac4a24aaf706311367a121
              name: '[AOS 6] Power supply {#ENTNAME} operational status'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.6486.800.1.1.1.1.1.1.1.2.{#SNMPINDEX}'
              key: 'aos6.psu.operstatus[{#SNMPINDEX}]'
              valuemap:
                name: 'ALE entity operational status'
              tags:
                - tag: component
