                  value: interface
                - tag: scope
                  value: performance
            - uuid: 8e2c74008ce1412aaa1439bda365eb32
              expression: '(avg(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],5m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) or avg(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],5m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])) and last(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0'
              name: 'Interface {#IFNAME}: high bandwidth usage > {$IF.UTIL.MAX}%'
              priority: WARNING
              description: '5min average utilization is above the configured threshold.'
              dependencies:
                - name: '{HOST.NAME}: No SNMP data collection'
                  expression: 'max(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: component
                  value: interface
                - tag: scope
                  value: performance
            - uuid: 57c100904191426aaa49d41b278a0d74
              expression: 'last(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and last(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/net.if.admin.status[ifAdminStatus.{#SNMPINDEX}])=1'
              name: 'Interface {#IFNAME} is down'
