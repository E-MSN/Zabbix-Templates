            - uuid: e38cb555a76b4b7daa43d7071798cfd5
              expression: 'avg(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"} or avg(/Alcatel-Lucent Enterprise OmniSwitch by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}'
              name: 'Interface {#IFNAME}: errors detected'
