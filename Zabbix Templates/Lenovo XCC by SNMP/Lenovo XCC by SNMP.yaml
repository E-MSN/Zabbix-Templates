zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: e960332b3f6c46a1956486d4f3f99fce
      name: 'Templates/Server hardware'
  templates:
    - uuid: f6b37fe301bd4652aaf432652a3d542e
      template: 'Lenovo XCC by SNMP'
      name: 'Lenovo XCC by SNMP'
      description: |
        SNMP template for monitoring Lenovo ThinkSystem servers through Lenovo XClarity Controller (XCC).
        
        Based on LENOVO-XCC-MIB
      vendor:
        name: E-MSN
        version: 7.4-10
      groups:
        - name: 'Templates/Server hardware'
      items:
        - uuid: b5fabf38926142d4a4b4aa8f1c4c3ace
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          delay: '60'
          history: 1w
          valuemap:
            name: 'Service state'
          tags:
            - tag: application
              value: status
          triggers:
            - uuid: 23f3437afe974b50ac28513ca29628e7
              expression: 'max(/Lenovo XCC by SNMP/icmpping,#3)=0'
              name: 'ICMP Ping: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 79ff1fbd38744200967ff965c4dd7f23
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: '%'
          tags:
            - tag: application
              value: status
          triggers:
            - uuid: 407097cd70cb422395ce40c3359c07f8
              expression: 'min(/Lenovo XCC by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Lenovo XCC by SNMP/icmppingloss,5m)<100'
              name: 'ICMP Ping: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Lenovo XCC by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 5e43a068595144368c542bdef706e3ae
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: s
          tags:
            - tag: application
              value: status
          triggers:
            - uuid: a39ba40a0e334ccd985a72ecb5889dd7
              expression: 'avg(/Lenovo XCC by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'ICMP Ping: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'ICMP Ping: High ICMP ping loss'
                  expression: 'min(/Lenovo XCC by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Lenovo XCC by SNMP/icmppingloss,5m)<100'
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Lenovo XCC by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: d3e45caaa57c4534901d8cbdfc5a49a5
          name: 'Power: total available'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.19046.11.1.1.10.1.9.0
          key: 'power.available[fuelGaugeTotalPowerAvailable.0]'
          delay: 5m
          history: 30d
          units: W
          tags:
            - tag: application
              value: power
        - uuid: 205d7995e300492aa8b38fbdbdacf789
          name: 'Power: CPU consumption'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.19046.11.1.1.10.1.11.0
          key: 'power.consumption.cpu[fuelGaugePowerConsumptionCpu.0]'
          delay: 5m
          history: 30d
          units: W
          tags:
            - tag: application
              value: power
        - uuid: 12f41b2230e645b2b8a03bd2b3b6be57
          name: 'Power: memory consumption'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.19046.11.1.1.10.1.12.0
          key: 'power.consumption.memory[fuelGaugePowerConsumptionMemory.0]'
          delay: 5m
          history: 30d
          units: W
          tags:
            - tag: application
              value: power
        - uuid: dba888d3b287453a83c65299f1371556
          name: 'Power: other consumption'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.19046.11.1.1.10.1.13.0
          key: 'power.consumption.other[fuelGaugePowerConsumptionOther.0]'
          delay: 5m
          history: 30d
          units: W
          tags:
            - tag: application
              value: power
        - uuid: e85f51120b4b41298cc48ef7aeab74d4
          name: 'Power: system maximum'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.19046.11.1.1.10.1.7.0
          key: 'power.maximum[fuelGaugeSystemMaxPower.0]'
          delay: 5m
          history: 30d
          units: W
          description: 'System maximum power reported by Lenovo XCC.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = Number(value);
                  if (isNaN(v)) {
                      throw 'Value is not numeric: ' + value;
                  }
                  
                  // 65535 W is used by some Lenovo XCC models as an invalid/sentinel value.
                  if (v == 65535 || v < 0) {
                      throw 'Invalid/sentinel system maximum power: ' + value;
                  }
                  
                  return v;
          tags:
            - tag: application
              value: power
        - uuid: 5bec6ee1d3f846d8b3e260b4a6047750
          name: 'Power: remaining'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.19046.11.1.1.10.1.8.0
          key: 'power.remaining[fuelGaugePowerRemaining.0]'
          delay: 5m
          history: 30d
          units: W
          description: 'Power remaining reported by Lenovo XCC.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = Number(value);
                  if (isNaN(v)) {
                      throw 'Value is not numeric: ' + value;
                  }
                  if (v < 0) {
                      throw 'Invalid negative power remaining: ' + value;
                  }
                  return v;
          tags:
            - tag: application
              value: power
        - uuid: b47901c8b3184d1ebce17f516ca3c377
          name: 'Power: current spare capacity'
          type: CALCULATED
          key: power.spare.current
          delay: 5m
          history: 30d
          value_type: FLOAT
          units: W
          params: 'last(//power.available[fuelGaugeTotalPowerAvailable.0])-last(//power.total.inuse[fuelGaugeTotalPowerInUse.0])'
          description: 'Calculated current spare power capacity: total available power minus current total power usage.'
          tags:
            - tag: application
              value: power
        - uuid: d9c601d362624b929c2b8d38206490cf
          name: 'Power: total in use'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.19046.11.1.1.10.1.10.0
          key: 'power.total.inuse[fuelGaugeTotalPowerInUse.0]'
          delay: 5m
          history: 30d
          units: W
          tags:
            - tag: application
              value: power
        - uuid: 5d57f1021f8348c8a77abec5074ee566
          name: 'Serial number'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.19046.11.1.1.5.2.1.3.0
          key: serialNumber
          delay: 1h
          history: 7d
          value_type: TEXT
          tags:
            - tag: application
              value: inventory
        - uuid: ffa474a0bbf14e1c81305c1e1bf4679f
          name: 'SNMP traps (fallback)'
          type: SNMP_TRAP
          key: snmptrap.fallback
          history: 2w
          value_type: LOG
          description: 'Item is used to collect all SNMP traps unmatched by other snmptrap items'
          logtimefmt: 'hh:mm:sszyyyy/MM/dd'
          tags:
            - tag: application
              value: general
        - uuid: da8b98114ffb4ec7b5655bd195576b5f
          name: 'System contact details'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.4.0
          key: 'system.contact[sysContact.0]'
          delay: 1h
          history: 2w
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            The textual identification of the contact person for this managed node, together with information on how to contact this person.  If no contact information is known, the value is the zero-length string.
          inventory_link: CONTACT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: application
              value: general
        - uuid: 44e4808ce52b450180f9f0c0f6cf0482
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: 'system.descr[sysDescr.0]'
          delay: 1h
          history: 2w
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            A textual description of the entity. This value should
            include the full name and version identification of the system's hardware type, software operating-system, and
            networking software.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: application
              value: general
        - uuid: be87a7bff97b40359558dcb482bbf237
          name: 'System location'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.6.0
          key: 'system.location[sysLocation.0]'
          delay: 1h
          history: 2w
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            The physical location of this node (e.g., `telephone closet, 3rd floor').  If the location is unknown, the value is the zero-length string.
          inventory_link: LOCATION
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: application
              value: general
        - uuid: f90e0d74af2a4cbfafcd6b06d627d36c
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: system.name
          delay: 1h
          history: 2w
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            An administratively-assigned name for this managed node.By convention, this is the node's fully-qualified domain name.  If the name is unknown, the value is the zero-length string.
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: application
              value: general
          triggers:
            - uuid: 6ddf8a92587640eda7ac1c09de1fe8ed
              expression: 'last(/Lenovo XCC by SNMP/system.name,#1)<>last(/Lenovo XCC by SNMP/system.name,#2) and length(last(/Lenovo XCC by SNMP/system.name))>0'
              name: 'Generic by SNMP: System name has changed'
              event_name: 'Generic by SNMP: System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              description: 'The name of the system has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
                - tag: scope
                  value: security
        - uuid: 8ae4b826b64740c38d0f68a8888a56f5
          name: 'System object ID'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.2.0
          key: 'system.objectid[sysObjectID.0]'
          delay: 15m
          history: 2w
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            The vendor's authoritative identification of the network management subsystem contained in the entity.  This value is allocated within the SMI enterprises subtree (1.3.6.1.4.1) and provides an easy and unambiguous means for determining`what kind of box' is being managed.  For example, if vendor`Flintstones, Inc.' was assigned the subtree1.3.6.1.4.1.4242, it could assign the identifier 1.3.6.1.4.1.4242.1.1 to its `Fred Router'.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          tags:
            - tag: application
              value: general
        - uuid: e955a2b32f1248cdb5af9d3398ed4498
          name: Uptime
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: 'system.uptime[sysUpTime.0]'
          delay: 30s
          history: 2w
          trends: 0d
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            The time (in hundredths of a second) since the network management portion of the system was last re-initialized.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: application
              value: status
          triggers:
            - uuid: 19aff0cc23b4452c9f99b3fb9aa55206
              expression: 'last(/Lenovo XCC by SNMP/system.uptime[sysUpTime.0])>0 and last(/Lenovo XCC by SNMP/system.uptime[sysUpTime.0])<10m'
              name: 'XCC has been restarted'
              opdata: 'Uptime: {ITEM.LASTVALUE1}'
              priority: INFO
              tags:
                - tag: scope
                  value: notice
        - uuid: 0aac92873e0a42a1b3f898bf7c113f83
          name: 'System type'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.19046.11.1.1.5.2.1.5.0
          key: systemType
          delay: 1h
          history: 7d
          value_type: TEXT
          tags:
            - tag: application
              value: inventory
        - uuid: 7c5539375df1484b920e3108f32894fb
          name: 'System power status'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.19046.11.1.5.1.1.0
          key: XCCcurrentSysPowerStatus
          delay: '300'
          history: 7d
          valuemap:
            name: 'LENOVO-XCC-MIB::currentSysPowerStatus'
          tags:
            - tag: application
              value: general
        - uuid: 6d0c2630c82f47e9b65a9bb96beb6cba
          name: 'Power-on hours'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.19046.11.1.5.1.2.0
          key: XCCpowerOnHours
          delay: 1h
          history: 7d
          units: h
          tags:
            - tag: application
              value: general
        - uuid: d2e835bedec4477e9e4b9d4ed7c631bd
          name: 'Restart count'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.19046.11.1.5.1.3.0
          key: XCCrestartCount
          delay: '3600'
          history: 7d
          tags:
            - tag: application
              value: general
        - uuid: 14e06e2ae1a84a1cb7667d508b83a3db
          name: 'System health status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.19046.11.1.1.4.1.0
          key: XCCsystemHealthStat
          history: 7d
          description: 'Overall server health status reported by Lenovo XCC.'
          valuemap:
            name: 'LENOVO-XCC-MIB::systemHealthStat'
          tags:
            - tag: application
              value: general
          triggers:
            - uuid: 9a810a608f3747dda9e1c578e3676e9c
              expression: 'last(/Lenovo XCC by SNMP/XCCsystemHealthStat)={$HEALTH_CRIT_STATUS}'
              name: 'System health is critical on {HOST.NAME}'
              priority: HIGH
              description: 'XCC reports a critical system health state. Last value: {ITEM.LASTVALUE1}.'
            - uuid: ed36323ef34243ddbf662aa179c79f57
              expression: 'last(/Lenovo XCC by SNMP/XCCsystemHealthStat)={$HEALTH_WARN_STATUS}'
              name: 'System health is non-critical on {HOST.NAME}'
              priority: WARNING
              description: 'XCC reports a non-critical system health state. Last value: {ITEM.LASTVALUE1}.'
            - uuid: 5601b9c3e2914ca0a313cb8dff775b80
              expression: 'last(/Lenovo XCC by SNMP/XCCsystemHealthStat)={$HEALTH_DISASTER_STATUS}'
              name: 'System health is non-recoverable on {HOST.NAME}'
              priority: DISASTER
              description: 'XCC reports a non-recoverable system health state. Last value: {ITEM.LASTVALUE1}.'
        - uuid: 6887c423b4034f82a9519d0bcbcd56a5
          name: 'System state'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.19046.11.1.5.1.4.0
          key: XCCsystemState
          delay: '300'
          history: 7d
          valuemap:
            name: 'LENOVO-XCC-MIB::systemState'
          tags:
            - tag: application
              value: general
        - uuid: 9651136e8c6f4502b60a05d5fb0c3c2a
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          history: 7d
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: application
              value: status
          triggers:
            - uuid: 984668b084c34da68a16136aec98c0ea
              expression: 'max(/Lenovo XCC by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'Generic by SNMP: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/Lenovo XCC by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: ae8573e8f40540daba48c7f5cedaa473
          name: 'CPU DTS Thermal Margin Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#TEMP_DESCR},.1.3.6.1.4.1.19046.11.1.1.1.2.1.2]'
          key: cpu.dts.discovery
          delay: 1h
          filter:
            conditions:
              - macro: '{#TEMP_DESCR}'
                value: '(?i)^CPU\s*[0-9]+\s*DTS$'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discover CPU DTS sensors and convert their raw offset to a positive thermal margin to TjMAX. These items are used for CPU thermal alerting.'
          item_prototypes:
            - uuid: dcaa0374a2e444bcb16dc67a664768f3
              name: '{#TEMP_DESCR}: Thermal margin to TjMAX'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.19046.11.1.1.1.2.1.3.{#SNMPINDEX}'
              key: 'sensor.cpu.dts.margin[tempReading.{#SNMPINDEX}]'
              history: 30d
              value_type: FLOAT
              units: °C
              description: 'Positive CPU thermal margin to TjMAX calculated from the raw DTS value.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var raw = String(value).trim();
                      var match = raw.match(/-?[0-9]+(?:\.[0-9]+)?/);
                      if (!match) {
                          throw 'DTS value is not numeric: ' + value;
                      }
                      var v = Number(match[0]);
                      if (!isFinite(v)) {
                          throw 'DTS value is not finite: ' + value;
                      }
                      return -v;
              tags:
                - tag: application
                  value: temperature
                - tag: component
                  value: 'cpu dts'
              trigger_prototypes:
                - uuid: 0d10913071b7409b9e9eb6741c95e958
                  expression: 'last(/Lenovo XCC by SNMP/sensor.cpu.dts.margin[tempReading.{#SNMPINDEX}])<={$CPU_DTS_MARGIN_DISASTER}'
                  name: '{#TEMP_DESCR}: CPU DTS thermal limit reached'
                  priority: DISASTER
                  description: 'CPU DTS thermal margin has reached 0 °C or below. The CPU is at or beyond its thermal limit. Last margin: {ITEM.LASTVALUE1}.'
                - uuid: 22ac05338e204af0b6f8c53e3d45be7d
                  expression: 'max(/Lenovo XCC by SNMP/sensor.cpu.dts.margin[tempReading.{#SNMPINDEX}],3m)<={$CPU_DTS_MARGIN_HIGH}'
                  name: '{#TEMP_DESCR}: CPU DTS thermal margin is critically low'
                  priority: HIGH
                  description: 'CPU DTS thermal margin has remained at or below {$CPU_DTS_MARGIN_HIGH} °C. Last margin: {ITEM.LASTVALUE1}.'
                  dependencies:
                    - name: '{#TEMP_DESCR}: CPU DTS thermal limit reached'
                      expression: 'last(/Lenovo XCC by SNMP/sensor.cpu.dts.margin[tempReading.{#SNMPINDEX}])<={$CPU_DTS_MARGIN_DISASTER}'
                - uuid: 4b1f48fe12fb420ca391a66eaf2878e3
                  expression: 'max(/Lenovo XCC by SNMP/sensor.cpu.dts.margin[tempReading.{#SNMPINDEX}],5m)<={$CPU_DTS_MARGIN_AVG}'
                  name: '{#TEMP_DESCR}: CPU DTS thermal margin is low'
                  priority: AVERAGE
                  description: 'CPU DTS thermal margin has remained at or below {$CPU_DTS_MARGIN_AVG} °C. Last margin: {ITEM.LASTVALUE1}.'
                  dependencies:
                    - name: '{#TEMP_DESCR}: CPU DTS thermal limit reached'
                      expression: 'last(/Lenovo XCC by SNMP/sensor.cpu.dts.margin[tempReading.{#SNMPINDEX}])<={$CPU_DTS_MARGIN_DISASTER}'
                    - name: '{#TEMP_DESCR}: CPU DTS thermal margin is critically low'
                      expression: 'max(/Lenovo XCC by SNMP/sensor.cpu.dts.margin[tempReading.{#SNMPINDEX}],3m)<={$CPU_DTS_MARGIN_HIGH}'
          graph_prototypes:
            - uuid: bd3bf688f6894305b4e6cdaa7e0e39a7
              name: '{#TEMP_DESCR}: Thermal margin to TjMAX'
              graph_items:
                - calc_fnc: ALL
                  item:
                    host: 'Lenovo XCC by SNMP'
                    key: 'sensor.cpu.dts.margin[tempReading.{#SNMPINDEX}]'
        - uuid: 599e1daa5a704e6c8a4effa3cb661ef2
          name: 'CPU Temperature Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#TEMP_DESCR},.1.3.6.1.4.1.19046.11.1.1.1.2.1.2]'
          key: cpu.temperature.discovery
          delay: 1h
          filter:
            conditions:
              - macro: '{#TEMP_DESCR}'
                value: '(?i)^CPU\s*[0-9]+\s*Temp$'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discover CPU absolute temperature sensors.'
          item_prototypes:
            - uuid: 4508fb7d2709451d99d7e5653dc6ad40
              name: '{#TEMP_DESCR}: Temperature'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.19046.11.1.1.1.2.1.3.{#SNMPINDEX}'
              key: 'sensor.cpu.temp.value[tempReading.{#SNMPINDEX}]'
              history: 30d
              value_type: FLOAT
              units: °C
              description: 'CPU absolute temperature reported by XCC.'
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(-?[0-9]+(?:\.[0-9]+)?)'
                    - \1
                  error_handler: DISCARD_VALUE
              tags:
                - tag: application
                  value: temperature
                - tag: component
                  value: cpu
          graph_prototypes:
            - uuid: 5262f9c428d14ee98bfa3b280e06c75c
              name: '{#TEMP_DESCR}: Temperature'
              graph_items:
                - calc_fnc: ALL
                  item:
                    host: 'Lenovo XCC by SNMP'
                    key: 'sensor.cpu.temp.value[tempReading.{#SNMPINDEX}]'
        - uuid: deb7be803558465d84d5db9740078720
          name: 'FAN Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#FANDESCR},.1.3.6.1.4.1.19046.11.1.1.3.2.1.2]'
