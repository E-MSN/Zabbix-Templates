        - uuid: 4f7f7e490edb49938cd7128231e369c2
          name: 'Network Port Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#NET_PORT_NAME},.1.3.6.1.4.1.19046.11.1.1.14.4.1.2,{#NET_PORT_NUMBER},.1.3.6.1.4.1.19046.11.1.1.14.4.1.3,{#NET_CONNECTOR},.1.3.6.1.4.1.19046.11.1.1.14.4.1.4,{#NET_MAC},.1.3.6.1.4.1.19046.11.1.1.14.4.1.5,{#NET_NOMINAL_SPEED},.1.3.6.1.4.1.19046.11.1.1.14.4.1.12]'
          key: network.ports.discovery
          delay: 1h
          item_prototypes:
            - uuid: 68132d913229423fbf305e26d8bdb8b9
              name: '{#NET_PORT_NAME}: Raw Link speed'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.19046.11.1.1.14.4.1.21.{#SNMPINDEX}'
              key: 'physical.net.speed.raw[portSpeed.{#SNMPINDEX}]'
              value_type: CHAR
              tags:
                - tag: component
                  value: network
            - uuid: c58a50fa47e5415ca440d752c0ae5564
              name: '{#NET_PORT_NAME}: Link speed'
              type: DEPENDENT
              key: 'physical.net.speed[portSpeed.{#SNMPINDEX}]'
              trends: '0'
              units: bps
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = String(value).trim();
                      if (v === '') {
                          throw 'Empty speed value';
                      }
                      if (/^(N\/A|NA|Unknown|Unsupported|NONSUPPORT)$/i.test(v)) {
                          throw 'Unsupported speed value: ' + value;
                      }
                      v = v.replace(',', '.');
                      v = v.replace(/\s+/g, '');
                      var m = v.match(/^([0-9]+(?:\.[0-9]+)?)([KMGT]?)(?:bps|bit\/s)?$/i);
                      if (!m) {
                          throw 'Unsupported speed format: ' + value;
                      }
                      var n = Number(m[1]);
                      var unit = String(m[2]).toUpperCase();
                      if (isNaN(n)) {
                          throw 'Speed is not numeric: ' + value;
                      }
                      var factor = 1;
                      if (unit === 'K') {
                          factor = 1000;
                      } else if (unit === 'M') {
                          factor = 1000000;
                      } else if (unit === 'G') {
                          factor = 1000000000;
                      } else if (unit === 'T') {
                          factor = 1000000000000;
                      }
                      return Math.round(n * factor);
              master_item:
                key: 'physical.net.speed.raw[portSpeed.{#SNMPINDEX}]'
              tags:
                - tag: component
                  value: network
            - uuid: c11f3b8e153a47abac6aeec8d4ac81c9
              name: '{#NET_PORT_NAME}: Link status'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.19046.11.1.1.14.4.1.20.{#SNMPINDEX}'
              key: 'physical.net.status[portStatus.{#SNMPINDEX}]'
              value_type: CHAR
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = String(value).trim().toUpperCase();
                      if (v === 'UP') {
                          return 'Up';
                      }
                      return 'Down';
              tags:
                - tag: component
                  value: network
