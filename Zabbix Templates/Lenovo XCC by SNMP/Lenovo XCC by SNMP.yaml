          name: 'Temperature Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#TEMP_DESCR},.1.3.6.1.4.1.19046.11.1.1.1.2.1.2]'
          key: temperature.discovery
          delay: 1h
          filter:
            conditions:
              - macro: '{#TEMP_DESCR}'
                value: '(?i)^(?!.*DTS)(?!CPU\s*[0-9]+\s*Temp$).*$'
          lifetime_type: DELETE_IMMEDIATELY
          description: 'Discover non-CPU, non-DTS temperature sensors from LENOVO-XCC-MIB::tempDescr.'
          item_prototypes:
            - uuid: 0e5fe80103d04fd189451aa4eef7f0a2
              name: '{#TEMP_DESCR}: Effective critical high limit'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.19046.11.1.1.1.2.1.6.{#SNMPINDEX}'
              key: 'sensor.temp.limit[tempCritLimitHigh.{#SNMPINDEX}]'
              delay: 10m
              history: 30d
              value_type: FLOAT
              units: °C
              description: 'Effective critical high temperature limit stored as data. The XCC-reported limit is kept only when it is plausible. N/A, missing, zero, 255 and out-of-range values are replaced directly by fallback macros based on the sensor name. CPU sensors are excluded from this item and monitored through DTS margin instead.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      function macroNumber(value, def) {
                          var n = Number(value);
                          if (!isFinite(n) || n <= 0) {
                              return def;
                          }
                          return n;
                      }
                      var descr = String('{#TEMP_DESCR}').trim();
                      var fallback = macroNumber('{$TEMP_CRIT}', 90);
                      if (/^Ambient Temp$/i.test(descr)) {
                          fallback = macroNumber('{$TEMP_CRIT_AMBIENT}', 47);
                      }
                      else if (/^Exhaust Temp$/i.test(descr)) {
                          fallback = macroNumber('{$TEMP_CRIT_EXHAUST}', 70);
                      }
                      else if (/^PCH Temp$/i.test(descr)) {
                          fallback = macroNumber('{$TEMP_CRIT_PCH}', 100);
                      }
                      else if (/^OCP Temp$/i.test(descr)) {
                          fallback = macroNumber('{$TEMP_CRIT_OCP}', 90);
                      }
                      else if (/^DIMM\s*\d+\s+Temp$/i.test(descr)) {
                          fallback = macroNumber('{$TEMP_CRIT_DIMM}', 87);
                      }
                      var minValid = macroNumber('{$TEMP_CRIT_VALID_MIN}', 30);
                      var maxValid = macroNumber('{$TEMP_CRIT_VALID_MAX}', 150);
                      if (maxValid <= minValid)  {
                          maxValid = 150;
                      }
                      var raw = String(value).trim();
                      var match = raw.match(/-?[0-9]+(?:\ .[0-9]+)?/);
                       if (!match) {
                          return fallback;
                      }
                      var v = Number(match[0]);
                      if (!isFinite(v) || v < minValid || v > maxValid) {
                          return fallback;
                      }
                      return v;
              tags:
                - tag: application
                  value: temperature
            - uuid: 67044436462347f1964f76a479d2b50f
              name: '{#TEMP_DESCR}: Temperature'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.19046.11.1.1.1.2.1.3.{#SNMPINDEX}'
              key: 'sensor.temp.value[tempReading.{#SNMPINDEX}]'
              history: 30d
              value_type: FLOAT
              units: °C
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(-?[0-9]+(?:\.[0-9]+)?)'
                    - \1
                  error_handler: DISCARD_VALUE
              tags:
                - tag: application
                  value: temperature
          trigger_prototypes:
            - uuid: 73d378857456428487ed54fce88cbfb2
              expression: 'last(/Lenovo XCC by SNMP/sensor.temp.limit[tempCritLimitHigh.{#SNMPINDEX}])>0 and last(/Lenovo XCC by SNMP/sensor.temp.value[tempReading.{#SNMPINDEX}])>last(/Lenovo XCC by SNMP/sensor.temp.limit[tempCritLimitHigh.{#SNMPINDEX}])'
              name: '{#TEMP_DESCR}: Temperature is above effective critical high limit'
              priority: HIGH
        - uuid: 78bdcf38345a4de78577e1073c9cfa7b
          name: 'Voltage Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#VOLTDESCR},.1.3.6.1.4.1.19046.11.1.1.2.2.1.2]'
          key: voltage.discovery
          delay: 1h
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovering voltage sensors from LENOVO-XCC-MIB::voltDescr.'
          item_prototypes:
            - uuid: 4c25bbb64b964e93a94a09f20f84e95b
              name: '{#VOLTDESCR}: Status'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.19046.11.1.1.2.2.1.11.{#SNMPINDEX}'
              key: 'voltage.status[{#SNMPINDEX}]'
              delay: 3m
              history: 2w
              value_type: CHAR
              tags:
                - tag: application
                  value: voltage
              trigger_prototypes:
                - uuid: 26a3c418931242b988887b6299918147
                  expression: 'find(/Lenovo XCC by SNMP/voltage.status[{#SNMPINDEX}],#2,"regexp","^({$VOLTAGE_OK_STATUS})$")=0'
                  name: '{#VOLTDESCR}: Voltage is not in normal state'
                  priority: WARNING
                  description: 'Last value: {ITEM.LASTVALUE1}.'
            - uuid: af9d9c7739354db4acf9202e28cfaad6
              name: '{#VOLTDESCR}: Voltage'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.19046.11.1.1.2.2.1.3.{#SNMPINDEX}'
              key: 'voltage[{#SNMPINDEX}]'
              delay: 3m
              history: 2w
              value_type: FLOAT
              units: V
              description: 'Voltage reading from Lenovo XCC. Values are kept in volts when already decimal volts; clearly millivolt-like values (absolute value >= 100) are divided by 1000.'
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(-?[0-9]+(?:\.[0-9]+)?)'
                    - \1
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = Number(value);
                      if (isNaN(v)) {
                          throw 'Value is not numeric: ' + value;
                      }
                      if (Math.abs(v) >= 100) {
                          return v / 1000;
                      }
                      return v;
              tags:
                - tag: application
                  value: voltage
          graph_prototypes:
            - uuid: 51e393928b414eca8b095d29c7f2f829
              name: '{#VOLTDESCR}: Voltage'
              graph_items:
                - calc_fnc: ALL
                  item:
                    host: 'Lenovo XCC by SNMP'
                    key: 'voltage[{#SNMPINDEX}]'
