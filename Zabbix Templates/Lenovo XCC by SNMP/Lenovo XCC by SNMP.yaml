          description: 'Fallback critical high temperature limit for PCH Temp when XCC reports N/A, 0, 255 or another invalid value.'
        - macro: '{$TEMP_CRIT_VALID_MAX}'
          value: '150'
          description: 'Maximum plausible critical high temperature limit. XCC values above this threshold, including 255, are treated as invalid and replaced by fallback macros.'
        - macro: '{$TEMP_CRIT_VALID_MIN}'
