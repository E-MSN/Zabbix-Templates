              key: 'raid.drive.temperature[{#SNMPINDEX}]'
              delay: 5m
              history: 30d
              value_type: FLOAT
              units: °C
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = String(value).trim();
                      if (v === '') {
                          return null;
                      }
                      v = v.replace(',', '.');
                      var m = v.match(/-?[0-9]+(?:\.[0-9]+)?/);
                      if (!m) {
                          return null;
                      }
                      var n = Number(m[0]);
                      if (isNaN(n)) {
                          return null;
                      }
                      if (n === 255 || n < 1 || n > 150) {
                          return null;
                      }
                      return n;
