zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: f71faac2ecaf43e4b251b991cc1bf1af
      name: 'Templates/Network devices'
  templates:
    - uuid: 7c95d1ac65dc47c188a923ef15c9ab7f
      template: 'Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP'
      name: 'Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP'
      description: |
        Template Alcatel OAW by SNMP
        
        MIBs used:
        EtherLike-MIB
        HOST-RESOURCES-MIB
        SNMPv2-MIB
        IF-MIB
        ALCATEL-NGOAW-DEVICES-MIB
      vendor:
        name: E-MSN
        version: 7.4-10
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 30d68f65fc3f4e7698a473d4b74cbffd
          name: 'Cluster group'
          type: CALCULATED
          key: ap.group.name
          delay: 30m
          value_type: TEXT
          params: 'last(//ap.cluster.group[0])'
          tags:
            - tag: component
              value: application
        - uuid: eda6c250146e4ebd9e13d746e72b425b
          name: 'Hardware model'
          type: CALCULATED
          key: hw.model
          delay: 30m
          value_type: TEXT
          params: 'last(//ap.hw.model[0])'
          inventory_link: MODEL
          tags:
            - tag: component
              value: system
        - uuid: c7299b175bd74cce9a977f7978d46dc8
          name: 'Serial number'
          type: CALCULATED
          key: hw.serial.number
          delay: 30m
          value_type: TEXT
          params: 'last(//ap.serial.number[0])'
          tags:
            - tag: component
              value: system
        - uuid: ca31f3c94fa54813a35072535d028877
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          description: |
            The host accessibility by ICMP ping.
            
            0 - ICMP ping fails;
            1 - ICMP ping successful.
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 97d38c879f3e4ccc9669d52b8da327c3
              expression: 'max(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/icmpping,#3)=0'
              name: 'Alcatel OAW: Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout. Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: c82706f2e1ce47589d6b69fcbbb268ab
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          description: 'The percentage of lost packets.'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: d870a539c97f48bdb798ebbde4f454dd
              expression: 'min(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/icmppingloss,5m)<100'
              name: 'Alcatel OAW: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'ICMP packets loss detected.'
              dependencies:
                - name: 'Alcatel OAW: Unavailable by ICMP ping'
                  expression: 'max(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: ecdb7dd7d7d4489286fe35c15fabf25d
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          description: 'The ICMP ping response time (in seconds).'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: f354c1b32907472597f9fe42297cfe71
              expression: 'avg(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'Alcatel OAW: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Average ICMP response time is too high.'
              dependencies:
                - name: 'Alcatel OAW: High ICMP ping loss'
                  expression: 'min(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/icmppingloss,5m)<100'
                - name: 'Alcatel OAW: Unavailable by ICMP ping'
                  expression: 'max(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 89ae847a4af34ccebb6da4f165e30958
          name: 'SNMP traps (fallback)'
          type: SNMP_TRAP
          key: snmptrap.fallback
          value_type: LOG
          description: 'The item is used to collect all SNMP traps unmatched by other snmptrap items'
          logtimefmt: 'hh:mm:sszyyyy/MM/dd'
          tags:
            - tag: component
              value: network
        - uuid: 012821ca1afc478fa9722b0aa8958bc2
          name: 'System contact details'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.4.0]'
          key: 'system.contact[sysContact.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            The textual identification of the contact person for this managed node, together with information on how to contact this person. If no contact information is known, the value is the zero-length string.
          inventory_link: CONTACT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: f6442e45453849dca8f6f16ae388fe58
          name: 'CPU avg Load 1min'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.10.1.3.1
          key: system.cpu.load.1m
          value_type: FLOAT
          tags:
            - tag: component
              value: cpu
        - uuid: 27fd00e9a4dc4c08b9568b36ec41f4d1
          name: 'CPU avg Load 5min'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.10.1.3.2
          key: system.cpu.load.5m
          value_type: FLOAT
          tags:
            - tag: component
              value: cpu
        - uuid: 8a999b9374c1445cbe78bef36954ec47
          name: 'CPU avg Load 15min'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.10.1.3.3
          key: system.cpu.load.15m
          value_type: FLOAT
          tags:
            - tag: component
              value: cpu
        - uuid: 35000da5aef243ca936957641543ca44
          name: 'CPU utilization'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.25.3.3.1.2.196608
          key: 'system.cpu.util[sgiCpuUsage.0]'
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: e71d070266064dee87c066cd8a0f3de8
              expression: 'min(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/system.cpu.util[sgiCpuUsage.0],5m)>{$CPU.UTIL.CRIT}'
              name: 'Alcatel OAW: High CPU utilization'
              event_name: 'Alcatel OAW: High CPU utilization (over {$CPU.UTIL.CRIT}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The CPU utilization is too high. The system might be slow to respond.'
              tags:
                - tag: scope
                  value: performance
        - uuid: c0d1d5176d2a4cecaa2c1b77bc5fc1e0
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.1.0]'
          key: 'system.descr[sysDescr.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            A textual description of the entity. This value should
            include the full name and version identification of the system's hardware type, software operating-system, and
            networking software.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 5a9cc0b4df124e178ab4c6b74ebd4b12
          name: 'Uptime (hardware)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.25.1.1.0]'
          key: 'system.hw.uptime[hrSystemUptime.0]'
          delay: 30s
          trends: '0'
          units: uptime
          description: |
            MIB: HOST-RESOURCES-MIB
            The amount of time since this host was last initialized. Note that this is different from sysUpTime in the SNMPv2-MIB [RFC1907] because sysUpTime is the uptime of the network management portion of the system.
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 78fa0435c126456cba8e39844feb9421
          name: 'System location'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.6.0]'
          key: 'system.location[sysLocation.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            Physical location of the node (e.g., `equipment room`, `3rd floor`). If not provided, the value is a zero-length string.
          inventory_link: LOCATION
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 24f52e3e66d84b398d678b0b8a7ea8f9
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.5.0]'
          key: system.name
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            An administratively-assigned name for this managed node.By convention, this is the node's fully-qualified domain name. If the name is unknown, the value is the zero-length string.
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: f63d8ed0c62044e4a4ae25192aeb8447
              expression: 'last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/system.name,#1)<>last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/system.name,#2) and length(last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/system.name))>0'
              name: 'Alcatel OAW: System name has changed'
              event_name: 'Alcatel TiMOS: System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              description: 'The name of the system has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
                - tag: scope
                  value: security
        - uuid: 4236eed331e241f49d02db6dafb02d3a
          name: 'Uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: 'system.net.uptime[sysUpTime.0]'
          delay: 30s
          trends: '0'
          units: uptime
          description: |
            MIB: SNMPv2-MIB
            Time (in hundredths of a second) since the network management portion of the system was last re-initialized.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 90fcf5fd41eb403c8c9718dc473d6931
          name: 'System object ID'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.2.0]'
          key: 'system.objectid[sysObjectID.0]'
          delay: 15m
          value_type: CHAR
          description: |
            MIB: SNMPv2-MIB
            The vendor's authoritative identification of the network management subsystem contained in the entity. This value is allocated within the SMI enterprises subtree (1.3.6.1.4.1) and provides an easy and unambiguous means for determining`what kind of box' is being managed.  For example, if vendor`Flintstones, Inc.' was assigned the subtree1.3.6.1.4.1.4242, it could assign the identifier 1.3.6.1.4.1.4242.1.1 to its `Fred Router'.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: component
              value: system
        - uuid: 5c83a59b9d404e22835419aee190a681
          name: 'OS version'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.1.0]'
          key: system.sw.os
          delay: 30m
          value_type: CHAR
          inventory_link: OS
          preprocessing:
            - type: REGEX
              parameters:
                - '.* ([0-9]+\.[0-9]+\.[0-9]+)'
                - \1
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: os
          triggers:
            - uuid: ebae2affacae4acfa7794a64ad085a57
              expression: 'last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/system.sw.os,#1)<>last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/system.sw.os,#2) and length(last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/system.sw.os))>0'
              name: 'Alcatel OAW: OS version has changed'
              priority: INFO
              description: 'The description of the operating system has changed. Possible reasons are that the system has been updated or replaced. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              dependencies:
                - name: 'Alcatel OAW: System name has changed'
                  expression: 'last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/system.name,#1)<>last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/system.name,#2) and length(last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/system.name))>0'
              tags:
                - tag: scope
                  value: notice
        - uuid: b6fc81efaf754c32a0fb80605def5a32
          name: 'Memory available'
          type: CALCULATED
          key: vm.memory.available
          value_type: FLOAT
          units: B
          params: last(//vm.memory.total)-last(//vm.memory.util)
          tags:
            - tag: component
              value: memory
        - uuid: f7914ca779fc47928ed224a4090a0ac6
          name: 'Memory total'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.25.2.3.1.5.1
          key: vm.memory.total
          value_type: FLOAT
          units: B
          description: 'The total memory expressed in bytes.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: 066e54813d42441e8662246d810381cc
          name: 'Memory used'
          type: CALCULATED
          key: vm.memory.used
          value_type: FLOAT
          units: '%'
          params: '100*last(//vm.memory.util)/last(//vm.memory.total)'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 85aa22a626d1421ca8e0c0e79011d34b
              expression: 'min(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/vm.memory.used,5m)>{$MEMORY.UTIL.MAX}'
              name: 'Alcatel OAW: High memory utilization'
              event_name: 'Alcatel TiMOS: High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
              priority: AVERAGE
              description: 'The system is running out of free memory.'
              tags:
                - tag: scope
                  value: capacity
                - tag: scope
                  value: performance
        - uuid: 48541bb984c4418db4c2ab3d127631a9
          name: 'Memory utilization'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.25.2.3.1.6.1
          key: vm.memory.util
          value_type: FLOAT
          units: B
          description: 'Memory utilization in bytes'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: 7e3c8b2d48da40889adea70aa5933bd8
          name: 'SNMP agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          description: |
            Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the host list.
            Possible values:
            0 - not available
            1 - available
            2 - unknown
          valuemap:
            name: zabbix.host.available
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 8e932c20c3194279b7e72528e9bf50c4
              expression: 'max(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'Alcatel OAW: No SNMP data collection'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'SNMP is not available for polling. Please check device connectivity and SNMP settings.'
              dependencies:
                - name: 'Alcatel OAW: Unavailable by ICMP ping'
                  expression: 'max(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 69cb98f91f354f4bbcbd83ca8bafd4bb
          name: 'Model discovery'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.2.0]'
          key: model.discovery
          delay: 1h
          item_prototypes:
            - uuid: 647a3ac161d64ab6b153b421493242b4
              name: 'AP Cluster group'
              type: SNMP_AGENT
              snmp_oid: '{#SYSOBJECTID}.1.1.4.0'
              key: 'ap.cluster.group[{#NUM}]'
              delay: 30m
              value_type: CHAR
              tags:
                - tag: component
                  value: application
            - uuid: 3fbd7a50087d4a278addfb095ecd7fe2
              name: 'AP Hardware model'
              type: SNMP_AGENT
              snmp_oid: '{#SYSOBJECTID}.1.1.5.0'
              key: 'ap.hw.model[{#NUM}]'
              delay: 1h
              value_type: CHAR
              tags:
                - tag: component
                  value: system
            - uuid: e84f7b34c456461199ea5fbacc93b356
              name: 'AP IP address'
              type: SNMP_AGENT
              snmp_oid: '{#SYSOBJECTID}.1.1.3.0'
              key: 'ap.ip.addr[{#NUM}]'
              delay: 30m
              value_type: CHAR
              tags:
                - tag: component
                  value: network
            - uuid: b0246cf8075d44d3979443155e8173b6
              name: 'AP MAC address'
              type: SNMP_AGENT
              snmp_oid: '{#SYSOBJECTID}.1.1.1.0'
              key: 'ap.mac.addr[{#NUM}]'
              delay: 30m
              value_type: CHAR
              tags:
                - tag: component
                  value: network
            - uuid: f2e8b1d820f84c499ba82e55ef0861e8
              name: 'WiFi clients radio indexes'
              type: SNMP_AGENT
              snmp_oid: 'walk[{#SYSOBJECTID}.1.4.1.1.2]'
              key: 'ap.radio.indexes[{#NUM}]'
              history: '0'
              value_type: TEXT
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
            - uuid: d3fc1342ebc044e49e8cbbe086c65690
              name: 'AP serial number'
              type: SNMP_AGENT
              snmp_oid: '{#SYSOBJECTID}.1.1.6.0'
              key: 'ap.serial.number[{#NUM}]'
              delay: 1h
              value_type: CHAR
              tags:
                - tag: component
                  value: system
            - uuid: 449c7022f72f4353b49446240776d9ae
              name: 'WiFi clients'
              type: DEPENDENT
              key: 'wifi.clients.[{#NUM}]'
              units: client(s)
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (!value || value.trim() === '') {
                          return 0;
                      }
                      var v = value.trim();
                      if (v.match(/No Such Instance/i) || v.match(/No Such Object/i) || v.match(/No more variables/i)) {
                          return 0;
                      }
                      var lines = v.split('\n');
                      var count = 0;
                      for (var i = 0; i < lines.length; i++) {
                          if (lines[i].match(/=\s*STRING:\s*"([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}"/)) {
                              count++;
                          }
                      }
                      return count;
              master_item:
                key: 'ap.radio.indexes[{#NUM}]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  return JSON.stringify({
                    data: [
                      {
                        "{#SYSOBJECTID}": value,
                        "{#NUM}": "0"
                      }
                    ]
                  });
        - uuid: 6e7d51d0ff9b4071848c984f632a7544
          name: 'Network interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3]'
          key: net.if.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.MATCHES}'
              - macro: '{#IFADMINSTATUS}'
                value: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFALIAS}'
                value: '{$NET.IF.IFALIAS.MATCHES}'
              - macro: '{#IFALIAS}'
                value: '{$NET.IF.IFALIAS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.MATCHES}'
              - macro: '{#IFDESCR}'
                value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFOPERSTATUS}'
                value: '{$NET.IF.IFOPERSTATUS.MATCHES}'
              - macro: '{#IFOPERSTATUS}'
                value: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.MATCHES}'
              - macro: '{#IFTYPE}'
                value: '{$NET.IF.IFTYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          lifetime_type: DELETE_IMMEDIATELY
          description: 'Discovering interfaces from IF-MIB.'
          item_prototypes:
            - uuid: cec03dbd40034eb0aa9f8f33709d10b5
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]'
              key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
              delay: 3m
              description: |
                MIB: IF-MIB
                The number of inbound packets which were chosen to be discarded
                even though no errors had been detected to prevent their being deliverable to a higher-layer protocol.
                One possible reason for discarding such a packet could be to free up buffer space.
                Discontinuities in the value of this counter can occur at re-initialization of the management system,
                and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 109d14055f154c1199ee0e0694b24311
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]'
              key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
              delay: 3m
              description: |
                MIB: IF-MIB
                For packet-oriented interfaces, the number of inbound packets that contained errors preventing them from being deliverable to a higher-layer protocol.  For character-oriented or fixed-length interfaces, the number of inbound transmission units that contained errors preventing them from being deliverable to a higher-layer protocol. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: e66c65efaa8c4e8b927a8abe4d311ed7
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits received'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]'
              key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
              delay: 3m
              units: bps
              description: |
                MIB: IF-MIB
                The total number of octets received on the interface, including framing characters. This object is a 64-bit version of ifInOctets. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 940fc77e2d99448eb84e8950839049ee
              name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]'
              key: 'net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]'
              delay: 3m
              description: |
                MIB: IF-MIB
                The number of outbound packets which were chosen to be discarded
                even though no errors had been detected to prevent their being deliverable to a higher-layer protocol.
                One possible reason for discarding such a packet could be to free up buffer space.
                Discontinuities in the value of this counter can occur at re-initialization of the management system,
                and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 218c3dcebc924a4bbc0399021a3506e3
              name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]'
              key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
              delay: 3m
              description: |
                MIB: IF-MIB
                For packet-oriented interfaces, the number of outbound packets that contained errors preventing them from being deliverable to a higher-layer protocol.  For character-oriented or fixed-length interfaces, the number of outbound transmission units that contained errors preventing them from being deliverable to a higher-layer protocol. Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 7db6dc3d5ed243c7aee74369c42431f7
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits sent'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]'
              key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
              delay: 3m
              units: bps
              description: |
                MIB: IF-MIB
                The total number of octets transmitted out of the interface, including framing characters. This object is a 64-bit version of ifOutOctets.Discontinuities in the value of this counter can occur at re-initialization of the management system, and at other times as indicated by the value of ifCounterDiscontinuityTime.
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: dab6218b55214c16928d3c0b86911803
              name: 'Interface {#IFNAME}({#IFALIAS}): Speed'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}]'
              key: 'net.if.speed[ifHighSpeed.{#SNMPINDEX}]'
              delay: 5m
              trends: '0'
              units: bps
              description: |
                MIB: IF-MIB
                An estimate of the interface's current bandwidth in units of 1,000,000 bits per second. If this object reports a value of `n' then the speed of the interface is somewhere in the range of `n-500,000' to`n+499,999'.  For interfaces which do not vary in bandwidth or for those where no accurate estimation can be made, this object should contain the nominal bandwidth. For a sub-layer which has no concept of bandwidth, this object should be zero.
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 8146df9bfc2d448290dbf63f6de21c85
              name: 'Interface {#IFNAME}({#IFALIAS}): Operational status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]'
              key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
              trends: '0'
              description: |
                MIB: IF-MIB
                The current operational state of the interface.
                - The testing(3) state indicates that no operational packet scan be passed
                - If ifAdminStatus is down(2) then ifOperStatus should be down(2)
                - If ifAdminStatus is changed to up(1) then ifOperStatus should change to up(1) if the interface is ready to transmit and receive network traffic
                - It should change todormant(5) if the interface is waiting for external actions (such as a serial line waiting for an incoming connection)
                - It should remain in the down(2) state if and only if there is a fault that prevents it from going to the up(1) state
                - It should remain in the notPresent(6) state if the interface has missing(typically, hardware) components.
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: 655938b0106547ca91880054c70d4167
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
                  name: 'Alcatel OAW: Interface {#IFNAME}({#IFALIAS}): Link down'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  status: DISABLED
                  discover: NO_DISCOVER
                  priority: AVERAGE
                  description: |
                    This trigger expression works as follows:
                    1. It can be triggered if the operations status is down.
                    2. `{$IFCONTROL:"{#IFNAME}"}=1` - a user can redefine the context macro to "0", marking this interface as not important. No new trigger will be fired if this interface is down.
                    3. `{TEMPLATE_NAME:METRIC.diff()}=1` - the trigger fires only if the operational status was up to (1) sometime before (so, does not fire for "eternal off" interfaces.)
                    
                    WARNING: if closed manually - it will not fire again on the next poll, because of .diff.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 03ecf251319a46c2bedb44e1bf5c27e7
              name: 'Interface {#IFNAME}({#IFALIAS}): Interface type'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.3.{#SNMPINDEX}]'
              key: 'net.if.type[ifType.{#SNMPINDEX}]'
              delay: 1h
              trends: '0'
              description: |
                MIB: IF-MIB
                The type of interface.
                Additional values for ifType are assigned by the Internet Assigned Numbers Authority (IANA),
                through updating the syntax of the IANAifType textual convention.
              valuemap:
                name: 'IF-MIB::ifType'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
          trigger_prototypes:
            - uuid: b32bdeb471eb47958882f5c90bb8b2fc
              expression: |
                change(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])<0 and last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0
                and (
                last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.type[ifType.{#SNMPINDEX}])=6 or
                last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.type[ifType.{#SNMPINDEX}])=7 or
                last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.type[ifType.{#SNMPINDEX}])=11 or
                last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.type[ifType.{#SNMPINDEX}])=62 or
                last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.type[ifType.{#SNMPINDEX}])=69 or
                last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.type[ifType.{#SNMPINDEX}])=117
                )
                and
                (last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2)
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                (change(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0 and last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}],#2)>0) or
                (last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2)
              name: 'Alcatel OAW: Interface {#IFNAME}({#IFALIAS}): Ethernet has changed to lower speed than it was before'
              opdata: 'Current reported speed: {ITEM.LASTVALUE1}'
              status: DISABLED
              discover: NO_DISCOVER
              priority: INFO
              description: 'This Ethernet connection has transitioned down from its known maximum speed. This might be a sign of autonegotiation issues. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              dependencies:
                - name: 'Alcatel OAW: Interface {#IFNAME}({#IFALIAS}): Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
                  recovery_expression: 'last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: performance
            - uuid: 88e20064ef134ae3846c272387758e84
              expression: |
                (avg(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) or
                avg(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])) and
                last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                avg(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) and
                avg(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])
              name: 'Alcatel OAW: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage'
              event_name: 'Alcatel TiMOS: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage (>{$IF.UTIL.MAX:"{#IFNAME}"}%)'
              opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE3}, speed: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'The utilization of the network interface is close to its estimated maximum bandwidth.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: performance
            - uuid: 773587f2ef8248b490cdc6d40c854eef
              expression: |
                min(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
                or min(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                max(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
                and max(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
              name: 'Alcatel OAW: Interface {#IFNAME}({#IFALIAS}): High error rate'
              event_name: 'Alcatel TiMOS: Interface {#IFNAME}({#IFALIAS}): High error rate (>{$IF.ERRORS.WARN:"{#IFNAME}"} for 5m)'
              opdata: 'errors in: {ITEM.LASTVALUE1}, errors out: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'It recovers when it is below 80% of the `{$IF.ERRORS.WARN:"{#IFNAME}"}` threshold.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
          graph_prototypes:
            - uuid: a1c492cb8d5b410cb6f9cb939f1f627a
              name: 'Interface {#IFNAME}({#IFALIAS}): Network traffic'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: 'Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP'
                    key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: F63100
                  item:
                    host: 'Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP'
                    key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
                - sortorder: '2'
                  color: 00611C
                  yaxisside: RIGHT
                  item:
                    host: 'Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP'
                    key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
                - sortorder: '3'
                  color: F7941D
                  yaxisside: RIGHT
                  item:
                    host: 'Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP'
                    key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
                - sortorder: '4'
                  color: FC6EA3
                  yaxisside: RIGHT
                  item:
                    host: 'Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP'
                    key: 'net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]'
                - sortorder: '5'
                  color: 6C59DC
                  yaxisside: RIGHT
                  item:
                    host: 'Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP'
                    key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
        - uuid: d18aafbd015344db94e18c40c8cef0a5
          name: 'EtherLike-MIB Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},1.3.6.1.2.1.10.7.2.1.19,{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2]'
          key: net.if.duplex.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFOPERSTATUS}'
                value: '1'
              - macro: '{#SNMPVALUE}'
                value: (2|3)
          description: 'Discovering interfaces from IF-MIB and EtherLike-MIB. Interfaces with up(1) Operational Status are discovered.'
          item_prototypes:
            - uuid: b6555bb5a8544720bc191edf650f4583
              name: 'Interface {#IFNAME}({#IFALIAS}): Duplex status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.10.7.2.1.19.{#SNMPINDEX}]'
              key: 'net.if.duplex[dot3StatsDuplexStatus.{#SNMPINDEX}]'
              description: |
                MIB: EtherLike-MIB
                The current mode of operation of the MAC
                entity.  'unknown' indicates that the current
                duplex mode could not be determined.
                
                Management control of the duplex mode is
                accomplished through the MAU MIB.  When
                an interface does not support autonegotiation,
                or when autonegotiation is not enabled, the
                duplex mode is controlled using
                ifMauDefaultType.  When autonegotiation is
                supported and enabled, duplex mode is controlled
                using ifMauAutoNegAdvertisedBits.  In either
                case, the currently operating duplex mode is
                reflected both in this object and in ifMauType.
                
                Note that this object provides redundant
                information with ifMauType.  Normally, redundant
                objects are discouraged.  However, in this
                instance, it allows a management application to
                determine the duplex status of an interface
                without having to know every possible value of
                ifMauType.  This was felt to be sufficiently
                valuable to justify the redundancy.
                Reference: [IEEE 802.3 Std.], 30.3.1.1.32,aDuplexStatus.
              valuemap:
                name: 'EtherLike-MIB::dot3StatsDuplexStatus'
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: a466f1173a6643ecaae83c2454fdcc2c
                  expression: 'last(/Alcatel-Lucent Enterprise OmniAccess Stellar by SNMP/net.if.duplex[dot3StatsDuplexStatus.{#SNMPINDEX}])=2'
                  name: 'Alcatel OAW: Interface {#IFNAME}({#IFALIAS}): In half-duplex mode'
                  priority: INFO
                  description: 'Please check autonegotiation settings and cabling.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: performance
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                  	var data = JSON.parse(value);
                  }
                  catch (error) {
                  	throw 'Failed to parse JSON of EtherLike-MIB discovery.';
                  }
                  var fields = ['{#SNMPVALUE}','{#IFOPERSTATUS}','{#IFALIAS}','{#IFNAME}','{#IFDESCR}'];
                  data.forEach(function (element) {
                  	fields.forEach(function (field) {
                  		element[field] = element[field] || '';
                  	});
                  });
                  return JSON.stringify(data);
      tags:
        - tag: class
          value: network
        - tag: target
          value: alcatel
        - tag: target
          value: 'omniaccess stellar'
      macros:
        - macro: '{$CPU.UTIL.CRIT}'
          value: '90'
        - macro: '{$FAN_CRIT_STATUS}'
          value: '4'
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'Warning threshold of ICMP packet loss in %.'
          config:
            type: TEXT
            priority: '9'
            section_name: Thresholds
            label: 'Threshold of ICMP packet loss'
            description: 'Warning threshold of ICMP packet loss in %. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: 'Warning threshold of the average ICMP response time in seconds.'
          config:
            type: TEXT
            priority: '10'
            section_name: Thresholds
            label: 'Threshold of the average ICMP response'
            description: 'Warning threshold of the average ICMP response time in seconds. No less than 0.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$IF.ERRORS.WARN}'
          value: '2'
          description: 'Warning threshold of error packet rate. Can be used with interface name as context.'
        - macro: '{$IF.UTIL.MAX}'
          value: '90'
        - macro: '{$IFCONTROL}'
          value: '1'
        - macro: '{$MEMORY.UTIL.MAX}'
          value: '90'
        - macro: '{$NET.IF.IFADMINSTATUS.MATCHES}'
          value: '^.*'
        - macro: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
          value: ^2$
          description: 'Ignore down(2) administrative status'
        - macro: '{$NET.IF.IFALIAS.MATCHES}'
          value: '.*'
        - macro: '{$NET.IF.IFALIAS.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
        - macro: '{$NET.IF.IFDESCR.MATCHES}'
          value: '.*'
        - macro: '{$NET.IF.IFDESCR.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
        - macro: '{$NET.IF.IFNAME.MATCHES}'
          value: '^.*$'
        - macro: '{$NET.IF.IFNAME.NOT_MATCHES}'
          value: '(^Software Loopback Interface|^NULL[0-9.]*$|^[Ll]o[0-9.]*$|^[Ss]ystem$|^Nu[0-9.]*$|^veth[0-9a-z]+$|docker[0-9]+|br-[a-z0-9]{12})'
          description: 'Filter out loopbacks, nulls, docker veth links and docker0 bridge by default'
        - macro: '{$NET.IF.IFOPERSTATUS.MATCHES}'
          value: '^.*$'
        - macro: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
          value: ^6$
          description: 'Ignore notPresent(6)'
        - macro: '{$NET.IF.IFTYPE.MATCHES}'
          value: '.*'
        - macro: '{$NET.IF.IFTYPE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
